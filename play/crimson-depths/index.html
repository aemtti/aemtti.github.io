class Projectile {

      const nx = this.x + this.dx * this.speed * sdt, ny = this.y + this.dy * this.speed * sdt
      if (game.level.blocked(nx, ny, 0.08)) { this.explode(game); return }
      this.x = nx; this.y = ny
      if (this.owner === 'enemy') {
        const p = game.player
        if ((p.x - this.x) ** 2 + (p.y - this.y) ** 2 < 0.36) { game.damagePlayer(this.dmg, this.x - this.dx, this.y - this.dy); this.explode(game); return }
      } else {
        for (const e of game.enemies) {
          if (e.state === 'dead') continue
          const r = e.k.radius + 0.15
          if ((e.x - this.x) ** 2 + (e.y - this.y) ** 2 < r * r) { e.hurt(this.dmg, game); this.explode(game); return }
        }
        for (const b of game.barrels) if (!b.dead && (b.x - this.x) ** 2 + (b.y - this.y) ** 2 < 0.25) { b.hurt(this.dmg, game); this.explode(game); return }
      }

    if (this.age > 6) this.alive = false
    if (game.particles.count < 300 && rnd() < 0.5) game.particles.emit(this.x, this.y, this.z, 1, Projectile.TRAIL[this.kind], 0.3, 0.25, 0.025, 0.0)
  }
  explode(game) {
    this.alive = false
    game.particles.emit(this.x, this.y, this.z, 14, Projectile.TRAIL[this.kind], 2.5, 0.4, 0.035, 2.0)
    game.addFlash(this.x, this.y, 3.0, Projectile.LIGHT[this.kind], 0.18, 1.6)

}
Projectile.LIGHT = { fireball: [1.0, 0.45, 0.12], plasma: [0.25, 0.6, 1.0], void: [0.7, 0.25, 1.0] }

class Particles {                                       // struct-of-arrays particle pool
  constructor(cap = 400) {
    this.cap = cap; this.p = new Float32Array(cap * 3); this.v = new Float32Array(cap * 3); this.life = new Float32Array(cap)
    this.size = new Float32Array(cap); this.col = new Uint8Array(cap * 3); this.grav = new Float32Array(cap); this.count = 0
  }
  emit(x, y, z, n, color, speed, life, size, gravity = 4.0, dirx = null, diry = null) {

      const ang = rnd() * TAU, el = uniform(-0.6, 1.0), sp = uniform(0.3, 1.0) * speed
      let vx = Math.cos(ang) * sp, vy = Math.sin(ang) * sp

      this.p[i * 3] = x; this.p[i * 3 + 1] = y; this.p[i * 3 + 2] = z
      this.v[i * 3] = vx; this.v[i * 3 + 1] = vy; this.v[i * 3 + 2] = el * sp

class Barrel {
  constructor(x, y) { this.x = x; this.y = y; this.hp = 30; this.dead = false }

    game.particles.emit(this.x, this.y, 0.4, 20, [60, 60, 60], 1.5, 1.4, 0.09, -0.5)
    game.addFlash(this.x, this.y, 6.0, [1.0, 0.55, 0.2], 0.45, 2.5)

const CHAIN_DELAY = 0.2

// ================================================================= game ===
const WEAPONS = {
  pistol: { label: 'PISTOL', dmg: 14, rate: 0.28, ammo: null, spread: 0.012, kick: 0.5, pellets: 1, sound: 'pistol' },
  shotgun: { label: 'SHOTGUN', dmg: 9, rate: 0.9, ammo: 'shells', spread: 0.075, kick: 1.0, pellets: 8, sound: 'shotgun' },
  plasma: { label: 'PLASMA RIFLE', dmg: 32, rate: 0.15, ammo: 'cells', spread: 0.01, kick: 0.3, pellets: 1, sound: 'plasma' },
}
const WEAPON_ORDER = ['pistol', 'shotgun', 'plasma']

class Player {
  constructor(x, y, angle) {
    this.x = x; this.y = y; this.angle = angle; this.pitch = 0.0; this.health = 100
    this.ammo = { shells: 8, cells: 0 }; this.weapon = 'pistol'; this.fireCd = 0.0; this.recoil = 0.0
    this.bob = 0.0; this.eyeZ = 0.5; this.swayX = 0.0; this.swayY = 0.0
  }
}

// Stereo position of a sound (audio.play_at): returns [volume, pan] or null when inaudible.
function positional(sx, sy, px, py, pdir, base = 1.0, falloff = 0.12) {
  const dx = sx - px, dy = sy - py, d = Math.hypot(dx, dy), vol = base / (1.0 + d * d * falloff)
  if (vol < 0.02) return null
  const side = (-dy * Math.cos(pdir) + dx * Math.sin(pdir)) / (d + 1e-6)
  return [Math.min(1.0, vol), 0.5 - 0.5 * side * 0.8]
}

class Game {
  // opts: { RH, god, autotest }   hooks: { play(name, vol, pan), startMusic(vol), setMusicVolume(vol), lockMouse(on) }
  constructor(opts, hooks, assets) {
    this.opts = opts; this.hooks = hooks
    this.RH = opts.RH || 225; this.RW = opts.RW || Math.round(this.RH * 16 / 9)
    const atlas = assets.atlas || buildAtlases()
    this.sprites = assets.sprites || buildSprites()
    this.renderer = new Renderer(this.RW, this.RH, atlas)
    this.weaponRaw = {}
    for (const n of WEAPON_ORDER) this.weaponRaw[n] = drawWeapon(n)
    this.flashRaw = drawMuzzleFlash()
    this.buildViewAssets()
    this.state = 'title'; this.time = 0.0; this.levelNum = 1; this.score = 0; this.totalKills = 0
    this.paused = false; this.fps = 0.0
    this.input = { mx: 0, my: 0, fwd: 0, strafe: 0, turn: 0, sprint: false, fire: false }
    this.autotest = opts.autotest || 0
    this.newGame()
    if (this.autotest) this.state = 'play'
  }
  buildViewAssets() {                                   // weapon sprites sized from the internal height, like main.py
    const wh = trunc(this.RH * 0.62), fs = trunc(this.RH * 0.3)
    this.weaponImgs = {}
    for (const n of WEAPON_ORDER) this.weaponImgs[n] = smoothscale(this.weaponRaw[n], trunc(wh * 200 / 140), wh)
    this.flashImg = smoothscale(this.flashRaw, fs, fs)
  }
  resizeView(RW, planeLen) { this.RW = RW; this.renderer.resize(RW, this.RH, planeLen); if (this.level) this.renderer.level = this.level }
  setRH(RH) {                                           // internal render height (the shell lowers it on slow phones)

    this.buildViewAssets()
  }
  newGame() {

    this.loadLevel(this.levelNum)
    this.player.health = 100
    this.player.ammo = { shells: 8, cells: 0 }
  }
  loadLevel(n, keepPlayer = null) {
    this.level = generate(n)
    this.renderer.setLevel(this.level)
    const lv = this.level, [px, py] = lv.start
    let door = [px + 1, py]
    if (lv.doorCells.length) {
      let best = Infinity
      for (const d of lv.doorCells) { const dd = (d[0] + 0.5 - px) ** 2 + (d[1] + 0.5 - py) ** 2; if (dd < best) { best = dd; door = d } }
    }
    const ang = Math.atan2(door[1] + 0.5 - py, door[0] + 0.5 - px)
    if (!keepPlayer) this.player = new Player(px, py, ang)
    else { this.player.x = px; this.player.y = py; this.player.angle = ang; this.player.pitch = 0.0 }
    this.enemies = lv.enemies.map(([x, y, k]) => new Enemy(x, y, k))
    this.pickups = lv.pickups.map(([x, y, k]) => new Pickup(x, y, k))
    this.barrels = lv.barrels.map(([x, y]) => new Barrel(x, y))
    this.projectiles = []; this.particles = new Particles(); this.flashes = []; this.pendingExplosions = []
    this.distField = new Int16Array(lv.w * lv.h); this.dfCell = null; this.dfTimer = 0.0
    this.noiseT = -10.0; this.shake = 0.0; this.dmgFlash = 0.0; this.dmgDir = null; this.dmgDirT = 0; this.hitmarkT = 0.0
    this.muzzleT = 0.0; this.pumpT = 0.0; this.messages = []; this.kills = 0; this.levelTime = 0.0; this.levelEndT = 0.0
    this.msg(`LEVEL ${n}`, 3.0)

  }

  playAt(name, sx, sy, base = 1.0, falloff = 0.12) {
    const p = this.player, r = positional(sx, sy, p.x, p.y, p.angle, base, falloff)
    if (r) this.hooks.play(name, r[0], r[1])
  }
  lockMouse(on) { if (!this.autotest) this.hooks.lockMouse(on) }
  // ---- discrete actions (handle_events)

  selectWeapon(name) { if (name !== this.player.weapon) { this.player.weapon = name; this.player.recoil = 0.6; this.play('click', 0.5) } }
  cycleWeapon(dir) { const i = WEAPON_ORDER.indexOf(this.player.weapon); this.selectWeapon(WEAPON_ORDER[pmod(i + dir, 3)]) }

  update(dt) {

    if (this.state === 'levelend') {

      if (this.levelEndT <= 0) {

function makeVignette(W, H) {                           // main.py make_vignette: 12 stepped rings of growing alpha

}
let deadAt = 0
function present(g) {

  if (g.dmgFlash > 0) addRed(Math.trunc(120 * Math.min(1.0, g.dmgFlash)), W, H)
  if (g.player.health < 30 && g.state === 'play') addRed(Math.trunc(40 + 30 * Math.sin(g.time * 6)), W, H)

  const touchUi = inputMode === 'touch'
  if (g.state === 'dead') {
    ctx.fillStyle = 'rgba(60,0,0,0.588)'; ctx.fillRect(0, 0, cssW, cssH)
    textCenter('YOU DIED', fb, [230, 40, 40], Hs * 0.4, true, full)
    textCenter(`Score ${g.score}   Kills ${g.totalKills}   Level ${g.levelNum}`, fm, [230, 200, 200], Hs * 0.55, true, full)
    textCenter(touchUi ? 'Tap to restart' : 'Press R to restart   -   ESC for title screen', f, [200, 180, 180], Hs * 0.65, true, full)
  } else if (g.state === 'levelend') {
    ctx.fillStyle = 'rgba(0,0,30,0.47)'; ctx.fillRect(0, 0, cssW, cssH)
    textCenter(`LEVEL ${g.levelNum} CLEARED`, fb, [140, 200, 255], Hs * 0.4, true, full)
    textCenter(`Kills ${g.kills}/${g.enemies.length}   Time ${Math.trunc(g.levelTime)}s   Score ${g.score}`, fm, [220, 230, 255], Hs * 0.55, true, full)
    textCenter('Descending...', f, [180, 190, 220], Hs * 0.65, true, full)
  } else if (g.paused) {

function addRed(k, W, H) {                              // scr.fill((k, 0, 0), special_flags=BLEND_ADD)

}
function drawTitle(g) {

  ctx.fillStyle = 'rgba(10,0,0,0.588)'; ctx.fillRect(0, 0, W, H)
  const pulse = 0.85 + 0.15 * Math.sin(g.time * 2)
  let big = PF(Math.trunc(H / 5))
  const tw0 = tw('CRIMSON DEPTHS', big); if (tw0 > W * 0.92) big = Math.floor(big * W * 0.92 / tw0)
  const x = W / 2 - tw('CRIMSON DEPTHS', big) / 2

  text('CRIMSON DEPTHS', x, H * 0.22, big, [Math.trunc(220 * pulse), Math.trunc(30 * pulse), Math.trunc(30 * pulse)])
  const f = PF(Math.max(20, Math.trunc(H / 26))), fm = PF(Math.max(28, Math.trunc(H / 16)))

function drawHud(g) {
  const p = g.player, W = view.w, H = view.h, ox = view.x, oy = view.y

    const rel = g.dmgDir - p.angle, a = Math.trunc(200 * (g.dmgDirT - g.time) / 1.2)

}
function drawMinimap(g, x0, y0, H) {                    // main.py draw_minimap: 25x25 cells around the player, explored cells only

// ------------------------------------------------------------ main --------
let game = null, last = 0, frames = 0, acc = 0
const hooks = {

  lockMouse: on => lockMouse(on),

function init() {
  makeKit()

  game.damagePlayer = (d, x, y) => { const was = game.state; origDamage(d, x, y); if (was === 'play' && game.state === 'dead') { deadAt = game.time; syncKit() } }

// Slow phone safety net: if a frame's work stays above 22 ms (under ~45 fps) for a few seconds of play,

drawLoading('generating textures, sprites and the first floor...')

})()
