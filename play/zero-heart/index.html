<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>제로 하트</title>
<meta name="description" content="제로 하트: ♥A는 0점, 퀸은 ♥A를 잡는 카드 대결. 봇이나 친구와 함께. Gold는 현금 가치가 없는 놀이용 돈입니다.">
<meta name="theme-color" content="#0c0912">
<style>
:root{
  --bg:#0c0912; --bg2:#15101f; --panel:#1c1529; --panel2:#251c36; --line:#3a2d52;
  --ink:#f5efe4; --ink2:#c9bfd6; --muted:#8a7f9b;
  --felt1:#1d5a4a; --felt2:#0b2a22; --felt3:#06170f;
  --gold:#f0c869; --gold2:#b98d35; --heart:#ff3d5e; --heart2:#9e1530; --queen:#a48cff;
  --win:#5be39b; --lose:#ff7a7a; --card:#fbf6ec; --cink:#1e1a26; --cred:#cf2443;
  --cw:36px; --mcw:68px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(1200px 600px at 50% -10%,#2a1640 0%,transparent 60%),radial-gradient(900px 500px at 50% 110%,#2b0c18 0%,transparent 60%),var(--bg);overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}
#app{max-width:1040px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:8px;padding:10px 16px 6px}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;letter-spacing:.04em}
.logo .mark{width:30px;height:30px}
.logo small{font-weight:600;color:var(--muted);font-size:12px;letter-spacing:0}
.pill{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;white-space:nowrap}
.pill .k{color:var(--muted);font-weight:600;font-size:12px}
.pill.gold b{color:var(--gold)}
.pill.mp b{color:var(--queen)}
.sp{flex:1}
.ib{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:44px;min-width:44px;padding:0 10px;font-size:13px;font-weight:700}
.ib:hover{border-color:var(--gold2)}
.screen{flex:1;display:flex;flex-direction:column;padding:4px 16px 14px;gap:10px}

/* ---------- lobby ---------- */
.hero{position:relative;text-align:center;padding:18px 10px 8px}
.hero h1{margin:6px 0 4px;font-size:clamp(34px,7vw,56px);font-weight:900;letter-spacing:.06em;
  background:linear-gradient(180deg,#fff3cf,#f0c869 55%,#b98d35);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 40px rgba(240,200,105,.15)}
.hero h1 em{font-style:normal;font-size:.38em;vertical-align:middle;color:var(--ink2);-webkit-text-fill-color:var(--ink2);letter-spacing:0;margin-left:6px}
.hero p{margin:0;color:var(--ink2);font-size:14px}
.hero .fan{display:flex;justify-content:center;gap:0;height:96px;margin-top:6px}
.hero .fan .card{--cw:52px;transform-origin:50% 120%;animation:float 3.6s ease-in-out infinite}
.hero .fan>div:nth-child(2) .card{animation-delay:-.9s}.hero .fan>div:nth-child(3) .card{animation-delay:-1.8s}.hero .fan>div:nth-child(4) .card{animation-delay:-2.7s}
@keyframes float{50%{transform:translateY(-7px)}}
.logo .mark{animation:beat 2.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}10%{transform:scale(1.12)}20%{transform:scale(1)}30%{transform:scale(1.08)}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:720px){.grid2{grid-template-columns:1fr}}
.box{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:16px;padding:14px}
.box h3{margin:0 0 10px;font-size:14px;color:var(--gold);letter-spacing:.02em}
.ladder{display:flex;gap:6px;align-items:stretch}
.rung{flex:1;border-radius:12px;padding:8px 6px;text-align:center;background:var(--bg2);border:1px solid var(--line);font-size:12px;color:var(--muted);position:relative}
.rung b{display:block;font-size:15px;color:var(--ink2)}
.rung.on{border-color:var(--gold2);color:var(--ink2)}
.rung.on b{color:var(--gold)}
.rung.here::after{content:"지금";position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--gold);color:#2a1d05;font-size:12px;font-weight:900;border-radius:6px;padding:1px 6px}
.prog{height:10px;background:var(--bg);border-radius:99px;overflow:hidden;border:1px solid var(--line);margin-top:10px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));border-radius:99px;transition:width .6s}
.note{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:44px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 0;font-weight:800}
.seg button small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.seg button:disabled{opacity:.6;cursor:default}
.seg button.on{background:linear-gradient(180deg,#3b2a12,#2a1d0a);border-color:var(--gold);color:var(--gold)}
.rooms{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
@media (max-width:520px){.rooms{grid-template-columns:repeat(2,1fr)}}
.room{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:9px 8px;text-align:left;font-size:12px;color:var(--muted);min-height:44px}
.room b{display:block;font-size:15px;color:var(--ink)}
.room.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.room:disabled{opacity:.45;cursor:not-allowed}
.big{width:100%;margin-top:12px;padding:14px;border:0;border-radius:14px;font-size:17px;font-weight:900;letter-spacing:.04em;color:#2a1a04;
  background:linear-gradient(180deg,#ffe39a,#f0c869 45%,#c99a3e);box-shadow:0 6px 0 #7a5a1c,0 10px 24px rgba(240,200,105,.25)}
.big:active{transform:translateY(3px);box-shadow:0 3px 0 #7a5a1c}
.big:disabled{filter:grayscale(.8) brightness(.7)}
.ghost{background:transparent;border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:44px;font-weight:700;color:var(--ink2)}
.ghost:disabled{opacity:.4}
.dex{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.dex div{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px;font-size:12px;color:var(--muted);line-height:1.4}
.dex div b{display:block;font-size:13px;color:var(--ink)}
.dex div .n{font-size:20px;font-weight:900;color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:12px;color:var(--muted);text-align:center}
.stats b{display:block;font-size:15px;color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- table ---------- */
#table{padding-top:0}
.goalbar{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink2)}
.goalbar .prog{flex:1;margin:0;height:8px}
.felt{position:relative;flex:1;min-height:440px;border-radius:40px;padding:14px 12px 12px;display:grid;grid-template-rows:auto 1fr auto;
  background:radial-gradient(ellipse at 50% 45%,var(--felt1) 0%,var(--felt2) 62%,var(--felt3) 100%);
  box-shadow:inset 0 0 0 3px #1a0f05,inset 0 0 0 6px #6b4a1c,inset 0 0 0 7px #e2b65a55,inset 0 0 0 10px #2a1a08,inset 0 0 90px rgba(0,0,0,.55),0 20px 50px rgba(0,0,0,.5);transition:filter .5s}
.felt::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.35;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><g fill='none' stroke='%23f0c869' stroke-opacity='.10'><path d='M60 20c-8-14-30-8-26 10 3 12 26 26 26 26s23-14 26-26c4-18-18-24-26-10z'/><path d='M0 100h120M100 0v120' stroke-dasharray='2 6'/></g></svg>")}
.felt.dim{filter:brightness(.7) saturate(.9)}
.felt .emblem{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(46%,320px);opacity:.10;pointer-events:none}
.opps{display:flex;justify-content:space-around;gap:6px;position:relative;z-index:2}
.seat{position:relative;width:clamp(98px,30%,190px);display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 6px 8px;border-radius:18px;
  background:rgba(8,14,12,.45);border:1px solid rgba(240,200,105,.12);transition:box-shadow .3s,opacity .3s,transform .3s}
.seat .ava{position:relative;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:radial-gradient(circle at 35% 30%,#ffffff22,#0000 60%),var(--c,#444);box-shadow:0 0 0 2px #0008,0 0 0 3px var(--c,#666)}
.seat .nm{font-size:13px;font-weight:800}
.seat .gd{font-size:12px;color:var(--gold);font-weight:700}
.seat .bet{font-size:12px;color:var(--ink2);min-height:14px}
.seat .cards{display:flex;gap:4px;min-height:calc(var(--cw)*1.4);justify-content:center}
.seat.turn{box-shadow:0 0 0 2px var(--gold),0 0 26px rgba(240,200,105,.45);transform:translateY(-2px)}
.seat.folded{opacity:.42}
.seat .card{transition:transform .4s,filter .4s}
.seat.folded .card{transform:translateY(8px) rotate(-8deg);filter:grayscale(1) brightness(.7)}
.seat.out{opacity:.25}
.seat.winner{box-shadow:0 0 0 3px var(--gold),0 0 50px rgba(240,200,105,.8)}
.lead{position:absolute;top:-7px;right:-9px;background:var(--gold);color:#2a1d05;font-size:12px;font-weight:900;border-radius:7px;padding:2px 5px;box-shadow:0 2px 6px #0008}
.tag{position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:900;border-radius:8px;padding:2px 8px;white-space:nowrap;background:#000a;border:1px solid var(--line);z-index:3}
.tag.half{background:linear-gradient(180deg,#ff5d78,#b51a3a);border-color:#ff9db0;color:#fff}
.tag.call{background:#1f4d7a;border-color:#4b8fd0}
.tag.ping{background:#5a3f10;border-color:var(--gold2);color:var(--gold)}
.tag.check{background:#2c3a33;border-color:#4f6a5c}
.tag.die{background:#333;color:#aaa}
.think{position:absolute;top:-4px;left:-4px;font-size:16px;animation:bob 1s infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.bubble{position:absolute;top:-34px;left:50%;transform:translateX(-50%) scale(.6);opacity:0;background:var(--card);color:var(--cink);font-size:12px;font-weight:700;padding:5px 10px;border-radius:12px;white-space:nowrap;pointer-events:none;transition:all .25s;z-index:5}
.bubble::after{content:"";position:absolute;bottom:-6px;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:var(--card);border-bottom:0}
.bubble.show{opacity:1;transform:translateX(-50%) scale(1)}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative;z-index:1}
.round{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--gold);text-transform:uppercase;background:#0006;border:1px solid #f0c86933;border-radius:999px;padding:4px 12px}
.pot{display:flex;align-items:center;gap:8px;font-size:clamp(24px,5vw,34px);font-weight:900;text-shadow:0 2px 10px #000}
.pot.bump{animation:bump .45s}
@keyframes bump{30%{transform:scale(1.18);color:var(--gold)}}
.chips{position:relative;width:34px;height:30px}
.chip{position:absolute;width:26px;height:26px;border-radius:50%;background:repeating-conic-gradient(var(--heart) 0 30deg,#fff 30deg 45deg);box-shadow:0 0 0 3px var(--heart2) inset,0 2px 0 #0008}
.chip::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--heart2);box-shadow:0 0 0 1px #fff6}
.potsub{font-size:12px;text-align:center;color:var(--ink2)}
.callout{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.4);font-size:clamp(34px,8vw,64px);font-weight:900;letter-spacing:.05em;opacity:0;pointer-events:none;z-index:20;white-space:nowrap;
  text-shadow:0 0 30px currentColor,0 4px 0 #0008}
.callout.go{animation:callout 1.1s ease-out forwards}
@keyframes callout{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-62%) scale(1)}}
.me{display:flex;justify-content:center;position:relative;z-index:2}
.me .seat{width:auto;min-width:min(100%,420px);flex-direction:row;gap:14px;padding:10px 14px;align-items:center}
.me .cards{--cw:var(--mcw);gap:8px}
.me .info{display:flex;flex-direction:column;gap:3px;align-items:flex-start;min-width:0}
.me .hint{font-size:12px;color:var(--ink);line-height:1.45;max-width:230px}
.hint .bd{margin-right:4px}
.bd{display:inline-block;font-size:12px;font-weight:900;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:1px}
.bd.ha{background:var(--heart);color:#fff}
.bd.q{background:var(--queen);color:#140c2a}
.bd.two{background:linear-gradient(90deg,var(--heart),var(--gold));color:#fff}
.coach{position:relative;margin-top:6px;width:min(96%,460px);background:var(--card);color:var(--cink);border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.5;box-shadow:0 10px 30px #000a;z-index:6}
.coach b{color:var(--cred)}
.coach .x{float:right;border:0;background:none;color:#7a6f84;font-size:12px;font-weight:700;min-height:44px;min-width:44px}

/* cards */
.card{position:relative;width:var(--cw);height:calc(var(--cw)*1.4);border-radius:calc(var(--cw)*.12);background:var(--card);color:var(--cink);
  box-shadow:0 2px 0 #0003,0 4px 10px #0006;font-weight:900;flex:none;transform-style:preserve-3d}
.card .cr{position:absolute;left:8%;top:4%;font-size:max(12px,calc(var(--cw)*.34));line-height:1;letter-spacing:-.04em}
.card .cs{position:absolute;left:9%;top:calc(4% + max(12px,var(--cw)*.34));font-size:max(10px,calc(var(--cw)*.24));line-height:1}
.card .cc{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--cw)*.62);padding-top:12%}
.card .face{font-size:calc(var(--cw)*.5);font-family:Georgia,serif;font-style:italic}
.card.red{color:var(--cred)}
.card.ha{background:radial-gradient(circle at 50% 55%,#fff 0%,#ffe9ee 60%,#ffd3dc 100%);box-shadow:0 0 0 2px var(--gold),0 0 18px rgba(255,61,94,.6),0 4px 10px #0006}
.card.ha .cc{text-shadow:0 0 12px rgba(255,61,94,.5)}
.card.qn{box-shadow:0 0 0 2px var(--queen),0 0 14px rgba(164,140,255,.45),0 4px 10px #0006}
.card .crown{position:absolute;right:8%;top:5%;font-size:calc(var(--cw)*.24);color:var(--queen)}
.card.back{background:linear-gradient(135deg,#5b1226,#2e0713);box-shadow:0 0 0 1px #f0c86966 inset,0 2px 0 #0003,0 4px 10px #0006;overflow:hidden}
.card.back::before{content:"";position:absolute;inset:calc(var(--cw)*.08);border-radius:calc(var(--cw)*.07);border:1px solid #f0c86988;
  background:repeating-linear-gradient(45deg,#f0c86915 0 3px,transparent 3px 7px),repeating-linear-gradient(-45deg,#f0c86915 0 3px,transparent 3px 7px)}
.card.back::after{content:"♥";position:absolute;inset:0;display:grid;place-items:center;color:var(--gold);font-size:calc(var(--cw)*.42);opacity:.85;text-shadow:0 0 8px #000}
.card.deal{animation:deal .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes deal{from{opacity:0;transform:translate(var(--dx,0),var(--dy,-120px)) rotate(-25deg) scale(.6)}}
.opps .card.deal{--dy:150px}
.me .card.deal,.me .card.big2{--dy:-170px}
.card.flip{animation:flip .5s ease-out both}
@keyframes flip{0%{transform:rotateY(90deg) scale(1.05)}100%{transform:rotateY(0)}}
.card.mini{--cw:34px}
.card.big2{animation:reveal2 .9s cubic-bezier(.2,.9,.2,1) both}
@keyframes reveal2{0%{transform:translateY(-140px) rotateY(180deg) scale(1.3);filter:brightness(2);opacity:0}60%{transform:translateY(0) rotateY(0) scale(1.12);filter:brightness(1.3)}100%{transform:none;filter:none}}
.flychip{position:fixed;z-index:50;width:20px;height:20px;border-radius:50%;pointer-events:none;background:repeating-conic-gradient(var(--heart) 0 30deg,#fff 30deg 45deg);box-shadow:0 0 0 3px var(--heart2) inset,0 2px 6px #000a;transition:transform .55s cubic-bezier(.3,.7,.2,1),opacity .55s}
.flychip.g{background:repeating-conic-gradient(var(--gold) 0 30deg,#fff 30deg 45deg);box-shadow:0 0 0 3px var(--gold2) inset,0 2px 6px #000a}

/* actions */
.actions{position:relative;background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px}
.actions .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);gap:8px}
.timer{height:5px;background:var(--bg);border-radius:9px;overflow:hidden}
.timer i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold2),var(--gold));transition:width .1s linear}
.timer i.warn{background:linear-gradient(90deg,#b51a3a,var(--heart))}
.btns{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.btn{border:0;border-radius:12px;padding:11px 4px 9px;font-weight:900;font-size:16px;line-height:1.1;background:#2b2140;color:var(--ink);box-shadow:0 4px 0 #120c1c;position:relative}
.btn small{display:block;font-size:12px;font-weight:700;opacity:.85;margin-top:3px}
.btn kbd{position:absolute;top:3px;right:6px;font-size:12px;opacity:.45;font-family:inherit}
@media (pointer:coarse){.btn kbd{display:none}}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #120c1c}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn.half{background:linear-gradient(180deg,#ff5d78,#c21f42);box-shadow:0 4px 0 #6d0e22}
.btn.call{background:linear-gradient(180deg,#3d86cf,#245d99);box-shadow:0 4px 0 #12345a}
.btn.ping{background:linear-gradient(180deg,#e8b852,#a87a22);color:#2a1a04;box-shadow:0 4px 0 #5e420f}
.btn.check{background:linear-gradient(180deg,#3f7a63,#285443);box-shadow:0 4px 0 #13302a}
.btn.die{background:#3a3344;box-shadow:0 4px 0 #19141f}
.btn.hl{outline:3px solid var(--gold);outline-offset:2px;animation:pulse 1s infinite}
@keyframes pulse{50%{outline-color:transparent}}
.actnote{font-size:12px;color:var(--muted);min-height:14px;text-align:center}
.waiting{position:absolute;inset:0;border-radius:18px;background:#0c0912cc;display:grid;place-items:center;font-size:13px;color:var(--ink2);font-weight:700}

/* sheets */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(5,3,9,.55);display:flex;align-items:center;justify-content:center;padding:12px;backdrop-filter:blur(2px)}
.sheet{width:min(640px,100%);max-height:88dvh;overflow:auto;background:linear-gradient(180deg,#221936,#15101f);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 30px 80px #000c;animation:sheetIn .35s cubic-bezier(.2,.9,.2,1)}
@keyframes sheetIn{from{transform:translateY(30px) scale(.96);opacity:0}}
@media (max-width:600px){.overlay{align-items:flex-end;padding:0}.sheet{border-radius:20px 20px 0 0;max-height:82dvh}}
.sheet h2{margin:0 0 4px;font-size:20px}
.sheet .sub{color:var(--ink2);font-size:13px;margin-bottom:10px}
.banner{text-align:center;padding:12px 8px;border-radius:14px;margin-bottom:10px;position:relative;overflow:hidden}
.banner .t{font-size:24px;font-weight:900}
.banner .s{font-size:13px;color:var(--ink2);margin-top:2px}
.banner.normal{background:linear-gradient(180deg,#22402f,#162a20)}
.banner.heart_win{background:linear-gradient(180deg,#5e1426,#2c0a14);box-shadow:0 0 0 1px var(--heart) inset}
.banner.queen_slay{background:linear-gradient(180deg,#33246a,#1a1236);box-shadow:0 0 0 1px var(--queen) inset}
.banner.double_heart{background:linear-gradient(135deg,#7a1630,#3a2470,#7a5a1c);box-shadow:0 0 0 2px var(--gold) inset}
.banner.tie,.banner.fold{background:linear-gradient(180deg,#2c2440,#1b1529)}
.banner.lost{filter:saturate(.6)}
.hrow{display:grid;grid-template-columns:86px auto 1fr auto;gap:8px;align-items:center;padding:8px;border-radius:12px;background:#0004;margin-bottom:6px;border:1px solid transparent;position:relative}
.hrow .who{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .cs2{display:flex;gap:3px}
.hrow .sm{font-size:13px;font-weight:800}
.hrow .sm small{display:block;font-weight:500;color:var(--ink2);font-size:12px;margin-top:2px}
.hrow .st{font-size:12px;font-weight:900;padding:3px 8px;border-radius:8px;background:#0006}
.hrow.win{border-color:var(--gold);background:linear-gradient(90deg,#3d2f0e66,#0004)}
.hrow.win .st{background:var(--gold);color:#2a1d05}
.hrow.elim{border-color:#ff3d5e66}
.hrow.elim .st{background:var(--heart2);color:#fff}
.hrow.elim::after{content:"";position:absolute;left:84px;right:60px;top:50%;height:3px;background:var(--heart);transform:rotate(-4deg);box-shadow:0 0 10px var(--heart);animation:slash .5s .3s both;transform-origin:left}
@keyframes slash{from{transform:rotate(-4deg) scaleX(0)}}
@media (max-width:520px){.hrow{grid-template-columns:auto 1fr auto}.hrow .who{grid-column:1/-1}.hrow.elim::after{left:8px;right:60px}}
.steps{margin:10px 0;padding-left:20px;font-size:13px;line-height:1.6;color:var(--ink)}
.steps li{margin-bottom:3px;animation:fadeUp .4s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}}
.money{background:#0005;border-radius:12px;padding:10px 12px;font-size:12px;color:var(--ink2);line-height:1.7}
.money b{color:var(--ink)}
.money .plus{color:var(--win);font-weight:900}
.money .minus{color:var(--lose);font-weight:900}
.tip{margin-top:10px;font-size:12px;color:#2a1a04;background:var(--gold);border-radius:10px;padding:8px 10px;line-height:1.5;font-weight:600}
.sheet .acts{display:flex;gap:8px;margin-top:12px}
.sheet .acts .big{margin-top:0}
.sheet .acts .ghost{flex:none}
.rules h4{margin:14px 0 6px;color:var(--gold);font-size:14px}
.rules p,.rules li{font-size:13px;line-height:1.6;color:var(--ink)}
.rules ul{padding-left:18px;margin:4px 0}
.rules table{width:100%;border-collapse:collapse;font-size:12px}
.rules td,.rules th{border-bottom:1px solid var(--line);padding:5px 4px;text-align:left}
.rules th{color:var(--muted);font-weight:600}
.vote{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:13px}
.vote span{background:#0006;border-radius:8px;padding:4px 8px}
.vote .y{color:var(--win)} .vote .n{color:var(--lose)}
#toasts{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;width:min(92vw,460px);pointer-events:none}
.toast{background:var(--card);color:var(--cink);border-radius:12px;padding:9px 12px;font-size:13px;font-weight:700;box-shadow:0 10px 30px #000a;animation:toast 4s both}
@keyframes toast{0%{opacity:0;transform:translateY(-10px)}8%,85%{opacity:1;transform:none}100%{opacity:0}}
.fx{position:fixed;inset:0;pointer-events:none;z-index:45;overflow:hidden}
.fx i{position:absolute;font-style:normal;font-size:22px;animation:fall linear forwards}
@keyframes fall{from{transform:translateY(-40px) rotate(0)}to{transform:translateY(110vh) rotate(540deg)}}
.flash{position:fixed;inset:0;pointer-events:none;z-index:44;animation:flash .6s ease-out forwards}
@keyframes flash{from{opacity:.55}to{opacity:0}}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@media (max-width:600px){
  :root{--cw:28px;--mcw:56px}
  .topbar{padding:8px 10px 4px;gap:6px}
  .logo small,.logo span{display:none}
  .pill .k{display:none}
  .ib{padding:0 8px;white-space:nowrap}
  .pill.mp b::before{content:'MP ';color:var(--muted);font-size:12px}
  .screen{padding:2px 8px 8px}
  .felt{border-radius:26px;min-height:400px;padding:12px 6px 10px}
  .seat{padding:6px 4px 8px;border-radius:14px}
  .seat .ava{width:38px;height:38px;font-size:21px}
  .seat .nm{font-size:12px}
  .btn{font-size:14px;padding:10px 2px 8px}
  .btn kbd{display:none}
  .pill{padding:4px 8px;font-size:12px}
  .me .seat{gap:10px;padding:8px 10px}
}
#app{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.sheet{padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.logo{cursor:pointer;user-select:none;-webkit-user-select:none;min-height:44px;min-width:44px}
.playmoney{text-align:center;font-size:12px;color:var(--muted);margin:6px 0 2px}
.ver{font-size:12px;color:var(--muted)}
.textin{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:44px}
select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:44px;width:100%}
.devrow{display:flex;flex-direction:column;gap:4px;margin:8px 0;font-size:13px;color:var(--ink2)}
.codebig{font-size:clamp(40px,11vw,60px);font-weight:900;letter-spacing:.18em;text-align:center;color:var(--gold);text-shadow:0 0 30px rgba(240,200,105,.25);margin:6px 0}
.linkbox{width:100%;margin-top:8px;font:inherit;font-size:12px;color:var(--ink2);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px}
.warn{margin-top:10px;background:#3a2410;border:1px solid var(--gold2);color:var(--gold);border-radius:12px;padding:10px;font-size:13px;line-height:1.5}
.olseats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media (max-width:520px){.olseats{grid-template-columns:repeat(2,1fr)}}
.olseat{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:2px;align-items:center;font-size:13px;min-height:84px;justify-content:center}
.olseat .i{font-size:26px}
.olseat small{font-size:12px;color:var(--muted)}
.olseat.me{border-color:var(--gold)}
.olseat.empty{color:var(--muted);border-style:dashed}
.ollog{max-height:160px;overflow:auto;font-size:12px;color:var(--ink2);line-height:1.6}
.spinner{width:42px;height:42px;margin:18px auto;border-radius:50%;border:4px solid var(--line);border-top-color:var(--gold);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.finals{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.finals div{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left}
.finals div.top{border-color:var(--gold);background:linear-gradient(90deg,#3d2f0e66,var(--bg2))}
.finals span{font-weight:900;color:var(--gold)}
.finals em{font-style:normal;font-weight:900;color:var(--gold)}
.seat.offline .ava{filter:grayscale(1) brightness(.6)}
#sitTxt .ib{min-height:36px}
@media (max-width:600px){#sitTxt .ib{min-height:44px}}
@media (orientation:landscape) and (max-height:520px){
  #app{max-width:none;height:100dvh;min-height:0}
  #table.screen{flex:1;min-height:0;grid-template-rows:auto minmax(0,1fr)}
  #table .felt{overflow:hidden;grid-template-rows:auto minmax(0,1fr) auto}
  .potsub,.me .info .bet,.me .hint br{display:none}
  .me .hint{max-width:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .me .info{max-width:52vw}
  .goalbar{font-size:12px}
  .topbar{padding:4px 10px 2px}
  .logo span{display:none}
  #table.screen{display:grid;grid-template-columns:1fr 236px;grid-template-rows:auto 1fr;gap:6px;padding:0 8px 6px}
  #table .goalbar{grid-column:1/-1}
  #table .felt{min-height:0;border-radius:24px;padding:8px 6px 8px;--cw:24px;--mcw:44px}
  #table .actions{grid-column:2;grid-row:2;justify-content:center;padding:8px}
  #table .btns{grid-template-columns:1fr 1fr}
  #table .btn{padding:8px 2px;font-size:14px;min-height:44px}
  #table .btn.die{grid-column:1/-1}
  .seat{padding:4px 4px 6px;gap:1px}
  .seat .ava{width:32px;height:32px;font-size:18px}
  .seat .nm{font-size:12px}
  .me .seat{padding:6px 10px;min-width:0}
  .pot{font-size:22px}
  .round{padding:2px 10px}
  .felt .emblem{display:none}
  .hero .fan{height:70px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

    <symbol id="mark" viewBox="0 0 64 64">

      <h4>\uD2B9\uC218 \uC2B9\uB9AC\uC640 MP (\uC9C0\uAE08 \uBC29: ${t.name})</h4>
      <table><tr><th>\uC720\uD615</th><th>\uC870\uAC74</th><th>1\uC5B5\uB2F9</th><th>\uD310\uB2F9 \uC0C1\uD55C(2\uC778)</th></tr>
      <tr><td>\uD558\uD2B8 A \uC2B9\uB9AC</td><td>\u2665A \uD328\uAC00 \uC774\uAE40</td><td>10</td><td>${t.cap.heart_win}</td></tr>
      <tr><td>\uD038\uC758 \uD558\uD2B8 \uACA9\uD30C</td><td>\uD038 \uD328\uAC00 \uC774\uAE30\uACE0 \u2665A \uD328\uAC00 \uD0C8\uB77D</td><td>20</td><td>${t.cap.queen_slay}</td></tr>
      <tr><td>\uD22C\uD558\uD2B8\uC758 \uD038 \uACA9\uD30C</td><td>\uD22C\uD558\uD2B8\uAC00 \uD038 \uD328\uB97C \uC774\uAE40</td><td>100</td><td>${t.cap.double_heart}</td></tr></table>
      <p>MP = min(\uD310\uB2F9 \uC0C1\uD55C, \uB534 Gold(\uC218\uC218\uB8CC \uC804) \xF7 1\uC5B5 \xD7 \uBE44\uC728). 3\uC778\uC740 \uC0C1\uD55C \xD71.5, 4\uC778 \xD72. \uC1FC\uB2E4\uC6B4\uAE4C\uC9C0 \uAC00\uC57C \uBC1B\uACE0, \uD558\uB8E8 100 MP\uAE4C\uC9C0(\uB0A8\uC740 \uB9CC\uD07C\uB9CC). \uD22C\uD558\uD2B8\uB294 \uC77C\uC77C \uC0C1\uD55C \uC608\uC678.</p>
      <h4>\uC9C4\uD589</h4>
      <ol><li>\uBAA8\uB450 \uC564\uD2F0\uB97C \uB0B8\uB2E4.</li><li>\uCE74\uB4DC 1\uC7A5(\uB098\uB9CC \uBD04) \u2192 1\uCC28 \uBCA0\uD305.</li><li>\uCE74\uB4DC 1\uC7A5 \uB354 \u2192 2\uCC28(\uCD5C\uC885) \uBCA0\uD305.</li><li>2\uBA85 \uC774\uC0C1 \uB0A8\uC73C\uBA74 \uC1FC\uB2E4\uC6B4, 1\uBA85\uB9CC \uB0A8\uC73C\uBA74 \uD328 \uACF5\uAC1C \uC5C6\uC774 \uAC00\uC838\uAC04\uB2E4(MP \uC5C6\uC74C).</li></ol>
      <h4>\uBCA0\uD305</h4>
      <ul><li><b>\uCCB4\uD06C</b>: \uC5F4\uB9B0 \uBCA0\uD305\uC774 \uC5C6\uC73C\uBA74 \uB204\uAD6C\uB098, \uB450 \uB77C\uC6B4\uB4DC \uBAA8\uB450.</li><li><b>\uC0A5</b>: 1\uCC28 \uBCA0\uD305\uC758 \uC120 \uD50C\uB808\uC774\uC5B4\uAC00 \uCC98\uC74C\uC5D0 \uC564\uD2F0\uB9CC\uD07C \uAC74\uB2E4. \uB808\uC774\uC988\uB85C \uC138\uC9C0 \uC54A\uB294\uB2E4.</li>
      <li><b>\uCF5C</b>: \uC55E \uBCA0\uD305\uC5D0 \uB9DE\uCD98\uB2E4. \uCF5C\uD55C \uB4A4\uC5D0\uB294 \uAC19\uC740 \uB77C\uC6B4\uB4DC\uC5D0\uC11C \uB2E4\uC2DC \uC62C\uB9B4 \uC218 \uC5C6\uB2E4.</li><li><b>\uD558\uD504</b>: \uCF5C + \uCF5C\uD55C \uB4A4 \uD310\uB3C8\uC758 50%.</li><li><b>\uB2E4\uC774</b>: \uD3EC\uAE30.</li>
      <li>\uB808\uC774\uC988\uB294 \uB77C\uC6B4\uB4DC\uB2F9 3\uD68C\uAE4C\uC9C0. \uD55C \uD310\uC5D0 \uB0BC \uC218 \uC788\uB294 \uB3C8\uC740 \uC564\uD2F0\xD720\uAE4C\uC9C0. \uD134 \uC81C\uD55C 30\uCD08, \uB118\uAE30\uBA74 \uC790\uB3D9 \uB2E4\uC774.</li><li>\uC120\uC740 \uD310\uB9C8\uB2E4 \uC2DC\uACC4 \uBC29\uD5A5\uC73C\uB85C \uD55C \uC790\uB9AC\uC529 \uC62E\uACA8 \uAC00\uACE0, \uB450 \uB77C\uC6B4\uB4DC \uBAA8\uB450 \uBA3C\uC800 \uD589\uB3D9\uD55C\uB2E4.</li></ul>
      <h4>\uB3D9\uC810</h4><p>\uB3D9\uC810\uC778 \uC0AC\uB78C\uB07C\uB9AC \uD22C\uD45C\uD569\uB2C8\uB2E4. \uBAA8\uB450 \uC7AC\uACBD\uAE30\uC5D0 \uCC2C\uC131\uD558\uBA74 \uD310\uB3C8\uC744 \uC774\uC6D4\uD574 \uC564\uD2F0 \uC5C6\uC774 \uC0C8 \uCE74\uB4DC\uB85C \uB2E4\uC2DC(\uD55C\uB3C4\uB294 \uB204\uC801), \uD55C \uBA85\uC774\uB77C\uB3C4 \uAC70\uBD80\uD558\uBA74 \uD310\uB3C8 \uC804\uCCB4\uB97C \uB611\uAC19\uC774 \uB098\uB215\uB2C8\uB2E4. \uB3D9\uC810 \uD310\uC740 MP\uAC00 \uC5C6\uC2B5\uB2C8\uB2E4.</p>
      <h4>\uC815\uC0B0\uACFC \uBC29</h4><p>\uC2B9\uC790\uB294 \uD310\uB3C8 \uC804\uBD80\uB97C \uAC00\uC838\uAC00\uACE0, \uC218\uC775(\uBC1B\uC740 \uD310\uB3C8 \u2212 \uC790\uAE30\uAC00 \uB0B8 \uB3C8)\uC758 3%\uAC00 \uC18C\uAC01\uB429\uB2C8\uB2E4.</p>
