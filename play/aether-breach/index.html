const NULL_AUDIO = { play() {}, toggle() { return false }, enabled: false, ready: false }
class Game {
  constructor({ renderer = null, audio = NULL_AUDIO, rng = new PyRandom(), highQuality = false } = {}) {

  get proj() { return this.renderer ? this.renderer.proj : 512 / (2 * Math.tan(FOV / 2)) }
  reset() {
    this.player = new Player()
    this.enemies = []; this.projectiles = []; this.particles = []
    this.pickups = [new Pickup(12.5, 24.0, 'health'), new Pickup(19.5, 24.0, 'shield'), new Pickup(3.5, 13.0, 'health'), new Pickup(28.5, 13.0, 'shield')]

    this.extraction = false; this.weapon = 'rifle'; this.ammo = { rifle: 30, scatter: 8 }

    this.recoil = this.muzzle = this.hit_marker = this.damage_flash = 0; this.shake = 0

    this.state = 'menu'

  }
  announce(title, subtitle = '', duration = 3.0) { this.banner = title; this.banner_sub = subtitle; this.banner_timer = duration }

    this.wave += 1
    let count
    if (this.wave === 1) { count = 5; this.announce('BREACH INITIATED', 'ELIMINATE SECURITY  /  KEEP MOVING') }
    else if (this.wave === 2) { count = 8; this.announce('SECURITY ESCALATION', 'STALKERS INBOUND  /  USE YOUR DASH'); this.audio.play('wave') }
    else { count = 6; this.announce('AEGIS HAS AWAKENED', 'DESTROY THE REACTOR GUARDIAN', 3.8); this.audio.play('wave') }

const fullscreenOK = () => !!(document.fullscreenEnabled && document.documentElement.requestFullscreen)
function toggleQuality() { game.high_quality = !game.high_quality; L.worldH = 0; setRenderer() }
function exitGame() {                                        // EXIT: leave the page (a browser tab cannot quit)
  if (history.length > 1 && document.referrer) history.back()
  else location.href = '../../'
}
function clickAction(action) {
  if (action === 'start' || action === 'restart') game.start()
  else if (action === 'resume') resume()
  else if (action === 'menu') { game.reset(); game.to_menu() }
  else if (action === 'quit') exitGame()
  else if (action === 'audio') audio.toggle()
  else if (action === 'quality') toggleQuality()
  else if (action === 'fps') game.show_fps = !game.show_fps
  else if (action === 'fullscreen') toggleFullscreen()
}
function onKey(code) {                                       // Game.events (KEYDOWN)
  const g = game
  if (code === 'F11') toggleFullscreen()
  else if (code === 'KeyM') audio.toggle()
  else if (code === 'F3') g.show_fps = !g.show_fps
  else if (code === 'F2') toggleQuality()
  else if (code === 'Escape') { if (g.state === 'playing') pause(); else if (g.state === 'paused' && performance.now() - input.unlockAt > 400) resume() }
  else if ((code === 'Enter' || code === 'NumpadEnter') && (g.state === 'menu' || g.state === 'dead' || g.state === 'victory')) g.start()
  else if (g.state === 'playing') {
    if (code === 'KeyR') g.reload()
    else if (code === 'Digit1' || code === 'Digit2') g.switch_weapon(code === 'Digit1' ? 'rifle' : 'scatter')
    else if (code === 'Tab') g.show_map = !g.show_map
    else if (code === 'ShiftLeft' || code === 'ShiftRight' || code === 'Space') g.dash(key('KeyW') - key('KeyS'), key('KeyD') - key('KeyA'))
  }
}
const NO_DEFAULT = new Set(['Tab', 'F2', 'F3', 'F11', 'Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'])
addEventListener('keydown', e => {
  if (NO_DEFAULT.has(e.code)) e.preventDefault()
  audio.init()
  if (e.repeat) return
  input.keys.add(e.code)
  onKey(e.code)
})
addEventListener('keyup', e => input.keys.delete(e.code))
addEventListener('blur', () => { input.keys.clear(); input.mouseHeld = false; if (game.state === 'playing') pause() })   // WINDOWFOCUSLOST
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (game.state === 'playing') pause(); if (audio.ctx && audio.ctx.state === 'running') audio.ctx.suspend().catch(() => {}) }
  else if (audio.ctx && audio.ctx.state === 'suspended') audio.ctx.resume().catch(() => {})
})
for (const type of ['pointerdown', 'touchend', 'click']) addEventListener(type, () => audio.init(), true)
function toHud(e) { const k = L.bw / L.cw / L.kh; return [(e.clientX - L.left) * k, (e.clientY - L.top) * k] }
function hitButton(pos) { for (const [name, r] of Object.entries(ui.buttons)) if (inside(pos, r)) return name; return null }
canvas.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch' && !touchMode) setTouchMode(true)
  const g = game
  if (e.pointerType === 'mouse') {
    input.mouse = toHud(e)
    if (e.button !== 0) return
    if (g.state !== 'playing') { const name = hitButton(input.mouse); if (name) clickAction(name); return }
    if (capturePending()) { requestLock(); input.swallow = true; return }
    input.mouseHeld = true
    return
  }
  e.preventDefault()
  if (g.state !== 'playing') { input.pressed = hitButton(toHud(e)); input.pressId = e.pointerId; return }
  if (input.lookId === null) { input.lookId = e.pointerId; input.lookX = e.clientX; input.lookY = e.clientY; try { canvas.setPointerCapture(e.pointerId) } catch (x) {} }
})
canvas.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse') {
    input.mouse = toHud(e)
    if (locked()) { input.relX += e.movementX; input.relY += e.movementY }
    else if (input.lockUnavailable && game.state === 'playing') { input.relX += e.movementX; input.relY += e.movementY }
    return
  }
  if (e.pointerId === input.lookId) { input.relTX = (input.relTX || 0) + e.clientX - input.lookX; input.relTY = (input.relTY || 0) + e.clientY - input.lookY; input.lookX = e.clientX; input.lookY = e.clientY }
})
const pointerEnd = e => {
  if (e.pointerType === 'mouse') { if (e.button === 0 || !(e.buttons & 1)) { input.mouseHeld = false; input.swallow = false } return }
  if (e.pointerId === input.lookId) input.lookId = null
  if (e.pointerId === input.pressId) {                        // touch menus act on release over the same button
    const name = hitButton(toHud(e)); if (name && name === input.pressed && game.state !== 'playing') clickAction(name)
    input.pressed = null; input.pressId = null
  }
}
canvas.addEventListener('pointerup', pointerEnd)
canvas.addEventListener('pointercancel', e => { if (e.pointerId === input.lookId) input.lookId = null; if (e.pointerId === input.pressId) { input.pressed = null; input.pressId = null } input.mouseHeld = false })
addEventListener('mouseup', e => { if (e.button === 0) input.mouseHeld = false })
canvas.addEventListener('contextmenu', e => e.preventDefault())
canvas.addEventListener('wheel', e => {                     // MOUSEWHEEL: switch weapon (one switch per notch)
  e.preventDefault()
  const now = performance.now()
  if (game.state === 'playing' && Math.abs(e.deltaY) + Math.abs(e.deltaX) > 0 && now - input.wheelAt > 90) { input.wheelAt = now; game.switch_weapon(game.weapon === 'rifle' ? 'scatter' : 'rifle') }
}, { passive: false })

// touch controls (touch-kit): left stick = WASD, FIRE = hold, buttons map to the original keys
let kit = null, rotateDismissed = false
const kitStyle = document.createElement('style')
kitStyle.textContent = `
.tk-root .tk-btn{border-color:rgba(92,246,232,.55);background:rgba(8,20,31,.5);color:#e2f4f6;font-family:Consolas,"DejaVu Sans Mono",Menlo,monospace;letter-spacing:0;font-size:12px}
.tk-root .tk-btn.s{width:54px;height:54px;font-size:12px}
.tk-root .tk-lab{font-size:12px}
.tk-root .tk-btn.on{background:rgba(92,246,232,.38);border-color:#b2fff0}
.tk-root .tk-btn.ab-fire{border-color:rgba(255,195,102,.7)}
.tk-root .tk-btn.ab-sel{border-color:#5cf6e8;box-shadow:0 0 0 2px rgba(92,246,232,.35),0 2px 12px rgba(0,0,0,.35)}
.tk-root .tk-btn.ab-dash{background:conic-gradient(rgba(92,246,232,.42) calc(var(--cd,1)*360deg),rgba(8,20,31,.5) 0)}
.tk-root .tk-base{border-color:rgba(92,246,232,.35);background:radial-gradient(circle,rgba(92,246,232,.08),rgba(92,246,232,.02) 70%)}
.tk-root .tk-knob{background:rgba(92,246,232,.25);border-color:rgba(178,255,240,.6)}
.tk-rot{background:rgba(2,8,15,.95)!important;font-family:Bahnschrift,"Segoe UI",Roboto,sans-serif!important}`
document.head.appendChild(kitStyle)
function makeKit() {
  if (!window.TouchKit) return
  kit = TouchKit.create({
    show: 'manual', landscape: true,
    sticks: [{ id: 'move', side: 'left', label: 'MOVE', keys: 'wasd' }],
    buttons: [
      { id: 'fire', label: 'FIRE', icon: '✦', size: 'l', row: 0, onDown: () => { input.touchFire = true }, onUp: () => { input.touchFire = false } },
      { id: 'dash', label: 'DASH', icon: '»', row: 0, key: 'ShiftLeft', tap: true },
      { id: 'reload', label: 'RELOAD', icon: '↻', size: 's', row: 1, key: 'KeyR', tap: true },
      { id: 'w2', label: 'ION', icon: '2', size: 's', row: 1, key: 'Digit2', tap: true },
      { id: 'w1', label: 'ARC', icon: '1', size: 's', row: 1, key: 'Digit1', tap: true },
      { id: 'pause', label: 'PAUSE', icon: '❚❚', size: 's', place: 'top-right', key: 'Escape', tap: true },
      { id: 'map', label: 'MAP', size: 's', place: 'top-right', key: 'Tab', tap: true },
    ],
  })
  kit.buttons.fire.el.classList.add('ab-fire'); kit.buttons.dash.el.classList.add('ab-dash')
  kit.rotate = document.querySelector('.tk-rot')
  if (kit.rotate) kit.rotate.querySelector('button').addEventListener('click', () => { rotateDismissed = true })
}
let lastDash = -1, lastWeapon = ''
function updateKit() {
  if (!kit || !kit.visible) return
  const f = 1 - Math.min(1, game.player.dash_cooldown / 2.6), q = Math.round(f * 40) / 40
  if (q !== lastDash) { lastDash = q; kit.buttons.dash.el.style.setProperty('--cd', q) }
  if (game.weapon !== lastWeapon) { lastWeapon = game.weapon; kit.buttons.w1.el.classList.toggle('ab-sel', lastWeapon === 'rifle'); kit.buttons.w2.el.classList.toggle('ab-sel', lastWeapon === 'scatter') }
}

// ---------- boot + main loop (Game.run) ----------
layout()
const A = ASSETS()
weaponCanvas = { rifle: surfaceCanvas(A.weapons.rifle), scatter: surfaceCanvas(A.weapons.scatter) }
game = new Game({ audio, rng: new PyRandom(Date.now() % 4294967296) })
game.onCapture = onCapture
setRenderer()
makeKit()
addEventListener('resize', layout)
if (window.visualViewport) visualViewport.addEventListener('resize', layout)
const portrait = matchMedia('(orientation: portrait)'), hook = window.__ab = { freeze: false }   // small debug/test hook
const TOUCH_YAW = 0.0055, TOUCH_PITCH = 0.3                 // radians / pitch units per CSS pixel dragged
let last = performance.now(), frames = [], lastState = game.state, slow = 0
function frame(now) {
  requestAnimationFrame(frame)
  let dt = (now - last) / 1000; last = now
  if (!(dt >= 0)) dt = 0
  if (dt > 0.05) dt = 0.05
  frames.push(now); while (frames.length > 11) frames.shift()
  if (frames.length > 1) game.fps = 1000 * (frames.length - 1) / (frames[frames.length - 1] - frames[0])
  const g = game, p = g.player
  const rotating = kit && kit.rotate && kit.visible && kit.rotate.classList.contains('need') && portrait.matches
  if (hook.freeze) dt = 0                                     // test hook: hold the simulation still for screenshots
  if (g.state === 'playing' && !capturePending() && !rotating && !hook.freeze) {
    const limit = 75 * renderer.pitchUnit
    p.angle = pmod(p.angle + input.relX * 0.0024 + (input.relTX || 0) * TOUCH_YAW, TAU)
    p.pitch = Math.max(-limit, Math.min(limit, p.pitch - input.relY * 0.16 * renderer.pitchUnit - (input.relTY || 0) * TOUCH_PITCH * renderer.pitchUnit))
    input.relX = input.relY = input.relTX = input.relTY = 0
    if (key('ArrowLeft')) p.angle -= dt * 1.9
    if (key('ArrowRight')) p.angle += dt * 1.9
    const firing = (input.mouseHeld && !input.swallow && (locked() || input.lockUnavailable)) || input.touchFire
    g.update(dt, key('KeyW') - key('KeyS'), key('KeyD') - key('KeyA'), firing)
  } else {
    input.relX = input.relY = input.relTX = input.relTY = 0
    if (g.state === 'menu') {
      g.menu_time += dt
      p.angle = -Math.PI / 2 + 0.13 + Math.sin(g.menu_time * 0.18) * 0.19
      for (const e of g.enemies) e.age += dt
    }
  }
  if (g.state !== lastState) {                                // death / victory release the controls
    if (g.state !== 'playing' && touchMode && kit) kit.show(false)
    lastState = g.state
  }
  if (touchMode && g.state === 'playing' && renderer.h > 150) {  // phones: lower the world resolution if it cannot keep up
    slow = L.worldMs > 11 ? slow + 1 : Math.max(0, slow - 2)
    if (slow > 90) { slow = 0; L.worldH = Math.max(150, Math.round(renderer.h * 0.85)); setRenderer() }
  }
  updateKit()
  draw()
}
requestAnimationFrame(frame)
Object.assign(hook, { game: () => game, renderer: () => renderer, layout: () => L, input, kit: () => kit, touchMode: () => touchMode, click: clickAction, audio,
  button: name => { const r = ui.buttons[name]; return r && [L.left + (r[0] + r[2] / 2) * L.kh * L.cw / L.bw, L.top + (r[1] + r[3] / 2) * L.kh * L.cw / L.bw] } })
})()
</script>
</body>
</html>
