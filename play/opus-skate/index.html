<!--
  CONCRETE JUNGLE (OpusSkate) -- web port of skate.cpp (C++17 + SDL2 + OpenGL 3.3).
  One self-contained file: WebGL2 renderer with the original shaders (GLSL ES 3.00), the original physics,
  tricks, scoring, pedestrians, traffic, autopilot and the procedural audio (AudioWorklet).
  Keyboard exactly as the original; on phones / tablets on-screen controls appear (touch-kit).
-->
<style>

  touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
#gl { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
#safe { position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
#load, #err { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px;
  color: #ffd23a; font: 700 18px/1.4 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .12em; text-align: center; padding: 24px; background: #0a0c12; z-index: 10; }

#err { color: #ff8a7a; z-index: 11; }
#err[hidden], #load[hidden] { display: none; }
/* touch menus (phones / tablets only; the keyboard menus are drawn in the game's pixel font) */
.menu { position: fixed; left: 0; right: 0; display: none; flex-wrap: wrap; justify-content: center; align-content: center; gap: 10px;
  padding: 0 calc(16px + env(safe-area-inset-right)) 0 calc(16px + env(safe-area-inset-left)); z-index: 5; pointer-events: none; }
.menu.on { display: flex; }
.mb { pointer-events: auto; touch-action: manipulation; min-height: 48px; min-width: 96px; padding: 0 16px; box-sizing: border-box;
  border: 2px solid #ffd23a; border-radius: 6px; background: rgba(10, 12, 18, .78); color: #fff; cursor: pointer;
  font: 700 14px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .08em; text-transform: uppercase; }
.mb.pri { background: #ffd23a; color: #141414; }

.tk-btn span, .tk-lab { font-size: 12px; }
.tk-rot button { min-height: 44px; min-width: 44px; }
@media (max-height: 430px) { #m-pause { top: 25%; } .mb { min-height: 46px; font-size: 13px; } }

<script>
/* touch-kit.js — on-screen touch controls for keyboard/mouse web games. No dependencies.
 * Inline it into a single-file game (inside a script tag) or load it next to the game.
 *
 *   const kit = TouchKit.create({
 *     sticks: [
 *       { id: 'move', side: 'left',  label: 'MOVE', keys: 'wasd' },            // 'wasd' | 'arrows' | {up,down,left,right} codes
 *       { id: 'aim',  side: 'right', label: 'AIM',  onMove: (x, y, on) => {} } // analog -1..1, on=false when released
 *     ],
 *     buttons: [ { id: 'fire', label: 'FIRE', icon: '✦', key: 'Space' },      // key: KeyboardEvent.code to hold while pressed
 *                { id: 'map', label: 'MAP', key: 'KeyM', place: 'top-right' } ],
 *     landscape: true,        // ask to rotate when the phone is held upright
 *   })
 *   kit.show(false)           // hide in menus, kit.show(true) in gameplay (default: shown on touch devices)
 *   kit.stick('aim')          // → { x, y, on }   kit.pressed('fire') → boolean
 *
 * Buttons without `key` can use onDown/onUp. Sticks with `keys` send keydown/keyup (8 directions) and still report analog x/y.
 * Keys are dispatched as KeyboardEvents (key, code, keyCode, which) on document, so window/document listeners receive them.
 * Everything else on the page keeps working: the kit only captures touches that start on its own zones/buttons.
 */
(function () {
  'use strict'
  if (window.TouchKit) return
  const KEYS = { Space: [' ', 32], Enter: ['Enter', 13], Escape: ['Escape', 27], Tab: ['Tab', 9], ShiftLeft: ['Shift', 16],
    ControlLeft: ['Control', 17], AltLeft: ['Alt', 18], ArrowLeft: ['ArrowLeft', 37], ArrowUp: ['ArrowUp', 38],
    ArrowRight: ['ArrowRight', 39], ArrowDown: ['ArrowDown', 40], Backspace: ['Backspace', 8] }
  const keyInfo = code => {
    if (KEYS[code]) return KEYS[code]
    if (/^Key[A-Z]$/.test(code)) return [code[3].toLowerCase(), code.charCodeAt(3)]
    if (/^Digit\d$/.test(code)) return [code[5], code.charCodeAt(5)]
    return [code, 0]
  }
  const held = new Map()                                   // code → count of sources holding it
  function sendKey(type, code) {
    const [key, kc] = keyInfo(code)
    const ev = new KeyboardEvent(type, { key, code, bubbles: true, cancelable: true, composed: true })
    try { Object.defineProperty(ev, 'keyCode', { get: () => kc }); Object.defineProperty(ev, 'which', { get: () => kc }) } catch (e) {}
    const t = document.activeElement && document.activeElement !== document.body ? document.activeElement : document
    t.dispatchEvent(ev)
  }
  function press(code) { const n = held.get(code) || 0; held.set(code, n + 1); if (n === 0) sendKey('keydown', code) }
  function release(code) { const n = held.get(code) || 0; if (n <= 1) { held.delete(code); if (n === 1) sendKey('keyup', code) } else held.set(code, n - 1) }
  function tapKey(code) { press(code); setTimeout(() => release(code), 80) }

  const isTouch = () => matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0
  const CSS = `
.tk-root{position:fixed;inset:0;pointer-events:none;z-index:2147483000;font:600 12px/1 system-ui,-apple-system,'Segoe UI',sans-serif;
  letter-spacing:.06em;color:#fff;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tk-root.tk-off{display:none}
.tk-zone{position:absolute;bottom:0;top:22%;pointer-events:auto;touch-action:none}
.tk-zone.l{left:0;width:42%}.tk-zone.r{right:0;width:42%}
.tk-base{position:absolute;width:128px;height:128px;margin:-64px 0 0 -64px;border-radius:50%;border:2px solid rgba(255,255,255,.28);
  background:radial-gradient(circle,rgba(255,255,255,.07),rgba(255,255,255,.02) 70%);transition:opacity .15s;opacity:.55}
.tk-knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;
  background:rgba(255,255,255,.28);border:2px solid rgba(255,255,255,.55);box-shadow:0 2px 10px rgba(0,0,0,.35)}
.tk-base.on{opacity:.95}
.tk-lab{position:absolute;left:0;right:0;top:50%;margin-top:-5px;text-align:center;opacity:.75;text-shadow:0 1px 2px #000;pointer-events:none}
.tk-btns{position:absolute;display:flex;gap:12px;pointer-events:none}
.tk-btns.br{right:calc(18px + env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));flex-direction:column-reverse;align-items:flex-end}
.tk-btns.tr{right:calc(12px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));flex-direction:row-reverse}
.tk-btns.tl{left:calc(12px + env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top))}
.tk-btns.bl{left:calc(18px + env(safe-area-inset-left));bottom:calc(20px + env(safe-area-inset-bottom));flex-direction:column-reverse}
.tk-row{display:flex;gap:12px;flex-direction:row-reverse;align-items:flex-end}
.tk-btn{pointer-events:auto;touch-action:none;width:68px;height:68px;border-radius:50%;border:2px solid rgba(255,255,255,.5);
  background:rgba(20,22,30,.42);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  box-shadow:0 2px 12px rgba(0,0,0,.35);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.tk-btn.s{width:54px;height:54px;font-size:12px}.tk-btn.l{width:84px;height:84px}
.tk-btn i{font-style:normal;font-size:22px;line-height:1}.tk-btn.s i{font-size:17px}
.tk-btn.on{background:rgba(255,255,255,.34);border-color:#fff;transform:scale(.94)}
.tk-rot{position:fixed;inset:0;z-index:2147483600;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;
  background:rgba(8,9,14,.94);color:#eee;font:500 16px/1.5 system-ui,sans-serif;text-align:center;pointer-events:auto;padding:24px}
.tk-rot b{font-size:44px;display:block;animation:tkr 1.8s ease-in-out infinite}
.tk-rot button{margin-top:6px;background:none;border:1px solid #666;color:#bbb;border-radius:22px;padding:10px 20px;min-height:44px;font:inherit;font-size:14px}
@keyframes tkr{0%,20%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){.tk-rot.need{display:flex}}
`
  // A tap on a kit button is followed by a compatibility `click` at the same spot ~100–300 ms later. If the button just
  // opened a game overlay/menu under the finger, that click would hit it (and often close it). Swallow it.
  let clickBlockUntil = 0
  function suppressClick() { clickBlockUntil = Date.now() + 450 }
  document.addEventListener('click', e => {
    if (Date.now() < clickBlockUntil && !(e.target && e.target.closest && e.target.closest('.tk-root'))) { e.stopPropagation(); e.preventDefault() }
  }, true)

  function el(tag, cls, parent, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e }

  function create(opt) {
    opt = opt || {}
    if (!document.getElementById('tk-style')) { const st = el('style'); st.id = 'tk-style'; st.textContent = CSS; document.head.appendChild(st) }
    const root = el('div', 'tk-root', document.body)
    const api = { root, sticks: {}, buttons: {}, visible: false }
    const rests = []                                         // idle-position functions, re-run when shown

    // ---- sticks: floating — the base appears where the thumb lands inside its half of the screen
    for (const s of opt.sticks || []) {
      const side = s.side === 'right' ? 'r' : 'l'
      const zone = el('div', 'tk-zone ' + side, root)
      if (s.zone) Object.assign(zone.style, s.zone)
      const base = el('div', 'tk-base', zone), knob = el('div', 'tk-knob', base)
      if (s.label) el('div', 'tk-lab', knob, s.label)
      const R = s.radius || 52, dz = s.deadzone == null ? 0.3 : s.deadzone
      const keys = s.keys === 'wasd' ? { up: 'KeyW', down: 'KeyS', left: 'KeyA', right: 'KeyD' }
        : s.keys === 'arrows' ? { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight' } : s.keys || null
      const st = { x: 0, y: 0, on: false, pid: null, cx: 0, cy: 0, dirs: {} }
      api.sticks[s.id || side] = st
      const rest = () => {                                   // idle hint position; keeps clear of the bottom-right buttons
        const zr = zone.getBoundingClientRect(); let x = side === 'l' ? 96 : zr.width - 96
        if (side === 'r' && groups.br) { const gr = groups.br.getBoundingClientRect(); if (gr.width) x = Math.min(x, gr.left - zr.left - 80) }
        base.style.left = x + 'px'; base.style.top = (zr.height - 110) + 'px'
      }
      const setDirs = (want) => {
        if (!keys) return
        for (const d of ['up', 'down', 'left', 'right']) {
          if (want[d] && !st.dirs[d]) { st.dirs[d] = true; press(keys[d]) }
          else if (!want[d] && st.dirs[d]) { st.dirs[d] = false; release(keys[d]) }
        }
      }
      const move = (px, py) => {
        let dx = px - st.cx, dy = py - st.cy; const d = Math.hypot(dx, dy)
        if (d > R) { dx *= R / d; dy *= R / d }
        knob.style.transform = `translate(${dx}px,${dy}px)`
        st.x = dx / R; st.y = dy / R
        const m = Math.hypot(st.x, st.y), a = Math.atan2(st.y, st.x)
        const want = { up: false, down: false, left: false, right: false }
        if (m > dz) { const oct = Math.round(a / (Math.PI / 4)); // 8 directions
          want.right = [0, 1, -1].includes(oct); want.left = [4, -4, 3, -3].includes(oct); want.down = [1, 2, 3].includes(oct); want.up = [-1, -2, -3].includes(oct) }
        setDirs(want)
        if (s.onMove) s.onMove(st.x, st.y, true)
      }
      zone.addEventListener('pointerdown', e => {
        if (st.pid !== null) return
        e.preventDefault(); st.pid = e.pointerId; try { zone.setPointerCapture(e.pointerId) } catch (x) {}
        const zr = zone.getBoundingClientRect(); st.cx = e.clientX; st.cy = e.clientY
        base.style.left = (e.clientX - zr.left) + 'px'; base.style.top = (e.clientY - zr.top) + 'px'
        base.classList.add('on'); st.on = true; move(e.clientX, e.clientY)
        if (s.onStart) s.onStart()
      })
      zone.addEventListener('pointermove', e => { if (e.pointerId === st.pid) { e.preventDefault(); move(e.clientX, e.clientY) } })
      const end = e => {
        if (e.pointerId !== st.pid) return
        st.pid = null; st.on = false; st.x = st.y = 0; knob.style.transform = ''; base.classList.remove('on'); setDirs({}); rest()
        if (s.onMove) s.onMove(0, 0, false); if (s.onEnd) s.onEnd()
      }
      zone.addEventListener('pointerup', end); zone.addEventListener('pointercancel', end)

    }

    const groups = {}
    for (const b of opt.buttons || []) {
      const place = b.place || 'bottom-right', code = { 'bottom-right': 'br', 'top-right': 'tr', 'top-left': 'tl', 'bottom-left': 'bl' }[place] || 'br'
      if (!groups[code]) groups[code] = el('div', 'tk-btns ' + code, root)
      let parent = groups[code]
      if (code === 'br' && b.row != null) { parent = groups['br' + b.row] || (groups['br' + b.row] = el('div', 'tk-row', groups.br)) }

      const bs = { down: false, pid: null, el: btn }
      api.buttons[b.id || b.label] = bs
      const down = e => {
        e.preventDefault(); e.stopPropagation()
        if (b.toggle) { bs.down = !bs.down; btn.classList.toggle('on', bs.down); if (b.key) (bs.down ? press : release)(b.key); (bs.down ? b.onDown : b.onUp) && (bs.down ? b.onDown : b.onUp)(); return }
        if (bs.pid !== null) return
        bs.pid = e.pointerId; try { btn.setPointerCapture(e.pointerId) } catch (x) {}
        bs.down = true; btn.classList.add('on')
        if (b.key) { if (b.tap) tapKey(b.key); else press(b.key) }
        if (b.onDown) b.onDown()
        if (navigator.vibrate && b.buzz !== false) try { navigator.vibrate(8) } catch (x) {}
      }
      const up = e => {
        suppressClick()
        if (b.toggle || e.pointerId !== bs.pid) return
        bs.pid = null; bs.down = false; btn.classList.remove('on')
        if (b.key && !b.tap) release(b.key)
        if (b.onUp) b.onUp()
      }
      btn.addEventListener('pointerdown', down); btn.addEventListener('pointerup', up); btn.addEventListener('pointercancel', up)
      btn.addEventListener('contextmenu', e => e.preventDefault())
    }

    // ---- portrait → ask to rotate (can be dismissed)
    let rot = null, rotDismissed = false                      // once dismissed, show(true) must not bring the hint back
    if (opt.landscape) {
      rot = el('div', 'tk-rot', document.body, `<b>⟳</b><div>${opt.rotateText || '휴대폰을 가로로 돌려 주세요'}<br><small style="opacity:.6">Rotate your phone</small></div><button type="button">그래도 세로로 하기</button>`)
      rot.querySelector('button').addEventListener('click', () => { rotDismissed = true; rot.classList.remove('need') })
    }

    // ---- page hygiene for touch play: no pinch/double-tap zoom, no pull-to-refresh, no long-press menu on the game
    if (opt.preventGestures !== false) {
      document.documentElement.style.overscrollBehavior = 'none'
      document.addEventListener('gesturestart', e => e.preventDefault())
      let lastT = 0
      document.addEventListener('touchend', e => { const now = Date.now(); if (now - lastT < 300 && !(e.target.closest && e.target.closest('input,textarea,select,a,button'))) e.preventDefault(); lastT = now }, { passive: false })
    }

    api.show = on => {
      api.visible = on; root.classList.toggle('tk-off', !on); if (on) requestAnimationFrame(() => rests.forEach(f => f())); if (rot) rot.classList.toggle('need', on && !!opt.landscape && !rotDismissed)
      if (!on) { for (const s of Object.values(api.sticks)) s.reset && s.reset(); for (const [code] of held) sendKey('keyup', code); held.clear()
        for (const b of Object.values(api.buttons)) { b.down = false; b.pid = null; b.el.classList.remove('on') } }
    }
    api.stick = id => api.sticks[id] || { x: 0, y: 0, on: false }
    api.pressed = id => !!(api.buttons[id] && api.buttons[id].down)
    api.destroy = () => { api.show(false); root.remove(); if (rot) rot.remove() }
    const mode = opt.show || 'auto'
    api.show(mode === 'always' || (mode === 'auto' && isTouch()))
    if (mode === 'auto' && !api.visible) addEventListener('touchstart', function once() { removeEventListener('touchstart', once); api.show(true) }, { passive: true })
    return api
  }

  // Helpers for games that read the mouse: fire mouse events at a point (client coords).
  function mouse(target, type, x, y, extra) {
    const ev = new MouseEvent(type, Object.assign({ clientX: x, clientY: y, bubbles: true, cancelable: true, button: 0, buttons: type === 'mouseup' ? 0 : 1 }, extra || {}))
    ;(target || document.elementFromPoint(x, y) || document).dispatchEvent(ev)
  }
  // Resume every AudioContext the game creates, on the first real touch (iOS/Android need a user gesture).
  function unlockAudio() {
    const ctxs = new Set(), AC = window.AudioContext || window.webkitAudioContext
    if (AC && !AC.__tk) { const W = function (...a) { const c = new AC(...a); ctxs.add(c); return c }; W.prototype = AC.prototype; W.__tk = true; window.AudioContext = W; if (window.webkitAudioContext) window.webkitAudioContext = W }
    const go = () => { for (const c of ctxs) if (c.state === 'suspended') c.resume().catch(() => {}) }
    addEventListener('pointerdown', go, true); addEventListener('touchend', go, true)
  }
  window.TouchKit = { create, press, release, tapKey, sendKey, mouse, unlockAudio, isTouch }
})()
</script>
<script>
(() => {
'use strict';
// ============================================================================
//   CONCRETE JUNGLE  --  web port of skate.cpp (OpusSkate)
//   Early-2000s New York City block: storefronts, brownstone stoops, a plaza
//   fountain, the basketball cage, a construction site and the East River.
//
//   This file is a line-by-line JavaScript + WebGL2 port of the single-file
//   C++17 / SDL2 / OpenGL 3.3 game. Everything is still procedural: geometry,
//   shaders, the 5x7 pixel font, sound effects and the boom-bap loop.
// ============================================================================

// ----------------------------------------------------------------------------
// Math
// ----------------------------------------------------------------------------
const PI = 3.14159265358979;
const TAU = 6.28318530717959;
const fr = Math.fround;

class V3 {
    constructor(x = 0, y = 0, z = 0) { this.x = x; this.y = y; this.z = z; }
    clone() { return new V3(this.x, this.y, this.z); }
    set(o) { this.x = o.x; this.y = o.y; this.z = o.z; return this; }
}
const v3 = (x, y, z) => new V3(x, y, z);
const add = (a, b) => new V3(a.x + b.x, a.y + b.y, a.z + b.z);
const sub = (a, b) => new V3(a.x - b.x, a.y - b.y, a.z - b.z);
const mul = (a, s) => new V3(a.x * s, a.y * s, a.z * s);
const addm = (a, b, s) => new V3(a.x + b.x * s, a.y + b.y * s, a.z + b.z * s);   // a + b * s
const dv = (a, s) => new V3(a.x / s, a.y / s, a.z / s);
const neg = (a) => new V3(-a.x, -a.y, -a.z);

      if(w > 1.5){ base = mix(vec3(0.85,0.83,0.78), vec3(0.18,0.2,0.22), step(0.5, hash12(id*3.1+7.0))); spec = 0.1; }
      else if(w > 0.5){
        float r = hash12(id + floor(vPos.x*0.01)*13.0 + floor(vPos.z*0.01)*7.0);
        vec3 glass = vec3(0.10,0.13,0.17) + vec3(0.05)*step(0.6,lc.y);
        if(r < 0.22) { base = vec3(1.0,0.78,0.45) * (0.55 + 0.4*hash12(id+3.0)); emit = 0.75; }
        else if(r < 0.35) { base = mix(vec3(0.75,0.72,0.62), glass, step(0.35, lc.x) * step(lc.x, 0.65)); }  // curtains
        else { base = glass; refl = 0.55; spec = 0.9; shin = 90.0; }
      }
    }
  } else if(m == 3){                                        // limestone with windows
    float cy = fuv.y / 0.62;
    float course = step(0.94, fract(cy)) * (1.0 - smoothstep(0.15, 0.4, fwidth(cy)));
    base *= (0.9 + 0.12*fbm(fuv*1.3)) * (1.0 - course*0.18);
    vec2 id, lc; float w = windowMask(fuv, 3.0, 3.6, 4.8, 1.4, 2.3, 0.7, id, lc);
    if(w > 1.5){ base = vec3(0.25,0.24,0.22); }
    else if(w > 0.5){
      float r = hash12(id + 17.0);
      if(r < 0.18){ base = vec3(1.0,0.85,0.55)*0.8; emit = 0.7; }
      else { base = vec3(0.1,0.12,0.15); refl = 0.6; spec = 0.9; shin = 90.0; }
    }
  } else if(m == 4){                                        // glass curtain wall
    vec2 q = vec2(fuv.x / 1.6, fuv.y / 3.4);
    vec2 f = fract(q), id = floor(q);
    float mull = (f.x < 0.04 || f.y < 0.03) ? 1.0 : 0.0;
    base = mix(vec3(0.16,0.23,0.30) * (0.85 + 0.3*hash12(id)), vec3(0.55,0.57,0.6), mull);
    if(mull < 0.5){ refl = 0.75; spec = 1.2; shin = 140.0; if(hash12(id*1.7) < 0.05){ base = vec3(0.8,0.78,0.66); emit = 0.35; refl=0.3; } }
  } else if(m == 5){                                        // asphalt
    float nz = fbm(vPos.xz * 0.9);
    base *= 0.78 + 0.35*nz;
    base *= 0.93 + 0.14*vnoise(vPos.xz*9.0);
    float patchK = smoothstep(0.62, 0.66, fbm(vPos.xz*0.12 + 4.0));   // ('patch' is reserved in GLSL ES)
    base = mix(base, base*0.72, patchK);
    float crack = smoothstep(0.006, 0.0, abs(fbm(vPos.xz*0.5+11.0) - 0.5)) * step(0.62, vnoise(vPos.xz*0.3));
    base *= 1.0 - crack*0.25;
  } else if(m == 6){                                        // sidewalk slabs
    vec2 g = vPos.xz / 1.52;
    vec2 gi = floor(g), gf = fract(g);
    vec2 fwg = fwidth(g);
    float aa = 1.0 - smoothstep(0.02, 0.06, max(fwg.x, fwg.y));
    float joint = (gf.x < 0.012 || gf.y < 0.012 || gf.x > 0.988 || gf.y > 0.988) ? 1.0 : 0.0;
    base *= 0.86 + 0.16*hash12(gi) + 0.1*fbm(vPos.xz*2.0);
    base *= 1.0 - joint*0.45*aa;
    vec2 gc = floor(vPos.xz * 3.0);
    if(hash12(gc) > 0.975){ vec2 d = fract(vPos.xz*3.0)-0.5; if(dot(d,d) < 0.06) base *= 0.55; }   // gum
  } else if(m == 7){ emit = 1.0; }
  else if(m == 8){                                          // wooden planks (along x)
    float w = vPos.z / 0.22; float pi = floor(w);
    float aaw = 1.0 - smoothstep(0.12, 0.35, fwidth(w));
    float gap = step(0.93, fract(w)) * aaw;
    float grain = vnoise(vec2(vPos.x*1.5 + pi*7.0, fract(w)*8.0));
    base *= (0.8 + 0.25*hash12(vec2(pi, floor(vPos.x/3.0 + hash12(vec2(pi,1.0))*3.0)))) * (0.85 + 0.25*grain);
    base *= 1.0 - gap*0.6;
  } else if(m == 9){ spec = 0.8; shin = 60.0; base *= 0.9 + 0.1*vnoise(fuv*20.0); }
  else if(m == 10){                                         // foliage
    float nz = fbm(vPos.xz*3.0 + vPos.y*2.0);
    base *= 0.6 + 0.8*nz; wrap = 0.5;
  } else if(m == 11){                                       // chain-link fence (cutout)
    vec2 q = fuv * 14.0;
    vec2 r = vec2(q.x + q.y, q.x - q.y);
    vec2 fwq = fwidth(r);
    if(max(fwq.x, fwq.y) > 0.28){ if(hash12(gl_FragCoord.xy) > 0.33) discard; }   // far away: dithered density
    else { vec2 f = abs(fract(r) - 0.5); if(min(f.x, f.y) > 0.09) discard; }
    spec = 0.6; shin = 40.0;
  } else if(m == 12){                                       // shop window glass
    vec3 R = reflect(-V, n);
    float fr = 0.25 + 0.75*pow(1.0 - max(dot(n, V), 0.0), 3.0);
    vec3 inside = vec3(0.16,0.13,0.1) + vec3(0.5,0.4,0.25)*smoothstep(0.55,0.75,fbm(fuv*vec2(1.5,3.0)));
    inside += vec3(0.6,0.55,0.4)*smoothstep(3.6, 4.2, vPos.y);
    base = mix(inside, skyColor(R)*0.8, fr*0.7);
    emit = 0.55; spec = 1.0; shin = 120.0;
  } else if(m == 13){                                       // brick pavers
    vec2 b = vPos.xz * vec2(5.0, 10.0);
    b.x += mod(floor(b.y), 2.0) * 0.5;
    vec2 bf = fract(b);
    vec2 fwb = fwidth(b);
    float aa = 1.0 - smoothstep(0.15, 0.45, max(fwb.x, fwb.y));
    base *= mix(0.95, 0.8 + 0.3*hash12(floor(b)), aa);
    if(bf.x < 0.06 || bf.y < 0.1) base = mix(base, vec3(0.45,0.42,0.38), 0.7*aa);
    base = mix(base, vec3(0.45,0.42,0.38), 0.12*(1.0-aa));
  } else if(m == 14){                                       // striped awning
    float s = step(0.5, fract(fuv.x / 0.45));
    base = mix(base, vec3(0.92,0.9,0.86), s);
    wrap = 0.3;
  } else if(m == 15){ wrap = 0.35; spec = 0.08; }
  else if(m == 16){ base *= 0.9 + 0.15*fbm(vPos.xz*1.5); }
  else if(m == 17){ base *= 0.85 + 0.25*fbm(fuv*1.7) ; base *= 0.95 + 0.08*vnoise(fuv*14.0); }
  else if(m == 18){ float gn = vnoise(fuv*14.0 + vPos.y*9.0); base *= 0.9 + 0.14*mix(gn, 0.5, smoothstep(0.1, 0.4, fwidth(fuv.x*14.0))); spec = 0.25; shin = 50.0; }
  else if(m == 19){ base *= 0.9 + 0.12*vnoise(fuv*25.0); wrap = 0.25; }
  else if(m == 20){ spec = 0.7; shin = 80.0; refl = 0.25; }
  else if(m == 22){ base *= 0.75 + 0.35*fbm(vPos.xz*0.8); }

  float ndl = dot(n, uSunDir);
  float diff = max((ndl + wrap) / (1.0 + wrap), 0.0);
  float sh = ndl > -0.2 ? shadowAt(n) : 0.0;
  vec3 hemi = mix(uGroundCol, uSkyTop*0.9 + uSkyHorizon*0.2, n.y*0.5 + 0.5);
  float ao = horiz ? 1.0 : mix(0.72, 1.0, smoothstep(0.0, 1.4, vPos.y + 0.1));
  vec3 col = base * (hemi * 0.62 * ao + uSunCol * diff * sh);
  vec3 H = normalize(uSunDir + V);
  col += uSunCol * spec * pow(max(dot(n, H), 0.0), shin) * sh;
  if(refl > 0.0){
    vec3 R = reflect(-V, n);
    float fr = 0.2 + 0.8*pow(1.0 - max(dot(n, V), 0.0), 4.0);
    col = mix(col, skyColor(R) * 0.85, refl * fr);
  }
  col = mix(col, base, emit);
  col = applyFog(col, vPos);
  fragColor = vec4(grade(col), 1.0);
}
`;

function compileShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error('Shader compile error:\n' + gl.getShaderInfoLog(s));
    return s;
}
function makeProgram(vs, fs) {
    const p = gl.createProgram();
    const a = compileShader(gl.VERTEX_SHADER, vs), b = compileShader(gl.FRAGMENT_SHADER, fs);
    gl.attachShader(p, a); gl.attachShader(p, b);
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error('Program link error:\n' + gl.getProgramInfoLog(p));
    gl.deleteShader(a); gl.deleteShader(b);
    p.uloc = new Map();   // uniform location cache
    return p;
}

// ----------------------------------------------------------------------------
// Collision world: oriented boxes, ramps and quarter pipes as a 2.5D height
// field, plus grindable line segments and named gaps.
// ----------------------------------------------------------------------------
const S_BOX = 0, S_RAMP = 1, S_QP = 2;
const SURF_ASPHALT = 0, SURF_CONCRETE = 1, SURF_WOOD = 2, SURF_METAL = 3, SURF_BRICK = 4, SURF_WATER = 5, SURF_COURT = 6, SURF_SIDEWALK = 7;

const WATER_LEVEL = -1.9;     // river surface
const RIVER_EDGE_Z = -88;     // seawall line (north)
const STEP_UP = 0.19;         // curbs are auto-climbed, stairs are not

class Solid {
    constructor() {
        this.cx = 0; this.cz = 0; this.c = 1; this.s = 0;   // center + cos/sin of yaw
        this.hx = 1; this.hz = 1;                          // half extents (local x / local z)
        this.y0 = 0; this.h = 1;                           // bottom and height
        this.type = S_BOX;
        this.R = 0;                                        // quarter-pipe transition radius
        this.surf = SURF_CONCRETE;
        this.tall = false;                                 // blocks the camera
        this.noWall = false;                               // never treated as a wall
        this.noGround = false;                             // never stood on (thin rail blockers)
    }
    heightLocal(lx, lz) {
        if (this.type === S_BOX) return this.y0 + this.h;
        if (this.type === S_RAMP) return this.y0 + this.h * sat((lz + this.hz) / (2 * this.hz));
        const x = clampf(lz + this.hz, 0, 2 * this.hz);
        return this.y0 + this.R - Math.sqrt(Math.max(this.R * this.R - x * x, 0));
    }
    normalLocal(lx, lz) {
        let k = 0;
        if (this.type === S_RAMP) k = this.h / (2 * this.hz);
        else if (this.type === S_QP) {
            const x = clampf(lz + this.hz, 0, 2 * this.hz);
            k = x / Math.sqrt(Math.max(this.R * this.R - x * x, 1e-4));
        }
        if (this.type === S_BOX) return v3(0, 1, 0);
        const nl = norm(v3(0, 1, -k));   // (local x, y, local z)
        // local z axis in world = (s, 0, c)
        return norm(v3(this.s * nl.z, nl.y, this.c * nl.z));
    }
    inside(lx, lz, m = 0) { return Math.abs(lx) <= this.hx + m && Math.abs(lz) <= this.hz + m; }
    localDirZ() { return v3(this.s, 0, this.c); }
    localDirX() { return v3(this.c, 0, -this.s); }
}

const RK_METAL = 0, RK_LEDGE = 1, RK_CURB = 2, RK_WOOD = 3, RK_CAR = 4;
class Rail { constructor() { this.a = v3(); this.b = v3(); this.dir = v3(); this.L = 0; this.kind = RK_METAL; } }

class Gap {
    constructor(name, points, cx, cz, c, s, hx, hz, topY) { this.name = name; this.points = points; this.cx = cx; this.cz = cz; this.c = c; this.s = s; this.hx = hx; this.hz = hz; this.topY = topY; }
    inside(x, z) {
        const dx = x - this.cx, dz = z - this.cz;
        const lx = dx * this.c - dz * this.s, lz = dx * this.s + dz * this.c;
        return Math.abs(lx) <= this.hx && Math.abs(lz) <= this.hz;
    }
}

// fountain basins: landing inside = splash    { x, z, r, floorY }

class GroundHit { constructor() { this.h = 0; this.n = v3(0, 1, 0); this.solid = -1; this.surf = SURF_ASPHALT; } }

const GX0 = -170, GZ0 = -200, CELL = 4, GW = 85, GH = 95;
const EMPTY_CELL = [];
class World {
    constructor() {
        this.solids = []; this.rails = []; this.gaps = []; this.pools = [];
        this.grid = [];   // uniform grid for solids
        this.minX = -69; this.maxX = 69; this.minZ = -100; this.maxZ = 69;   // playable bounds
        this._cand = [];
    }
    addSolid(s) { this.solids.push(s); return this.solids.length - 1; }
    addBox(cx, cz, rot, hx, hz, y0, y1, surf, tall = false) {
        const s = new Solid(); s.cx = cx; s.cz = cz; s.c = Math.cos(rot); s.s = Math.sin(rot);
        s.hx = hx; s.hz = hz; s.y0 = y0; s.h = y1 - y0; s.type = S_BOX; s.surf = surf; s.tall = tall;
        return this.addSolid(s);
    }
    // ramp rising towards local +z (yaw 'rot' => rises along fwdYaw(rot))
    addRamp(cx, cz, rot, hx, hz, y0, height, surf) {
        const s = new Solid(); s.cx = cx; s.cz = cz; s.c = Math.cos(rot); s.s = Math.sin(rot);
        s.hx = hx; s.hz = hz; s.y0 = y0; s.h = height; s.type = S_RAMP; s.surf = surf;
        return this.addSolid(s);
    }
    // quarter pipe of transition radius R and height H, rising towards fwdYaw(rot); (cx,cz) = footprint center
    addQP(cx, cz, rot, hx, R, H, y0, surf) {
        const s = new Solid(); s.cx = cx; s.cz = cz; s.c = Math.cos(rot); s.s = Math.sin(rot);
        const W = Math.sqrt(Math.max(R * R - (R - H) * (R - H), 0.01));
        s.hx = hx; s.hz = W * 0.5; s.y0 = y0; s.h = H; s.R = R; s.type = S_QP; s.surf = surf;
        return this.addSolid(s);
    }
    addRail(a, b, kind) {
        // clip to the playable area: rails running past the invisible walls (river railing, long curbs)

const world = new World();


// ----------------------------------------------------------------------------
// Level construction helpers: every prop emits render geometry (SM / WM) and
// its collision solids, grind rails and gaps.
// ----------------------------------------------------------------------------
const SM = new MeshBuilder(1 << 18, 1 << 19);   // static opaque world
const WM = new MeshBuilder(4096, 16384);         // water surfaces

const EM_FOUNTAIN = 0, EM_HYDRANT = 1, EM_STEAM = 2, EM_POOLSPLASH = 3;
const emitters = [];      // { pos, dir, kind, rate, acc }
const tlights = [];       // { pos, yaw, axis }  axis 0: faces E-W traffic, 1: N-S
const pigeonSpots = [];
const npcPaths = [];      // { pts: [V3], loop }
let letterPos = [];
const lamps = [];

// palette
const C_ASPHALT = hexc(0x46464a), C_SIDEWALK = hexc(0xa9a59c), C_CURB = hexc(0x8f8b84);
const C_GRANITE = hexc(0x8d8a86), C_IRON = hexc(0x1e2220), C_STEEL = hexc(0x9aa0a6);
const C_WOOD = hexc(0x8a6a48), C_PLYWOOD = hexc(0xc49a62), C_YELLOW = hexc(0xf2c318), C_WHITE = hexc(0xeeeeea);

function rotLocal(rot, lx, lz) {   // local (x,z) offset -> world offset
    const c = Math.cos(rot), s = Math.sin(rot);
    return v3(lx * c + lz * s, 0, -lx * s + lz * c);
}
const frame = (cx, y, cz, rot) => mmul(mTranslate(v3(cx, y, cz)), mRotY(rot));

function triOut(mb, a, b, c, out, colr, mat) {
    if (dot(cross(sub(b, a), sub(c, a)), out) < 0) mb.tri(a, c, b, colr, mat); else mb.tri(a, b, c, colr, mat);
}

// Solid box with render + collision
function solidBox(cx, cz, rot, hx, hz, y0, y1, colr, mat, surf, tall = false, top = null, faces = 63) {
    SM.boxRot(cx, cz, rot, hx, hz, y0, y1, colr, mat, faces, top);
    return world.addBox(cx, cz, rot, hx, hz, y0, y1, surf, tall);
}
function addRailW(a, b, kind) { world.addRail(a, b, kind); }

// grind rails along the long top edges (and optionally short ones) of an oriented box
function edgeRails(cx, cz, rot, hx, hz, top, kind, longOnly = true) {
    const c = v3(cx, top, cz);
    const ax = rotLocal(rot, 1, 0), az = rotLocal(rot, 0, 1);
    const xLong = hx >= hz;
    if (xLong || !longOnly) {
        addRailW(comb(c, ax, -hx, az, hz), comb(c, ax, hx, az, hz), kind);
        addRailW(comb(c, ax, -hx, az, -hz), comb(c, ax, hx, az, -hz), kind);
    }
    if (!xLong || !longOnly) {
        addRailW(comb(c, az, -hz, ax, hx), comb(c, az, hz, ax, hx), kind);
        addRailW(comb(c, az, -hz, ax, -hx), comb(c, az, hz, ax, -hx), kind);
    }
}

// Sidewalk / plaza slab with curb rails on chosen edges (bit 1:-x 2:+x 4:-z 8:+z)
function slab(x0, z0, x1, z1, y1, colr, mat, surf, curbEdges) {
    SM.boxAA(v3(x0, -0.3, z0), v3(x1, y1, z1), C_CURB, MAT_CONCRETE, 1 | 2 | 16 | 32);
    SM.quadN(v3(x0, y1, z1), v3(x1, y1, z1), v3(x1, y1, z0), v3(x0, y1, z0), v3(0, 1, 0), colr, mat);
    world.addBox((x0 + x1) * 0.5, (z0 + z1) * 0.5, 0, (x1 - x0) * 0.5, (z1 - z0) * 0.5, -0.3, y1, surf);
    if (curbEdges & 1) addRailW(v3(x0, y1, z0), v3(x0, y1, z1), RK_CURB);
    if (curbEdges & 2) addRailW(v3(x1, y1, z0), v3(x1, y1, z1), RK_CURB);
    if (curbEdges & 4) addRailW(v3(x0, y1, z0), v3(x1, y1, z0), RK_CURB);
    if (curbEdges & 8) addRailW(v3(x0, y1, z1), v3(x1, y1, z1), RK_CURB);
}
// flat overlay quad (paint, different paving) slightly above a surface
function overlay(x0, z0, x1, z1, y, colr, mat) {
    SM.quadN(v3(x0, y, z1), v3(x1, y, z1), v3(x1, y, z0), v3(x0, y, z0), v3(0, 1, 0), colr, mat);
}

// Metal handrail with posts; grindable
function handrail(a, b, grind = true, colr = C_IRON, postEvery = 1.8) {
    SM.limb(a, b, 0.06, 0.06, v3(0, 1, 0), colr, MAT_METAL);
    const d = sub(b, a), L = lenXZ(d);
    const n = Math.max(1, Math.ceil(L / postEvery));
    for (let i = 0; i <= n; i++) {
        const p = addm(a, d, i / n);
        const groundY = world.groundSlow(p.x, p.z, p.y - 0.3);
        SM.limb(v3(p.x, groundY, p.z), p, 0.05, 0.05, v3(1, 0, 0), colr, MAT_METAL);
    }
    if (grind) addRailW(a, b, RK_METAL);
    // thin blocking solid under the rail so you cannot roll through it
    const m = mul(add(a, b), 0.5);
    const rot = Math.atan2(d.x, d.z);
    const si = world.addBox(m.x, m.z, rot, 0.04, len(v3(d.x, 0, d.z)) * 0.5, Math.min(a.y, b.y) - 0.7, Math.min(a.y, b.y) - 0.06, SURF_METAL);
    world.solids[si].noGround = true;
}

// Plywood kicker ramp rising towards fwdYaw(rot)
function kicker(cx, cz, rot, hx, hz, h, y0 = 0.15, colr = C_PLYWOOD, mat = MAT_WOOD, surf = SURF_WOOD) {
    const F = frame(cx, y0, cz, rot);
    const p0 = xPoint(F, v3(-hx, 0, -hz)), p1 = xPoint(F, v3(hx, 0, -hz)), p2 = xPoint(F, v3(hx, h, hz)), p3 = xPoint(F, v3(-hx, h, hz));
    const b2 = xPoint(F, v3(hx, 0, hz)), b3 = xPoint(F, v3(-hx, 0, hz));
    const up = xDir(F, v3(0, 1, -h / (2 * hz)));
    SM.quadOut(p0, p1, p2, p3, up, colr, mat);
    triOut(SM, p1, b2, p2, xDir(F, v3(1, 0, 0)), shade(colr, 0.8), mat);
    triOut(SM, p0, b3, p3, xDir(F, v3(-1, 0, 0)), shade(colr, 0.8), mat);
    SM.quadOut(b3, b2, p2, p3, xDir(F, v3(0, 0, 1)), shade(colr, 0.7), mat);
    // metal lip plate
    SM.limb(add(p3, xDir(F, v3(0, 0.005, -0.03))), add(p2, xDir(F, v3(0, 0.005, -0.03))), 0.05, 0.02, v3(0, 1, 0), C_STEEL, MAT_METAL);
    world.addRamp(cx, cz, rot, hx, hz, y0, h, surf);
}

// Quarter pipe; (cx,cz) is the coping midpoint, the ramp faces direction fwdYaw(rot+PI) (you ride towards fwdYaw(rot))
function quarterPipe(cx, cz, rot, hx, R, H, deck, y0 = 0.15, colr = C_PLYWOOD) {
    const W = Math.sqrt(Math.max(R * R - (R - H) * (R - H), 0.01));
    const fz = fwdYaw(rot);
    const fcx = cx - fz.x * W * 0.5, fcz = cz - fz.z * W * 0.5;   // footprint center
    const F = frame(fcx, y0, fcz, rot);
    const N = 12;
    for (let i = 0; i < N; i++) {
        const xa = W * i / N, xb = W * (i + 1) / N;
        const ya = R - Math.sqrt(R * R - xa * xa), yb = R - Math.sqrt(R * R - xb * xb);
        const za = -W * 0.5 + xa, zb = -W * 0.5 + xb;
        const q = [xPoint(F, v3(-hx, ya, za)), xPoint(F, v3(hx, ya, za)), xPoint(F, v3(hx, yb, zb)), xPoint(F, v3(-hx, yb, zb))];
        const xm = (xa + xb) * 0.5, k = xm / Math.sqrt(R * R - xm * xm);
        SM.quadOut(q[0], q[1], q[2], q[3], xDir(F, v3(0, 1, -k)), colr, MAT_WOOD);
        for (let sgn = -1; sgn <= 1; sgn += 2) {
            const s0 = xPoint(F, v3(sgn * hx, 0, za)), s1 = xPoint(F, v3(sgn * hx, 0, zb));
            const t0 = xPoint(F, v3(sgn * hx, ya, za)), t1 = xPoint(F, v3(sgn * hx, yb, zb));
            SM.quadOut(s0, s1, t1, t0, xDir(F, v3(sgn, 0, 0)), shade(colr, 0.75), MAT_WOOD);
        }
    }
    // back wall + deck
    SM.quadOut(xPoint(F, v3(-hx, 0, W * 0.5)), xPoint(F, v3(hx, 0, W * 0.5)), xPoint(F, v3(hx, H, W * 0.5)), xPoint(F, v3(-hx, H, W * 0.5)),
        xDir(F, v3(0, 0, 1)), shade(colr, 0.6), MAT_WOOD);
    world.addQP(fcx, fcz, rot, hx, R, H, y0, SURF_WOOD);
    if (deck > 0.05) {
        const dc = addm(v3(cx, 0, cz), fz, deck * 0.5);
        const dcol = shade(colr, 0.9);
        solidBox(dc.x, dc.z, rot, hx, deck * 0.5, y0, y0 + H, shade(colr, 0.7), MAT_WOOD, SURF_WOOD, false, dcol);
    }
    // coping
    const ca = xPoint(F, v3(-hx, H, W * 0.5)), cb = xPoint(F, v3(hx, H, W * 0.5));
    SM.limb(ca, cb, 0.07, 0.07, v3(0, 1, 0), C_STEEL, MAT_METAL);
    addRailW(add(ca, v3(0, 0.02, 0)), add(cb, v3(0, 0.02, 0)), RK_METAL);
}

// Staircase rising towards fwdYaw(rot). Returns top height.
function stairs(cx, cz, rot, hx, n, stepH, stepD, y0, colr, mat, rails) {
    const L = n * stepD;
    for (let i = 0; i < n; i++) {
        // each step is a box from its front edge to the top end of the flight
        const z0 = -L * 0.5 + i * stepD;
        const hz = (L * 0.5 - z0) * 0.5;
        const center = add(v3(cx, 0, cz), rotLocal(rot, 0, z0 + hz));
        solidBox(center.x, center.z, rot, hx, hz, y0, y0 + (i + 1) * stepH, colr, mat, SURF_CONCRETE, false, null, 63 & ~8);
    }
    if (rails) {
        for (let sgn = -1; sgn <= 1; sgn += 2) {
            const a = add(v3(cx, 0, cz), rotLocal(rot, sgn * (hx - 0.12), -L * 0.5 + stepD * 0.5));
            const b = add(v3(cx, 0, cz), rotLocal(rot, sgn * (hx - 0.12), L * 0.5 - stepD * 0.5));
            a.y = y0 + stepH + 0.85; b.y = y0 + n * stepH + 0.85;
            handrail(a, b, true, C_IRON, 1.4);
        }
    }
    return y0 + n * stepH;
}

// Low granite / concrete ledge with grindable top edges
function ledge(cx, cz, rot, hx, hz, y0, h, colr = C_GRANITE, mat = MAT_GRANITE) {
    const top = shade(colr, 1.08);
    solidBox(cx, cz, rot, hx, hz, y0, y0 + h, colr, mat, SURF_CONCRETE, false, top);
    // steel edge protector
    const ax = rotLocal(rot, 1, 0), az = rotLocal(rot, 0, 1);
    const xl = hx >= hz;
    for (let sgn = -1; sgn <= 1; sgn += 2) {
        const c = add(v3(cx, y0 + h, cz), xl ? mul(az, sgn * hz) : mul(ax, sgn * hx));
        const e = xl ? mul(ax, hx) : mul(az, hz);
        SM.limb(sub(c, e), add(c, e), 0.035, 0.035, v3(0, 1, 0), hexc(0x6e6f70), MAT_METAL);
    }
    edgeRails(cx, cz, rot, hx, hz, y0 + h, RK_LEDGE);
}

function tree(x, z, y0, scale = 1) {
    const r = new Rng(toU32(fr(fr(fr(fr(x) * 131) + fr(fr(z) * 71)) + 999)));
    SM.boxAA(v3(x - 0.75, y0 - 0.02, z - 0.75), v3(x + 0.75, y0 + 0.02, z + 0.75), hexc(0x4a3b2c), MAT_CONCRETE, 4);

    SM.cylinder(frame(x, y0, z, 0), 0.12 * scale, th, 7, hexc(0x4d3d30), MAT_PLAIN, false, 0.08 * scale);
    world.addBox(x, z, 0, 0.14, 0.14, y0, y0 + th + 2, SURF_WOOD, false);

    for (let i = 0; i < 4; i++) {
        SM.limb(p[i], p[(i + 1) % 4], 0.035, 0.035, v3(0, 1, 0), C_IRON, MAT_METAL);
        SM.limb(v3(p[i].x, y0, p[i].z), p[i], 0.04, 0.04, v3(1, 0, 0), C_IRON, MAT_METAL);
        addRailW(p[i], p[(i + 1) % 4], RK_METAL);
    }
    world.addBox(x, z, 0, g, g, y0, gy - 0.05, SURF_METAL, false);
}

function streetLamp(x, z, y0, yaw) {
    SM.cylinder(frame(x, y0, z, 0), 0.11, 0.6, 8, hexc(0x2f3a33), MAT_METAL);
    SM.cylinder(frame(x, y0, z, 0), 0.07, 6.6, 8, hexc(0x3a463e), MAT_METAL, true, 0.05);
    const top = v3(x, y0 + 6.6, z);
    const arm = add(addm(top, fwdYaw(yaw), 1.6), v3(0, 0.25, 0));
    SM.limb(top, arm, 0.07, 0.07, v3(0, 1, 0), hexc(0x3a463e), MAT_METAL);
    const hf = mmul(mTranslate(add(arm, v3(0, -0.05, 0))), mRotY(yaw));
    SM.box(hf, v3(0.22, 0.08, 0.45), hexc(0x3a463e), MAT_METAL);
    SM.box(mmul(hf, mTranslate(v3(0, -0.09, 0.05))), v3(0.16, 0.02, 0.3), hexc(0xfff1c0), MAT_EMISSIVE);
    world.addBox(x, z, 0, 0.12, 0.12, y0, y0 + 6.6, SURF_METAL, false);
    lamps.push({ pos: add(arm, v3(0, -0.15, 0)) });
}

function hydrant(x, z, y0, open, sprayYaw = 0) {
    const red = hexc(0xb8261d);
    SM.cylinder(frame(x, y0, z, 0), 0.15, 0.55, 10, red, MAT_PAINTED);
    SM.sphere(mTranslate(v3(x, y0 + 0.58, z)), v3(0.16, 0.12, 0.16), 8, 4, red, MAT_PAINTED);
    SM.box(frame(x, y0 + 0.36, z, sprayYaw), v3(0.26, 0.06, 0.06), shade(red, 0.9), MAT_PAINTED);
    SM.box(frame(x, y0 + 0.36, z, sprayYaw + PI / 2), v3(0.06, 0.06, 0.22), shade(red, 0.9), MAT_PAINTED);
    world.addBox(x, z, 0, 0.2, 0.2, y0, y0 + 0.72, SURF_METAL, false);
    world.addGap("HYDRANT HOP", 150, x, z, 0, 0.25, 0.25, y0 + 0.75);
    if (open) {
        const d = fwdYaw(sprayYaw);
        emitters.push({ pos: addm(v3(x, y0 + 0.36, z), d, 0.3), dir: d, kind: EM_HYDRANT, rate: 260, acc: 0 });
    }
}

function puddle(x, z, y, rx, rz) {
    const N = 14;
    const c0 = WM.nv;
    WM.vert(v3(x, y, z), v3(0, 1, 0), rgb(0, 0, 255), 2);
    for (let i = 0; i < N; i++) {
        const a = TAU * i / N;
        const wob = 0.8 + 0.35 * hashf(toInt(fr(fr(x) * 10)), toInt(fr(fr(z) * 10)), i);
        WM.vert(v3(x + Math.sin(a) * rx * wob, y, z + Math.cos(a) * rz * wob), v3(0, 1, 0), rgb(0, 0, 0), 2);
    }
    for (let i = 0; i < N; i++) WM.idx3(c0, c0 + 1 + i, c0 + 1 + ((i + 1) % N));
}

function manhole(x, z, steam) {
    SM.cylinder(frame(x, 0.0, z, 0), 0.4, 0.012, 14, hexc(0x2b2a28), MAT_METAL);
    if (steam) emitters.push({ pos: v3(x, 0.05, z), dir: v3(0, 1, 0), kind: EM_STEAM, rate: 18, acc: 0 });
}

// Car body geometry. type 0 = yellow cab, 1 = sedan, 2 = town car, 3 = van. F: ground frame, nose +Z.
const CAR_TRIM = hexc(0x2a2a2a), CAR_GLASS = hexc(0x1d2630), CAR_TYRE = hexc(0x111111), CAR_HEAD = hexc(0xfff4d0),
    CAR_BRAKE = hexc(0xff2a1a), CAR_TAIL = hexc(0x8a1010), CAR_TAXI = hexc(0xfff6c8), CAR_CHECK = hexc(0x111111);
function carGeom(mb, F, type, body, brake = 0) {
    const L = type === 3 ? 2.6 : 2.45, Wd = 0.95;
    const bodyTop = type === 3 ? 1.9 : 0.95;
    const T = (x, y, z) => mmul(F, mTranslate(v3(x, y, z)));
    mb.box(T(0, (0.3 + bodyTop) * 0.5, 0), v3(Wd, (bodyTop - 0.3) * 0.5, L), body, MAT_PAINTED);
    mb.box(T(0, 0.36, 0), v3(Wd + 0.02, 0.06, L + 0.04), CAR_TRIM, MAT_PLAIN);   // bumpers/rocker
    if (type !== 3) {
        mb.box(T(0, 1.22, -0.15), v3(Wd * 0.9, 0.27, 1.15), body, MAT_PAINTED);
        mb.box(T(0, 1.2, -0.15), v3(Wd * 0.92, 0.2, 1.1), CAR_GLASS, MAT_PAINTED, 1 | 2 | 16 | 32);
    } else {
        mb.box(T(0, 1.45, 1.9), v3(Wd * 0.95, 0.25, 0.72), CAR_GLASS, MAT_PAINTED, 16 | 1 | 2);
    }
    for (let i = 0; i < 4; i++) {
        const sx = (i & 1) ? Wd * 0.92 : -Wd * 0.92, sz = (i & 2) ? L * 0.62 : -L * 0.62;
        mb.box(T(sx, 0.32, sz), v3(0.12, 0.32, 0.32), CAR_TYRE, MAT_PLAIN);
    }
    mb.box(T(0.6, 0.75, L + 0.005), v3(0.18, 0.07, 0.01), CAR_HEAD, MAT_EMISSIVE);
    mb.box(T(-0.6, 0.75, L + 0.005), v3(0.18, 0.07, 0.01), CAR_HEAD, MAT_EMISSIVE);
    const tail = brake > 0.5 ? CAR_BRAKE : CAR_TAIL;
    mb.box(T(0.65, 0.78, -L - 0.005), v3(0.15, 0.07, 0.01), tail, MAT_EMISSIVE);
    mb.box(T(-0.65, 0.78, -L - 0.005), v3(0.15, 0.07, 0.01), tail, MAT_EMISSIVE);
    if (type === 0) {   // taxi roof light + checker stripe
        mb.box(T(0, 1.56, -0.1), v3(0.35, 0.08, 0.12), CAR_TAXI, MAT_EMISSIVE);
        mb.box(T(Wd + 0.005, 0.72, 0), v3(0.005, 0.05, L * 0.8), CAR_CHECK, MAT_PLAIN);
        mb.box(T(-Wd - 0.005, 0.72, 0), v3(0.005, 0.05, L * 0.8), CAR_CHECK, MAT_PLAIN);
    }
}

function parkedCar(x, z, yaw, type, body) {
    const L = type === 3 ? 2.6 : 2.45, Wd = 0.95;
    const bodyTop = type === 3 ? 1.9 : 0.95;
    carGeom(SM, frame(x, 0, z, yaw), type, body);
    world.addBox(x, z, yaw, Wd, L, 0, bodyTop, SURF_METAL, false);
    if (type !== 3) world.addBox(x + rotLocal(yaw, 0, -0.15).x, z + rotLocal(yaw, 0, -0.15).z, yaw, Wd * 0.9, 1.15, 0, 1.49, SURF_METAL, false);
    world.addGap(type === 0 ? "CAB HOP" : (type === 3 ? "VAN HOP" : "CAR HOP"), type === 3 ? 400 : 250, x, z, yaw, Wd, L, type === 3 ? 1.95 : 1.5);
}

function signBoard(pos, right, up, out, w, h, txt, bg, fg, neon) {
    const c = pos;
    const F = mBasis(right, up, out, c);
    SM.box(F, v3(w * 0.5, h * 0.5, 0.06), bg, MAT_PAINTED);
    const px = Math.min(h * 0.62 / 7, (w * 0.9) / (txt.length * 6));
    const tw = textWidth3D(txt, px);
    const o = comb(c, right, -tw * 0.5, up, -3.5 * px, out, 0.065);
    SM.text3D(txt, o, right, up, px, fg, neon ? MAT_EMISSIVE : MAT_PLAIN);
}

// Storefront on a building face. 'o' = left end at ground, 'r' = along facade, 'n' = outward normal.
function storefront(o, r, n, w, name, signBg, signFg, awning, hasAwning, rng) {
    const up = v3(0, 1, 0);
    const sfH = 4.8;
    // piers
    const pier = hexc(0x5b5048);
    const P0 = mBasis(r, up, n, comb(o, r, 0.25, up, sfH * 0.5, n, 0.12));
    SM.box(P0, v3(0.25, sfH * 0.5, 0.12), pier, MAT_CONCRETE);
    const P1 = mBasis(r, up, n, comb(o, r, w - 0.25, up, sfH * 0.5, n, 0.12));
    SM.box(P1, v3(0.25, sfH * 0.5, 0.12), pier, MAT_CONCRETE);
    // kick plate + glass
    const K = mBasis(r, up, n, comb(o, r, w * 0.5, up, 0.3, n, 0.08));
    SM.box(K, v3(w * 0.5 - 0.5, 0.3, 0.08), hexc(0x4a4540), MAT_METAL);
    const doorW = 1.1, doorX = rng.chance(0.5) ? 0.9 : w - 0.9 - doorW;
    const gl0 = comb(o, r, 0.5, up, 0.6, n, 0.03);
    const g0 = gl0, g1 = comb(o, r, w - 0.5, up, 0.6, n, 0.03);
    SM.quadN(g0, g1, addm(g1, up, 2.9), addm(g0, up, 2.9), n, rgb(255, 255, 255), MAT_SHOPGLASS);
    // door
    const d0 = comb(o, r, doorX, n, 0.05);
    const D = mBasis(r, up, n, comb(d0, r, doorW * 0.5, up, 1.2));
    SM.box(D, v3(doorW * 0.5, 1.2, 0.03), hexc(0x2c2a28), MAT_PAINTED);
    // transom band + sign
    const T = mBasis(r, up, n, comb(o, r, w * 0.5, up, 3.75, n, 0.1));
    SM.box(T, v3(w * 0.5 - 0.5, 0.25, 0.1), hexc(0x3d3935), MAT_PAINTED);
    signBoard(comb(o, r, w * 0.5, up, 4.3, n, 0.12), r, up, n, w - 1.0, 0.75, name, signBg, signFg, rng.chance(0.4));
    // neon "OPEN" in the window sometimes
    if (rng.chance(0.55)) {
        const px = 0.045;
        const no = comb(o, r, doorX < w * 0.5 ? w - 2.2 : 1.0, up, 2.4, n, 0.05);
        SM.text3D("OPEN", no, r, up, px, rng.chance(0.5) ? hexc(0xff3060) : hexc(0x40c0ff), MAT_EMISSIVE);
    }
    if (hasAwning) {
        const a0 = comb(o, r, 0.3, up, 3.5, n, 0.2), a1 = comb(o, r, w - 0.3, up, 3.5, n, 0.2);
        const b0 = comb(a0, n, 1.4, up, -0.7), b1 = comb(a1, n, 1.4, up, -0.7);
        SM.quadOut(a0, a1, b1, b0, add(up, n), awning, MAT_AWNING);
        SM.quadOut(a0, a1, b1, b0, neg(add(up, n)), shade(awning, 0.6), MAT_AWNING);
        SM.quadOut(b0, b1, addm(b1, up, -0.3), addm(b0, up, -0.3), n, awning, MAT_AWNING);
    }
}

// Rooftop water tower (wooden tank on steel legs) -- the NYC skyline signature
function waterTower(x, y, z, s) {
    for (let i = 0; i < 4; i++) {
        const a = PI / 4 + i * PI / 2;
        const f = v3(Math.sin(a) * 1.0 * s, 0, Math.cos(a) * 1.0 * s);
        SM.limb(add(v3(x, y, z), f), add(v3(x, y + 2.2 * s, z), mul(f, 0.9)), 0.1 * s, 0.1 * s, v3(1, 0, 0), hexc(0x2a2a2a), MAT_METAL);
    }
    SM.cylinder(frame(x, y + 2.2 * s, z, 0), 1.35 * s, 2.8 * s, 12, hexc(0x6b5238), MAT_WOOD, true);
    SM.cylinder(frame(x, y + 5.0 * s, z, 0), 1.45 * s, 0.9 * s, 12, hexc(0x3b3029), MAT_ROOF, true, 0.05);
    for (let k = 0; k < 3; k++) SM.cylinder(frame(x, y + (2.5 + k * 0.9) * s, z, 0), 1.37 * s, 0.06, 12, hexc(0x222222), MAT_METAL, false);
}

// Fire escape (black iron balconies + ladders) on a facade
function fireEscape(o, r, n, w, floors) {
    for (let f = 0; f < floors; f++) {
        const y = 4.8 + 3.3 * f + 0.2;
        const b0 = add(o, v3(0, y, 0)), b1 = addm(b0, r, w);
        SM.box(mBasis(r, v3(0, 1, 0), n, addm(mul(add(b0, b1), 0.5), n, 0.6)), v3(w * 0.5, 0.03, 0.6), C_IRON, MAT_METAL);
        const t0 = add(addm(b0, n, 1.2), v3(0, 0.9, 0)), t1 = add(addm(b1, n, 1.2), v3(0, 0.9, 0));
        SM.limb(t0, t1, 0.04, 0.04, v3(0, 1, 0), C_IRON, MAT_METAL);
        SM.limb(addm(b0, n, 1.2), t0, 0.04, 0.04, v3(1, 0, 0), C_IRON, MAT_METAL);
        SM.limb(addm(b1, n, 1.2), t1, 0.04, 0.04, v3(1, 0, 0), C_IRON, MAT_METAL);
        for (let k = 1; k < 8; k++) {
            const p = comb(b0, r, w * k / 8, n, 1.2);
            SM.limb(p, add(p, v3(0, 0.9, 0)), 0.015, 0.015, v3(1, 0, 0), C_IRON, MAT_METAL);
        }
        if (f + 1 < floors) {   // diagonal stair to the next balcony
            const s0 = comb(b0, r, w * 0.2, n, 0.6), s1 = add(comb(b0, r, w * 0.75, n, 0.6), v3(0, 3.3, 0));
            SM.limb(s0, s1, 0.5, 0.05, n, C_IRON, MAT_METAL);
        }
    }
}

// ----------------------------------------------------------------------------
// The level: one NYC intersection, four corners, a waterfront promenade.
//   Avenue (N-S) road x in [-9,9]; cross street (E-W) z in [-7,7];
//   Water St z in [-74,-62]; promenade z in [-88,-74]; river beyond.
// ----------------------------------------------------------------------------
const SH = 0.15;   // sidewalk height

function building(x0, z0, x1, z1, h, style, colr, seed, roofStuff = true) {
    const mat = style === 1 ? MAT_STONEWIN : (style === 2 ? MAT_GLASSWALL : MAT_WINDOWS);
    SM.boxAA(v3(x0, 0, z0), v3(x1, h, z1), colr, mat, 1 | 2 | 16 | 32);
    SM.quadN(v3(x0, h, z1), v3(x1, h, z1), v3(x1, h, z0), v3(x0, h, z0), v3(0, 1, 0), hexc(0x55514c), MAT_ROOF);
    world.addBox((x0 + x1) * 0.5, (z0 + z1) * 0.5, 0, (x1 - x0) * 0.5, (z1 - z0) * 0.5, 0, h, SURF_CONCRETE, true);
    const r = new Rng(seed);
    if (style !== 2) {
        const cor = style === 1 ? shade(colr, 0.85) : hexc(0x6d665c);
        SM.boxAA(v3(x0 - 0.35, h - 0.15, z0 - 0.35), v3(x1 + 0.35, h + 0.45, z1 + 0.35), cor, MAT_CONCRETE);
        SM.boxAA(v3(x0 - 0.12, 4.7, z0 - 0.12), v3(x1 + 0.12, 4.95, z1 + 0.12), cor, MAT_CONCRETE);   // storefront cornice line
    } else {
        SM.boxAA(v3(x0 + 1, h, z0 + 1), v3(x1 - 1, h + 3, z1 - 1), hexc(0x5b6066), MAT_CONCRETE);
    }
    if (roofStuff && style !== 2) {
        const w = x1 - x0, d = z1 - z0;
        if (r.chance(0.6) && w > 5 && d > 5) {
            const tx = x0 + w * r.range(0.3, 0.7), tz = z0 + d * r.range(0.3, 0.7), ts = r.range(0.8, 1.1);
            waterTower(tx, h + 0.45, tz, ts);
        }
        const n = r.irange(1, 3);
        for (let i = 0; i < n; i++) {
            const cx = x0 + w * r.range(0.2, 0.8), cz = z0 + d * r.range(0.2, 0.8);
            SM.boxAA(v3(cx - 0.8, h + 0.45, cz - 0.6), v3(cx + 0.8, h + 1.5, cz + 0.6), hexc(0x8a8a88), MAT_METAL);
        }
    }
}

const SHOP_NAMES = [
    "DELI & GROCERY", "PIZZA", "BAGELS", "VIDEO RENTAL", "LAUNDROMAT", "RECORDS", "NAIL SALON", "CHECK CASHING",
    "99 CENT STORE", "CHINESE FOOD", "LIQUORS", "PHARMACY", "SNEAKERS", "DINER", "BARBER SHOP", "HARDWARE",
    "CAFE", "TATTOO", "INTERNET CAFE", "PAGERS & CELL", "DVD VHS GAMES", "SKATE SHOP", "BODEGA 24 HRS", "TAILOR",
    "FRIED CHICKEN", "PAWN SHOP", "OPTICAL", "SHOE REPAIR"];
let shopIdx = 0;

// A row of buildings with storefronts. 'left' is the street-view left corner of the row at ground level,
// 'out' the outward (street-facing) normal. Text reads left-to-right for someone on the sidewalk.
const FR_BRICKS = [0x8e4a36, 0x7a3b2c, 0xa0664a, 0x9c7a5a, 0x6e4535, 0xb08560, 0x8a5a44, 0x5e3a2e];
const FR_STONES = [0xc8bfae, 0xb5ad9f, 0xd6ccb8, 0x9e978b];
const FR_SIGNBG = [0xb3201b, 0xf2c318, 0x1f6b3a, 0x1d3f8f, 0x151515, 0xf0efe8, 0x7d1d4a, 0xe06a12];
const FR_SIGNFG = [0xffffff, 0x141414, 0xffffff, 0xffe040, 0xf2c318, 0xc0201b, 0xffffff, 0xffffff];
const FR_AWN = [0x1f6b3a, 0xa31c1c, 0x1d3f8f, 0x6b1d2a, 0x2a2a2a, 0xc26a10];
function facadeRow(left, out, length, depth, seed, shops, minH, maxH, styleMode) {
    const up = v3(0, 1, 0), r = cross(up, out);
    const rng = new Rng(seed);
    let x = 0;   // float arithmetic as in C++ (decides where buildings split)
    while (x < fr(length - 0.5)) {
        let w = rng.range(7, 10);
        if (fr(length - fr(x + w)) < 5) w = fr(length - x);
        const p0 = addm(left, r, x), p1 = addm(left, r, x + w), back = mul(out, -depth);
        const mn = v3(Math.min(p0.x, p1.x, p0.x + back.x, p1.x + back.x), 0, Math.min(p0.z, p1.z, p0.z + back.z, p1.z + back.z));
        const mx = v3(Math.max(p0.x, p1.x, p0.x + back.x, p1.x + back.x), 0, Math.max(p0.z, p1.z, p0.z + back.z, p1.z + back.z));
        const style = styleMode >= 0 ? styleMode : (rng.chance(0.72) ? 0 : 1);
        const colr = style === 1 ? hexc(FR_STONES[rng.irange(0, 3)]) : hexc(FR_BRICKS[rng.irange(0, 7)]);
        const h = 4.8 + 3.3 * rng.irange(Math.trunc((minH - 4.8) / 3.3), Math.trunc((maxH - 4.8) / 3.3)) + 0.4;
        building(mn.x, mn.z, mx.x, mx.z, h, style, colr, rng.next());
        if (shops) {
            const k = rng.irange(0, 7);
            const awnCol = hexc(FR_AWN[rng.irange(0, 5)]);
            const hasAwn = rng.chance(0.6);
            storefront(addm(p0, out, 0.001), r, out, w, SHOP_NAMES[shopIdx++ % 28], hexc(FR_SIGNBG[k]), hexc(FR_SIGNFG[k]), awnCol, hasAwn, rng);
        }
        if (style === 0 && h > 12 && rng.chance(0.5)) fireEscape(comb(p0, r, w * 0.2, out, 0.01), r, out, w * 0.6, Math.trunc((h - 5) / 3.3));
        x = fr(x + w);
    }
}

function stripeQuad(a, dirLong, dirWide, L, W, c) {
    const p0 = a, p1 = addm(a, dirWide, W), p2 = addm(p1, dirLong, L), p3 = addm(a, dirLong, L);
    SM.quadOut(p0, p1, p2, p3, v3(0, 1, 0), c, MAT_PLAIN);
}

function buildStreets() {
    const up = v3(0, 1, 0);
    SM.quadN(v3(-600, 0, 600), v3(600, 0, 600), v3(600, 0, RIVER_EDGE_Z), v3(-600, 0, RIVER_EDGE_Z), up, C_ASPHALT, MAT_ASPHALT);
    // sidewalk slabs (curbs are grindable)
    slab(-200, -62, -9, -7, SH, C_SIDEWALK, MAT_SIDEWALK, SURF_SIDEWALK, 2 | 4 | 8);
    slab(9, -62, 200, -7, SH, C_SIDEWALK, MAT_SIDEWALK, SURF_SIDEWALK, 1 | 4 | 8);
    slab(-200, 7, -9, 200, SH, C_SIDEWALK, MAT_SIDEWALK, SURF_SIDEWALK, 2 | 4);
    slab(9, 7, 200, 200, SH, C_SIDEWALK, MAT_SIDEWALK, SURF_SIDEWALK, 1 | 4);
    slab(-600, RIVER_EDGE_Z, 600, -74, SH, C_SIDEWALK, MAT_SIDEWALK, SURF_SIDEWALK, 8);
    // road markings
    const white = hexc(0xdedbd2), yel = hexc(0xe0b416);
    const y = 0.006;
    for (let z = -60; z < 200; z += 6) {
        if (z > -12 && z < 12) continue;
        stripeQuad(v3(-2.3, y, z), v3(0, 0, 1), v3(1, 0, 0), 3, 0.14, white);
        stripeQuad(v3(2.2, y, z), v3(0, 0, 1), v3(1, 0, 0), 3, 0.14, white);
    }
    for (let x = -200; x < 200; x += 6) {
        if (x > -14 && x < 14) continue;
        stripeQuad(v3(x, y, -0.07), v3(1, 0, 0), v3(0, 0, 1), 3, 0.14, white);
    }
    stripeQuad(v3(-600, y, -68.2), v3(1, 0, 0), v3(0, 0, 1), 1200, 0.12, yel);
    stripeQuad(v3(-600, y, -67.9), v3(1, 0, 0), v3(0, 0, 1), 1200, 0.12, yel);
    // crosswalks (float loop counters as in C++)
    const STEP = fr(1.1);
    for (let side = -1; side <= 1; side += 2) {
        for (let x = fr(-8.5); x < 8.5; x = fr(x + STEP)) stripeQuad(v3(x, y, side > 0 ? 8.0 : -11.0), v3(0, 0, 1), v3(1, 0, 0), 3.0, 0.55, white);

function subwayEntrance(cx, cz) {
    const hx = 1.1, hz = 2.3, ry = SH + 1.0;
    const c = [v3(cx - hx, ry, cz - hz), v3(cx + hx, ry, cz - hz), v3(cx + hx, ry, cz + hz), v3(cx - hx, ry, cz + hz)];
    for (let i = 0; i < 4; i++) handrail(c[i], c[(i + 1) % 4], true, hexc(0x2c4a36), 1.2);
    for (let i = 0; i < 4; i++) {   // side panels
        const a = c[i], b = c[(i + 1) % 4];
        const d = norm(sub(b, a)), n = cross(v3(0, 1, 0), d);
        SM.quadOut(v3(a.x, SH + 0.1, a.z), v3(b.x, SH + 0.1, b.z), sub(b, v3(0, 0.08, 0)), sub(a, v3(0, 0.08, 0)), neg(n), hexc(0x24402f), MAT_METAL);
        SM.quadOut(v3(a.x, SH + 0.1, a.z), v3(b.x, SH + 0.1, b.z), sub(b, v3(0, 0.08, 0)), sub(a, v3(0, 0.08, 0)), n, hexc(0x24402f), MAT_METAL);
    }
    SM.boxAA(v3(cx - hx, SH, cz - hz), v3(cx + hx, SH + 0.03, cz + hz), hexc(0x55585a), MAT_METAL);   // closed steel plate
    signBoard(v3(cx + hx + 0.07, SH + 0.75, cz), v3(0, 0, -1), v3(0, 1, 0), v3(1, 0, 0), 3.4, 0.32, "SUBWAY", hexc(0x151515), C_WHITE, false);
    for (let s = -1; s <= 1; s += 2) {
        const p = v3(cx + hx, SH, cz + s * hz);
        SM.cylinder(frame(p.x, p.y, p.z, 0), 0.05, 1.9, 6, hexc(0x2c4a36), MAT_METAL);
        SM.sphere(mTranslate(add(p, v3(0, 2.05, 0))), v3(0.17, 0.17, 0.17), 8, 5, hexc(0x40ff70), MAT_EMISSIVE);
    }
}

function buildFountain(cx, cz) {
    const N = 24;
    const rOut = 5.0, rIn = 4.5, top = SH + 0.5;
    const rim = hexc(0xb9b2a4);
    for (let i = 0; i < N; i++) {
        const a0 = TAU * i / N, a1 = TAU * (i + 1) / N, am = (a0 + a1) * 0.5;
        const rm = (rOut + rIn) * 0.5;
        const segL = 2 * rm * Math.sin(PI / N) + 0.06;
        const c = addm(v3(cx, 0, cz), v3(Math.sin(am), 0, Math.cos(am)), rm);
        const t = shade(rim, 1.1);
        solidBox(c.x, c.z, am, segL * 0.5, (rOut - rIn) * 0.5, SH, top, rim, MAT_GRANITE, SURF_CONCRETE, false, t);
        const p0 = v3(cx + Math.sin(a0) * rm, top, cz + Math.cos(a0) * rm), p1 = v3(cx + Math.sin(a1) * rm, top, cz + Math.cos(a1) * rm);
        addRailW(p0, p1, RK_LEDGE);
    }
    // basin floor + water surface (pool center is encoded in the vertex colour for the ripple shader)
    SM.cylinder(frame(cx, SH, cz, 0), rIn, 0.02, N, hexc(0x3e6f78), MAT_CONCRETE);
    const enc = rgb(0, 0, 255);
    const c0 = WM.nv;
    WM.vert(v3(cx, top - 0.12, cz), v3(0, 1, 0), enc, 1);
    for (let i = 0; i < N; i++) {
        const a = TAU * i / N;
        WM.vert(v3(cx + Math.sin(a) * rIn, top - 0.12, cz + Math.cos(a) * rIn), v3(0, 1, 0), enc, 1);
    }
    for (let i = 0; i < N; i++) WM.idx3(c0, c0 + 1 + i, c0 + 1 + ((i + 1) % N));
    world.pools.push({ x: cx, z: cz, r: rIn, floorY: SH + 0.05 });
    // centre sculpture: pedestal, bowl, spout
    const stone = hexc(0xc9c1b0);
    SM.cylinder(frame(cx, SH, cz, 0), 0.8, 1.1, 12, stone, MAT_GRANITE);
    SM.cylinder(frame(cx, SH + 1.1, cz, 0), 0.6, 0.25, 12, stone, MAT_GRANITE, true, 1.9);
    SM.cylinder(frame(cx, SH + 1.35, cz, 0), 1.9, 0.12, 12, stone, MAT_GRANITE);
    SM.cylinder(frame(cx, SH + 1.47, cz, 0), 0.25, 0.9, 8, stone, MAT_GRANITE, true, 0.12);
    world.addBox(cx, cz, 0, 0.8, 0.8, SH, SH + 1.1, SURF_CONCRETE);
    world.addBox(cx, cz, 0, 1.3, 1.3, SH + 1.1, SH + 1.47, SURF_CONCRETE);
    emitters.push({ pos: v3(cx, SH + 2.35, cz), dir: v3(0, 1, 0), kind: EM_FOUNTAIN, rate: 240, acc: 0 });
    emitters.push({ pos: v3(cx, SH + 1.5, cz), dir: v3(0, 1, 0), kind: EM_POOLSPLASH, rate: 90, acc: 0 });
    world.addGap("FOUNTAIN GAP", 1000, cx, cz, 0, rIn * 0.8, rIn * 0.8, top + 0.3);
}

// chain-link fence panel run between two points (with posts); blocks the skater
function chainFence(a, b, h) {
    const d = sub(b, a), L = lenXZ(d);
    const dir = dv(d, Math.max(L, 1e-4)), n = cross(v3(0, 1, 0), dir);
    const A = a, B = b, Bt = add(b, v3(0, h, 0)), At = add(a, v3(0, h, 0));
    SM.quadOut(A, B, Bt, At, n, hexc(0x9ea4a8), MAT_FENCE);
    const posts = Math.max(1, Math.trunc(L / 3.0));
    for (let i = 0; i <= posts; i++) {
        const p = addm(a, d, i / posts);
        SM.cylinder(frame(p.x, p.y, p.z, 0), 0.045, h + 0.05, 6, hexc(0x8a9094), MAT_METAL);
    }
    SM.limb(At, Bt, 0.05, 0.05, v3(0, 1, 0), hexc(0x8a9094), MAT_METAL);
    const m = mul(add(a, b), 0.5);
    world.addBox(m.x, m.z, Math.atan2(dir.x, dir.z), 0.06, L * 0.5, a.y - 0.3, a.y + h, SURF_METAL, false);
}

function hoop(x, z, faceYaw) {
    const f = fwdYaw(faceYaw);
    const base = v3(x, SH, z);
    SM.cylinder(frame(x, SH, z, 0), 0.09, 3.3, 8, hexc(0x3c4a5a), MAT_PAINTED);
    const top = add(base, v3(0, 3.3, 0)), bb = add(addm(top, f, 1.0), v3(0, 0.1, 0));
    SM.limb(top, bb, 0.08, 0.08, v3(0, 1, 0), hexc(0x3c4a5a), MAT_PAINTED);
    const B = mmul(mTranslate(add(bb, v3(0, 0.25, 0))), mRotY(faceYaw));
    SM.box(B, v3(0.9, 0.55, 0.03), hexc(0xe8e8e8), MAT_PAINTED);
    SM.box(mmul(B, mTranslate(v3(0, -0.1, 0.035))), v3(0.3, 0.2, 0.005), hexc(0xc03020), MAT_PLAIN, 16);
    for (let i = 0; i < 10; i++) {
        const a0 = TAU * i / 10, a1 = TAU * (i + 1) / 10;
        const c = add(addm(bb, f, 0.35), v3(0, -0.2, 0));
        SM.limb(addm(c, v3(Math.sin(a0), 0, Math.cos(a0)), 0.23), addm(c, v3(Math.sin(a1), 0, Math.cos(a1)), 0.23), 0.02, 0.02, v3(0, 1, 0), hexc(0xe0501a), MAT_METAL);
    }
    world.addBox(x, z, 0, 0.12, 0.12, SH, SH + 3.4, SURF_METAL);
}

function buildSkyline() {
    const r = new Rng(4242);
    const cols = [0x8e4a36, 0xb5ad9f, 0x7a3b2c, 0xc8bfae, 0x9c7a5a, 0x8899aa, 0x6e6a66];
    // Brooklyn across the river
    for (let i = 0; i < 70; i++) {
        const x = r.range(-650, 650), z = r.range(-620, -430), w = r.range(12, 40), d = r.range(12, 40);
        let h = r.range(10, 45);
        if (r.chance(0.08)) h = r.range(60, 110);
        const st = r.chance(0.3) ? 1 : 0, cl = hexc(cols[r.irange(0, 6)]), sd = r.next();
        building(x, z, x + w, z + d, h, st, cl, sd, false);
    }
    SM.quadN(v3(-700, 0.5, -420), v3(700, 0.5, -420), v3(700, 0.5, -900), v3(-700, 0.5, -900), v3(0, 1, 0), hexc(0x5a574f), MAT_CONCRETE);
    SM.quadOut(v3(-700, 0.5, -420), v3(700, 0.5, -420), v3(700, WATER_LEVEL - 2, -420), v3(-700, WATER_LEVEL - 2, -420), v3(0, 0, 1), hexc(0x5a574f), MAT_CONCRETE);
    // Manhattan: a ring of towers behind the block
    for (let i = 0; i < 150; i++) {
        const a = r.range(-PI * 0.62, PI * 0.62);
        const rad = r.range(230, 520);
        const x = Math.sin(a) * rad * 1.3, z = Math.cos(a) * rad;
        if (z < 60 && Math.abs(x) < 220) continue;
        const w = r.range(18, 40), d = r.range(18, 40), h = r.range(35, 150);
        const style = r.irange(0, 2);
        { const cl = hexc(cols[r.irange(0, 6)]), sd = r.next(); building(x - w / 2, z - d / 2, x + w / 2, z + d / 2, h, style, cl, sd, false); }
        if (style !== 2 && r.chance(0.25)) {   // setback crown
            const hh = h + r.range(10, 30), cl = hexc(cols[r.irange(0, 6)]), sd = r.next();
            building(x - w / 4, z - d / 4, x + w / 4, z + d / 4, hh, style, cl, sd, false);
        }
    }
    // an art-deco spire tower down the avenue
    {
        const x = -40, z = 380;
        building(x - 30, z - 30, x + 30, z + 30, 120, 1, hexc(0xc9c0ae), 9001, false);
        building(x - 20, z - 20, x + 20, z + 20, 170, 1, hexc(0xc9c0ae), 9002, false);
        building(x - 12, z - 12, x + 12, z + 12, 215, 1, hexc(0xc9c0ae), 9003, false);
        SM.cylinder(frame(x, 215, z, 0), 5, 30, 8, hexc(0xd8d0c0), MAT_METAL, true, 0.4);
        SM.cylinder(frame(x, 245, z, 0), 0.6, 35, 6, hexc(0xb0b0b0), MAT_METAL, true, 0.1);
    }
    // suspension bridge over the river to the west
    {
        const bx = -190, deckY = 38;
        const tz = [-170, -350];
        const stone = hexc(0x9a8c78);
        for (const z of tz) {
            for (let s = -1; s <= 1; s += 2) SM.boxAA(v3(bx + s * 9 - 3, WATER_LEVEL, z - 4), v3(bx + s * 9 + 3, 88, z + 4), stone, MAT_GRANITE);
            SM.boxAA(v3(bx - 12, 70, z - 4), v3(bx + 12, 80, z + 4), stone, MAT_GRANITE);
            SM.boxAA(v3(bx - 12, deckY - 4, z - 4), v3(bx + 12, deckY, z + 4), stone, MAT_GRANITE);
        }
        SM.boxAA(v3(bx - 11, deckY - 1.5, -600), v3(bx + 11, deckY + 0.5, -60), hexc(0x4a4a4a), MAT_METAL);
        for (let s = -1; s <= 1; s += 2) {
            const cx = bx + s * 9;
            const cableY = (z) => {
                if (z > tz[0]) return 88 - (88 - deckY - 2) * sat((z - tz[0]) / 110);
                if (z < tz[1]) return 88 - (88 - deckY - 2) * sat((tz[1] - z) / 110);
                const t = (z - tz[1]) / (tz[0] - tz[1]);
                return 88 - 4 * (88 - deckY - 6) * t * (1 - t);
            };
            let prev = -560;
            for (let z = -560 + 10; z <= -60; z += 10) {
                SM.limb(v3(cx, cableY(prev), prev), v3(cx, cableY(z), z), 0.9, 0.9, v3(1, 0, 0), hexc(0x55504a), MAT_METAL);
                if (z < -65 && z > -555) SM.limb(v3(cx, deckY, z), v3(cx, cableY(z), z), 0.15, 0.15, v3(1, 0, 0), hexc(0x55504a), MAT_METAL);
                prev = z;
            }
        }
    }
}
