const SFX_POP = 0, SFX_LAND = 1, SFX_LAND_HARD = 2, SFX_GRIND = 3, SFX_SLIDE = 4, SFX_BAIL = 5, SFX_SPLASH = 6, SFX_COMBO = 7, SFX_BIGCOMBO = 8,
    SFX_LETTER = 9, SFX_CLACK = 10, SFX_FLIP = 11, SFX_HONK = 12, SFX_PIGEONS = 13, SFX_HEY = 14, SFX_MENU = 15, SFX_GAP = 16, SFX_COUNT = 17;
// True while the autopilot runs look-ahead copies of the player: those must stay silent and invisible.
let g_sim = false;
const aud = { roll: 0, rollPitch: 1, rollSurf: 0, grind: 0, grindMetal: 1, water: 0, wind: 0 };

// ----------------------------------------------------------------------------
// Tricks
// ----------------------------------------------------------------------------
// direction index: 0 none, 1 left, 2 right, 3 up, 4 down, 5 up+left, 6 up+right, 7 down+left, 8 down+right
const DIRMAP = [[0, 1, 2], [3, 5, 6], [4, 7, 8]];
function dirIndex(up, down, left, right) {
    const v = up && !down ? 1 : (down && !up ? 2 : 0);
    const h = left && !right ? 1 : (right && !left ? 2 : 0);
    return DIRMAP[v][h];
}
const FD = (name, pts, dur, flip, shove, imp) => ({ name, pts, dur, flip, shove, imp });
const FLIPS = [
    FD("Kickflip", 100, 0.40, 1, 0, 0), FD("Heelflip", 100, 0.40, -1, 0, 0),
    FD("Pop Shove-It", 100, 0.36, 0, -0.5, 0), FD("Impossible", 300, 0.48, 0, 0, 1),
    FD("360 Flip", 500, 0.52, 1, -1, 0), FD("Hardflip", 400, 0.48, 1, 0.5, 0),
    FD("Varial Kickflip", 300, 0.46, 1, -0.5, 0), FD("Varial Heelflip", 300, 0.46, -1, 0.5, 0),
    FD("360 Shove-It", 250, 0.46, 0, -1, 0)];
const GRABS = [
    { name: "Indy", pts: 200 }, { name: "Melon", pts: 200 }, { name: "Method", pts: 300 }, { name: "Nosegrab", pts: 250 }, { name: "Tailgrab", pts: 250 },
    { name: "Madonna", pts: 450 }, { name: "Benihana", pts: 400 }, { name: "Stalefish", pts: 350 }, { name: "Crossbone", pts: 350 }];
const GD = (name, pts, slide, yawOff, pitch, roll) => ({ name, pts, slide, yawOff, pitch, roll });
const GRINDS = [
    GD("50-50 Grind", 100, false, 0, 0, 0), GD("Boardslide", 150, true, PI / 2, 0, 0),
    GD("Feeble Grind", 250, false, 0.35, 0.14, 0.2), GD("Nosegrind", 200, false, 0, -0.26, 0),
    GD("5-0 Grind", 150, false, 0, 0.26, 0), GD("Noseslide", 200, true, PI / 2, -0.16, 0),
    GD("Crooked Grind", 300, false, -0.42, -0.24, 0.18), GD("Tailslide", 250, true, PI / 2, 0.16, 0),
    GD("Smith Grind", 300, false, 0.42, 0.24, -0.2)];
const SPIN_PTS = [0, 150, 400, 750, 1200, 2000, 3000, 4500];

class Combo {
    constructor() { this.names = []; this.uses = []; this.base = 0; this.mult = 0; }
    active() { return this.mult > 0; }
    reset() { this.names = []; this.uses = []; this.base = 0; this.mult = 0; }
    add(n, pts) {
        let u = 0;
        for (const p of this.uses) if (p[0] === n) { u = ++p[1]; break; }
        if (u === 0) this.uses.push([n, 0]);
        const k = Math.max(0.25, Math.pow(0.72, u));   // repeated tricks are worth less
        this.base += pts * k;
        this.mult++;
        if (this.names.length && this.names[this.names.length - 1] === n) this.names[this.names.length - 1] += "+";
        this.names.push(n);
    }
    addRunning(pts) { this.base += pts; }
    value() { return Math.trunc(this.base) * Math.max(1, this.mult); }
    text(maxChars) {
        let s = "";
        for (let i = this.names.length - 1; i >= 0; i--) {
            const part = this.names[i];
            if (part[part.length - 1] === '+') continue;
            const ns = part + (s.length === 0 ? "" : " + ") + s;
            if (ns.length > maxChars) { s = "... + " + s; break; }
            s = ns;
        }
        return s;
    }
    copy() { const c = new Combo(); c.names = this.names.slice(); c.uses = this.uses.map(p => [p[0], p[1]]); c.base = this.base; c.mult = this.mult; return c; }
}

// ----------------------------------------------------------------------------
// Input snapshot for one physics tick
// ----------------------------------------------------------------------------
class Input {
    constructor() {
        this.up = false; this.down = false; this.left = false; this.right = false;
        this.ollie = false; this.flip = false; this.grab = false; this.grind = false; this.manual = false;           // held
        this.olliePress = false; this.ollieRelease = false; this.flipPress = false; this.grabPress = false;          // edges
        this.grindPress = false; this.manualPress = false;
    }
}

const ST_RIDE = 0, ST_AIR = 1, ST_GRIND = 2, ST_MANUAL = 3, ST_BAIL = 4;

const GRAV = 12.5;
const OLLIE_MIN = 5.2, OLLIE_MAX = 6.8;
const PUSH_ACC = 5.5, PUSH_MAX = 10.2, MAX_SPEED = 19;
const SPIN_MAX = 9.2, SPIN_ACC = 40;
const LETTER_NAMES = ["S", "K", "A", "T", "E"];

class Player {
    constructor() { this.init(); }
    init() {
        this.pos = v3(); this.vel = v3(); this.prevPos = v3();   // prevPos: position at the previous physics tick (render interpolation)
        this.yaw = 0;
        this.state = ST_RIDE;
        this.n = v3(0, 1, 0); this.upVis = v3(0, 1, 0);
        this.groundSolid = -1; this.surf = SURF_ASPHALT;
        this.speed = 0;
        // ollie
        this.crouching = false;
        this.crouchT = 0; this.coyote = 0;   // coyote: late-ollie window after rolling off an edge
        // air
        this.airT = 0; this.spinRate = 0; this.spinAccum = 0;
        this.qpAir = false; this.fromManual = false; this.trickThisAir = false;
        this.flipIdx = -1; this.flipExtra = 0;
        this.flipT = 0; this.flipDur = 0;
        this.grabIdx = -1;
        this.grabT = 0; this.grabBlend = 0;
        this.grabHeld = false;
        this.gapArmed = [];       // gaps flown over during this air
        this.gapDone = [];        // gaps already awarded in this combo
        // grind
        this.rail = -1; this.railDir = 1; this.grindIdx = 0; this.lastRail = -1; this.grindSide = 1;
        this.railT = 0; this.railSpeed = 0; this.grindTime = 0; this.railCooldown = 0; this.grindBuffer = 0; this.grindYaw = 0;
        this.bal = 0; this.balV = 0; this.balSeed = 0;
        this.grindFakie = false;
        // manual
        this.nose = false;
        this.manualTime = 0; this.manualBuffer = 0;
        // bail
        this.bailT = 0;
        this.bailWhy = "";
        this.bodyPos = v3(); this.bodyVel = v3(); this.boardPos = v3(); this.boardVel = v3();
        this.boardSpin = 0; this.boardAng = 0; this.bodyAng = 0;
        // animation helpers
        this.pushPhase = 0; this.landSquash = 0; this.sparkAcc = 0;
        this.pushing = false; this.braking = false;
        // scoring
        this.combo = new Combo();
        this.landGrace = 0;
        this.score = 0; this.best = 0;
        this.letters = [false, false, false, false, false];
        this.lettersGot = 0;
        this.slabDist = 0;
        this.rng = new Rng(777);
    }
    // deep copy (the autopilot's look-ahead runs copies of the player)
    clone() {
        const c = Object.create(Player.prototype);
        Object.assign(c, this);
        c.pos = this.pos.clone(); c.vel = this.vel.clone(); c.prevPos = this.prevPos.clone();
        c.n = this.n.clone(); c.upVis = this.upVis.clone();
        c.gapArmed = this.gapArmed.slice(); c.gapDone = this.gapDone.slice();
        c.bodyPos = this.bodyPos.clone(); c.bodyVel = this.bodyVel.clone(); c.boardPos = this.boardPos.clone(); c.boardVel = this.boardVel.clone();
        c.combo = this.combo.copy();
        c.letters = this.letters.slice();
        c.rng = this.rng.copy();
        return c;
    }
    reset(p, y) {
        const score = this.score, best = this.best, letters = this.letters.slice(), lettersGot = this.lettersGot;
        this.init();
        this.score = score; this.best = best; this.letters = letters; this.lettersGot = lettersGot;
        this.pos = p.clone(); this.yaw = y;
        this.pos.y = world.ground(p.x, p.z, p.y + 1.0).h;
    }
    grounded() { return this.state === ST_RIDE || this.state === ST_MANUAL; }
    isFakie() { return this.vel.x * Math.sin(this.yaw) + this.vel.z * Math.cos(this.yaw) < -0.3; }

    // ---------------------------------------------------------------- scoring
    bankCombo() {
        if (!this.combo.active()) return;
        const v = this.combo.value();
        this.score += v;
        if (this.score > this.best) this.best = this.score;
        const word = v >= 50000 ? "INSANE!!" : v >= 15000 ? "SICK COMBO!" : v >= 5000 ? "SWEET!" : v >= 1500 ? "NICE!" : "LANDED";
        popup(`${word}  +${v}`, v >= 5000 ? hexc(0xffd23a) : hexc(0x7dff8a), v >= 5000 ? 1.35 : 1.1, 2.0);
        sfx(v >= 5000 ? SFX_BIGCOMBO : SFX_COMBO, 0.8);
        this.combo.reset();
        this.gapDone = [];
    }
    addTrick(name, pts) {
        this.combo.add(name, pts);
        this.landGrace = 0;
    }
    finishSpin() {
        let n180 = Math.floor(Math.abs(this.spinAccum) / PI + 0.5);
        if (n180 >= 1) {
            n180 = Math.min(n180, 7);
            const bs = (this.spinAccum > 0) !== this.isFakie();
            this.addTrick(`${bs ? "BS" : "FS"} ${n180 * 180}`, SPIN_PTS[n180]);
        }
        this.spinAccum = 0;
        this.spinRate = 0;
    }

    // ---------------------------------------------------------------- bail
    bail(why, splash = false) {
        if (this.state === ST_BAIL) return;
        this.state = ST_BAIL;
        this.bailT = 0;
        this.bailWhy = why;
        if (this.combo.active()) popup(`BAILED!  -${this.combo.value()}`, hexc(0xff4a3a), 1.3, 2.0);
        else popup("BAILED!", hexc(0xff4a3a), 1.3, 1.6);
        if (why.length) popup(why, hexc(0xffb0a0), 0.8, 1.8);
        this.combo.reset();
        this.gapDone = [];
        this.landGrace = 0;
        const side = cross(v3(0, 1, 0), fwdYaw(this.yaw));
        this.bodyPos = this.pos.clone();
        this.bodyVel = add(mul(this.vel, 0.55), v3(0, 2.2, 0));
        this.boardPos = add(this.pos, v3(0, 0.1, 0));
        this.boardVel = addm(add(mul(this.vel, 1.05), v3(0, 2.6, 0)), side, this.rng.range(-2, 2));
        this.boardSpin = this.rng.range(-12, 12);
        this.boardAng = 0;
        this.bodyAng = 0;
        this.flipIdx = this.grabIdx = -1;
        this.rail = -1;
        this.crouching = false;
        sfx(splash ? SFX_SPLASH : SFX_BAIL);
        if (splash) spawnSplash(this.pos, 80, 1.5); else spawnDust(this.pos, 14);
    }
    updateBail(dt) {
        this.bailT += dt;
        const phys = (p, v, bounce) => {
            v.y -= GRAV * dt;
            p.x += v.x * dt; p.y += v.y * dt; p.z += v.z * dt;
            const gy = world.ground(p.x, p.z, p.y + 0.4).h;
            if (p.z < RIVER_EDGE_Z && p.y < WATER_LEVEL) {   // sinks slowly in the river
                p.y = WATER_LEVEL - 0.2; v.x *= 0.9; v.y *= 0.9; v.z *= 0.9; v.y = 0;
            } else if (p.y < gy) {
                p.y = gy;
                if (v.y < -2) v.y = -v.y * bounce; else v.y = 0;
                v.x *= 0.88; v.z *= 0.88;
            }
            const dummy = v.clone();
            world.collideWalls(p, dummy, 0.25, p.y + 0.3, 0.8);
            v.x = dummy.x; v.z = dummy.z;
        };
        phys(this.bodyPos, this.bodyVel, 0.25);
        phys(this.boardPos, this.boardVel, 0.45);
        this.boardAng += this.boardSpin * dt;
        this.boardSpin *= Math.exp(-1.5 * dt);
        this.bodyAng = Math.min(1, this.bailT * 3.0);
        this.pos = this.bodyPos.clone();
        this.vel = this.bodyVel.clone();
        if (this.bailT > 1.8) this.respawnAfterBail();
    }
    respawnAfterBail() {
        const p = awayFromTraffic(this.bodyPos);   // never get back up in the middle of a traffic lane
        if (p.z < RIVER_EDGE_Z + 0.8) { p.z = RIVER_EDGE_Z + 3.0; p.y = SH + 1.0; }
        p.y = world.ground(p.x, p.z, Math.max(p.y, 0) + 0.5).h;
        // never respawn perched on a thin thing: drop to the lowest nearby surface if on a rail blocker
        const v = v3(0, 0, 0);
        world.collideWalls(p, v, 0.35, p.y + STEP_UP, 1.6);
        p.y = world.ground(p.x, p.z, p.y + 0.3).h;
        const y = this.yaw;
        this.state = ST_RIDE;
        this.pos = p;
        this.vel = v3(0, 0, 0);
        this.yaw = y;
        this.spinAccum = this.spinRate = 0;
        this.flipIdx = this.grabIdx = -1;
        this.rail = -1;
        this.crouching = false;
        this.landSquash = 0;
    }

    // ---------------------------------------------------------------- ollie
    ollie(strength, fromRail) {
        let v = lerpf(OLLIE_MIN, OLLIE_MAX, strength);
        if (fromRail) v *= 0.92;
        // pop straight up (popping along a ramp normal would bleed forward speed on kickers)
        if (this.vel.y < 0 && !fromRail) this.vel.y *= 0.5;
        this.vel.y += v;
        this.fromManual = false;
        this.state = ST_AIR;
        this.airT = 0;
        this.qpAir = !fromRail && this.n.y < 0.6;   // popped off a steep transition: vert air
        this.trickThisAir = false;
        this.crouching = false;
        this.crouchT = 0;
        this.coyote = 0;
        this.gapArmed = [];
        sfx(SFX_POP, 0.9, 0.95 + strength * 0.15);
    }
    startFlip(idx) {
        if (this.flipIdx >= 0) {
            // same flip pressed again mid-trick => double / triple
            if (this.flipIdx === idx && this.flipExtra < 2 && this.flipT > this.flipDur * 0.35) {
                this.flipExtra++;
                this.flipDur += FLIPS[idx].dur * 0.75;
                const pre = this.flipExtra === 1 ? "Double " : "Triple ";
                this.addTrick(pre + FLIPS[idx].name, FLIPS[idx].pts * (this.flipExtra === 1 ? 2.2 : 3.6));
                sfx(SFX_FLIP, 0.5, 1.15);
            }
            return;
        }
        if (this.grabIdx >= 0) return;
        this.flipIdx = idx;
        this.flipT = 0;
        this.flipExtra = 0;
        this.flipDur = FLIPS[idx].dur;
        this.addTrick(FLIPS[idx].name, FLIPS[idx].pts);
        this.trickThisAir = true;
        sfx(SFX_FLIP, 0.5);
    }
    startGrab(idx) {
        if (this.flipIdx >= 0 || this.grabIdx >= 0) return;
        this.grabIdx = idx;
        this.grabT = 0;
        this.addTrick(GRABS[idx].name, GRABS[idx].pts);
        this.trickThisAir = true;
    }

    // ---------------------------------------------------------------- ground
    updateGround(inp, dt) {
        const manual = this.state === ST_MANUAL;
        const g0 = world.ground(this.pos.x, this.pos.z, this.pos.y + 0.05);
        this.n = g0.n;
        this.speed = len(this.vel);
        // steering
        const steer = (inp.left ? 1 : 0) - (inp.right ? 1 : 0);
        let rate = this.speed < 0.7 ? 2.6 : lerpf(3.2, 2.2, sat((this.speed - 1) / 11));
        if (manual) rate *= 0.7;
        if (this.crouching) rate *= 1.15;
        this.yaw += steer * rate * dt;
        const n = this.n;
        const f = fwdYaw(this.yaw);
        const ft = norm(sub(f, mul(n, dot(f, n))));
        const g = v3(0, -GRAV, 0);
        this.vel = addm(this.vel, sub(g, mul(n, dot(g, n))), dt);
        let s = dot(this.vel, ft);
        let lat = sub(sub(this.vel, mul(ft, s)), mul(n, dot(this.vel, n)));
        this.pushing = false;
        this.braking = false;
        const travel = s < -0.15 ? -1 : 1;
        if (inp.up && !manual && !this.crouching && Math.abs(s) < PUSH_MAX) {
            s += travel * PUSH_ACC * dt;
            this.pushing = true;
        }
        if (inp.down && !manual) {
            s = approach(s, 0, 6.5 * dt);
            this.braking = Math.abs(s) > 0.5;
        }
        s = approach(s, 0, (0.22 + 0.0035 * s * s) * dt);
        lat = mul(lat, Math.exp(-11 * dt));
        this.vel = add(mul(ft, s), lat);
        if (len(this.vel) > MAX_SPEED) this.vel = mul(norm(this.vel), MAX_SPEED);
        this.pushPhase = this.pushing ? this.pushPhase + dt * 1.8 : Math.max(0, this.pushPhase - dt * 2);
        if (!this.pushing && this.pushPhase > 1) this.pushPhase = 0;

        // move + collide
        const np = addm(this.pos, this.vel, dt);
        const wallN = v3();
        const onQP = this.groundSolid >= 0 && world.solids[this.groundSolid].type === S_QP;
        // on a slope, the ground ahead is higher than under our feet: allow for that when testing walls
        const slopeRise = n.y < 0.999 ? 0.3 * Math.sqrt(Math.max(0, 1 - n.y * n.y)) / Math.max(n.y, 0.3) : 0;
        const impact = world.collideWalls(np, this.vel, onQP ? 0.05 : 0.3, this.pos.y + STEP_UP + slopeRise, 1.6, wallN);
        if (impact > 9.5) { this.pos = np; this.bail("SLAMMED INTO A WALL"); return; }
        if (impact > 2.5) { sfx(SFX_LAND, 0.4, 0.7); this.landSquash = 0.3; }
        const g2 = world.ground(np.x, np.z, this.pos.y + STEP_UP);
        const dy = np.y - g2.h;
        const snap = 0.035 + len(this.vel) * dt * 0.55;
        let leaving = dy > 0.002 && dot(this.vel, g2.n) > 0.8;   // moving away from the next surface: launch
        // Topping out a quarter pipe right at the coping used to snap onto the deck and turn all the
        // upward speed into a horizontal shot off the back. Going up the wall onto something flatter
        // means going vert.
        if (onQP && g2.solid !== this.groundSolid && this.n.y < 0.6 && dot(this.vel, g2.n) > 0.8) leaving = true;
        if (dy <= snap && !leaving) {
            if (g2.surf === SURF_WATER) { this.pos = np; this.bail("SPLASHDOWN!", true); return; }
            const rise = g2.h - this.pos.y;
            if (rise > 0.06 && g2.n.y > 0.97) {                // rolled up a curb
                this.vel = mul(this.vel, 0.86);
                this.landSquash = 0.5;
                sfx(SFX_CLACK, 0.7);
            }
            np.y = g2.h;
            const sp = len(this.vel);
            const nv = sub(this.vel, mul(g2.n, dot(this.vel, g2.n)));
            const kink = dot(g2.n, this.n);
            if (len(nv) > 1e-4) this.vel = mul(norm(nv), sp * (kink < 0.93 ? 0.96 : 1));
            this.n = g2.n;
            this.groundSolid = g2.solid;
            this.surf = g2.surf;
            this.pos = np;
        } else {
            // left the ground: off a ledge, over a lip or out of a quarter pipe
            const last = this.groundSolid >= 0 ? world.solids[this.groundSolid] : null;
            this.pos = np;
            this.fromManual = manual;
            this.state = ST_AIR;
            this.airT = 0;
            this.trickThisAir = false;
            this.gapArmed = [];
            this.qpAir = false;
            if (last && last.type === S_QP && this.n.y < 0.6) {
                // vert assist: come straight back down the transition
                const fz = last.localDirZ();
                const vh = v3(this.vel.x, 0, this.vel.z);
                const along = dot(vh, fz);
                const latv = sub(vh, mul(fz, along));
                this.vel = add(addm(latv, fz, -0.35), v3(0, this.vel.y, 0));
                this.qpAir = true;
            }
            this.coyote = this.qpAir ? 0 : 0.14;
            if (this.qpAir) this.crouching = false;
            return;
        }
        // ollie charge / release
        if (inp.olliePress && !this.crouching) { this.crouching = true; this.crouchT = 0; }
        if (this.crouching) {
            this.crouchT += dt;
            if (!inp.ollie) { this.ollie(sat(this.crouchT / 0.32), false); return; }
        }
        if (inp.flipPress) {   // pop straight into a flip
            this.ollie(0.45, false);
            this.startFlip(dirIndex(inp.up, inp.down, inp.left, inp.right));
            return;
        }
        if (inp.grindPress) { this.grindBuffer = 0.45; this.ollie(0.25, false); return; }
        // manuals
        if (this.state === ST_RIDE && inp.manualPress && len(this.vel) > 1.0) this.startManual(inp);
        else if (this.state === ST_MANUAL && inp.manualPress && this.manualTime > 0.15) { this.state = ST_RIDE; this.bankCombo(); }
        if (this.state === ST_MANUAL) {
            this.manualTime += dt;
            const inst = 1.8 + this.manualTime * 0.35;
            this.balV += (this.bal * inst * 2.4 + Math.sin(this.manualTime * 2.3 + this.balSeed) * (0.5 + 0.15 * this.manualTime)) * dt;
            if (inp.up) this.balV -= 6 * dt;
            if (inp.down) this.balV += 6 * dt;
            this.balV *= Math.exp(-1.2 * dt);
            this.bal += this.balV * dt;
            this.combo.addRunning(140 * dt);
            if (Math.abs(this.bal) >= 1) { this.bail(this.bal > 0 ? "SCRAPED THE TAIL" : "NOSE DIVE"); return; }
            if (len(this.vel) < 0.6) { this.state = ST_RIDE; this.bankCombo(); }
        }
        this.speed = len(this.vel);
        // rolling sound + sidewalk joint clacks
        if (this.state !== ST_AIR) {
            this.slabDist += this.speed * dt;
            if (this.surf === SURF_SIDEWALK && this.slabDist > 1.52) { this.slabDist = 0; sfx(SFX_CLACK, 0.18 + this.speed * 0.02, 1.3); }
        }
    }
    startManual(inp) {
        this.state = ST_MANUAL;
        this.nose = inp.up;
        this.manualTime = 0;
        this.bal = this.rng.range(-0.1, 0.1);
        this.balV = 0;
        this.balSeed = this.rng.range(0, 10);
        this.addTrick(this.nose ? "Nose Manual" : "Manual", this.nose ? 150 : 100);
    }

    // ---------------------------------------------------------------- air
    land(g, inp) {
        const nn = g.n;
        const impact = -dot(this.vel, nn);
        const vt = sub(this.vel, mul(nn, dot(this.vel, nn)));
        const f = fwdYaw(this.yaw);
        const ft = norm(sub(f, mul(nn, dot(f, nn))));
        let fail = "";
        let splash = false;
        if (g.surf === SURF_WATER) { fail = "SPLASHDOWN!"; splash = true; }
        else if (this.flipIdx >= 0 && this.flipT < this.flipDur * 0.8) fail = "DIDN'T FINISH THE FLIP";
        else if (this.grabIdx >= 0 && this.grabHeld && this.grabT > 0.08) fail = "STILL GRABBING";
        else {
            const vl = len(vt);
            if (vl > 1.8) {
                const c = dot(ft, dv(vt, vl));
                if (Math.abs(c) < 0.74) fail = "LANDED SIDEWAYS";
            }
            if (this.upVis.y < 0.2 && nn.y > 0.8) fail = "LANDED ON YOUR HEAD";
        }
        this.pos.y = g.h;
        if (fail.length) { this.bail(fail, splash); return; }
        const vl = len(vt);
        if (vl > 1.0) {   // straighten out to the travel direction (forward or fakie)
            let d = wrapPi(yawOf(vt) - this.yaw);
            if (Math.abs(d) > PI / 2) d = wrapPi(d + PI);
            this.yaw += d;
        }
        this.vel = mul(vt, impact > 11 ? 0.82 : 0.97);
        this.n = nn;
        this.groundSolid = g.solid;
        this.surf = g.surf;
        if (this.trickThisAir || this.spinAccum !== 0) this.finishSpin();
        this.flipIdx = -1;
        this.grabIdx = -1;
        this.grabBlend = 0;
        this.spinRate = 0;
        this.qpAir = false;
        this.landSquash = Math.min(1, 0.35 + impact * 0.06);
        sfx(impact > 9 ? SFX_LAND_HARD : SFX_LAND, Math.min(1, 0.4 + impact * 0.07));
        spawnDust(this.pos, impact > 6 ? 10 : 4);
        this.state = ST_RIDE;
        const wantManual = inp.manual || this.manualBuffer > 0 || (this.fromManual && this.airT < 0.45);
        if (wantManual && len(this.vel) > 1.0) {
            if (this.fromManual && this.airT < 0.45 && !this.trickThisAir && this.combo.active()) { this.state = ST_MANUAL; }   // kept manualing off a curb
            else this.startManual(inp);
            this.manualBuffer = 0;
        } else if (this.combo.active()) {
            this.landGrace = 0.3;
        }
        this.fromManual = false;
    }
    updateAir(inp, dt) {
        this.airT += dt;
        this.vel.y -= GRAV * dt;
        // late ollie: releasing (or tapping) space just after rolling off an edge still pops
        this.coyote -= dt;
        if (this.coyote > 0 && inp.olliePress && !this.crouching) { this.crouching = true; this.crouchT = 0.1; }
        if (this.crouching) {
            this.crouchT += dt;
            if (!inp.ollie) {
                const late = this.coyote > 0;
                this.crouching = false;
                if (late) { this.ollie(sat(this.crouchT / 0.32), false); return; }
            }
        }
        // spins
        const spinIn = (inp.left ? 1 : 0) - (inp.right ? 1 : 0);
        if (spinIn !== 0) this.spinRate = approach(this.spinRate, spinIn * SPIN_MAX, SPIN_ACC * dt);
        else this.spinRate = approach(this.spinRate, 0, SPIN_ACC * 1.5 * dt);
        this.yaw += this.spinRate * dt;
        this.spinAccum += this.spinRate * dt;
        // a little air control
        const fwd = norm(v3(this.vel.x, 0, this.vel.z));
        if (inp.up) this.vel = addm(this.vel, fwd, 0.6 * dt);
        if (inp.down) this.vel = addm(this.vel, fwd, -0.6 * dt);
        // tricks
        if (inp.flipPress) this.startFlip(dirIndex(inp.up, inp.down, inp.left, inp.right));
        if (inp.grabPress) this.startGrab(dirIndex(inp.up, inp.down, inp.left, inp.right));
        this.grabHeld = inp.grab;
        if (this.flipIdx >= 0) {
            this.flipT += dt;
            if (this.flipT >= this.flipDur) { this.flipIdx = -1; this.flipT = 0; }
        }
        if (this.grabIdx >= 0) {
            this.grabT += dt;
            if (inp.grab) {
                this.grabBlend = Math.min(1, this.grabBlend + dt * 9);
                if (this.grabT > 0.2) this.combo.addRunning(320 * dt);
            } else {
                this.grabBlend = Math.max(0, this.grabBlend - dt * 10);
                if (this.grabBlend <= 0) this.grabIdx = -1;
            }
        }
        if (inp.manualPress) this.manualBuffer = 0.35;
        if (inp.grindPress) this.grindBuffer = 0.3;
        if ((inp.grind || this.grindBuffer > 0) && this.tryGrind(inp)) return;
        // gaps: arm while above a gap zone, award when we have cleared it
        const gaps = world.gaps;
        for (let i = 0; i < gaps.length; i++) {
            const gp = gaps[i];
            const over = gp.inside(this.pos.x, this.pos.z) && this.pos.y > gp.topY;
            if (over && this.gapArmed.indexOf(i) < 0) this.gapArmed.push(i);
        }
        // integrate
        const np = addm(this.pos, this.vel, dt);
        world.collideWalls(np, this.vel, this.qpAir ? 0.05 : 0.3, this.pos.y + 0.12, 1.6);
        const g = world.ground(np.x, np.z, this.pos.y + 0.05);
        // visual up vector leans towards the surface below (keeps vert airs looking right)
        const targetUp = this.qpAir ? norm(lerp3(v3(0, 1, 0), g.n, 0.75)) : v3(0, 1, 0);
        this.upVis = norm(damp3(this.upVis, targetUp, 5, dt));
        if (np.y <= g.h && this.vel.y <= 0.5) {
            this.pos = np;
            this.awardGaps();
            if (this.state !== ST_AIR) return;
            this.land(g, inp);
            return;
        }
        this.pos = np;
        if (this.pos.z < RIVER_EDGE_Z && this.pos.y < WATER_LEVEL + 0.2) { this.bail("SWIM TIME!", true); return; }
    }
    awardGaps() {
        for (const i of this.gapArmed) {
            const gp = world.gaps[i];
            if (gp.inside(this.pos.x, this.pos.z)) continue;   // landed on it, not over it
            if (this.gapDone.indexOf(i) >= 0) continue;
            this.gapDone.push(i);
            this.addTrick(gp.name, gp.points);
            popup(gp.name, hexc(0x9fe8ff), 0.9, 1.3);
            sfx(SFX_GAP, 0.6);
            this.trickThisAir = true;
        }
        this.gapArmed = [];
    }

    // ------------------------------------------------------------------------
    // Grinding, the per-tick player update, S-K-A-T-E letters
    // ------------------------------------------------------------------------
    tryGrind(inp) {
        let best = -1, bestScore = 1e9, bestT = 0;
        const rails = world.rails, px = this.pos.x, py = this.pos.y, pz = this.pos.z;
        for (let i = 0; i < rails.length; i++) {
            if (i === this.lastRail && this.railCooldown > 0) continue;
            const r = rails[i], a = r.a, d = r.dir;
            const t = clampf((px - a.x) * d.x + (py - a.y) * d.y + (pz - a.z) * d.z, 0, r.L);
            const dx = px - (a.x + d.x * t), dy = py - (a.y + d.y * t), dz = pz - (a.z + d.z * t);
            const dh = Math.sqrt(dx * dx + dz * dz);
            if (dh > 1.1 || dy < -0.55 || dy > 0.85) continue;
            if (this.vel.y > 3.0 && dy < 0) continue;      // still rising up past it
            const sc = dh + Math.abs(dy) * 0.6;
            if (sc < bestScore) { bestScore = sc; best = i; bestT = t; }
        }
        if (best < 0) return false;
        const r = rails[best];
        let rh = v3(r.dir.x, 0, r.dir.z);
        const rl = len(rh);
        if (rl < 0.2) return false;
        rh = dv(rh, rl);
        const vh = v3(this.vel.x, 0, this.vel.z);
        const spd = len(vh), along = dot(vh, rh);
        if (spd > 1.0 && Math.abs(along) < 0.25 * spd) return false;   // coming in dead perpendicular
        const dir = spd > 1.0 ? (along >= 0 ? 1 : -1) : (dot(fwdYaw(this.yaw), rh) >= 0 ? 1 : -1);
        if ((dir > 0 && r.L - bestT < 0.25) || (dir < 0 && bestT < 0.25)) return false;
        const s = Math.max(Math.abs(dot(this.vel, r.dir)), Math.max(0.8 * spd, 3.0));
        this.startGrind(best, bestT, dir, s, inp);
        return this.state === ST_GRIND;
    }
    startGrind(ri, t, dir, spd, inp) {
        if (this.state === ST_AIR) {
            if (this.flipIdx >= 0 && this.flipT < this.flipDur * 0.7) { this.bail("DIDN'T FINISH THE FLIP"); return; }
            this.awardGaps();
            this.finishSpin();
        }
        const r = world.rails[ri];
        this.flipIdx = -1;
        this.grabIdx = -1;
        this.grabBlend = 0;
        this.state = ST_GRIND;
        this.rail = ri;
        this.railT = t;
        this.railDir = dir;
        this.railSpeed = Math.min(spd, 14);
        this.grindIdx = dirIndex(inp.up, inp.down, inp.left, inp.right);
        this.grindTime = 0;
        this.bal = this.rng.range(-0.15, 0.15);
        this.balV = 0;
        this.balSeed = this.rng.range(0, 10);
        const md = mul(r.dir, dir);
        const travelYaw = yawOf(v3(md.x, 0, md.z));
        this.grindFakie = Math.cos(wrapPi(this.yaw - travelYaw)) < 0;
        const gd = GRINDS[this.grindIdx];
        const base = travelYaw + (this.grindFakie ? PI : 0);
        if (gd.slide) {
            const a1 = base + PI / 2, a2 = base - PI / 2;
            this.grindYaw = Math.abs(wrapPi(a1 - this.yaw)) < Math.abs(wrapPi(a2 - this.yaw)) ? a1 : a2;
        } else this.grindYaw = base + gd.yawOff;
        this.yaw = this.grindYaw;
        {   // remember which side of the rail we came from (see exitGrind)
            const side = norm(cross(v3(0, 1, 0), v3(r.dir.x, 0, r.dir.z)));
            this.grindSide = dot(sub(this.pos, addm(r.a, r.dir, this.railT)), side) >= 0 ? 1 : -1;
        }
        this.pos = addm(r.a, r.dir, this.railT);
        this.vel = mul(md, this.railSpeed);
        this.addTrick(gd.name, gd.pts);
        const slideSound = gd.slide || r.kind !== RK_METAL;
        sfx(slideSound ? SFX_SLIDE : SFX_GRIND, 0.85);
        this.landSquash = 0.45;
        this.grindBuffer = 0;
        this.spinRate = 0;
        this.spinAccum = 0;
        this.upVis = v3(0, 1, 0);
        this.crouching = false;
    }
    exitGrind(popUp) {
        const r = world.rails[this.rail];
        this.lastRail = this.rail;
        this.railCooldown = 0.3;
        const md = mul(r.dir, this.railDir);
        this.vel = mul(md, this.railSpeed);
        if (!popUp) this.vel.y += 1.4;
        this.yaw = yawOf(v3(md.x, 0, md.z)) + (this.grindFakie ? PI : 0);
        this.state = ST_AIR;
        this.airT = 0;
        this.trickThisAir = false;
        this.qpAir = false;
        this.gapArmed = [];
        this.rail = -1;
        this.pos = add(this.pos, v3(0, 0.02, 0));
        // Handrails stand on a thin blocker so you cannot roll through them. Dropping straight down onto
        // it shoved the skater out to an arbitrary side -- off the river railing that meant the river.
        // Lean a hair towards the side we came from (or the dry one) so that is where it pushes us.
        const side = norm(cross(v3(0, 1, 0), v3(r.dir.x, 0, r.dir.z)));
        let overBlocker = false;
        const cl = world.cell(this.pos.x, this.pos.z);
        for (let k = 0; k < cl.length; k++) {
            const s = world.solids[cl[k]];
            if (!s.noGround || s.noWall || s.y0 > this.pos.y) continue;
            const dx = this.pos.x - s.cx, dz = this.pos.z - s.cz;
            const lx = dx * s.c - dz * s.s, lz = dx * s.s + dz * s.c;
            if (s.inside(lx, lz, 0.3)) { overBlocker = true; break; }
        }
        if (overBlocker) {
            let sgn = this.grindSide;
            const test = addm(this.pos, side, sgn * 0.5);
            const g = world.ground(test.x, test.z, this.pos.y);
            if (g.surf === SURF_WATER || test.z < RIVER_EDGE_Z) sgn = -sgn;
            this.pos = addm(this.pos, side, sgn * 0.03);
        }
    }
    updateGrind(inp, dt) {
        const r = world.rails[this.rail];
        const md = mul(r.dir, this.railDir);
        this.grindTime += dt;
        const metal = r.kind === RK_METAL;
        this.railSpeed += (-GRAV * md.y) * dt * 0.85;
        this.railSpeed -= (metal ? 0.6 : 1.2) * dt;
        // balance meter: unstable equilibrium you fight with left/right
        const inst = 2.0 + this.grindTime * 0.45;
        this.balV += (this.bal * inst * 2.2 + Math.sin(this.grindTime * 2.9 + this.balSeed) * (0.5 + this.grindTime * 0.18)) * dt;
        if (inp.left) this.balV -= 6.5 * dt;
        if (inp.right) this.balV += 6.5 * dt;
        this.balV *= Math.exp(-1.3 * dt);
        this.bal += this.balV * dt;
        this.combo.addRunning((metal ? 130 : 110) * dt);
        if (Math.abs(this.bal) >= 1) { this.bail(this.bal > 0 ? "FELL OFF THE RAIL" : "LOST YOUR BALANCE"); return; }
        if (inp.olliePress) { this.exitGrind(true); this.ollie(0.55, true); return; }
        // sparks off metal
        if (metal) {
            this.sparkAcc += dt * (20 + this.railSpeed * 6);
            while (this.sparkAcc >= 1) { this.sparkAcc -= 1; spawnSparks(this.pos, mul(md, this.railSpeed), 1); }
        }
        this.railT += this.railSpeed * this.railDir * dt;
        if (this.railSpeed < 0.5) { this.exitGrind(false); return; }
        if (this.railT < 0 || this.railT > r.L) {
            const endP = this.railT < 0 ? r.a : r.b;
            const over = this.railT < 0 ? -this.railT : this.railT - r.L;
            let next = -1, nextDir = 1, nextT = 0;
            const rails = world.rails;
            for (let i = 0; i < rails.length; i++) {
                if (i === this.rail) continue;
                const q = rails[i];
                if (len(sub(q.a, endP)) < 0.15 && dot(q.dir, md) > 0.6) { next = i; nextDir = 1; nextT = over; break; }
                if (len(sub(q.b, endP)) < 0.15 && -dot(q.dir, md) > 0.6) { next = i; nextDir = -1; nextT = q.L - over; break; }
            }
            if (next < 0) { this.exitGrind(false); return; }
            const nmd = mul(rails[next].dir, nextDir);
            this.yaw += wrapPi(yawOf(v3(nmd.x, 0, nmd.z)) - yawOf(v3(md.x, 0, md.z)));
            this.grindYaw = this.yaw;
            this.rail = next;
            this.railDir = nextDir;
            this.railT = nextT;
        }
        const rr = world.rails[this.rail];
        this.pos = addm(rr.a, rr.dir, this.railT);
        this.vel = mul(rr.dir, this.railDir * this.railSpeed);
        this.speed = this.railSpeed;
    }

    update(inp, dt) {
        // defensive: never let a numerical blow-up leave the skater in limbo
        const p = this.pos, v = this.vel;
        if (!(isFinite(p.x) && isFinite(p.y) && isFinite(p.z) && isFinite(v.x) && isFinite(v.y) && isFinite(v.z))) {
            this.reset(SPAWN_POS, SPAWN_YAW);
            return;
        }
        if (this.pos.y < -30) { this.bodyPos = this.pos.clone(); this.respawnAfterBail(); return; }   // respawn from here, not from the last bail
        this.railCooldown = Math.max(0, this.railCooldown - dt);
        this.grindBuffer = Math.max(0, this.grindBuffer - dt);
        this.manualBuffer = Math.max(0, this.manualBuffer - dt);
        this.landSquash = Math.max(0, this.landSquash - dt * 2.5);
        switch (this.state) {
            case ST_RIDE:
            case ST_MANUAL: this.updateGround(inp, dt); break;
            case ST_AIR: this.updateAir(inp, dt); break;
            case ST_GRIND: this.updateGrind(inp, dt); break;
            case ST_BAIL: this.updateBail(dt); break;
        }
        if (this.state === ST_RIDE && this.landGrace > 0) {
            this.landGrace -= dt;
            if (this.landGrace <= 0) this.bankCombo();
        }
        if (this.state === ST_RIDE || this.state === ST_MANUAL) this.upVis = norm(damp3(this.upVis, this.n, 14, dt));
        else if (this.state === ST_GRIND) this.upVis = norm(damp3(this.upVis, v3(0, 1, 0), 14, dt));
        // S-K-A-T-E letters
        if (this.state !== ST_BAIL) {
            for (let i = 0; i < 5 && i < letterPos.length; i++) {
                if (this.letters[i]) continue;
                const lp = letterPos[i];
                const dx = this.pos.x - lp.x, dy = this.pos.y + 0.9 - lp.y, dz = this.pos.z - lp.z;
                if (Math.sqrt(dx * dx + dy * dy + dz * dz) < 1.4) {
                    this.letters[i] = true;
                    this.lettersGot++;
                    this.score += 250;
                    if (this.score > this.best) this.best = this.score;
                    sfx(SFX_LETTER);
                    if (this.lettersGot === 5) {
                        this.score += 5000;
                        if (this.score > this.best) this.best = this.score;
                        popup("S-K-A-T-E COLLECTED!  +5000", hexc(0xffd23a), 1.4, 3.0);
                    } else popup("LETTER " + LETTER_NAMES[i] + "  +250", hexc(0xff9ad8), 1.1, 1.6);
                }
            }
        }
        if (g_sim) return;
        // continuous audio parameters
        const rolling = this.state === ST_RIDE || this.state === ST_MANUAL;
        aud.roll = rolling ? sat(this.speed / 9) * (this.surf === SURF_WOOD ? 0.8 : 0.65) : 0;
        aud.rollPitch = 0.6 + this.speed / 14;
        aud.rollSurf = this.surf;
        aud.grind = this.state === ST_GRIND ? 0.75 : 0;
        aud.grindMetal = (this.state === ST_GRIND && this.rail >= 0 && world.rails[this.rail].kind === RK_METAL) ? 1 : 0;
        aud.wind = this.state === ST_AIR ? sat((len(this.vel) - 4) / 10) * 0.5 : sat((this.speed - 7) / 10) * 0.2;
    }
}
const P = new Player();


// ----------------------------------------------------------------------------
// Characters: an articulated box figure driven by a pose with 2-bone IK for
// arms and legs. Local character space faces -X, left side towards +Z.
// ----------------------------------------------------------------------------
const DM = new MeshBuilder(65536, 131072);   // dynamic geometry, rebuilt every frame

class Outfit {
    constructor() {
        this.skin = hexc(0xc68a5a); this.shirt = hexc(0xc8302a); this.pants = hexc(0x2c3e66); this.shoes = hexc(0xe6e6e0);
        this.hat = hexc(0x1b1b1b); this.hair = hexc(0x2a1a10); this.bagCol = hexc(0x3a2a1a);
        this.hat_ = 2;          // 0 none, 1 cap forward, 2 cap backwards, 3 beanie
        this.height = 1;
        this.bag = false; this.longSleeves = false; this.baggy = true;
    }
}
class Pose {
    constructor() {
        this.pelvis = v3(0.03, 0.88, 0);
        this.pelvisYaw = 0; this.lean = 0.15; this.side = 0; this.twist = 0.35;
        this.footL = v3(0, 0, 0.24); this.footR = v3(0.02, 0, -0.25);
        this.footYawL = 0.25; this.footYawR = 0.1;
        this.handL = v3(-0.05, 0.62, 0.4); this.handR = v3(0.05, 0.6, -0.38);
        this.kneeHint = v3(-1, 0.1, 0);
        this.headYaw = 0.7; this.headPitch = 0;
        this.elbowHintL = v3(0.4, -0.6, 0.3); this.elbowHintR = v3(0.4, -0.6, -0.3);
    }
}

function ikJoint(a, target, l1, l2, hint, end) {
    const d = sub(target, a);
    const L = len(d);
    const dn = L > 1e-5 ? dv(d, L) : v3(0, -1, 0);
    const Lc = clampf(L, 0.02, l1 + l2 - 1e-3);
    const x = (l1 * l1 - l2 * l2 + Lc * Lc) / (2 * Lc);
    const h = Math.sqrt(Math.max(l1 * l1 - x * x, 0));
    let hp = sub(hint, mul(dn, dot(hint, dn)));
    if (len(hp) < 1e-4) hp = Math.abs(dn.y) < 0.9 ? cross(dn, v3(0, 1, 0)) : cross(dn, v3(1, 0, 0));
    hp = norm(hp);
    end.set(addm(a, dn, Lc));
    return add(addm(a, dn, x), mul(hp, h));
}

const C_EYE = hexc(0x151515);
const UPV = v3(0, 1, 0);
// Draw a figure. M maps character space to world. Pose values are in character space (metres, unscaled).
function drawHuman(mb, M, p, o) {
    const s = o.height;
    const W = (v) => xPoint(M, v);
    const WD = (v) => xDir(M, v);
    const Rp = mRotY(p.pelvisYaw);
    const left = xDir(Rp, v3(0, 0, 1));
    const pel = mul(p.pelvis, s);
    const Rt = mm(mRotY(p.pelvisYaw + p.twist), mRotZ(p.lean), mRotX(p.side));
    const tUp = xDir(Rt, v3(0, 1, 0)), tLeft = xDir(Rt, v3(0, 0, 1)), tFwd = xDir(Rt, v3(-1, 0, 0));
    const legW = o.baggy ? 0.2 : 0.15;
    // legs
    for (let k = 0; k < 2; k++) {
        const sg = k === 0 ? 1 : -1;
        const hip = sub(addm(pel, left, 0.1 * sg * s), v3(0, 0.04 * s, 0));
        const foot = mul(k === 0 ? p.footL : p.footR, s);
        const ankle = add(foot, v3(0, 0.08 * s, 0));
        const end = v3();
        const hint = addm(p.kneeHint, left, 0.25 * sg);
        const knee = ikJoint(hip, ankle, 0.44 * s, 0.44 * s, hint, end);
        mb.limb(W(hip), W(knee), legW * s, legW * s, WD(left), o.pants, MAT_CLOTH);
        mb.limb(W(knee), W(end), (legW - 0.02) * s, (legW - 0.02) * s, WD(left), o.pants, MAT_CLOTH);
        const fy = k === 0 ? p.footYawL : p.footYawR;
        const fdir = v3(-Math.cos(fy), 0, Math.sin(fy));
        const fside = cross(UPV, fdir);
        const fc = addm(add(end, v3(0, -0.04 * s, 0)), fdir, 0.07 * s);
        mb.box(mBasis(WD(fside), WD(UPV), WD(fdir), W(fc)), v3(0.065 * s, 0.05 * s, 0.155 * s), o.shoes, MAT_CLOTH);
    }
    // hips + torso
    mb.box(mBasis(WD(left), WD(UPV), WD(xDir(Rp, v3(-1, 0, 0))), W(pel)), v3(0.19 * s, 0.1 * s, 0.13 * s), o.pants, MAT_CLOTH);
    const chestC = addm(pel, tUp, 0.3 * s);
    mb.box(mBasis(WD(tLeft), WD(tUp), WD(tFwd), W(chestC)), v3(0.2 * s, 0.26 * s, 0.125 * s), o.shirt, MAT_CLOTH);
    const neck = addm(pel, tUp, 0.56 * s);
    // head
    const Rh = mm(Rt, mRotY(p.headYaw), mRotZ(p.headPitch));
    const hUp = xDir(Rh, v3(0, 1, 0)), hLeft = xDir(Rh, v3(0, 0, 1)), hFwd = xDir(Rh, v3(-1, 0, 0));
    const headC = addm(neck, hUp, 0.14 * s);
    mb.limb(W(addm(neck, tUp, -0.02)), W(addm(neck, hUp, 0.06 * s)), 0.08 * s, 0.08 * s, WD(tLeft), o.skin, MAT_SKIN);
    const HB = mBasis(WD(hLeft), WD(hUp), WD(hFwd), W(headC));
    const HT = (x, y, z) => mmul(HB, mTranslate(v3(x, y, z)));
    mb.box(HB, v3(0.1 * s, 0.12 * s, 0.11 * s), o.skin, MAT_SKIN);
    mb.box(HT(0.035 * s, 0.025 * s, 0.112 * s), v3(0.018 * s, 0.012 * s, 0.004 * s), C_EYE, MAT_PLAIN);
    mb.box(HT(-0.035 * s, 0.025 * s, 0.112 * s), v3(0.018 * s, 0.012 * s, 0.004 * s), C_EYE, MAT_PLAIN);
    if (o.hat_ === 0) {
        mb.box(HT(0, 0.1 * s, -0.01 * s), v3(0.105 * s, 0.035 * s, 0.115 * s), o.hair, MAT_CLOTH);
    } else if (o.hat_ === 3) {
        mb.box(HT(0, 0.1 * s, -0.005 * s), v3(0.11 * s, 0.06 * s, 0.12 * s), o.hat, MAT_CLOTH);
    } else {
        mb.box(HT(0, 0.105 * s, 0), v3(0.108 * s, 0.04 * s, 0.118 * s), o.hat, MAT_CLOTH);
        const bz = o.hat_ === 1 ? 0.16 : -0.16;
        mb.box(HT(0, 0.08 * s, bz * s), v3(0.085 * s, 0.01 * s, 0.07 * s), o.hat, MAT_CLOTH);
    }
    // arms
    for (let k = 0; k < 2; k++) {
        const sg = k === 0 ? 1 : -1;
        const sh = addm(addm(neck, tUp, -0.06 * s), tLeft, 0.22 * sg * s);
        const hand = mul(k === 0 ? p.handL : p.handR, s);
        const hint = k === 0 ? p.elbowHintL : p.elbowHintR;
        const end = v3();
        const elbow = ikJoint(sh, hand, 0.29 * s, 0.27 * s, hint, end);
        mb.limb(W(sh), W(elbow), 0.12 * s, 0.12 * s, WD(tFwd), o.shirt, MAT_CLOTH);
        mb.limb(W(elbow), W(end), 0.085 * s, 0.085 * s, WD(tFwd), o.longSleeves ? o.shirt : o.skin, o.longSleeves ? MAT_CLOTH : MAT_SKIN);
        const hd = norm(sub(end, elbow));
        mb.limb(W(end), W(addm(end, hd, 0.09 * s)), 0.08 * s, 0.05 * s, WD(tFwd), o.skin, MAT_SKIN);
    }
    if (o.bag) {
        const bc = add(addm(pel, left, -0.26 * s), v3(0, -0.1 * s, 0));
        mb.box(mBasis(WD(left), WD(UPV), WD(xDir(Rp, v3(-1, 0, 0))), W(bc)), v3(0.05 * s, 0.16 * s, 0.2 * s), o.bagCol, MAT_CLOTH);
    }
}

// Skateboard in board space: deck top centre at origin, nose +Z
const B_GRIP = hexc(0x222222), B_DECK = hexc(0xd8402a), B_TRUCK = hexc(0xb8bcc0), B_WHEEL = hexc(0xf0ead8), B_STRIPE = hexc(0xf0e8d0);
function drawBoard(mb, B) {
    const T = (x, y, z) => mmul(B, mTranslate(v3(x, y, z)));
    mb.box(T(0, -0.009, 0), v3(0.105, 0.009, 0.3), B_DECK, MAT_PAINTED, 63, B_GRIP);
    for (let sg = -1; sg <= 1; sg += 2) {
        const K = mm(B, mTranslate(v3(0, -0.009, sg * 0.3)), mRotX(-sg * 0.33), mTranslate(v3(0, 0, sg * 0.075)));
        mb.box(K, v3(0.1, 0.009, 0.078), B_DECK, MAT_PAINTED, 63, B_GRIP);
        mb.box(T(0, -0.04, sg * 0.22), v3(0.02, 0.022, 0.035), B_TRUCK, MAT_METAL);
        mb.box(T(0, -0.062, sg * 0.22), v3(0.085, 0.012, 0.014), B_TRUCK, MAT_METAL);
        for (let sx = -1; sx <= 1; sx += 2)
            mb.cylinder(mmul(T(sx * 0.07, -0.07, sg * 0.22), mRotZ(PI / 2)), 0.028, 0.032, 8, B_WHEEL, MAT_PLAIN, true);
    }
    // stripe on the bottom
    mb.box(T(0, -0.0185, 0), v3(0.02, 0.0005, 0.26), B_STRIPE, MAT_PLAIN, 8);
}

const PLAYER_OUTFIT = new Outfit();

// Build the skater's pose + board transform for the current state and draw them.
function drawSkater(mb, pl, inp) {
    if (pl.state === ST_BAIL) {
        // tumbling body + loose board
        const up = v3(0, 1, 0), side = cross(up, fwdYaw(pl.yaw));
        const base = mBasis(side, up, fwdYaw(pl.yaw), add(pl.bodyPos, v3(0, 0.05, 0)));
        const ang = pl.bodyAng * (PI * 0.47);
        const M = mm(base, mRotZ(ang), mTranslate(v3(0, -0.2 * pl.bodyAng, 0)));
        const p = new Pose();
        p.pelvis = v3(0.1, 0.75, 0);
        p.lean = -0.2;
        p.handL = v3(-0.1, 1.1, 0.7); p.handR = v3(0.1, 1.05, -0.7);
        p.footL = v3(-0.1, 0.1, 0.35); p.footR = v3(0.2, 0.25, -0.35);
        p.headYaw = 0.2; p.headPitch = 0.3;
        drawHuman(mb, M, p, PLAYER_OUTFIT);
        const B = mm(mTranslate(add(pl.boardPos, v3(0, 0.08, 0))), mRotY(pl.yaw + pl.boardAng * 0.5), mRotZ(pl.boardAng));
        drawBoard(mb, B);
        return;
    }
    const up = norm(pl.upVis);
    const f = fwdYaw(pl.yaw);
    let fwd = sub(f, mul(up, dot(f, up)));
    if (len(fwd) < 1e-3) fwd = v3(0, 0, 1);
    fwd = norm(fwd);
    const side = cross(up, fwd);
    let lift = 0.1;
    if (pl.state === ST_GRIND) lift = GRINDS[pl.grindIdx].slide ? 0.03 : 0.08;
    const R = mBasis(side, up, fwd, addm(pl.pos, up, lift));   // rider space == board space (no trick rotation)
    const p = new Pose();
    const speed = len(pl.vel);
    const fakie = pl.isFakie();
    p.headYaw = fakie ? -0.9 : 0.75;
    const steer = (inp.left ? 1 : 0) - (inp.right ? 1 : 0);
    const squash = pl.landSquash;
    let boardT = M4ident();   // trick transform applied to the board in rider space
    let boardOff = v3(0, 0, 0);
    if (pl.state === ST_RIDE || pl.state === ST_MANUAL) {
        const crouch = pl.crouching ? smooth01(pl.crouchT / 0.3) : 0;
        p.pelvis.y = 0.86 - crouch * 0.26 - squash * 0.2 - (pl.braking ? 0.08 : 0);
        p.lean = 0.15 + crouch * 0.25 - steer * 0.22 * sat(speed / 6);
        p.side = 0;
        if (crouch > 0) { p.handL = v3(-0.25, 0.45, 0.32); p.handR = v3(-0.2, 0.42, -0.3); }
        if (pl.braking) {   // heel drag / powerslide stance
            p.footR = v3(0.05, 0.0, -0.28);
            p.lean = -0.05;
            boardT = mRotY(0.25);
        }
        if (pl.pushing || pl.pushPhase > 0) {
            const ph = pl.pushPhase % 1;
            const gy = -0.1;
            const onBoard = v3(0.02, 0, -0.25);
            const plant = v3(-0.16, gy, 0.12), pushEnd = v3(-0.16, gy, -0.6);
            let fp;
            if (ph < 0.25) fp = add(lerp3(onBoard, plant, smooth01(ph / 0.25)), v3(0, Math.sin(ph / 0.25 * PI) * 0.08, 0));
            else if (ph < 0.65) fp = lerp3(plant, pushEnd, (ph - 0.25) / 0.4);
            else fp = add(lerp3(pushEnd, onBoard, smooth01((ph - 0.65) / 0.35)), v3(0, Math.sin((ph - 0.65) / 0.35 * PI) * 0.12, 0));
            p.footR = fp;
            p.footYawL = 1.35;
            p.footYawR = 1.2;
            p.twist = 1.1;
            p.headYaw = 0.35;
            p.pelvis = v3(0.0, 0.8, 0.1);
            p.lean = 0.3;
            p.handL = v3(-0.1, 0.62, 0.5);
            p.handR = v3(0.15, 0.62, -0.3);
        }
        if (pl.state === ST_MANUAL) {
            const a = pl.nose ? 0.2 : -0.2;
            const pivot = pl.nose ? 0.22 : -0.22;
            boardT = mm(mTranslate(v3(0, 0, pivot)), mRotX(a), mTranslate(v3(0, 0, -pivot)));
            if (!pl.nose) { p.footL = v3(0, 0.09, 0.24); p.footR = v3(0.02, 0.0, -0.24); }
            else { p.footL = v3(0, 0.0, 0.24); p.footR = v3(0.02, 0.09, -0.24); }
            p.pelvis = v3(0.04, 0.8, pl.nose ? 0.1 : -0.1);
            p.side = (pl.nose ? 0.15 : -0.15) + pl.bal * 0.25;
            p.handL = v3(0.0, 0.95, 0.65);
            p.handR = v3(0.05, 0.9, -0.65);
        }
    } else if (pl.state === ST_AIR) {
        const t = pl.airT;
        const tuck = smooth01(t / 0.18) * (1 - smooth01((-pl.vel.y - 3.5) / 3) * 0.6);
        p.pelvis.y = 0.86 - tuck * 0.22;
        p.lean = 0.25;
        p.handL = v3(-0.1, 0.95, 0.55);
        p.handR = v3(0.05, 0.9, -0.55);
        p.elbowHintL = v3(0.2, -0.5, 0.6);
        p.elbowHintR = v3(0.2, -0.5, -0.6);
        if (pl.flipIdx >= 0) {
            const fd = FLIPS[pl.flipIdx];
            const u = sat(pl.flipT / pl.flipDur);
            const e = u * u * (3 - 2 * u);
            const turns = 1 + pl.flipExtra;
            const fl = fd.flip * turns * TAU * e, sh = fd.shove * TAU * e * (1 + pl.flipExtra * 0.0), im = fd.imp * turns * TAU * e;
            boardOff = v3(0, 0.12 * Math.sin(u * PI) - 0.05, 0);
            boardT = mm(mTranslate(v3(0, -0.04, 0)), mRotY(sh), mRotZ(fl), mRotX(im), mTranslate(v3(0, 0.04, 0)));
            const lift2 = Math.sin(u * PI) * 0.22;
            p.footL.y += lift2; p.footR.y += lift2 * 0.9;
            p.footL.x -= lift2 * 0.3;
        }
        if (pl.grabIdx >= 0) {
            const g = smooth01(pl.grabBlend);
            p.pelvis.y = 0.86 - 0.3 * g;
            p.lean = 0.25 + 0.25 * g;
            boardOff = v3(0, 0.2 * g, 0);
            let target = v3();
            let front = true;
            switch (pl.grabIdx) {
                case 0: target = v3(-0.1, 0, -0.04); front = false; break;                      // indy: toe edge, back hand
                case 1: target = v3(0.1, 0, 0.05); break;                                         // melon: heel edge, front hand
                case 2: target = v3(0.1, 0, 0.04); boardT = mmul(mTranslate(v3(0.18 * g, 0.1 * g, 0)), mRotZ(-0.6 * g)); break;  // method
                case 3: target = v3(0, 0, 0.4); break;                                            // nosegrab
                case 4: target = v3(0, 0, -0.4); front = false; break;                            // tailgrab
                case 5: target = v3(0, 0, 0.38); p.footR = v3(0.25, -0.35 * g, -0.45); break;    // madonna
                case 6: target = v3(0, 0, -0.38); front = false; p.footR = v3(-0.15, -0.4 * g, -0.5); break;  // benihana
                case 7: target = v3(0.1, 0, -0.14); front = false; break;                         // stalefish
                case 8: target = v3(0.1, 0, 0.08); boardT = mRotX(0.4 * g); break;                // crossbone
            }
            const tw = add(xPoint(mmul(mTranslate(boardOff), boardT), target), v3(0, 0.02, 0));
            if (front) { p.handL = lerp3(p.handL, tw, g); p.elbowHintL = v3(-0.3, 0.2, 0.5); }
            else { p.handR = lerp3(p.handR, tw, g); p.elbowHintR = v3(-0.3, 0.2, -0.5); }
            if (pl.grabIdx !== 5 && pl.grabIdx !== 6) { p.footL.y += boardOff.y; p.footR.y += boardOff.y; }
            else p.footL.y += boardOff.y;
        }
        if (pl.qpAir) p.headYaw = 0.2;
    } else if (pl.state === ST_GRIND) {
        const gd = GRINDS[pl.grindIdx];
        const pv = gd.pitch > 0 ? -0.22 : (gd.pitch < 0 ? 0.22 : 0);   // pivot on the grinding truck
        boardT = mm(mTranslate(v3(0, 0, pv)), mRotX(-gd.pitch), mRotZ(gd.roll), mTranslate(v3(0, 0, -pv)));
        p.pelvis = v3(0.02, 0.8, 0);
        p.lean = 0.12;
        p.side = pl.bal * 0.35;
        p.handL = v3(-0.05, 1.0, 0.72);
        p.handR = v3(0.08, 0.95, -0.72);
        p.elbowHintL = v3(0.1, -0.6, 0.3);
        p.elbowHintR = v3(0.1, -0.6, -0.3);
        if (gd.slide) { p.twist = 0.9; p.headYaw = 0.5; }
        if (gd.pitch !== 0) {
            const pd = 0.3 * Math.sin(gd.pitch);
            p.footL.y = -pd; p.footR.y = pd;
        }
    }
    const B = mm(R, mTranslate(boardOff), boardT);
    drawBoard(mb, B);
    drawHuman(mb, R, p, PLAYER_OUTFIT);
}


// ----------------------------------------------------------------------------
// Living city: pedestrians, pigeons, traffic, signals, collectible letters
// ----------------------------------------------------------------------------
let bubbles = [];   // { pos, text, t }
function speech(p, s) {
    for (const b of bubbles) if (len(sub(b.pos, p)) < 0.5) { b.text = s; b.t = 2.2; return; }
    bubbles.push({ pos: p, text: s, t: 2.2 });
}

let pathInfo = [];   // { cum: [], total }
function preparePaths() {
    pathInfo = [];
    for (const np of npcPaths) {
        const pi = { cum: [0], total: 0 };
        const n = np.pts.length;
        const segs = np.loop ? n : n - 1;
        for (let i = 0; i < segs; i++) {
            const a = np.pts[i], b = np.pts[(i + 1) % n];
            pi.total += lenXZ(sub(b, a));
            pi.cum.push(pi.total);
        }
        pathInfo.push(pi);
    }
}
// writes the position (and, when dOut is given, the walking direction) at arc length s
function pathSample(path, s, pOut, dOut) {
    const np = npcPaths[path];
    const pi = pathInfo[path];
    const n = np.pts.length;
    const segs = pi.cum.length - 1;
    let i = 0;
    while (i + 1 < segs && pi.cum[i + 1] < s) i++;
    const a = np.pts[i], b = np.pts[(i + 1) % n];
    const L = Math.max(1e-3, pi.cum[i + 1] - pi.cum[i]);
    const t = clampf((s - pi.cum[i]) / L, 0, 1);
    pOut.x = a.x + (b.x - a.x) * t; pOut.y = a.y + (b.y - a.y) * t; pOut.z = a.z + (b.z - a.z) * t;
    if (dOut) dOut.set(norm(v3(b.x - a.x, 0, b.z - a.z)));
}

class Npc {
    constructor() {
        this.path = 0; this.dir = 1;
        this.s = 0; this.speed = 1.3; this.lateral = 0; this.targetLat = 0; this.phase = 0;
        this.pos = v3();
        this.yaw = 0;
        this.outfit = new Outfit();
        this.knocked = 0; this.cheerCool = 0; this.dodgeCool = 0;
    }
}
const npcs = [];

function initNpcs() {
    preparePaths();
    const r = new Rng(9001);
    const skins = [0xf1c7a5, 0xd9a47a, 0xc68a5a, 0x9c6a42, 0x6e4a2e, 0x4a3020];
    const shirts = [0x2f5d9e, 0xd8d4c8, 0x8e2a2a, 0x2e6b3a, 0xe0b030, 0x111111, 0x6a4a8a, 0xe07a30, 0x607080, 0xf0f0f0];
    const pants = [0x1f2a44, 0x222222, 0x5a4a3a, 0x6a6a6a, 0x2a3a5a, 0xb0a080];
    for (let p = 0; p < npcPaths.length; p++) {
        let count = Math.max(1, Math.trunc(pathInfo[p].total / 22));
        count = Math.min(count, 4);
        for (let k = 0; k < count; k++) {
            const n = new Npc();
            n.path = p;
            n.s = r.range(0, pathInfo[p].total);
            n.dir = r.chance(0.5) ? 1 : -1;
            n.speed = r.range(1.0, 1.6);
            n.lateral = n.targetLat = r.range(-0.3, 0.3);
            n.phase = r.range(0, TAU);
            const o = n.outfit;
            o.skin = hexc(skins[r.irange(0, 5)]);
            o.shirt = hexc(shirts[r.irange(0, 9)]);
            o.pants = hexc(pants[r.irange(0, 5)]);
            o.shoes = r.chance(0.5) ? hexc(0x1a1a1a) : hexc(0xdedad0);
            o.hat_ = r.chance(0.35) ? (r.chance(0.5) ? 1 : 3) : 0;
            o.hat = r.chance(0.5) ? hexc(0x1c2a4a) : hexc(0x8a1a1a);
            o.hair = r.chance(0.5) ? hexc(0x1a120c) : hexc(0x6a4a2a);
            o.height = r.range(0.9, 1.07);
            o.bag = r.chance(0.35);
            o.bagCol = r.chance(0.5) ? hexc(0x3a2a1a) : hexc(0x1a1a1a);
            o.longSleeves = r.chance(0.5);
            o.baggy = r.chance(0.3);
            npcs.push(n);
        }
    }
}

const CHEERS = ["NICE!", "SICK!", "WHOA!", "YO! DO THAT AGAIN!", "THAT WAS DOPE!", "RESPECT!"];
const ANGRY = ["HEY! I'M WALKIN' HERE!", "WATCH IT, KID!", "GET OFF THE SIDEWALK!", "OW! MY COFFEE!"];

const npcRng = new Rng(4242);
let lastScoreSeen = 0;
function updateNpcs(dt, pl) {
    const r = npcRng;
    let cheerEvent = false;
    if (pl.score !== lastScoreSeen) { cheerEvent = pl.score - lastScoreSeen >= 800; lastScoreSeen = pl.score; }
    if (cheerEvent) {   // the closest onlooker always reacts to a big line
        let best = null;
        let bd = 18;
        for (const n of npcs)
            if (n.knocked <= 0 && n.cheerCool <= 0 && len(sub(n.pos, pl.pos)) < bd) { bd = len(sub(n.pos, pl.pos)); best = n; }
        if (best) { speech(add(best.pos, v3(0, 2.1, 0)), CHEERS[r.irange(0, 5)]); best.cheerCool = 6; }
    }
    const p = v3(), d = v3();
    for (const n of npcs) {
        n.cheerCool = Math.max(0, n.cheerCool - dt);
        n.dodgeCool = Math.max(0, n.dodgeCool - dt);
        if (n.knocked > 0) { n.knocked -= dt; continue; }
        const pi = pathInfo[n.path];
        const loop = npcPaths[n.path].loop;
        n.s += n.dir * n.speed * dt;
        if (loop) { if (n.s > pi.total) n.s -= pi.total; if (n.s < 0) n.s += pi.total; }
        else if (n.s > pi.total) { n.s = pi.total; n.dir = -1; }
        else if (n.s < 0) { n.s = 0; n.dir = 1; }
        pathSample(n.path, n.s, p, d);
        const wd = mul(d, n.dir);
        const perp = cross(v3(0, 1, 0), wd);
        n.lateral = damp(n.lateral, n.targetLat, 3, dt);
        const np = addm(p, perp, n.lateral);
        np.y = world.ground(np.x, np.z, p.y + 0.4).h;
        n.pos = np;
        const ty = yawOf(wd);
        n.yaw = n.yaw + wrapPi(ty - n.yaw) * Math.min(1, dt * 6);
        n.phase += n.speed * dt * 4.2;
        // dodge a skater that is about to run us over
        if (pl.state !== ST_BAIL && n.dodgeCool <= 0) {
            const rel = sub(n.pos, pl.pos);
            const pv = v3(pl.vel.x, 0, pl.vel.z);
            const sp = len(pv);
            if (sp > 3 && Math.abs(rel.y) < 1.2) {
                const tca = dot(v3(rel.x, 0, rel.z), pv) / (sp * sp);
                if (tca > 0 && tca < 0.7) {
                    const closest = addm(v3(pl.pos.x, 0, pl.pos.z), pv, tca);
                    const miss = sub(v3(n.pos.x, 0, n.pos.z), closest);
                    if (len(miss) < 0.9) {
                        const sideSign = dot(miss, perp) >= 0 ? 1 : -1;
                        n.targetLat = clampf(n.lateral + sideSign * 1.3, -1.8, 1.8);
                        n.dodgeCool = 1.2;
                        if (r.chance(0.3)) speech(add(n.pos, v3(0, 2.1, 0)), "WHOA!");
                    }
                }
            }
        }
        if (n.dodgeCool <= 0 && Math.abs(n.targetLat) > 0.6) n.targetLat *= 0.5;
        // collisions with the skater
        if (pl.state !== ST_BAIL) {
            const rel = sub(pl.pos, n.pos);
            const dh = Math.sqrt(rel.x * rel.x + rel.z * rel.z);
            if (dh < 0.55 && rel.y > -0.5 && rel.y < 1.5) {

// ---------------------------------------------------------------- traffic
const LANES = [{ z: -2.1, dir: 1, hasLight: true }, { z: 2.1, dir: 1, hasLight: true }, { z: -71.0, dir: -1, hasLight: false }, { z: -66.4, dir: 1, hasLight: false }];
class Car { constructor() { this.lane = 0; this.x = 0; this.speed = 0; this.target = 0; this.type = 0; this.col = new Col(); this.honk = 0; this.brake = 0; } }
// A point inside a traffic lane moved onto the nearer sidewalk of that street
function awayFromTraffic(p) {
    p = p.clone();
    for (const L of LANES) {
        if (Math.abs(p.z - L.z) > 1.6) continue;
        const z0 = Math.abs(L.z) < 7 ? -7 : -74, z1 = Math.abs(L.z) < 7 ? 7 : -62;   // the street's kerbs
        p.z = (p.z - z0 < z1 - p.z) ? z0 - 0.8 : z1 + 0.8;
        p.y = SH;

}
const cars = [];
let tlTimer = 0;
function ewPhase() {   // 0 green, 1 yellow, 2 red for east-west traffic
    const t = tlTimer % 32;
    if (t < 13) return 0;
    if (t < 16) return 1;
    return 2;
}
function nsPhase() {
    const t = tlTimer % 32;
    if (t >= 17 && t < 29) return 0;
    if (t >= 29 && t < 31) return 1;
    return 2;
}
function initTraffic() {
    const r = new Rng(555);
    const cols = [hexc(0xf2c318), hexc(0xf2c318), hexc(0xf2c318), hexc(0x1b1b1d), hexc(0x7a1f22), hexc(0x9ca3a8), hexc(0x274a78), hexc(0xd8d4c8)];
    for (let l = 0; l < 4; l++)
        for (let k = 0; k < 3; k++) {
            const c = new Car();
            c.lane = l;
            c.x = -120 + k * 80 + r.range(-10, 10);
            c.speed = c.target = r.range(8, 11);
            c.col = cols[r.irange(0, 7)];
            c.type = c.col.r === 0xf2 ? 0 : r.irange(1, 3);
            cars.push(c);
        }
}
function updateTraffic(dt, pl) {
    tlTimer += dt;
    for (const c of cars) {
        const L = LANES[c.lane];
        let want = c.target;
        // car ahead
        for (const o of cars) {
            if (o === c || o.lane !== c.lane) continue;
            const gap = (o.x - c.x) * L.dir;
            if (gap > 0 && gap < 9) want = Math.min(want, Math.max(0, (gap - 5.5) * 1.5));
        }
        // red light (stop line west of the intersection for eastbound traffic)
        if (L.hasLight && ewPhase() !== 0) {
            const stopX = -14.5;
            const gap = (stopX - c.x) * L.dir;
            if (gap > 0 && gap < 22 && (ewPhase() === 2 || gap > 6)) want = Math.min(want, Math.max(0, (gap - 0.5) * 0.9));
        }
        // the skater in the lane ahead
        if (pl.state !== ST_BAIL && pl.pos.y < 1.2 && Math.abs(pl.pos.z - L.z) < 1.9) {
            const gap = (pl.pos.x - c.x) * L.dir;
            if (gap > 0 && gap < 11) {
                want = Math.min(want, Math.max(0, (gap - 3.4) * 1.4));
                if (c.honk <= 0 && Math.abs(pl.pos.x - c.x) < 11) { sfx(SFX_HONK, 0.8, c.type === 0 ? 1.1 : 0.9); c.honk = 2.5; }
            }
        }
        c.honk = Math.max(0, c.honk - dt);
        const acc = want > c.speed ? 3 : 9;
        c.brake = want < c.speed - 0.2 ? 1 : 0;
        c.speed = approach(c.speed, want, acc * dt);
        c.x += c.speed * L.dir * dt;
        if (c.x * L.dir > 140) c.x = -140 * L.dir;
        // hit the skater?
        if (pl.state !== ST_BAIL && pl.pos.y < 1.6) {
            const dx = Math.abs(pl.pos.x - c.x), dz = Math.abs(pl.pos.z - L.z);
            if (dx < 2.6 && dz < 1.2 && c.speed > 2) {
                pl.vel = add(pl.vel, v3(L.dir * c.speed * 0.6, 2, 0));
                pl.bail(c.type === 0 ? "HIT BY A CAB!" : "HIT BY A CAR!");
                sfx(SFX_HONK, 1);
            } else if (dx < 2.5 && dz < 1.1) {
                pl.pos = v3(pl.pos.x, pl.pos.y, L.z + (pl.pos.z > L.z ? 1.25 : -1.25));
            }
        }
    }
}
function drawTraffic(mb, cam) {
    for (const c of cars) {

function updateParticles(dt, cam) {
    // emitters near the camera
    for (const e of emitters) {
        if (len(sub(e.pos, cam)) > 75) continue;
        e.acc += e.rate * dt;
        while (e.acc >= 1) {
            e.acc -= 1;
            const q = new Particle();
            q.water = true;
            switch (e.kind) {
                case EM_FOUNTAIN: {
                    const a = prng.range(0, TAU), r = prng.range(0, 0.55);
                    q.p = e.pos.clone();
                    q.v = v3(Math.sin(a) * r, prng.range(5.2, 6.4), Math.cos(a) * r);
                    q.life = q.maxLife = 2.2;
                    q.size = prng.range(0.05, 0.09); q.grav = 9.8;
                    q.r = 0.82; q.g = 0.92; q.b = 1; q.a = 0.55;
                    break;
                }
                case EM_POOLSPLASH: {
                    const a = prng.range(0, TAU);
                    const o = v3(Math.sin(a), 0, Math.cos(a));
                    q.p = addm(e.pos, o, 1.9);
                    const hs = prng.range(0.3, 0.9), vs = prng.range(-0.5, 0.2);
                    q.v = add(mul(o, hs), v3(0, vs, 0));
                    q.life = q.maxLife = 1.2;
                    q.size = prng.range(0.04, 0.07); q.grav = 9.8;
                    q.r = 0.8; q.g = 0.9; q.b = 1; q.a = 0.5;
                    break;

                    q.p = e.pos.clone();
                    const f = prng.range(8, 11), u = prng.range(1.6, 3.2), s = prng.range(-1.1, 1.1);
                    q.v = add(add(mul(e.dir, f), v3(0, u, 0)), mul(side, s));
                    q.life = q.maxLife = 1.6;
                    q.size = prng.range(0.05, 0.11); q.grav = 9.8; q.drag = 0.4;
                    q.r = 0.85; q.g = 0.93; q.b = 1; q.a = 0.6;
                    if (prng.chance(0.15)) { q.size = 0.35; q.grow = 0.8; q.a = 0.12; q.water = false; q.grav = 2; q.drag = 1.5; }
                    break;
                }
                case EM_STEAM: {
                    const ox = prng.range(-0.3, 0.3), oz = prng.range(-0.3, 0.3);
                    q.p = add(e.pos, v3(ox, 0, oz));
                    const vx = prng.range(-0.2, 0.2) + 0.25, vy = prng.range(0.7, 1.3), vz = prng.range(-0.2, 0.2) + 0.1;
                    q.v = v3(vx, vy, vz);
                    q.life = q.maxLife = prng.range(2.5, 3.5);
                    q.size = 0.35; q.grow = 0.55; q.grav = -0.1; q.drag = 0.3;
                    q.r = q.g = q.b = 0.92; q.a = 0.2;
