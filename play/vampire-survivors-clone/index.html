// --- Enhanced Game Over Screen ---
function drawGameOver(ctx, spawner) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
    ctx.fillRect(0, 0, BASE_WIDTH, BASE_HEIGHT);

    const cx = BASE_WIDTH / 2;

    // Title
    ctx.textAlign = 'center';
    ctx.fillStyle = '#f44336';
    ctx.font = 'bold 52px monospace';
    ctx.fillText('GAME OVER', cx, BASE_HEIGHT / 2 - 120);

    // Divider line
    ctx.strokeStyle = 'rgba(244, 67, 54, 0.4)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx - 180, BASE_HEIGHT / 2 - 95);
    ctx.lineTo(cx + 180, BASE_HEIGHT / 2 - 95);
    ctx.stroke();

    // Stats panel background
    const panelW = 400, panelH = 140;
    const panelX = cx - panelW / 2, panelY = BASE_HEIGHT / 2 - 80;
    ctx.fillStyle = 'rgba(20, 20, 40, 0.8)';
    ctx.fillRect(panelX, panelY, panelW, panelH);
    ctx.strokeStyle = '#444';
    ctx.lineWidth = 1;
    ctx.strokeRect(panelX, panelY, panelW, panelH);

    // Stats
    const statsX = cx;
    const statsStartY = panelY + 30;
    const statsGap = 30;

    const stats = [
        { label: 'Survival Time', value: formatTime(spawner.elapsedTime), color: '#ffd54f' },
        { label: 'Wave Reached', value: `Wave ${spawner.waveNumber + 1}`, color: '#ff9800' },
        { label: 'Enemies Slain', value: `${game.killCount}`, color: '#ef5350' },
        { label: 'Level Reached', value: `Lv ${player.level}`, color: '#7c4dff' },
    ];

    for (let i = 0; i < stats.length; i++) {
        const sy = statsStartY + i * statsGap;
        ctx.font = uiFont(14) + 'px monospace';
        ctx.fillStyle = '#888';
        ctx.textAlign = 'right';
        ctx.fillText(stats[i].label + ':', statsX - 15, sy);
        ctx.font = 'bold 16px monospace';
        ctx.fillStyle = stats[i].color;
        ctx.textAlign = 'left';
        ctx.fillText(stats[i].value, statsX + 15, sy);
    }

    // Equipped weapons summary
    const weaponIcons = [];
    if (weapons) {
        for (const [id, weapon] of Object.entries(weapons)) {
            if (weapon.level > 0) {
                weaponIcons.push({ icon: SKILL_DEFS[id].icon, name: SKILL_DEFS[id].name, level: weapon.level, color: SKILL_DEFS[id].color });
            }
        }
    }
    if (weaponIcons.length > 0) {
        const wepY = panelY + panelH + 20;
        ctx.textAlign = 'center';
        ctx.fillStyle = '#666';
        ctx.font = uiFont(12) + 'px monospace';
        ctx.fillText('Equipped Skills', cx, wepY);

        const wepGap = 70;
        const wepStart = cx - ((weaponIcons.length - 1) * wepGap) / 2;
        for (let i = 0; i < weaponIcons.length; i++) {
            const wx = wepStart + i * wepGap;
            ctx.font = '24px serif';
            ctx.fillText(weaponIcons[i].icon, wx, wepY + 28);
            ctx.font = uiFont(10) + 'px monospace';
            ctx.fillStyle = weaponIcons[i].color;
            ctx.fillText(`Lv${weaponIcons[i].level}`, wx, wepY + 44);
            ctx.fillStyle = '#666';
        }
    }

    // Buttons
    const btnW = 200, btnH = 50;
    const btnGap = 30;

    // Restart button
    const rBtnX = cx - btnW - btnGap / 2, rBtnY = gameOverButtonsY();
    const isRestartHovered = game._mouseX >= rBtnX && game._mouseX <= rBtnX + btnW &&
                             game._mouseY >= rBtnY && game._mouseY <= rBtnY + btnH;
    ctx.fillStyle = isRestartHovered ? 'rgba(76, 175, 80, 0.3)' : 'rgba(76, 175, 80, 0.12)';
    ctx.fillRect(rBtnX, rBtnY, btnW, btnH);
    ctx.strokeStyle = isRestartHovered ? '#4caf50' : 'rgba(76, 175, 80, 0.6)';
    ctx.lineWidth = 2;
    ctx.strokeRect(rBtnX, rBtnY, btnW, btnH);
    ctx.textAlign = 'center';
    ctx.fillStyle = isRestartHovered ? '#fff' : '#4caf50';
    ctx.font = 'bold 18px monospace';
    ctx.fillText(touchUI() ? 'RESTART' : 'RESTART (R)', rBtnX + btnW / 2, rBtnY + 31);

    // Title screen button
    const tBtnX = cx + btnGap / 2, tBtnY = rBtnY;
    const isTitleHovered = game._mouseX >= tBtnX && game._mouseX <= tBtnX + btnW &&
                           game._mouseY >= tBtnY && game._mouseY <= tBtnY + btnH;
    ctx.fillStyle = isTitleHovered ? 'rgba(158, 158, 158, 0.3)' : 'rgba(158, 158, 158, 0.12)';
    ctx.fillRect(tBtnX, tBtnY, btnW, btnH);
    ctx.strokeStyle = isTitleHovered ? '#9e9e9e' : 'rgba(158, 158, 158, 0.6)';
    ctx.lineWidth = 2;
    ctx.strokeRect(tBtnX, tBtnY, btnW, btnH);
    ctx.fillStyle = isTitleHovered ? '#fff' : '#9e9e9e';
    ctx.font = 'bold 18px monospace';
    ctx.fillText(touchUI() ? 'TITLE' : 'TITLE (ESC)', tBtnX + btnW / 2, tBtnY + 31);

    ctx.textAlign = 'left';
}

// --- FPS Counter ---
let fpsValues = [];
function drawFPS(ctx, fps) {
    fpsValues.push(fps);
    if (fpsValues.length > 60) fpsValues.shift();
    const avg = Math.round(fpsValues.reduce((a, b) => a + b, 0) / fpsValues.length);
    const fx = BASE_WIDTH - safeArea.right, fy = BASE_HEIGHT - safeArea.bottom;
    ctx.font = uiFont(12) + 'px monospace';
    const fw = Math.max(65, ctx.measureText(`FPS: ${avg}`).width + 12);
    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
    ctx.fillRect(fx - 5 - fw, fy - 27, fw, 22);
    ctx.fillStyle = '#0f0'; ctx.textAlign = 'right';
    ctx.fillText(`FPS: ${avg}`, fx - 10, fy - 10);
    ctx.textAlign = 'left';
}

// =============================================================================
// Game State
// =============================================================================

const camera = new Camera();
const screenShake = new ScreenShake();
let player, weapons, enemies, xpGems, spawner, upgradeSystem;
let particles = [];      // Phase 5: death particles
let damageNumbers = [];  // Phase 5: floating damage numbers
let waveNotifyTimer = 0;

const game = {
    state: GameState.TITLE,
    killCount: 0,
    titleAnimTimer: 0,   // For animated title screen
    titleBgParticles: [], // Background particles for title screen
    _mouseX: 0,          // Mouse position for hover effects
    _mouseY: 0,
};

function initGame() {
    AudioSystem.init(); // Phase 7: init audio on first game start
    player = new Player(0, 0);
    weapons = {
        orbit: new OrbitWeapon(player),
        forwardShot: new ForwardShotWeapon(player),
        areaBurst: new AreaBurstWeapon(player),
        speedBuff: new SpeedBuffSkill(player),
    };
    enemies = [];
    xpGems = [];
    particles = [];
    damageNumbers = [];
    spawner = new WaveSpawner();
    upgradeSystem = new UpgradeSystem();
    game.state = GameState.PLAYING;
    game.killCount = 0;
    waveNotifyTimer = 0;
    screenShake.intensity = 0;
    screenShake.timer = 0;
}

/** Initialize title screen background particles */
function initTitleParticles() {
    game.titleBgParticles = [];
    for (let i = 0; i < 50; i++) {
        game.titleBgParticles.push({
            x: Math.random() * BASE_WIDTH,
            y: Math.random() * BASE_HEIGHT,
            radius: 1 + Math.random() * 3,
            speed: 10 + Math.random() * 30,
            alpha: 0.2 + Math.random() * 0.5,
            color: ['#ffd54f', '#42a5f5', '#ef5350', '#69f0ae', '#ab47bc'][Math.floor(Math.random() * 5)],
        });
    }
}

// Initialize in title state (don't call initGame yet)
initTitleParticles();

// --- Input ---
window.addEventListener('keydown', (e) => {
    // --- Title Screen ---
    if (game.state === GameState.TITLE) {
        if (e.code === 'Enter' || e.code === 'Space') {
            initGame();
        }
        return;
    }

    // --- Game Over ---
    if (game.state === GameState.GAMEOVER) {
        if (e.code === 'KeyR') { initGame(); }
        if (e.code === 'Escape') { game.state = GameState.TITLE; initTitleParticles(); }
        return;
    }

    // --- Mute toggle ---
    if (e.code === 'KeyM') {
        AudioSystem.toggle();
        return;
    }

    // --- Pause toggle ---
    if (e.code === 'Escape' || e.code === 'KeyP') {
        if (game.state === GameState.PLAYING && !upgradeSystem.isShowingPopup) {
            game.state = GameState.PAUSED;
            return;
        }
        if (game.state === GameState.PAUSED) {
            game.state = GameState.PLAYING;
            return;
        }
    }

    // --- Upgrade popup input ---
    if (upgradeSystem.isShowingPopup && game.state === GameState.PLAYING) {
        if (e.code === 'Digit1' && upgradeSystem.choices.length >= 1) upgradeSystem.applyChoice(0, weapons);
        else if (e.code === 'Digit2' && upgradeSystem.choices.length >= 2) upgradeSystem.applyChoice(1, weapons);
        else if (e.code === 'Digit3' && upgradeSystem.choices.length >= 3) upgradeSystem.applyChoice(2, weapons);
        else if (e.code === 'ArrowLeft' || e.code === 'KeyA') upgradeSystem.selectedIndex = Math.max(0, upgradeSystem.selectedIndex - 1);
        else if (e.code === 'ArrowRight' || e.code === 'KeyD') upgradeSystem.selectedIndex = Math.min(upgradeSystem.choices.length - 1, upgradeSystem.selectedIndex + 1);
        else if (e.code === 'Enter' || e.code === 'Space') upgradeSystem.applyChoice(upgradeSystem.selectedIndex, weapons);
    }
});

canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (BASE_WIDTH / rect.width);
    const my = (e.clientY - rect.top) * (BASE_HEIGHT / rect.height);

    if (upgradeSystem && upgradeSystem.isShowingPopup) {
        upgradeSystem.hoveredIndex = upgradeSystem.getCardAt(mx, my);
    }

    // Track hover for title screen button and game over buttons
    game._mouseX = mx;
    game._mouseY = my;
});

canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (BASE_WIDTH / rect.width);
    const my = (e.clientY - rect.top) * (BASE_HEIGHT / rect.height);

    // Title screen click
    if (game.state === GameState.TITLE) {
        // Check if Start button is clicked
        const btnW = 220, btnH = 55;
        const btnX = BASE_WIDTH / 2 - btnW / 2, btnY = titleStartButtonY();
        if (mx >= btnX && mx <= btnX + btnW && my >= btnY && my <= btnY + btnH) {
            initGame();
        }
        return;
    }

    // Pause screen — resume button
    if (game.state === GameState.PAUSED) {
        const btnW = 200, btnH = 50;
        const btnX = BASE_WIDTH / 2 - btnW / 2, btnY = BASE_HEIGHT / 2 + 20;
        if (mx >= btnX && mx <= btnX + btnW && my >= btnY && my <= btnY + btnH) {
            game.state = GameState.PLAYING;
        }
        // Quit button
        const qBtnY = btnY + 70;
        if (mx >= btnX && mx <= btnX + btnW && my >= qBtnY && my <= qBtnY + btnH) {
            game.state = GameState.TITLE;
            initTitleParticles();
        }
        return;
    }

    // Game Over — Restart / Title buttons
    if (game.state === GameState.GAMEOVER) {
        const btnW = 200, btnH = 50;
        const centerX = BASE_WIDTH / 2;
        // Restart button
        const rBtnX = centerX - btnW - 15, rBtnY = gameOverButtonsY();
        if (mx >= rBtnX && mx <= rBtnX + btnW && my >= rBtnY && my <= rBtnY + btnH) {
            initGame();
        }
        // Title button
        const tBtnX = centerX + 15, tBtnY = gameOverButtonsY();
        if (mx >= tBtnX && mx <= tBtnX + btnW && my >= tBtnY && my <= tBtnY + btnH) {
            game.state = GameState.TITLE;
            initTitleParticles();
        }
        return;
    }

    // Upgrade popup click
    if (upgradeSystem && upgradeSystem.isShowingPopup) {
        const idx = upgradeSystem.getCardAt(mx, my);
        if (idx >= 0) upgradeSystem.applyChoice(idx, weapons);
    }
});

// =============================================================================
// Main Game Loop
// =============================================================================

let lastTime = 0;

function gameLoop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;

    // Draw in game units (desktop: 1:1 as before; mobile: canvas pixels per unit)
    ctx.setTransform(pixelScale, 0, 0, pixelScale, 0, 0);
    syncTouchKit();

    // =====================================================================
    // TITLE SCREEN
    // =====================================================================
    if (game.state === GameState.TITLE) {
        drawTitleScreen(ctx, dt);
        if (dt > 0) drawFPS(ctx, Math.round(1 / dt));
        requestAnimationFrame(gameLoop);
        return;
    }

    // =====================================================================
    // PLAYING / PAUSED / GAMEOVER — need game objects
    // =====================================================================
    const isUpgrading = upgradeSystem.isShowingPopup;
    const isPaused = game.state === GameState.PAUSED;
    const isGameOver = game.state === GameState.GAMEOVER;
    const canUpdate = !isGameOver && !isPaused && !isUpgrading;

    // Phase 5: Always update visual effects even when paused (for smooth rendering)
    screenShake.update(dt);

    // Update particles & damage numbers even when paused for smooth fade-out
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update(dt);
        if (particles[i].lifetime <= 0) particles.splice(i, 1);
    }
    for (let i = damageNumbers.length - 1; i >= 0; i--) {
        damageNumbers[i].update(dt);
        if (damageNumbers[i].lifetime <= 0) damageNumbers.splice(i, 1);
    }

    if (canUpdate) {
        // --- UPDATE ---
        player.update(dt);
        weapons.orbit.update(dt);
        weapons.forwardShot.update(dt, enemies);
        weapons.areaBurst.update(dt, enemies);
        weapons.speedBuff.update(dt);

        spawner.update(dt, player.x, player.y, enemies);

        if (spawner.waveChangedFlag) {
            waveNotifyTimer = 2.5;
            spawner.waveChangedFlag = false;
        }
        if (waveNotifyTimer > 0) waveNotifyTimer -= dt;

        // Update enemies + collision
        for (let i = enemies.length - 1; i >= 0; i--) {
            const enemy = enemies[i];
            enemy.update(dt, player.x, player.y);

            // Contact damage
            if (circleCollision(player.x, player.y, player.radius, enemy.x, enemy.y, enemy.radius)) {
                if (player.takeDamage(enemy.damage)) {
                    game.state = GameState.GAMEOVER;
                    AudioSystem.gameOver();
                }
            }

            let killed = false;

            // Orbit weapon hits
            if (weapons.orbit.checkHit(enemy)) {
                killed = enemy.takeDamage(weapons.orbit.damage);
                // Phase 5: damage number
                damageNumbers.push(new DamageNumber(enemy.x, enemy.y - enemy.radius, weapons.orbit.damage, '#ffd54f'));
            }

            // Forward shot hits
            if (!killed) {
                const fsDmg = weapons.forwardShot.checkHits(enemy);
                if (fsDmg > 0) {
                    killed = enemy.takeDamage(fsDmg);
                    damageNumbers.push(new DamageNumber(enemy.x, enemy.y - enemy.radius, fsDmg, '#42a5f5'));
                }
            }

            // Area burst already handles damage numbers in burst()
            if (enemy.hp <= 0) killed = true;

            if (killed) {
                // Phase 5: death particles!
                const isBoss = enemy.type === 'Boss';
                const particleCount = isBoss ? 30 : enemy.type === 'Tank' ? 16 : enemy.type === 'Dasher' ? 10 : 12;
                spawnDeathParticles(enemy.x, enemy.y, enemy.color, particleCount);

                // Phase 5/7: screen shake on kill (bigger for tanks/bosses)
                if (isBoss) {
                    screenShake.trigger(12, 0.4);
                    AudioSystem.bossDeath();
                    // Boss drops extra XP gems in a burst
                    for (let g = 0; g < 8; g++) {
                        const ga = (Math.PI * 2 / 8) * g;
                        xpGems.push(new XPGem(enemy.x + Math.cos(ga) * 20, enemy.y + Math.sin(ga) * 20, Math.ceil(enemy.xpValue / 8)));
                    }
                } else {
                    if (enemy.type === 'Tank') screenShake.trigger(5, 0.15);
                    AudioSystem.enemyDeath();
                }

                xpGems.push(new XPGem(enemy.x, enemy.y, enemy.xpValue));
                enemies.splice(i, 1);
                game.killCount++;
                continue;
            }

            if (dist(player.x, player.y, enemy.x, enemy.y) > 1500) enemies.splice(i, 1);
        }

        // Update XP gems (Phase 5: magnet effect)
        for (let i = xpGems.length - 1; i >= 0; i--) {
            const gem = xpGems[i];
            gem.update(dt, player.x, player.y, player.magnetRadius);

            if (circleCollision(player.x, player.y, player.radius + 2, gem.x, gem.y, gem.radius)) {
                player.addXP(gem.value);
                // Phase 5: sparkle effect on pickup
                spawnXPPickupParticles(gem.x, gem.y);
                AudioSystem.xpPickup();
                xpGems.splice(i, 1);
                continue;
            }
            if (gem.lifetime <= 0) xpGems.splice(i, 1);
        }

        if (player.pendingLevelUps > 0) {
            player.pendingLevelUps--;
            upgradeSystem.generateChoices(weapons);
            AudioSystem.levelUp();
        }

        camera.follow(player);
    }

    // --- RENDER ---
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, BASE_WIDTH, BASE_HEIGHT);

    drawGrid(ctx, camera);

    // Particles (behind everything)
    for (const p of particles) p.draw(ctx, camera);

    for (const gem of xpGems) gem.draw(ctx, camera);
    for (const enemy of enemies) enemy.draw(ctx, camera);

    weapons.orbit.draw(ctx, camera);
    weapons.forwardShot.draw(ctx, camera);
    weapons.areaBurst.draw(ctx, camera);

    player.draw(ctx, camera);

    // Damage numbers (in front of everything in world space)
    for (const dn of damageNumbers) dn.draw(ctx, camera);

    drawHUD(ctx, player, weapons, spawner);

    // Wave notification
    if (waveNotifyTimer > 0 && !isUpgrading && !isPaused) {
        const alpha = Math.min(1, waveNotifyTimer / 0.5);
        ctx.globalAlpha = alpha;
        ctx.textAlign = 'center';
        ctx.fillStyle = '#ff9800'; ctx.font = 'bold 28px monospace';
        ctx.fillText(`~ Wave ${spawner.waveNumber + 1} ~`, BASE_WIDTH / 2, 85);
        ctx.fillStyle = '#fff'; ctx.font = uiFont(14) + 'px monospace';
        ctx.fillText('Enemies grow stronger!', BASE_WIDTH / 2, 112);
        ctx.globalAlpha = 1;
        ctx.textAlign = 'left';
    }

    // Phase 7: Boss warning notification
    if (spawner.bossWarningActive && spawner.bossWarningTimer > 0) {
        const bwAlpha = Math.min(1, spawner.bossWarningTimer / 0.5);
        const pulse = 0.7 + 0.3 * Math.sin(Date.now() / 100);
        ctx.globalAlpha = bwAlpha * pulse;
        ctx.textAlign = 'center';
        ctx.fillStyle = '#ff6f00'; ctx.font = 'bold 36px monospace';
        ctx.fillText('⚠ BOSS INCOMING ⚠', BASE_WIDTH / 2, BASE_HEIGHT / 2 - 60);
        ctx.globalAlpha = 1;
        ctx.textAlign = 'left';
        // Red border flash
        ctx.strokeStyle = `rgba(255, 111, 0, ${0.3 * bwAlpha * pulse})`;
        ctx.lineWidth = 4;
        ctx.strokeRect(2, 2, BASE_WIDTH - 4, BASE_HEIGHT - 4);
    }

    // Phase 5: red vignette flash when player takes damage
    if (player.hitFlashTimer > 0) {
        const flashAlpha = 0.3 * (player.hitFlashTimer / 0.15);
        ctx.fillStyle = `rgba(255, 0, 0, ${flashAlpha})`;
        ctx.fillRect(0, 0, BASE_WIDTH, BASE_HEIGHT);
    }

    if (dt > 0) drawFPS(ctx, Math.round(1 / dt));

    // Overlays based on state
    if (isUpgrading) upgradeSystem.draw(ctx);
    if (isPaused) drawPauseScreen(ctx);
    if (isGameOver) drawGameOver(ctx, spawner);

    requestAnimationFrame(gameLoop);
}

// --- Start ---
requestAnimationFrame((timestamp) => {
    lastTime = timestamp;
    gameLoop(timestamp);
});

</script>
</body>
</html>
