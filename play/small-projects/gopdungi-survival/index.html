  }
  drawIcbmScreen(); // 화이트아웃은 모든 것 위에
}

// ============================================================
// 입력
// ============================================================
function hitUI(mx, my) {
  for (let i = uiRects.length - 1; i >= 0; i--) {
    const r = uiRects[i];
    if (mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h) return r.act;
  }
  return null;
}

canvas.addEventListener('mousedown', (ev) => {
  ev.preventDefault();
  if (touchAimOwnsMouse()) return; // 터치 직후 브라우저가 만든 호환 마우스 이벤트 무시
  mouse.x = ev.clientX; mouse.y = ev.clientY;
  mouse.wx = mouse.x / ZOOM + camX; mouse.wy = mouse.y / ZOOM + camY;
  if (ev.button === 2) {
    if (placing) placing = null;
    return;
  }
  if (ev.button !== 0) return;
  if (state === ST.TITLE) {
    const act = hitUI(mouse.x, mouse.y);
    if (act) handleAction(act);
    return;
  }
  if (state === ST.OVER || state === ST.STATS) {
    const act = hitUI(mouse.x, mouse.y);
    if (act) handleAction(act);
    return;
  }
  if (state !== ST.PLAY || paused) return;
  if (shopOpen) { // 패널 영역을 동기적으로 계산 — 전 프레임 rect에 의존하지 않음
    const L = shopLayout();
    if (mouse.x >= L.sx && mouse.x <= L.sx + L.sw && mouse.y >= L.sy && mouse.y <= L.sy + L.sh) {
      const act = hitUI(mouse.x, mouse.y);
      if (act) handleAction(act);
      return;
    }
  }
  if (placing) { tryPlace(); return; }
  if (getWeapon().kind === 'icbm') { tryFireIcbm(); return; } // ICBM은 클릭당 1발 발사 시퀀스
  firing = true;
});
window.addEventListener('mouseup', (ev) => { if (ev.button === 0) firing = false; });
window.addEventListener('mousemove', (ev) => {
  if (touchAimOwnsMouse()) return; // 터치 조준 중: 조준점은 오른쪽 스틱이 정한다
  mouse.x = ev.clientX; mouse.y = ev.clientY;
  mouse.wx = mouse.x / ZOOM + camX; mouse.wy = mouse.y / ZOOM + camY;
});
canvas.addEventListener('contextmenu', (ev) => ev.preventDefault());
// 휠: 델타 누적 + 임계값 — 트랙패드 관성/수평 스크롤/Ctrl 줌과 충돌하지 않게
let wheelAcc = 0, wheelLastT = 0;
window.addEventListener('wheel', (ev) => {
  if (state !== ST.PLAY || paused || ev.ctrlKey || ev.deltaY === 0) return;
  if (Math.abs(ev.deltaY) <= Math.abs(ev.deltaX)) return; // 수평 스와이프 무시
  const now = performance.now();
  if (now - wheelLastT > 150) wheelAcc = 0; // 제스처 사이 잔여 델타 리셋
  wheelLastT = now;
  wheelAcc += ev.deltaMode === 1 ? ev.deltaY * 40 : ev.deltaY;
  if (Math.abs(wheelAcc) >= 80) {
    cycleWeapon(wheelAcc > 0 ? 1 : -1);
    wheelAcc = 0;
  }
}, { passive: true });

window.addEventListener('keydown', (ev) => {
  keys[ev.code] = true;
  if (ev.code === 'Tab') ev.preventDefault(); // 브라우저 포커스 이동 방지 (repeat 포함)
  if (ev.repeat) return;
  const inPlay = state === ST.PLAY && !paused;
  if (ev.code.startsWith('Digit')) {
    const i = parseInt(ev.code.slice(5), 10) - 1;
    if (inPlay && i >= 0 && i < CONFIG.weapons.length) {
      if (ev.shiftKey) {
        handleAction({ t: 'upWeapon', i }); // Shift+숫자: 해당 무기 강화
      } else {
        handleAction({ t: 'buyWeapon', i }); // 숫자: 보유→장착 / 미보유→구매
        digitHold = { code: ev.code, i, t: 0, fired: 0 }; // 홀드 시 자동 강화 시작점
      }
    }
  } else if (ev.code === 'KeyV') {
    if (inPlay) handleAction({ t: 'upShield' }); // 보호막 구매/강화
  } else if (ev.code === 'Tab') {
    if (inPlay) { shopOpen = !shopOpen; if (shopOpen) placing = null; }
  } else if (ev.code === 'KeyT') {
    if (inPlay) togglePlace(2); // 터렛 배치 모드 토글
  } else if (ev.code === 'KeyB') {
    if (inPlay) togglePlace(1); // 바리케이드 배치 모드 토글
  } else if (ev.code === 'KeyH') {
    if (inPlay) handleAction({ t: 'heal' });
  } else if (ev.code === 'KeyE') {
    if (inPlay) handleAction({ t: 'buyAmmo', i: player.slot });
  } else if (ev.code === 'Escape') {
    if (settingsOpen) settingsOpen = false;
    else if (placing) placing = null;
    else if (shopOpen) shopOpen = false;
  } else if (ev.code === 'KeyP') {
    if (state === ST.PLAY) { paused = !paused; firing = false; }
  } else if (ev.code === 'KeyM') {
    if (inPlay) handleAction({ t: 'upMaxhp' }); // 최대 체력 강화
  } else if (ev.code === 'KeyJ') {
    if (inPlay) handleAction({ t: 'upSpeed' }); // 이동속도 강화
  } else if (ev.code === 'KeyN') {
    const muted = SFX.toggleMute(); // 음소거 (M에서 이동)
    if (state === ST.PLAY) fbFloat('음소거 ' + (muted ? 'ON' : 'OFF'), '#ccc');
  } else if (ev.code === 'KeyR') {
    if (state === ST.STATS || state === ST.OVER) handleAction({ t: 'restart' });
  }
});
window.addEventListener('beforeunload', () => { if (state === ST.PLAY) writeSave(); });
window.addEventListener('keyup', (ev) => {
  keys[ev.code] = false;
  if (digitHold && ev.code === digitHold.code) digitHold = null;
});
window.addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
  firing = false;
  digitHold = null;
});

// ============================================================
// 터치 조작 (휴대폰·태블릿) — 위에 인라인한 touch-kit 사용
//   왼쪽 스틱: 이동 · 오른쪽 스틱: 조준, 절반 이상 밀면 연속 발사 (ICBM은 밀 때마다 1발)
//   오른쪽 위 버튼: 상점 · 소리 · 일시정지 / 하단 무기 칸 탭: 장착·미보유 시 구매 (숫자키와 같음)
//   설치물: 상점에서 고른 뒤 필드를 눌러 위치를 잡고 떼면 설치(연속), 취소 버튼으로 끝
//   메뉴·상점·대화상자는 탭(누른 버튼 위에서 떼기), 상점 목록은 끌어서 스크롤. 데스크톱 조작은 그대로.
// ============================================================
const touchMove = { on: false, x: 0, y: 0 };                  // 왼쪽 스틱 (단위 방향)
const touchAim = { on: false, x: 1, y: 0, m: 0, fire: false }; // 오른쪽 스틱
let lastTouchT = -1e9;   // 마지막 터치 시각 — 터치가 만든 호환 마우스 이벤트 무시용
let touchGhost = false;  // 배치 고스트: 필드를 누르고 있는 동안만 표시
let shopScroll = 0;      // 터치 상점 목록 스크롤 (상점 좌표 단위)
let touchKit = null;
function touchAimOwnsMouse() { return TOUCH_UI && performance.now() - lastTouchT < 1000; }

// 글자 폭이 maxW를 넘지 않는 가장 큰 글꼴 크기 (최소 12px)
function fitFont(txt, size, maxW, pre) {
  ctx.font = (pre || '') + size + 'px sans-serif';
  const w = ctx.measureText(txt).width;
  return w <= maxW ? size : Math.max(12, Math.floor(size * maxW / w));
}
// 폭을 넘는 글자는 … 로 자름 (현재 ctx.font 기준)
function clipText(txt, maxW) {
  if (ctx.measureText(txt).width <= maxW) return txt;
  let s = txt;
  while (s.length > 1 && ctx.measureText(s + '…').width > maxW) s = s.slice(0, -1);
  return s + '…';
}

// 터치 레이아웃 치수 (CSS px) — 그리기와 탭 판정이 같은 값을 쓴다
function touchLayout() {
  const s = SAFE, land = VW >= VH, L = { land };
  L.btnL = VW - s.r - 12 - (3 * 58 + 2 * 12);         // 오른쪽 위 버튼 묶음(상점·소리·일시정지, 54px + 테두리) 왼쪽 끝
  L.btnB = s.t + 10 + 58;                              // 그 아래 끝
  L.scoreMax = Math.max(1, (L.btnL - s.l - 20) / 190); // 점수창이 버튼에 닿지 않는 최대 배율
  if (land) { L.fpsX = L.btnL - 10; L.fpsY = s.t + 12; } else { L.fpsX = VW - s.r - 12; L.fpsY = L.btnB + 8; }
  const aw = VW - s.l - s.r - 20;
  if (land) {                                          // 가로: 한 줄 바 (HP·레벨·무기 / 무기 칸 8개 / 잔고)
    const sz = 44, gap = 4, slotsW = 8 * sz + 7 * gap;
    L.barTop = VH - s.b - 58;
    L.hp = { x: s.l + 10, y: L.barTop + 10, w: 140, h: 18 };
    L.lv = { x: s.l + 158, y: L.barTop + 19 };
    L.wpn = { x: s.l + 10, y: L.barTop + 45, maxW: 200 };
    L.slots = { x: s.l + 220, y: L.barTop + 7, sz, gap, cols: 8 };
    const rest = VW - s.r - 10 - (L.slots.x + slotsW);
    L.money = rest >= 140
      ? { x: VW - s.r - 12, y: L.barTop + 29, align: 'right', maxW: rest - 6 }
      : { x: VW / 2, y: s.t + 24, align: 'center', maxW: Math.max(120, L.btnL - VW / 2 - 10) * 2 };
  } else {                                             // 세로: HP·레벨·잔고 / 무기·탄약 / 무기 칸
    const one = aw >= 8 * 44 + 7 * 2;
    const cols = one ? 8 : 4, gap = one ? 2 : 6;
    const sz = one ? Math.min(48, Math.floor((aw - 7 * gap) / 8)) : 48;
    const rows = 8 / cols, slotsH = rows * sz + (rows - 1) * gap;
    L.barTop = VH - s.b - (62 + slotsH + 8);
    L.hp = { x: s.l + 10, y: L.barTop + 10, w: 150, h: 18 };
    L.lv = { x: s.l + 168, y: L.barTop + 19 };
    L.wpn = { x: s.l + 10, y: L.barTop + 45, maxW: aw };
    L.money = { x: VW - s.r - 12, y: L.barTop + 19, align: 'right', maxW: VW - s.r - 12 - (s.l + 232) };
    L.slots = { x: (VW - (cols * sz + (cols - 1) * gap)) / 2, y: L.barTop + 62, sz, gap, cols };
  }
  L.bossY = land ? s.t + 98 : s.t + 122;               // 보스 체력바: 상단 HUD·버튼 아래
  L.annY = L.bossY + (bossCount > 0 ? 40 : 12);        // 중앙 공지
  L.auraY = L.barTop - 22;
  L.placeY = land ? s.t + 22 : s.t + 150;              // 배치 안내 + 취소 버튼
  // 가운데 글자(보스 바·공지·피폭 경고)의 기준 — 가로 화면에서 상점이 열려 있으면 패널 왼쪽 공간만 쓴다
  L.midX = VW / 2; L.midW = VW - 24;
  if (land && shopOpen && state === ST.PLAY) { const g = shopTouchGeom(L); L.midX = (s.l + g.sx) / 2; L.midW = g.sx - s.l - 20; }
  return L;
}

// ---- 터치 하단 바: HP·보호막, 레벨, 무기·탄약, 무기 칸(탭), 잔고 ----
function drawBarTouch(L) {
  ctx.fillStyle = 'rgba(10,14,8,0.72)';
  ctx.fillRect(0, L.barTop, VW, VH - L.barTop);
  const hp = L.hp, sm = shieldMax();
  if (sm > 0) { // 보호막 바 (HP 위 파란색) — 구매 후에만
    ctx.fillStyle = '#122a40'; ctx.fillRect(hp.x, hp.y - 7, hp.w, 5);
    ctx.fillStyle = '#4db8ff'; ctx.fillRect(hp.x, hp.y - 7, hp.w * clamp(player.shield / sm, 0, 1), 5);
  }
  ctx.fillStyle = '#401010';
  ctx.fillRect(hp.x, hp.y, hp.w, hp.h);
  const hpFrac = clamp(player.hp / player.maxHp, 0, 1);
  ctx.fillStyle = hpFrac > 0.3 ? '#35d13a' : '#e04a2a';
  ctx.fillRect(hp.x, hp.y, hp.w * hpFrac, hp.h);
  ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
  ctx.strokeRect(hp.x + 0.5, hp.y + 0.5, hp.w - 1, hp.h - 1);
  const shTxt = sm > 0 ? '  +' + Math.round(player.shield) + '🛡' : '';
  const hTxt = 'HP ' + Math.ceil(player.hp) + ' / ' + player.maxHp + shTxt;
  ctx.fillStyle = '#fff';
  ctx.font = 'bold ' + fitFont(hTxt, 13, hp.w - 6, 'bold ') + 'px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(hTxt, hp.x + hp.w / 2, hp.y + hp.h / 2 + 1);
  // 레벨
  ctx.textAlign = 'left';
  ctx.font = 'bold 16px sans-serif';
  ctx.fillStyle = '#a4ef7c';
  ctx.fillText('Lv ' + level, L.lv.x, L.lv.y);
  ctx.fillStyle = 'rgba(164,239,124,0.25)';
  ctx.fillRect(L.lv.x, L.lv.y + 11, 50, 4);
  ctx.fillStyle = '#a4ef7c';
  ctx.fillRect(L.lv.x, L.lv.y + 11, 50 * clamp(levelT / CONFIG.difficulty.levelTime, 0, 1), 4);
  // 선택 무기 + 탄약
  const w = getWeapon();
  const ammoTxt = getAmmo() === Infinity ? '∞' : formatNum(getAmmo());
  ctx.font = 'bold 14px sans-serif';
  ctx.fillStyle = getAmmo() === 0 ? '#ff7b6b' : '#fff';
  ctx.fillText(clipText(w.name + ' · ' + ammoTxt + '발', L.wpn.maxW), L.wpn.x, L.wpn.y);
  // 무기 칸 — 탭: 장착 / 미보유 시 구매 (숫자키와 같은 동작)
  const sl = L.slots, live = state === ST.PLAY && !paused;
  ctx.textAlign = 'center';
  for (let i = 0; i < CONFIG.weapons.length; i++) {
    const x = sl.x + (i % sl.cols) * (sl.sz + sl.gap), y = sl.y + ((i / sl.cols) | 0) * (sl.sz + sl.gap);
    const owned = player.owned[i];
    ctx.fillStyle = owned ? '#38402c' : '#1d1f1a';
    ctx.fillRect(x, y, sl.sz, sl.sz);
    ctx.strokeStyle = player.slot === i ? '#ffd94a' : owned ? '#788a60' : '#333';
    ctx.lineWidth = player.slot === i ? 2 : 1;
    ctx.strokeRect(x + 0.5, y + 0.5, sl.sz - 1, sl.sz - 1);
    ctx.fillStyle = owned ? '#dbe8c8' : '#666';
    ctx.font = 'bold 15px sans-serif';
    ctx.fillText(String(i + 1), x + sl.sz / 2, y + sl.sz / 2 - 7);
    ctx.font = '12px sans-serif';
    const nm = CONFIG.weapons[i].kind === 'icbm' ? 'ICBM' : CONFIG.weapons[i].name.slice(0, 2);
    ctx.fillText(nm, x + sl.sz / 2, y + sl.sz / 2 + 10);
    if (live) pushRect(x, y, sl.sz, sl.sz, { t: 'buyWeapon', i });
  }
  // 잔고 (배율: money)
  const mTxt = formatMoney(money), m = L.money;
  ctx.textAlign = m.align;
  ctx.font = 'bold ' + fitFont(mTxt, Math.round(22 * uiF('money')), m.maxW, 'bold ') + 'px sans-serif';
  ctx.strokeStyle = 'rgba(0,0,0,0.75)'; ctx.lineWidth = 4;
  ctx.strokeText(mTxt, m.x, m.y);
  ctx.fillStyle = '#ffd94a';
  ctx.fillText(mTxt, m.x, m.y);
}

// ---- 터치용 버튼 (기존 uiButton 스타일, 44px 이상) ----
function tButton(x, y, w, h, label, enabled, act, sub) {
  ctx.fillStyle = enabled ? '#3a4a2e' : '#2a2a2a';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = enabled ? '#9dc17d' : '#555'; ctx.lineWidth = 1.5;
  ctx.strokeRect(x + 0.75, y + 0.75, w - 1.5, h - 1.5);
  ctx.fillStyle = enabled ? '#e8ffd8' : '#777';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (sub) {
    ctx.font = 'bold ' + fitFont(label, 13, w - 8, 'bold ') + 'px sans-serif';
    ctx.fillText(label, x + w / 2, y + h / 2 - 8);
    ctx.font = fitFont(sub, 12, w - 8) + 'px sans-serif';
    ctx.fillStyle = enabled ? '#ffd94a' : '#777';
    ctx.fillText(sub, x + w / 2, y + h / 2 + 9);
  } else {
    ctx.font = 'bold ' + fitFont(label, 15, w - 10, 'bold ') + 'px sans-serif';
    ctx.fillText(label, x + w / 2, y + h / 2 + 1);
  }
  if (enabled && act) pushRect(x, y, w, h, act);
}

// ---- 터치 상점: 가로는 오른쪽 패널(왼쪽 스틱으로 계속 이동 가능), 세로는 위쪽 패널. 목록은 끌어서 스크롤 ----
function shopTouchGeom(L) {
  const s = SAFE, f = uiF('shop');
  let x0, y0, x1, y1;
  if (L.land) { x0 = Math.round(Math.max(VW * 0.44, VW - s.r - 8 - 520 * f)); x1 = VW - s.r - 8; y0 = s.t + 6; y1 = VH - s.b - 6; }
  else { x0 = s.l + 8; x1 = VW - s.r - 8; y0 = L.btnB + 6; const rows = shopTab === 0 ? CONFIG.weapons.length : 7; y1 = Math.min(L.barTop - 6, y0 + (100 + rows * 52 + 34) * f); }
  const g = { sx: x0, sy: y0, sw: x1 - x0, sh: y1 - y0, f };
  g.w = g.sw / f; g.h = g.sh / f;
  g.hdrR = L.land ? (Math.min(x1, L.btnL - 8) - x0) / f : g.w; // 머리줄 오른쪽 끝 (가로: 오른쪽 위 버튼 피하기)
  g.listY = 100; g.listH = g.h - g.listY - 4; g.rowH = 52;
  return g;
}
function inShopList(x, y) {
  if (!shopOpen || state !== ST.PLAY) return false;
  const g = shopTouchGeom(touchLayout());

function drawShopTouch(L) {

  const rows = shopTab === 0 ? CONFIG.weapons.length : 7;

  const top = g.listY, bot = g.listY + g.listH;
  const rect = (x, y, rw, rh, act) => {                // 보이는 부분만 탭 영역으로

    ctx.fillStyle = 'rgba(157,193,125,0.5)';

}

  uiRects.push({ x: bx, y: byy, w: bw, h: bhh, act: { t: 'ok' } });
}

// ---- 터치 최종 결과 ----
function drawStatsTouch() {

// ---- 터치 일시정지: 터치 조작 안내 + 계속하기 / 소리 버튼 ----
function drawPauseTouch() {

    ['무기 칸 탭', '장착 / 미보유 시 구매'], ['상점 버튼', '무기·탄약·강화·보호막·체력·치료·설치물'],

// ---- 탭 동작 (터치 전용 동작 + 기존 handleAction) ----
function touchAction(act) {
  SFX.init(); // 터치 떼기 = 사용자 제스처: 오디오 시작 가능
  if (act.t === 'none') return;
  if (act.t === 'tResume') { if (state === ST.PLAY) paused = false; return; }
  if (act.t === 'tMute') { SFX.toggleMute(); return; }
  if (act.t === 'tCancelPlace') { placing = null; touchGhost = false; return; }
  if (act.t === 'tab') shopScroll = 0;
  handleAction(act);
  if ((act.t === 'placeTurret' || act.t === 'placeBarr') && placing) touchGhost = false;
}

// ---- 캔버스 터치: 탭 / 상점 목록 스크롤 / 설치물 배치 ----
let tapG = null; // 진행 중인 한 손가락 동작 { id, x0, y0, act, mode, moved, scroll0 }
function setTouchMouse(x, y) {
  mouse.x = x; mouse.y = y;
  mouse.wx = x / ZOOM + camX; mouse.wy = y / ZOOM + camY;
}
if (TOUCH_UI) {
  addEventListener('touchstart', () => { lastTouchT = performance.now(); }, { capture: true, passive: true });
  canvas.addEventListener('pointerdown', (ev) => {
    if (ev.pointerType === 'mouse') return;       // 마우스는 기존 mousedown 경로
    ev.preventDefault();                           // 호환 마우스 이벤트(mousedown 등) 막기
    lastTouchT = performance.now();
    if (tapG) return;                              // 한 손가락만
    const x = ev.clientX, y = ev.clientY;
    const act = hitUI(x, y);
    tapG = { id: ev.pointerId, x0: x, y0: y, act, mode: 'tap', moved: false, scroll0: shopScroll };
    if (state === ST.PLAY && !paused && placing && !act) {
      tapG.mode = 'place'; touchGhost = true; setTouchMouse(x, y);
    } else if (inShopList(x, y)) tapG.mode = 'list';
    try { canvas.setPointerCapture(ev.pointerId); } catch (e) {}
  });
  canvas.addEventListener('pointermove', (ev) => {
    if (!tapG || ev.pointerId !== tapG.id) return;
    ev.preventDefault();
    const dx = ev.clientX - tapG.x0, dy = ev.clientY - tapG.y0;
    if (tapG.mode === 'place') { setTouchMouse(ev.clientX, ev.clientY); return; }
    if (!tapG.moved && Math.hypot(dx, dy) > 10) tapG.moved = true;
    if (tapG.moved && tapG.mode === 'list') shopScroll = tapG.scroll0 - dy / uiF('shop');
  });
  const endTouch = (ev) => {
    if (!tapG || ev.pointerId !== tapG.id) return;
    const g = tapG; tapG = null;
    lastTouchT = performance.now();
    if (ev.type === 'pointercancel') { touchGhost = false; return; }
    if (g.mode === 'place') {                      // 뗀 곳에 설치 (연속 배치는 기존 규칙 그대로)
      setTouchMouse(ev.clientX, ev.clientY);
      touchGhost = false;
      if (state === ST.PLAY && !paused && placing) tryPlace();
      return;
    }
    if (g.moved || !g.act) return;                 // 끌기는 탭이 아님
    const act = hitUI(ev.clientX, ev.clientY);
    if (act && JSON.stringify(act) === JSON.stringify(g.act)) touchAction(act);
  };
  canvas.addEventListener('pointerup', endTouch);
  canvas.addEventListener('pointercancel', endTouch);
}

// ---- 조준 스틱 → 게임의 마우스 좌표(조준점)와 발사 ----
function applyTouchAim() {
  const px = (player.x - camX) * ZOOM, py = (player.y - camY) * ZOOM; // 화면상 플레이어
  const R = 70 + 130 * touchAim.m;
  setTouchMouse(px + touchAim.x * R, py + touchAim.y * R);
}

if (TOUCH_UI && window.TouchKit) {
  TouchKit.unlockAudio(); // iOS/Android: 첫 터치에서 오디오 재개
  const zoneFit = () => { // 스틱 영역은 상단 HUD 아래 ~ 하단 바 위
    if (!touchKit) return;
    const L = touchLayout(), bottom = (VH - L.barTop) + 'px';
    for (const z of touchKit.root.querySelectorAll('.tk-zone')) { z.style.top = '22%'; z.style.bottom = bottom; }
  };
  addEventListener('resize', zoneFit); // touch-kit의 resize(스틱 대기 위치)보다 먼저 등록
  touchKit = TouchKit.create({
    show: 'manual',
    sticks: [
      { id: 'move', side: 'left', label: '이동', zone: { width: '45%' }, onMove: (x, y, on) => {
        const m = Math.hypot(x, y);
        touchMove.on = on && m > 0.22;
        touchMove.x = touchMove.on ? x / m : 0; touchMove.y = touchMove.on ? y / m : 0;
      } },
      { id: 'aim', side: 'right', label: '조준', zone: { width: '45%' }, onMove: (x, y, on) => {
        const m = Math.min(1, Math.hypot(x, y));
        const wasFire = touchAim.fire;
        if (on && m > 0.2) { touchAim.on = true; touchAim.x = x / Math.hypot(x, y); touchAim.y = y / Math.hypot(x, y); touchAim.m = m; touchAim.fire = m > 0.5; }
        else if (!on) { touchAim.on = false; touchAim.fire = false; touchAim.m = 0; firing = false; }
        else touchAim.fire = false;
        const live = state === ST.PLAY && !paused && !placing;
        if (touchAim.on && live) applyTouchAim();
        firing = live && touchAim.fire && getWeapon().kind !== 'icbm';
        // ICBM: 클릭 1번 = 1발 → 스틱을 절반 이상 밀 때마다 1발
        if (live && touchAim.fire && !wasFire && getWeapon().kind === 'icbm') tryFireIcbm();
      } },
    ],
    buttons: [
      { id: 'pause', icon: '❚❚', place: 'top-right', size: 's', onDown: () => {
        if (state === ST.PLAY) { paused = !paused; firing = false; }
      } },
      { id: 'sound', icon: '🔊', place: 'top-right', size: 's', onDown: () => {
        SFX.init(); const muted = SFX.toggleMute();
        if (state === ST.PLAY) fbFloat('음소거 ' + (muted ? 'ON' : 'OFF'), '#ccc');
      } },
      { id: 'shop', icon: '🛒', label: '상점', place: 'top-right', size: 's', onDown: () => {
        if (state === ST.PLAY && !paused) { shopOpen = !shopOpen; if (shopOpen) { placing = null; touchGhost = false; } }
      } },
    ],
  });
  touchKit.root.classList.add('gd-kit');
  zoneFit();
  const zMove = touchKit.root.querySelector('.tk-zone.l'), zAim = touchKit.root.querySelector('.tk-zone.r');
  let shown = null, moveOn = null, aimOn = null;
  (function touchSync() {
    requestAnimationFrame(touchSync);
    const play = state === ST.PLAY && !paused;
    if (play !== shown) { shown = play; touchKit.show(play); if (!play) { touchMove.on = false; touchAim.on = false; touchAim.fire = false; firing = false; } }
    // 상점: 조준 스틱 숨김(가로는 이동 스틱 유지), 배치 중: 두 스틱 숨김 (필드 탭으로 설치)
    const wantMove = play && !placing && !(shopOpen && VH > VW);
    const wantAim = play && !placing && !shopOpen;
    if (wantMove !== moveOn) { moveOn = wantMove; if (!wantMove) touchKit.sticks.move.reset(); zMove.style.display = wantMove ? '' : 'none'; }
    if (wantAim !== aimOn) { aimOn = wantAim; if (!wantAim) { touchKit.sticks.aim.reset(); firing = false; } zAim.style.display = wantAim ? '' : 'none'; }
    if (play && touchAim.on && !placing) applyTouchAim(); // 카메라가 움직여도 조준 방향 유지
    const sb = touchKit.buttons.sound, icon = SFX.isMuted() ? '🔇' : '🔊';
    if (sb && sb.icon !== icon) { sb.icon = icon; sb.el.querySelector('i').textContent = icon; }
  })();
}

// ============================================================
// 저장 / 이어하기 (localStorage)
// ============================================================
function makeSave() {
  return {
    v: CONFIG.save.version, t: Date.now(),
    money, score, kills, level, levelT, playT,
    slot: player.slot,
    player: { x: Math.round(player.x), y: Math.round(player.y),
      hp: Math.round(player.hp * 10) / 10, shield: Math.round(player.shield * 10) / 10 },
    owned: player.owned.map(Boolean),
    ammo: player.ammo.map(a => a === Infinity ? -1 : a), // JSON은 Infinity 불가 → -1
    wUp: wUp.slice(),
    tUp,
    pUp: { speed: pUp.speed, maxhp: pUp.maxhp, shield: pUp.shield },
    healsUsed, frags, nukeMat, eliteUnlocked, nextBossLevel,
    bossPending: bossCount > 0, // 보스전 도중 저장 → 로드 시 재등장
    structures: structures.map(s => ({ k: s.kind, gx: s.gx, gy: s.gy, hp: Math.round(s.hp) })),
    fragItems: fragItems.map(f => [Math.round(f.x), Math.round(f.y)]),
  };
}
function writeSave() {
  if (!savingEnabled || state !== ST.PLAY) return;
  try { localStorage.setItem(CONFIG.save.key, JSON.stringify(makeSave())); } catch (e) {}
  titleSaveCache = undefined;
}
function readSave() { // {ok:true,data} | {ok:false,old:true} | null
  try {
    const raw = localStorage.getItem(CONFIG.save.key);
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (!d || typeof d !== 'object') return null;
    if (d.v !== CONFIG.save.version) return { ok: false, old: true }; // 구버전 — 정중히 초기화 안내
    return { ok: true, data: d };
  } catch (e) { return null; }
}
function titleSaveInfo() {
  if (titleSaveCache === undefined) titleSaveCache = readSave();
  return titleSaveCache;
}
function clearSave() {
  try { localStorage.removeItem(CONFIG.save.key); } catch (e) {}
  titleSaveCache = undefined;
}
function applySave(d) {
  money = d.money || 0; score = d.score || 0; kills = d.kills || 0;
  level = Math.max(1, d.level || 1); levelT = d.levelT || 0; playT = d.playT || 0;
  pUp = { speed: 0, maxhp: 0, shield: 0 };
  if (d.pUp) { pUp.speed = d.pUp.speed || 0; pUp.maxhp = d.pUp.maxhp || 0; pUp.shield = d.pUp.shield || 0; }
  player.maxHp = playerMaxHpCalc();
  player.x = clamp(d.player.x, player.r, MAP_W - player.r);
  player.y = clamp(d.player.y, player.r, MAP_H - player.r);
  player.hp = clamp(d.player.hp, 1, player.maxHp);
  player.shield = clamp(d.player.shield || 0, 0, shieldMax());
  player.owned = CONFIG.weapons.map((w, i) => i === 0 || !!(d.owned && d.owned[i]));
  player.ammo = CONFIG.weapons.map((w, i) => {
    if (i === 0) return Infinity;
    const a = d.ammo && d.ammo[i];
    return a === -1 ? Infinity : (a > 0 ? a : 0);
  });
  player.slot = clamp(d.slot || 0, 0, CONFIG.weapons.length - 1);
  if (!player.owned[player.slot]) player.slot = 0;
  wUp = CONFIG.weapons.map((w, i) => (d.wUp && d.wUp[i]) || 0);
  tUp = d.tUp || 0; // 구버전 세이브(필드 없음)는 0으로 기본 마이그레이션
  healsUsed = d.healsUsed || 0;
  frags = d.frags || 0;
  nukeMat = d.nukeMat || 0;
  eliteUnlocked = !!d.eliteUnlocked;
  nextBossLevel = d.nextBossLevel || CONFIG.boss.every;
  for (const s of (d.structures || [])) {
    if (s.gx < 0 || s.gy < 0 || s.gx >= GC || s.gy >= GR) continue;
    if (structGrid[s.gy * GC + s.gx]) continue;
    const st = s.k === 2 ? addTurret(s.gx, s.gy) : addBarricade(s.gx, s.gy);
    st.hp = clamp(s.hp, 1, st.maxHp);
  }
  for (const f of (d.fragItems || [])) spawnFragItem(f[0], f[1]);
  if (d.bossPending) spawnBoss();
  saveTimer = 0;
}

// ============================================================
// 리셋 / 루프
// ============================================================
function resetGame() {
  money = CONFIG.economy.startMoney;
  score = 0; kills = 0; level = 1; levelT = 0; playT = 0; spawnAcc = 0;
  hurtFlash = 0; shakeMag = 0; newBest = false; noAmmoT = -99;
  paused = false; firing = false; placing = null; shopOpen = false;
  player.x = MAP_W / 2; player.y = MAP_H / 2;
  pUp = { speed: 0, maxhp: 0, shield: 0 };
  wUp = CONFIG.weapons.map(() => 0);
  tUp = 0;
  player.maxHp = playerMaxHpCalc(); player.hp = player.maxHp; player.shield = 0;
  player.aim = 0; player.fireCd = 0; player.hurtCd = 0; player.sinceHurt = 99;
  player.slot = 0;
  player.owned = CONFIG.weapons.map((w, i) => i === 0);
  player.ammo = CONFIG.weapons.map((w, i) => i === 0 ? Infinity : 0);
  frags = 0; nukeMat = 0; eliteUnlocked = false; nextBossLevel = CONFIG.boss.every;
  bossCount = 0; bossWarnT = 0; healsUsed = 0; icbm = null;
  insideAura = false; shieldFlash = 0; auraFxT = 0; shieldWasFull = true;
  saveTimer = 0; shopTab = 0; titleConfirm = false;
  fragItems.length = 0; announces.length = 0;
  enemies.length = 0; freeEnemies.length = 0; enemyPool.length = 0;
  bullets.length = 0; freeBullets.length = 0; bulletsCreated = 0;
  parts.length = 0; freeParts.length = 0;
  floats.length = 0;
  structures.length = 0; structGrid.fill(null);
  ehash.clear();
  bakeGround();
  for (let i = 0; i < 8; i++) trySpawn();
}

function startNewGame() {
  SFX.init();
  savingEnabled = true;
  clearSave();
  resetGame();
  state = ST.PLAY;
  writeSave();
}
function continueGame() {
  const s = titleSaveInfo();
  if (!s || !s.ok) { SFX.dry(); return; }
  SFX.init();
  savingEnabled = true;
  resetGame();
  applySave(s.data);
  state = ST.PLAY;
  announce('이어하기 — Lv ' + level + ' 에서 재개', '#cfe6bd', 3, 20);
}

let lastT = performance.now();
function loop(t) {
  requestAnimationFrame(loop);
  let dt = (t - lastT) / 1000;
  lastT = t;
  if (dt > 0) fpsAvg += (1 / dt - fpsAvg) * 0.05;
  if (dt > 0.05) dt = 0.05;
  if (state === ST.PLAY && !paused) update(dt);
  draw();
}

// ---------- 디버그 API (플레이테스트용) ----------
window.__gd = {
  get stats() {
    return { state, level, money, score, kills, fps: Math.round(fpsAvg),
      enemies: enemies.length, bullets: bullets.length, structures: structures.length, particles: parts.length,
      frags, nukeMat, eliteUnlocked, nextBossLevel, bossCount, shield: player.shield, shieldMax: shieldMax() };
  },
  // 디버그 시작은 자동 저장을 끔 (실제 세이브 보호). __gd.start(true)로 저장 활성화
  start(withSave) { if (state !== ST.PLAY) { SFX.init(); savingEnabled = !!withSave; resetGame(); state = ST.PLAY; } },
  spawn(n, type) {
    n = n || 100; type = type || 'small';
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, d = rand(300, 700);
      spawnEnemy(type, clamp(player.x + Math.cos(a) * d, 20, MAP_W - 20), clamp(player.y + Math.sin(a) * d, 20, MAP_H - 20));
    }
  },
  money(n) { money += n || 1000000; },
  setLevel(n) { level = n; },
  god() { player.maxHp = 1e9; player.hp = 1e9; },
  turret(gx, gy) { return addTurret(gx, gy); },
  barricade(gx, gy) { return addBarricade(gx, gy); },
  boss() { spawnBoss(); },
  mat(n) { nukeMat += n || 1; },
  frag(n) { addFrag(n || 1); },
  nuke(x, y) { detonateNuke(x || player.x, y || player.y); },
  save() { savingEnabled = true; writeSave(); },
  loadInfo() { return readSave(); },
  wipeSave() { clearSave(); },
};

buildSprites();
loadUiSettings();
resetGame();
requestAnimationFrame(loop);
</script>
