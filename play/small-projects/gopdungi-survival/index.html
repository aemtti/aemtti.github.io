  /* 휴대폰·태블릿(html.touch): 화면 고정, 스크롤·확대·길게 누르기 메뉴 없음 */
  html.touch,html.touch body{touch-action:none;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;}

<!-- 안전 영역(노치·홈 바) 측정용 -->
<div id="safeProbe" style="position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)"></div>
<!-- touch-kit:start -->
<script>
/* touch-kit.js — on-screen touch controls for keyboard/mouse web games. No dependencies.
 * Inline it into a single-file game (inside a script tag) or load it next to the game.
 *
 *   const kit = TouchKit.create({
 *     sticks: [
 *       { id: 'move', side: 'left',  label: 'MOVE', keys: 'wasd' },            // 'wasd' | 'arrows' | {up,down,left,right} codes
 *       { id: 'aim',  side: 'right', label: 'AIM',  onMove: (x, y, on) => {} } // analog -1..1, on=false when released
 *     ],
 *     buttons: [ { id: 'fire', label: 'FIRE', icon: '✦', key: 'Space' },      // key: KeyboardEvent.code to hold while pressed
 *                { id: 'map', label: 'MAP', key: 'KeyM', place: 'top-right' } ],
 *     landscape: true,        // ask to rotate when the phone is held upright
 *   })
 *   kit.show(false)           // hide in menus, kit.show(true) in gameplay (default: shown on touch devices)
 *   kit.stick('aim')          // → { x, y, on }   kit.pressed('fire') → boolean
 *
 * Buttons without `key` can use onDown/onUp. Sticks with `keys` send keydown/keyup (8 directions) and still report analog x/y.
 * Keys are dispatched as KeyboardEvents (key, code, keyCode, which) on document, so window/document listeners receive them.
 * Everything else on the page keeps working: the kit only captures touches that start on its own zones/buttons.
 */
(function () {
  'use strict'
  if (window.TouchKit) return
  const KEYS = { Space: [' ', 32], Enter: ['Enter', 13], Escape: ['Escape', 27], Tab: ['Tab', 9], ShiftLeft: ['Shift', 16],
    ControlLeft: ['Control', 17], AltLeft: ['Alt', 18], ArrowLeft: ['ArrowLeft', 37], ArrowUp: ['ArrowUp', 38],
    ArrowRight: ['ArrowRight', 39], ArrowDown: ['ArrowDown', 40], Backspace: ['Backspace', 8] }
  const keyInfo = code => {
    if (KEYS[code]) return KEYS[code]
    if (/^Key[A-Z]$/.test(code)) return [code[3].toLowerCase(), code.charCodeAt(3)]
    if (/^Digit\d$/.test(code)) return [code[5], code.charCodeAt(5)]
    return [code, 0]
  }
  const held = new Map()                                   // code → count of sources holding it
  function sendKey(type, code) {
    const [key, kc] = keyInfo(code)
    const ev = new KeyboardEvent(type, { key, code, bubbles: true, cancelable: true, composed: true })
    try { Object.defineProperty(ev, 'keyCode', { get: () => kc }); Object.defineProperty(ev, 'which', { get: () => kc }) } catch (e) {}
    const t = document.activeElement && document.activeElement !== document.body ? document.activeElement : document
    t.dispatchEvent(ev)
  }
  function press(code) { const n = held.get(code) || 0; held.set(code, n + 1); if (n === 0) sendKey('keydown', code) }
  function release(code) { const n = held.get(code) || 0; if (n <= 1) { held.delete(code); if (n === 1) sendKey('keyup', code) } else held.set(code, n - 1) }
  function tapKey(code) { press(code); setTimeout(() => release(code), 80) }

  const isTouch = () => matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0
  const CSS = `
.tk-root{position:fixed;inset:0;pointer-events:none;z-index:2147483000;font:600 12px/1 system-ui,-apple-system,'Segoe UI',sans-serif;
  letter-spacing:.06em;color:#fff;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tk-root.tk-off{display:none}
.tk-zone{position:absolute;bottom:0;top:22%;pointer-events:auto;touch-action:none}
.tk-zone.l{left:0;width:42%}.tk-zone.r{right:0;width:42%}
.tk-base{position:absolute;width:128px;height:128px;margin:-64px 0 0 -64px;border-radius:50%;border:2px solid rgba(255,255,255,.28);
  background:radial-gradient(circle,rgba(255,255,255,.07),rgba(255,255,255,.02) 70%);transition:opacity .15s;opacity:.55}
.tk-knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;
  background:rgba(255,255,255,.28);border:2px solid rgba(255,255,255,.55);box-shadow:0 2px 10px rgba(0,0,0,.35)}
.tk-base.on{opacity:.95}
.tk-lab{position:absolute;left:0;right:0;top:50%;margin-top:-5px;text-align:center;opacity:.75;text-shadow:0 1px 2px #000;pointer-events:none}
.tk-btns{position:absolute;display:flex;gap:12px;pointer-events:none}
.tk-btns.br{right:calc(18px + env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));flex-direction:column-reverse;align-items:flex-end}
.tk-btns.tr{right:calc(12px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));flex-direction:row-reverse}
.tk-btns.tl{left:calc(12px + env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top))}
.tk-btns.bl{left:calc(18px + env(safe-area-inset-left));bottom:calc(20px + env(safe-area-inset-bottom));flex-direction:column-reverse}
.tk-row{display:flex;gap:12px;flex-direction:row-reverse;align-items:flex-end}
.tk-btn{pointer-events:auto;touch-action:none;width:68px;height:68px;border-radius:50%;border:2px solid rgba(255,255,255,.5);
  background:rgba(20,22,30,.42);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  box-shadow:0 2px 12px rgba(0,0,0,.35);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.tk-btn.s{width:54px;height:54px;font-size:12px}.tk-btn.l{width:84px;height:84px}
.tk-btn i{font-style:normal;font-size:22px;line-height:1}.tk-btn.s i{font-size:17px}
.tk-btn.on{background:rgba(255,255,255,.34);border-color:#fff;transform:scale(.94)}
.tk-rot{position:fixed;inset:0;z-index:2147483600;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;
  background:rgba(8,9,14,.94);color:#eee;font:500 16px/1.5 system-ui,sans-serif;text-align:center;pointer-events:auto;padding:24px}
.tk-rot b{font-size:44px;display:block;animation:tkr 1.8s ease-in-out infinite}
.tk-rot button{margin-top:6px;background:none;border:1px solid #666;color:#bbb;border-radius:22px;padding:10px 20px;min-height:44px;font:inherit;font-size:14px}
@keyframes tkr{0%,20%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){.tk-rot.need{display:flex}}
`
  // A tap on a kit button is followed by a compatibility `click` at the same spot ~100–300 ms later. If the button just
  // opened a game overlay/menu under the finger, that click would hit it (and often close it). Swallow it.
  let clickBlockUntil = 0
  function suppressClick() { clickBlockUntil = Date.now() + 450 }
  document.addEventListener('click', e => {
    if (Date.now() < clickBlockUntil && !(e.target && e.target.closest && e.target.closest('.tk-root'))) { e.stopPropagation(); e.preventDefault() }
  }, true)

  function el(tag, cls, parent, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e }

  function create(opt) {
    opt = opt || {}
    if (!document.getElementById('tk-style')) { const st = el('style'); st.id = 'tk-style'; st.textContent = CSS; document.head.appendChild(st) }
    const root = el('div', 'tk-root', document.body)
    const api = { root, sticks: {}, buttons: {}, visible: false }
    const rests = []                                         // idle-position functions, re-run when shown

    // ---- sticks: floating — the base appears where the thumb lands inside its half of the screen
    for (const s of opt.sticks || []) {
      const side = s.side === 'right' ? 'r' : 'l'
      const zone = el('div', 'tk-zone ' + side, root)
      if (s.zone) Object.assign(zone.style, s.zone)
      const base = el('div', 'tk-base', zone), knob = el('div', 'tk-knob', base)
      if (s.label) el('div', 'tk-lab', knob, s.label)
      const R = s.radius || 52, dz = s.deadzone == null ? 0.3 : s.deadzone
      const keys = s.keys === 'wasd' ? { up: 'KeyW', down: 'KeyS', left: 'KeyA', right: 'KeyD' }
        : s.keys === 'arrows' ? { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight' } : s.keys || null
      const st = { x: 0, y: 0, on: false, pid: null, cx: 0, cy: 0, dirs: {} }
      api.sticks[s.id || side] = st
      const rest = () => {                                   // idle hint position; keeps clear of the bottom-right buttons
        const zr = zone.getBoundingClientRect(); let x = side === 'l' ? 96 : zr.width - 96
        if (side === 'r' && groups.br) { const gr = groups.br.getBoundingClientRect(); if (gr.width) x = Math.min(x, gr.left - zr.left - 80) }
        base.style.left = x + 'px'; base.style.top = (zr.height - 110) + 'px'
      }
      const setDirs = (want) => {
        if (!keys) return
        for (const d of ['up', 'down', 'left', 'right']) {
          if (want[d] && !st.dirs[d]) { st.dirs[d] = true; press(keys[d]) }
          else if (!want[d] && st.dirs[d]) { st.dirs[d] = false; release(keys[d]) }
        }
      }
      const move = (px, py) => {
        let dx = px - st.cx, dy = py - st.cy; const d = Math.hypot(dx, dy)
        if (d > R) { dx *= R / d; dy *= R / d }
        knob.style.transform = `translate(${dx}px,${dy}px)`
        st.x = dx / R; st.y = dy / R
        const m = Math.hypot(st.x, st.y), a = Math.atan2(st.y, st.x)
        const want = { up: false, down: false, left: false, right: false }
        if (m > dz) { const oct = Math.round(a / (Math.PI / 4)); // 8 directions
          want.right = [0, 1, -1].includes(oct); want.left = [4, -4, 3, -3].includes(oct); want.down = [1, 2, 3].includes(oct); want.up = [-1, -2, -3].includes(oct) }
        setDirs(want)
        if (s.onMove) s.onMove(st.x, st.y, true)
      }
      zone.addEventListener('pointerdown', e => {
        if (st.pid !== null) return
        e.preventDefault(); st.pid = e.pointerId; try { zone.setPointerCapture(e.pointerId) } catch (x) {}
        const zr = zone.getBoundingClientRect(); st.cx = e.clientX; st.cy = e.clientY
        base.style.left = (e.clientX - zr.left) + 'px'; base.style.top = (e.clientY - zr.top) + 'px'
        base.classList.add('on'); st.on = true; move(e.clientX, e.clientY)
        if (s.onStart) s.onStart()
      })
      zone.addEventListener('pointermove', e => { if (e.pointerId === st.pid) { e.preventDefault(); move(e.clientX, e.clientY) } })
      const end = e => {
        if (e.pointerId !== st.pid) return
        st.pid = null; st.on = false; st.x = st.y = 0; knob.style.transform = ''; base.classList.remove('on'); setDirs({}); rest()
        if (s.onMove) s.onMove(0, 0, false); if (s.onEnd) s.onEnd()
      }
      zone.addEventListener('pointerup', end); zone.addEventListener('pointercancel', end)
      st.reset = () => { if (st.pid !== null) end({ pointerId: st.pid }) }
      rests.push(rest); requestAnimationFrame(rest); addEventListener('resize', rest)
    }

    // ---- buttons: grouped by place (default bottom-right cluster)
    const groups = {}
    for (const b of opt.buttons || []) {
      const place = b.place || 'bottom-right', code = { 'bottom-right': 'br', 'top-right': 'tr', 'top-left': 'tl', 'bottom-left': 'bl' }[place] || 'br'
      if (!groups[code]) groups[code] = el('div', 'tk-btns ' + code, root)
      let parent = groups[code]
      if (code === 'br' && b.row != null) { parent = groups['br' + b.row] || (groups['br' + b.row] = el('div', 'tk-row', groups.br)) }
      const btn = el('div', 'tk-btn' + (b.size ? ' ' + b.size : ''), parent, (b.icon ? `<i>${b.icon}</i>` : '') + (b.label ? `<span>${b.label}</span>` : ''))
      const bs = { down: false, pid: null, el: btn }
      api.buttons[b.id || b.label] = bs
      const down = e => {
        e.preventDefault(); e.stopPropagation()
        if (b.toggle) { bs.down = !bs.down; btn.classList.toggle('on', bs.down); if (b.key) (bs.down ? press : release)(b.key); (bs.down ? b.onDown : b.onUp) && (bs.down ? b.onDown : b.onUp)(); return }
        if (bs.pid !== null) return
        bs.pid = e.pointerId; try { btn.setPointerCapture(e.pointerId) } catch (x) {}
        bs.down = true; btn.classList.add('on')
        if (b.key) { if (b.tap) tapKey(b.key); else press(b.key) }
        if (b.onDown) b.onDown()
        if (navigator.vibrate && b.buzz !== false) try { navigator.vibrate(8) } catch (x) {}
      }
      const up = e => {
        suppressClick()
        if (b.toggle || e.pointerId !== bs.pid) return
        bs.pid = null; bs.down = false; btn.classList.remove('on')
        if (b.key && !b.tap) release(b.key)
        if (b.onUp) b.onUp()
      }
      btn.addEventListener('pointerdown', down); btn.addEventListener('pointerup', up); btn.addEventListener('pointercancel', up)
      btn.addEventListener('contextmenu', e => e.preventDefault())
    }

    // ---- portrait → ask to rotate (can be dismissed)
    let rot = null, rotDismissed = false                      // once dismissed, show(true) must not bring the hint back
    if (opt.landscape) {
      rot = el('div', 'tk-rot', document.body, `<b>⟳</b><div>${opt.rotateText || '휴대폰을 가로로 돌려 주세요'}<br><small style="opacity:.6">Rotate your phone</small></div><button type="button">그래도 세로로 하기</button>`)
      rot.querySelector('button').addEventListener('click', () => { rotDismissed = true; rot.classList.remove('need') })
    }

    // ---- page hygiene for touch play: no pinch/double-tap zoom, no pull-to-refresh, no long-press menu on the game
    if (opt.preventGestures !== false) {
      document.documentElement.style.overscrollBehavior = 'none'
      document.addEventListener('gesturestart', e => e.preventDefault())
      let lastT = 0
      document.addEventListener('touchend', e => { const now = Date.now(); if (now - lastT < 300 && !(e.target.closest && e.target.closest('input,textarea,select,a,button'))) e.preventDefault(); lastT = now }, { passive: false })
    }

    api.show = on => {
      api.visible = on; root.classList.toggle('tk-off', !on); if (on) requestAnimationFrame(() => rests.forEach(f => f())); if (rot) rot.classList.toggle('need', on && !!opt.landscape && !rotDismissed)
      if (!on) { for (const s of Object.values(api.sticks)) s.reset && s.reset(); for (const [code] of held) sendKey('keyup', code); held.clear()
        for (const b of Object.values(api.buttons)) { b.down = false; b.pid = null; b.el.classList.remove('on') } }
    }
    api.stick = id => api.sticks[id] || { x: 0, y: 0, on: false }
    api.pressed = id => !!(api.buttons[id] && api.buttons[id].down)
    api.destroy = () => { api.show(false); root.remove(); if (rot) rot.remove() }
    const mode = opt.show || 'auto'
    api.show(mode === 'always' || (mode === 'auto' && isTouch()))
    if (mode === 'auto' && !api.visible) addEventListener('touchstart', function once() { removeEventListener('touchstart', once); api.show(true) }, { passive: true })
    return api
  }

  // Helpers for games that read the mouse: fire mouse events at a point (client coords).
  function mouse(target, type, x, y, extra) {
    const ev = new MouseEvent(type, Object.assign({ clientX: x, clientY: y, bubbles: true, cancelable: true, button: 0, buttons: type === 'mouseup' ? 0 : 1 }, extra || {}))
    ;(target || document.elementFromPoint(x, y) || document).dispatchEvent(ev)
  }
  // Resume every AudioContext the game creates, on the first real touch (iOS/Android need a user gesture).
  function unlockAudio() {
    const ctxs = new Set(), AC = window.AudioContext || window.webkitAudioContext
    if (AC && !AC.__tk) { const W = function (...a) { const c = new AC(...a); ctxs.add(c); return c }; W.prototype = AC.prototype; W.__tk = true; window.AudioContext = W; if (window.webkitAudioContext) window.webkitAudioContext = W }
    const go = () => { for (const c of ctxs) if (c.state === 'suspended') c.resume().catch(() => {}) }
    addEventListener('pointerdown', go, true); addEventListener('touchend', go, true)
  }
  window.TouchKit = { create, press, release, tapKey, sendKey, mouse, unlockAudio, isTouch }
})()
</script>
<!-- touch-kit:end -->

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function formatNum(n) { return Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function formatMoney(n) { return '₩' + formatNum(n); }
function enemyHpMul(level) { return Math.pow(CONFIG.difficulty.hpGrowth, Math.max(0, level - 1)); }
function enemyDmgMul(level) { return Math.min(1 + CONFIG.difficulty.dmgGrowth * (level - 1), CONFIG.difficulty.dmgGrowthCap); }
function rewardForKill(type, level) { return Math.round(CONFIG.economy.reward[type] * Math.pow(CONFIG.economy.rewardGrowth, Math.max(0, level - 1))); }
function spawnRate(level) { return Math.min(CONFIG.difficulty.spawnBase + CONFIG.difficulty.spawnPerLevel * (level - 1), CONFIG.difficulty.spawnCap); }
function maxAlive(level) { return Math.min(CONFIG.difficulty.aliveBase + CONFIG.difficulty.alivePerLevel * (level - 1), CONFIG.difficulty.aliveCap); }
function largeRatio(level) { return Math.min(CONFIG.difficulty.largeRatioBase + CONFIG.difficulty.largeRatioPerLevel * (level - 1), CONFIG.difficulty.largeRatioCap); }
function mediumRatio(level) { return Math.min(CONFIG.difficulty.mediumRatioBase + CONFIG.difficulty.mediumRatioPerLevel * (level - 1), CONFIG.difficulty.mediumRatioCap); }
function pickEnemyType(level, r) {

// ---------- 업그레이드/경제 곡선 (순수) ----------
function upgradeCost(base, growth, n) { return Math.ceil(base * Math.pow(growth, n)); }
function weaponUpCost(price, n) {

  return upgradeCost(Math.max(price * u.costFactor, u.costMin), u.costGrowth, n);
}
function weaponDmgMul(n) { return Math.pow(CONFIG.upgrades.weapon.dmgGrowth, n); }
function turretDmgMul(n) { return Math.pow(CONFIG.upgrades.turret.dmgGrowth, n); }
// ---------- 밸런스 모델 (불변식 테스트용, 보수적 하한: 소형만 잡는다고 가정) ----------
function modelIncomePerLevel(L) {
  return CONFIG.difficulty.levelTime * spawnRate(L) * rewardForKill('small', L);
}
function modelCumIncome(L) {
  let s = 0;
  for (let i = 1; i <= L; i++) s += modelIncomePerLevel(i);
  return s;
}
function flamerRangeAt(baseRange, n) { return baseRange * Math.pow(CONFIG.upgrades.weapon.flamerRangeGrowth, n); }
function healCost(level) { return Math.ceil(CONFIG.economy.healBase * Math.pow(CONFIG.economy.healGrowth, Math.max(0, level - 1))); }
function shieldMaxAt(lv) {
  const s = CONFIG.upgrades.shield;
  return lv <= 0 ? 0 : s.first + s.perLevel * (lv - 1);
}

// 공간 분할 해시 — Int32 연결 리스트, GC 프리
class SpatialHash {
  constructor(cell, w, h, cap) {
    this.cell = cell;
    this.cols = Math.max(1, Math.ceil(w / cell));
    this.rows = Math.max(1, Math.ceil(h / cell));
    this.heads = new Int32Array(this.cols * this.rows).fill(-1);
    this.next = new Int32Array(cap).fill(-1);
    this.results = new Int32Array(cap);
  }
  clear() { this.heads.fill(-1); }
  insert(idx, x, y) {
    let cx = (x / this.cell) | 0, cy = (y / this.cell) | 0;
    if (cx < 0) cx = 0; else if (cx >= this.cols) cx = this.cols - 1;
    if (cy < 0) cy = 0; else if (cy >= this.rows) cy = this.rows - 1;
    const c = cy * this.cols + cx;
    this.next[idx] = this.heads[c];
    this.heads[c] = idx;
  }
  // 셀 단위 후보 반환(정밀 거리 판정은 호출자 몫). results에 채우고 개수 리턴.
  query(x, y, r) {
    let n = 0;
    let x0 = ((x - r) / this.cell) | 0, x1 = ((x + r) / this.cell) | 0;
    let y0 = ((y - r) / this.cell) | 0, y1 = ((y + r) / this.cell) | 0;
    if (x0 < 0) x0 = 0; if (y0 < 0) y0 = 0;
    if (x1 >= this.cols) x1 = this.cols - 1;
    if (y1 >= this.rows) y1 = this.rows - 1;
    for (let cy = y0; cy <= y1; cy++) {
      const row = cy * this.cols;
      for (let cx = x0; cx <= x1; cx++) {
        let i = this.heads[row + cx];
        while (i !== -1) { this.results[n++] = i; i = this.next[i]; }
      }
    }
    return n;
  }
}

if (typeof module !== 'undefined') {
  module.exports = { CONFIG, clamp, lerp, formatNum, formatMoney, enemyHpMul, enemyDmgMul,

    upgradeCost, weaponUpCost, weaponDmgMul, flamerRangeAt, healCost, shieldMaxAt,

}

      g.arc(-R * 0.3, 0, R * 0.42, a - 0.4, a + 0.4);
      g.closePath(); g.fill();
    }
    g.fillStyle = pal.hump;
    g.beginPath(); g.arc(-R * 0.3, 0, R * 0.12, 0, TAU); g.fill();
  }
}

function spriteRot(angle) {
  let i = Math.round(angle / TAU * ROT) % ROT;
  if (i < 0) i += ROT;
  return i;
}

function buildSprites() {
  for (const type of Object.keys(CONFIG.enemies)) {
    const R = CONFIG.enemies[type].radius;
    const S = Math.ceil(R * 5) + 2;
    const frames = [];
    for (let f = 0; f < 2; f++) {
      const base = document.createElement('canvas');
      base.width = base.height = S;
      const bg = base.getContext('2d');
      bg.translate(S / 2, S / 2);
      drawBug(bg, R, f, type);
      const rots = [];
      for (let a = 0; a < ROT; a++) {
        const c = document.createElement('canvas');
        c.width = c.height = S;
        const g = c.getContext('2d');
        g.translate(S / 2, S / 2);
        g.rotate(a * TAU / ROT);
        g.drawImage(base, -S / 2, -S / 2);
        rots.push(c);
      }
      frames.push(rots);
    }
    bugSprites[type] = { frames, size: S };
  }
  // 바리케이드 (빨간 X 나무 상자)
  barrSprite = document.createElement('canvas');
  barrSprite.width = barrSprite.height = GRID;
  {
    const g = barrSprite.getContext('2d');
    g.fillStyle = '#c59a55'; g.fillRect(0, 0, GRID, GRID);
    g.strokeStyle = '#8a6430'; g.lineWidth = 2;
    for (let i = 1; i < 3; i++) { g.beginPath(); g.moveTo(0, i * GRID / 3); g.lineTo(GRID, i * GRID / 3); g.stroke(); }
    g.strokeStyle = '#6d4c24'; g.lineWidth = 4; g.strokeRect(2, 2, GRID - 4, GRID - 4);
    g.strokeStyle = '#d42222'; g.lineWidth = 6; g.lineCap = 'round';
    g.beginPath(); g.moveTo(7, 7); g.lineTo(GRID - 7, GRID - 7); g.moveTo(GRID - 7, 7); g.lineTo(7, GRID - 7); g.stroke();
  }
  // 파손 크랙 오버레이
  crackSprite = document.createElement('canvas');
  crackSprite.width = crackSprite.height = GRID;
  {
    const g = crackSprite.getContext('2d');
    g.strokeStyle = 'rgba(25,12,4,0.85)'; g.lineWidth = 2; g.lineCap = 'round';
    for (let i = 0; i < 5; i++) {
      let x = GRID / 2 + rand(-6, 6), y = GRID / 2 + rand(-6, 6);
      g.beginPath(); g.moveTo(x, y);
      for (let k = 0; k < 3; k++) { x += rand(-14, 14); y += rand(-14, 14); g.lineTo(clamp(x, 2, GRID - 2), clamp(y, 2, GRID - 2)); }
      g.stroke();
    }
  }
}

// 지면 캔버스 — 잔디 + 핏자국/시체 데칼을 여기에 구움 (개별 엔티티 금지)
// ============================================================
const groundC = document.createElement('canvas');
groundC.width = MAP_W; groundC.height = MAP_H;
const gctx = groundC.getContext('2d');

function bakeGround() {
  gctx.globalAlpha = 1;
  gctx.fillStyle = '#4aa72e';
  gctx.fillRect(0, 0, MAP_W, MAP_H);
  for (let i = 0; i < 160; i++) { // 큰 얼룩
    gctx.fillStyle = 'rgba(' + ((30 + Math.random() * 40) | 0) + ',' + ((110 + Math.random() * 50) | 0) + ',' + ((20 + Math.random() * 30) | 0) + ',0.07)';
    gctx.beginPath();
    gctx.arc(Math.random() * MAP_W, Math.random() * MAP_H, 80 + Math.random() * 260, 0, TAU);
    gctx.fill();
  }
  for (let i = 0; i < 22000; i++) { // 풀잎 노이즈
    const s = 1 + Math.random() * 3;
    gctx.fillStyle = Math.random() < 0.5 ? 'rgba(30,90,15,0.18)' : 'rgba(120,210,80,0.15)';
    gctx.fillRect(Math.random() * MAP_W, Math.random() * MAP_H, s, s);
  }
  gctx.strokeStyle = 'rgba(0,0,0,0.35)'; gctx.lineWidth = 8;
  gctx.strokeRect(4, 4, MAP_W - 8, MAP_H - 8);
}

function bakeKill(e) {
  const g = gctx, R = e.r;
  const glow = !!e.cfg.glow; // 방사능 개체는 녹색 체액
  for (let i = 0; i < 5; i++) { // 핏자국
    const a = Math.random() * TAU, d = Math.random() * R * 1.6;
    g.fillStyle = glow
      ? 'rgba(40,' + ((150 + Math.random() * 60) | 0) + ',40,' + (0.25 + Math.random() * 0.3).toFixed(2) + ')'
      : 'rgba(' + ((140 + Math.random() * 50) | 0) + ',10,10,' + (0.25 + Math.random() * 0.3).toFixed(2) + ')';
    g.beginPath();
    g.ellipse(e.x + Math.cos(a) * d, e.y + Math.sin(a) * d, R * (0.3 + Math.random() * 0.7), R * (0.2 + Math.random() * 0.5), a, 0, TAU);
    g.fill();
  }
  const ka = (e.lhx || e.lhy) ? Math.atan2(e.lhy, e.lhx) : Math.random() * TAU;
  for (let i = 0; i < 4; i++) { // 피격 방향으로 튄 핏방울
    const d = R + Math.random() * R * 3, a = ka + (Math.random() - 0.5) * 0.9;
    g.fillStyle = glow ? 'rgba(45,170,45,0.4)' : 'rgba(150,12,10,0.4)';
    g.beginPath(); g.arc(e.x + Math.cos(a) * d, e.y + Math.sin(a) * d, 1 + Math.random() * 3, 0, TAU); g.fill();
  }
  // 시체 데칼
  const spr = bugSprites[e.type], S = spr.size;
  g.globalAlpha = 0.85;
  g.drawImage(spr.frames[1][spriteRot(e.angle)], e.x - S / 2, e.y - S / 2);
  g.globalAlpha = 1;
  g.fillStyle = 'rgba(90,8,6,0.5)';
  g.beginPath(); g.ellipse(e.x, e.y, R * 0.9, R * 0.6, e.angle, 0, TAU); g.fill();
}

function bakeCrater(x, y, r) {
  gctx.fillStyle = 'rgba(25,20,10,0.25)';
  gctx.beginPath(); gctx.arc(x, y, r * 0.6, 0, TAU); gctx.fill();
}

function bakeNukeScorch(x, y) { // 핵폭발 그을음 — 한 번에 구워서 프레임 보호
  gctx.fillStyle = 'rgba(30,26,14,0.5)';
  gctx.beginPath(); gctx.arc(x, y, 340, 0, TAU); gctx.fill();
  gctx.fillStyle = 'rgba(20,18,10,0.35)';
  gctx.beginPath(); gctx.arc(x, y, 180, 0, TAU); gctx.fill();
  for (let i = 0; i < 90; i++) {
    const a = Math.random() * TAU, d = 340 + Math.random() * 900;
    gctx.fillStyle = 'rgba(25,22,12,' + (0.06 + Math.random() * 0.16).toFixed(2) + ')';
    gctx.beginPath(); gctx.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, 20 + Math.random() * 70, 0, TAU); gctx.fill();
  }
}

// 원 vs 설치물 충돌 — 밀어낸 좌표와 충돌 대상 반환 (스크래치 객체 재사용)
const colRes = { x: 0, y: 0, s: null };
function collideStructs(x, y, r) {
  colRes.s = null; colRes.x = x; colRes.y = y;
  const x0 = clamp(((x - r) / GRID) | 0, 0, GC - 1), x1 = clamp(((x + r) / GRID) | 0, 0, GC - 1);
  const y0 = clamp(((y - r) / GRID) | 0, 0, GR - 1), y1 = clamp(((y + r) / GRID) | 0, 0, GR - 1);
  for (let cy = y0; cy <= y1; cy++) {
    for (let cx = x0; cx <= x1; cx++) {
      const s = structGrid[cy * GC + cx];
      if (!s) continue;
      if (s.kind === 1) {
        const bx = cx * GRID, by = cy * GRID;
        const nx = clamp(colRes.x, bx, bx + GRID), ny = clamp(colRes.y, by, by + GRID);
        let dx = colRes.x - nx, dy = colRes.y - ny;
        const d2 = dx * dx + dy * dy;
        if (d2 < r * r) {
          if (d2 === 0) {
            const dl = colRes.x - bx, dr = bx + GRID - colRes.x, dt2 = colRes.y - by, db = by + GRID - colRes.y;
            const mn = Math.min(dl, dr, dt2, db);
            if (mn === dl) colRes.x = bx - r;
            else if (mn === dr) colRes.x = bx + GRID + r;
            else if (mn === dt2) colRes.y = by - r;
            else colRes.y = by + GRID + r;
          } else {
            const d = Math.sqrt(d2);
            colRes.x = nx + dx / d * r; colRes.y = ny + dy / d * r;
          }
          colRes.s = s;
        }
      } else {
        const rr = r + CONFIG.turret.radius;
        let dx = colRes.x - s.x, dy = colRes.y - s.y;
        const d2 = dx * dx + dy * dy;
        if (d2 < rr * rr) {
          const d = Math.sqrt(d2) || 0.001;
          colRes.x = s.x + dx / d * rr; colRes.y = s.y + dy / d * rr;
          colRes.s = s;
        }
      }
    }
  }
  return colRes.s ? colRes : null;
}

// ============================================================
function computeCam() { // 월드 시야(VWW×VHW) 기준 — 데스크톱은 화면 크기와 같음
  camX = MAP_W <= VWW ? (MAP_W - VWW) / 2 : clamp(player.x - VWW / 2, 0, MAP_W - VWW);
  camY = MAP_H <= VHW ? (MAP_H - VHW) / 2 : clamp(player.y - VHW / 2, 0, MAP_H - VHW);
}

function shake(m) { if (m > shakeMag) shakeMag = m; }

// 피해는 보호막부터 소모. aura 옵션 = 지속 틱뎀(전역 피격 쿨다운/연출 스팸 없이)
function damagePlayer(d, aura) {
  player.sinceHurt = 0; // 보호막 회복 대기시간 리셋 (아우라 안에서는 리젠 불가)
  if (player.shield > 0) {
    const ab = Math.min(player.shield, d);
    player.shield -= ab;
    d -= ab;
    shieldFlash = 0.3;
    SFX.shieldHit();
    if (player.shield <= 0) {
      player.shield = 0;
      SFX.shieldBreak();
      addFloat(player.x, player.y - 26, '보호막 파괴!', '#6cc7ff', 15);
    }
    if (d <= 0) {
      if (!aura) player.hurtCd = CONFIG.player.hurtCooldown;
      return;
    }
  }
  player.hp -= d;
  if (!aura) {
    player.hurtCd = CONFIG.player.hurtCooldown;
    hurtFlash = 0.35;
    shake(2);
    SFX.hurt();
  }
  if (player.hp <= 0) { player.hp = 0; gameOver(); }
}

function gameOver() {
  state = ST.OVER;
  firing = false; placing = null; shopOpen = false; icbm = null;
  clearSave(); // 런 종료 — 이어하기 대상 아님
  SFX.gameover();
  newBest = score > best.score;
  if (newBest) best.score = score;
  if (level > best.level) best.level = level;
  try { localStorage.setItem('gopdungi_best', JSON.stringify(best)); } catch (e) {}
}

function getWeapon() { return CONFIG.weapons[player.slot]; }
function getAmmo() { return player.ammo[player.slot]; }

function updatePlayer(dt) {
  const sp = playerSpeed();
  let dx = 0, dy = 0;
  if (keys.KeyW) dy -= 1;
  if (keys.KeyS) dy += 1;
  if (keys.KeyA) dx -= 1;
  if (keys.KeyD) dx += 1;
  if (touchMove.on) { dx = touchMove.x; dy = touchMove.y; } // 왼쪽 스틱: 모든 방향, 키보드와 같은 속도
  if (dx || dy) {
    const il = 1 / Math.hypot(dx, dy);
    player.x += dx * il * sp * dt;
    player.y += dy * il * sp * dt;
  }
  player.x = clamp(player.x, player.r, MAP_W - player.r);
  player.y = clamp(player.y, player.r, MAP_H - player.r);
  for (let k = 0; k < 2; k++) { // 코너 처리를 위해 2회 반복
    const col = collideStructs(player.x, player.y, player.r);
    if (!col) break;
    player.x = col.x; player.y = col.y;
  }
  player.aim = Math.atan2(mouse.wy - player.y, mouse.wx - player.x);
  player.hurtCd -= dt;
  player.sinceHurt += dt;
  // HP 자동회복 없음 — 보호막만 무피격 후 자동 회복
  const sm = shieldMax();
  if (sm > 0 && player.sinceHurt > CONFIG.upgrades.shield.regenDelay && player.shield < sm) {
    if (shieldWasFull) { shieldWasFull = false; SFX.shieldUp(); } // 회복 시작 피드백
    player.shield = Math.min(sm, player.shield + CONFIG.upgrades.shield.regenRate * dt);
  } else if (player.shield >= sm) shieldWasFull = true;
  // 발사 (ICBM은 클릭 시퀀스 전용 — 홀드 발사 제외)
  player.fireCd -= dt;
  const canFire = firing && !placing && !paused && getWeapon().kind !== 'icbm';
  if (canFire) {
    if (player.fireCd <= 0) {
      if (getAmmo() <= 0) {
        SFX.dry();
        player.fireCd = 0.3;
        if (playT - noAmmoT > 2) { noAmmoT = playT; addFloat(player.x, player.y - 30, TOUCH_UI ? '탄약 없음! (상점: 탄약 구매)' : '탄약 없음! (E: 탄약 구매)', '#ff7b6b', 15); }
      } else {
        fireWeapon();
      }
    }
  } else if (player.fireCd < 0) player.fireCd = 0;
}

let smokeCounter = 0;
function fireWeapon() {
  const w = getWeapon();
  player.fireCd += 60 / w.rpm;
  if (player.fireCd < 0) player.fireCd = 0;
  if (player.ammo[player.slot] !== Infinity) player.ammo[player.slot]--;
  const mx = player.x + Math.cos(player.aim) * (player.r + 14);
  const my = player.y + Math.sin(player.aim) * (player.r + 14);
  const dm = weaponDmgMul(wUp[player.slot] || 0);
  for (let i = 0; i < w.pellets; i++) {
    const a = player.aim + (Math.random() * 2 - 1) * w.spread * DEG;
    if (w.kind === 'flame') { // 사거리(업그레이드 반영)를 수명으로 환산
      spawnBullet(mx, my, a, w, false, 1, (flamerRange() / w.speed) * rand(0.75, 1.05));
    } else {
      spawnBullet(mx, my, a, w, false, dm);
    }
  }
  addParticle(3, mx, my, 0, 0, 0.05, 9 + w.pellets);
  if (++smokeCounter % 4 === 0) addParticle(2, mx, my, Math.cos(player.aim) * 30 + rand(-15, 15), Math.sin(player.aim) * 30 + rand(-15, 15), rand(0.4, 0.7), rand(3, 6));
  if (w.id === 'shotgun') shake(1.5);
  if (w.kind === 'rocket') shake(3);
  SFX.shot(w.kind);
}

function updateEnemies(dt) {
  const kbDecay = Math.min(1, dt * 7);
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.hp <= 0) continue;
    e.hitFlash -= dt;
    e.pAtkCd -= dt;
    e.kbx *= 1 - kbDecay;
    e.kby *= 1 - kbDecay;
    if (e.state === 1) { // 도약 중
      e.timer -= dt;
      const p = 1 - Math.max(0, e.timer) / e.dur;
      e.hopP = p;
      const ease = (1 - p) * (1 - p) * 2.0 + 0.15;
      let nx = clamp(e.x + (e.vx * ease + e.kbx) * dt, e.r, MAP_W - e.r);
      let ny = clamp(e.y + (e.vy * ease + e.kby) * dt, e.r, MAP_H - e.r);
      const col = collideStructs(nx, ny, e.r);
      if (col) {
        e.x = col.x; e.y = col.y;
        e.tgtS = col.s;
        e.state = 2; e.timer = 0.15 + Math.random() * 0.2; e.hopP = 0;
      } else {
        e.x = nx; e.y = ny;
        if (e.timer <= 0) {
          e.state = 0; e.hopP = 0;
          e.timer = rand(e.cfg.idleDur[0], e.cfg.idleDur[1]);
        }
      }
    } else {
      if (e.kbx || e.kby) { // 멈춘 상태에서도 넉백은 적용
        let nx = clamp(e.x + e.kbx * dt, e.r, MAP_W - e.r);
        let ny = clamp(e.y + e.kby * dt, e.r, MAP_H - e.r);
        const col = collideStructs(nx, ny, e.r);
        if (col) { e.x = col.x; e.y = col.y; } else { e.x = nx; e.y = ny; }
      }
      e.timer -= dt;
      if (e.state === 2) { // 설치물 갉기
        const s = e.tgtS;
        if (!s || s.hp <= 0) { e.state = 0; e.timer = 0.1; e.tgtS = null; }
        else {
          const reach = e.r + (s.kind === 1 ? GRID * 0.75 : CONFIG.turret.radius + 6);
          const dx = s.x - e.x, dy = s.y - e.y;
          e.angle = Math.atan2(dy, dx);
          if (dx * dx + dy * dy > reach * reach * 1.44) { e.state = 0; e.timer = 0.05; e.tgtS = null; }
          else if (e.timer <= 0) {
            s.hp -= e.structDmg;
            e.timer = e.cfg.atkCd;
            SFX.bite();
            addParticle(5, s.x + rand(-8, 8), s.y + rand(-8, 8), rand(-60, 60), rand(-60, 60), 0.3, 2);
            if (s.hp <= 0) destroyStruct(s);
          }
        }
      } else if (e.timer <= 0) { // 대기 → 도약 시작 (곱등이 특유의 불규칙 점프)
        let ta;
        if (Math.random() < e.cfg.panic) ta = Math.random() * TAU;
        else ta = Math.atan2(player.y - e.y, player.x - e.x) + (Math.random() * 2 - 1) * e.cfg.dev;
        e.angle = ta;
        e.dur = rand(e.cfg.hopDur[0], e.cfg.hopDur[1]);
        e.timer = e.dur;
        e.state = 1; e.hopP = 0;
        e.vx = Math.cos(ta) * e.speed;
        e.vy = Math.sin(ta) * e.speed;
      }
    }
    // 플레이어 접촉 공격
    const rr = e.r + player.r + 2;
    if (dist2(e.x, e.y, player.x, player.y) < rr * rr) {
      if (e.pAtkCd <= 0 && player.hurtCd <= 0 && state === ST.PLAY) {
        damagePlayer(e.dmg);
        e.pAtkCd = e.cfg.atkCd;
      }
    }
  }
}

function rebuildHash() {
  ehash.clear();
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    ehash.insert(e.poolIndex, e.x, e.y);
  }
}

function findNearestEnemy(x, y, range) {
  const n = ehash.query(x, y, range);
  let bestE = null, bestD = range * range;
  for (let k = 0; k < n; k++) {
    const e = enemyPool[ehash.results[k]];
    if (!e.active || e.hp <= 0) continue;
    const d = dist2(x, y, e.x, e.y);
    if (d < bestD) { bestD = d; bestE = e; }
  }
  return bestE;
}

function updateTurrets(dt) {
  const tc = CONFIG.turret;
  for (let i = 0; i < structures.length; i++) {
    const s = structures[i];
    if (s.kind !== 2) continue;
    s.cd -= dt;
    s.ret -= dt;
    s.recoil = Math.max(0, s.recoil - dt * 10);
    if (s.ret <= 0 || !s.target || !s.target.active || s.target.hp <= 0) {
      s.ret = tc.retarget;
      s.target = findNearestEnemy(s.x, s.y, tc.range);
    }
    const t = s.target;
    if (!t) { s.cd = Math.max(s.cd, 0); continue; }
    const dx = t.x - s.x, dy = t.y - s.y;
    if (dx * dx + dy * dy > tc.range * tc.range) { s.target = null; continue; }
    s.angle = angleLerp(s.angle, Math.atan2(dy, dx), dt * 10);
    if (s.cd <= 0) {
      s.cd += 60 / tc.rpm;
      if (s.cd < 0) s.cd = 0;
      const mx = s.x + Math.cos(s.angle) * 20, my = s.y + Math.sin(s.angle) * 20;
      spawnBullet(mx, my, s.angle + rand(-0.03, 0.03), tc, true, turretDmgMul(tUp));
      s.recoil = 1;
      SFX.tshot();
      if (onCam(s.x, s.y, 40)) addParticle(3, mx, my, 0, 0, 0.04, 7);
    }
  }
}

function explode(b) {
  const aoe = b.aoe || 100;
  SFX.boom();
  shake(7);
  bakeCrater(b.x, b.y, aoe);
  addParticle(3, b.x, b.y, 0, 0, 0.12, aoe * 0.7);
  for (let i = 0; i < 18; i++) {
    const a = Math.random() * TAU, sp = rand(100, 400);
    addParticle(4, b.x, b.y, Math.cos(a) * sp, Math.sin(a) * sp, rand(0.2, 0.5), rand(3, 7));
  }
  for (let i = 0; i < 8; i++) addParticle(2, b.x + rand(-20, 20), b.y + rand(-20, 20), rand(-40, 40), rand(-40, 40), rand(0.5, 1), rand(8, 16));
  const n = ehash.query(b.x, b.y, aoe + MAX_ER);
  for (let k = 0; k < n; k++) {
    const e = enemyPool[ehash.results[k]];
    if (!e.active || e.hp <= 0) continue;
    const d = Math.sqrt(dist2(b.x, b.y, e.x, e.y));
    if (d > aoe + e.r) continue;
    const fall = 1 - b.falloff * clamp(d / aoe, 0, 1);
    e.hp -= (b.dmg + e.maxHp * b.hpBonus) * fall;
    e.hitFlash = 0.1;
    const il = 1 / Math.max(1, d);
    e.kbx += (e.x - b.x) * il * b.kb;
    e.kby += (e.y - b.y) * il * b.kb;
    e.lhx = e.x - b.x; e.lhy = e.y - b.y;
    if (e.hp <= 0) killEnemy(e);
  }
}

function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.life -= dt;
    b.px = b.x; b.py = b.y;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    if (b.kind === 2) addParticle(4, b.x - b.ux * 8, b.y - b.uy * 8, rand(-20, 20), rand(-20, 20), 0.25, rand(3, 5));
    let dead = false;
    if (b.life <= 0 || b.x < 0 || b.y < 0 || b.x > MAP_W || b.y > MAP_H) {
      if (b.kind === 2) explode(b);
      dead = true;
    } else {
      const mx = (b.x + b.px) / 2, my = (b.y + b.py) / 2;
      const halfSeg = Math.hypot(b.x - b.px, b.y - b.py) / 2;
      const n = ehash.query(mx, my, halfSeg + MAX_ER);
      for (let k = 0; k < n; k++) {
        const e = enemyPool[ehash.results[k]];
        if (!e.active || e.hp <= 0) continue;
        if (b.hits.indexOf(e.poolIndex) !== -1) continue;
        if (!segCircle(b.px, b.py, b.x, b.y, e.x, e.y, e.r + 2)) continue;
        b.hits.push(e.poolIndex);
        if (b.kind === 2) { explode(b); dead = true; break; }
        e.hp -= b.dmgPct ? e.maxHp * b.dmgPct : b.dmg;
        e.hitFlash = 0.08;
        const kbm = b.kb / e.cfg.kbResist;
        e.kbx += b.ux * kbm;
        e.kby += b.uy * kbm;
        e.lhx = b.vx; e.lhy = b.vy;
        if (b.kind === 0 && onCam(e.x, e.y, 40)) addParticle(1, e.x, e.y, b.ux * 60 + rand(-40, 40), b.uy * 60 + rand(-40, 40), rand(0.15, 0.3), rand(1.5, 3));
        if (e.hp <= 0) killEnemy(e);
        if (b.pierce <= 0) { dead = true; break; }
        b.pierce--;
      }
    }
    if (dead) freeBullet(i);
  }
}

function updateParticles(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt;
    if (p.life <= 0) {
      const l = parts.pop();
      if (l !== p) parts[i] = l;
      freeParts.push(p);
      continue;
    }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 1 - Math.min(1, dt * 4);
    p.vy *= 1 - Math.min(1, dt * 4);
  }
}

function updateFloats(dt) {
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i];
    f.life -= dt;
    f.y -= 46 * dt;
    if (f.life <= 0) floats.splice(i, 1);
  }
}

function trySpawn() {
  if (enemies.length >= maxAlive(level)) return;
  const type = (eliteUnlocked && Math.random() < CONFIG.elite.rate)
    ? 'elite' : pickEnemyType(level, Math.random());
  const r = CONFIG.enemies[type].radius;
  for (let t = 0; t < 6; t++) {
    const side = (Math.random() * 4) | 0;
    let x, y;
    if (side === 0) { x = rand(r, MAP_W - r); y = r + 4; }
    else if (side === 1) { x = rand(r, MAP_W - r); y = MAP_H - r - 4; }
    else if (side === 2) { x = r + 4; y = rand(r, MAP_H - r); }
    else { x = MAP_W - r - 4; y = rand(r, MAP_H - r); }
    const sd = CONFIG.difficulty.spawnSafeDist;
    if (t === 5 || dist2(x, y, player.x, player.y) > sd * sd) {
      spawnEnemy(type, x, y);
      return;
    }
  }
}

function updateSpawner(dt) {
  levelT += dt;
  playT += dt;
  if (levelT >= CONFIG.difficulty.levelTime) {
    levelT -= CONFIG.difficulty.levelTime;
    level++;
    SFX.levelup();
    addFloat(player.x, player.y - 60, 'LEVEL ' + level + '!', '#7cff6a', 26);
    const burst = Math.min(CONFIG.difficulty.burstOnLevelUp + level, CONFIG.difficulty.burstCap);
    for (let i = 0; i < burst; i++) trySpawn();
    while (level >= nextBossLevel) { // 20레벨마다 보스
      spawnBoss();
      nextBossLevel += CONFIG.boss.every;
    }
    writeSave();
  }
  spawnAcc += spawnRate(level) * dt;
  while (spawnAcc >= 1) { spawnAcc -= 1; trySpawn(); }
}

function spawnBoss() {
  const r = CONFIG.enemies.boss.radius;
  const side = (Math.random() * 4) | 0;
  let x, y;
  if (side === 0) { x = rand(r, MAP_W - r); y = r + 4; }
  else if (side === 1) { x = rand(r, MAP_W - r); y = MAP_H - r - 4; }
  else if (side === 2) { x = r + 4; y = rand(r, MAP_H - r); }
  else { x = MAP_W - r - 4; y = rand(r, MAP_H - r); }
  const e = spawnEnemy('boss', x, y);
  if (!e) return;
  bossCount++;
  bossWarnT = CONFIG.boss.warnDur;
  announce('⚠ 대왕 방사능 곱등이 출현! ⚠', '#7dff7d', CONFIG.boss.warnDur, 26);
  SFX.siren();
}

// 방사능 아우라 — 내부의 플레이어에게 최대 HP 비례 틱뎀 (보호막 먼저 소모, 리젠 대기 계속 리셋)
function updateAura(dt) {
  insideAura = false;
  if (!bossCount) return;
  const aR = CONFIG.boss.auraRadius;
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    if (e.type !== 'boss' || e.hp <= 0) continue;
    if (dist2(e.x, e.y, player.x, player.y) < aR * aR) {
      insideAura = true;
      damagePlayer(player.maxHp * CONFIG.boss.auraDpsPct * dt, true);
      auraFxT += dt;
      if (auraFxT > 0.3) { auraFxT = 0; hurtFlash = Math.max(hurtFlash, 0.12); shake(1); }
      SFX.aura();
      if (state !== ST.PLAY) return; // 사망 처리됨
    }
  }
}

function tryFireIcbm() {
  if (icbm) { SFX.dry(); return; }
  if (getAmmo() <= 0) {
    SFX.dry();
    addFloat(player.x, player.y - 30, TOUCH_UI ? '탄약 없음 — 핵물질로 구매 필요 (상점)' : '탄약 없음 — 핵물질로 구매 필요 (E/Tab)', '#ff7b6b', 15);
    return;
  }
  player.ammo[player.slot]--;
  icbm = { t: 0, x: mouse.wx, y: mouse.wy, done: false };
  SFX.siren();
  announce('⚠ ICBM 발사 — 탄도 접근 중 ⚠', '#ff6a5a', CONFIG.icbm.warnDur + CONFIG.icbm.aimDur, 24);
  writeSave();
}

function updateIcbm(dt) {
  if (!icbm) return;
  const c = CONFIG.icbm;
  icbm.t += dt;
  if (!icbm.done && icbm.t >= c.warnDur + c.aimDur) {
    icbm.done = true;
    detonateNuke(icbm.x, icbm.y);
  }
  if (icbm.t >= c.warnDur + c.aimDur + c.boomDur + 0.8) icbm = null;
}

function detonateNuke(x, y) {
  nukeSweep = true; nukeGold = 0; nukeKills = 0;
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.hp <= 0 || !e.active) continue;
    if (e.type === 'boss') { // 방사능 내성 — 최대 체력 50%만
      e.hp -= e.maxHp * CONFIG.icbm.bossDmgPct;
      e.hitFlash = 0.3;
      if (e.hp <= 0) killEnemy(e);
    } else {
      killEnemy(e);
    }
  }
  nukeSweep = false;
  money += nukeGold;
  bakeNukeScorch(x, y);
  shake(18);
  SFX.nuke();
  announce('핵 처치 ' + formatNum(nukeKills) + '마리 · +' + formatMoney(nukeGold), '#ffd94a', 4.5, 24);
  writeSave();
}

// 숫자키 홀드 자동 강화 — 1초 홀드 후 첫 강화, 이후 2초 간격 (Shift+숫자와 별개)
function updateDigitHold(dt) {
  if (!digitHold) return;
  if (state !== ST.PLAY || paused) return; // 루프 게이트와 별개의 방어선
  if (!keys[digitHold.code]) { digitHold = null; return; } // 안전망 (keyup 누락 대비)
  digitHold.t += dt;
  const w = CONFIG.weapons[digitHold.i];
  if (!player.owned[digitHold.i] || w.kind === 'icbm') return; // 미보유/ICBM은 홀드 무시
  const due = digitHold.fired === 0 ? CONFIG.input.holdUpgradeDelay : CONFIG.input.holdUpgradeInterval;
  if (digitHold.t >= due) {
    digitHold.t = 0;
    digitHold.fired++;
    handleAction({ t: 'upWeapon', i: digitHold.i });
  }
}

function update(dt) {
  lastDt = dt;
  computeCam();
  mouse.wx = mouse.x / ZOOM + camX;
  mouse.wy = mouse.y / ZOOM + camY;
  updateDigitHold(dt);
  updatePlayer(dt);
  updateEnemies(dt);
  rebuildHash();
  updateAura(dt);
  updateTurrets(dt);
  updateBullets(dt);
  updateParticles(dt);
  updateFloats(dt);
  updateFragItems();
  updateIcbm(dt);
  updateSpawner(dt);
  for (let i = announces.length - 1; i >= 0; i--) {
    announces[i].t -= dt;
    if (announces[i].t <= 0) announces.splice(i, 1);
  }
  bossWarnT = Math.max(0, bossWarnT - dt);
  shieldFlash = Math.max(0, shieldFlash - dt);
  hurtFlash = Math.max(0, hurtFlash - dt * 1.2);
  shakeMag = Math.max(0, shakeMag - dt * 18);
  saveTimer += dt; // 주기 자동 저장
  if (saveTimer >= CONFIG.save.interval) { saveTimer = 0; writeSave(); }
}

// ============================================================
// 상점 / 배치
// ============================================================
function cycleWeapon(dir) {
  const n = CONFIG.weapons.length;
  let i = player.slot;
  for (let k = 0; k < n; k++) {
    i = (i + dir + n) % n;
    if (player.owned[i]) { player.slot = i; return; }
  }
}
// 키보드 조작 피드백 — 상점 패널 없이 조작할 때 결과를 플레이어 머리 위에 표시
function fbFloat(txt, col) { addFloat(player.x, player.y - 34, txt, col || '#ff8a7a', 14); }

// 배치 모드 토글 (T 터렛 / B 바리케이드 / 상점 버튼 공용)
function togglePlace(kind) {
  if (placing && placing.kind === kind) { placing = null; return; }
  const price = kind === 2 ? CONFIG.turret.price : CONFIG.barricade.price;
  if (money >= price) {
    placing = { kind };
    shopOpen = false;
  } else {
    SFX.dry();
    fbFloat((kind === 2 ? '터렛' : '바리케이드') + ' — 잔고 부족 (' + formatMoney(price) + ')');
  }
}

const PUP_NAMES = { speed: '이동속도', maxhp: '최대 체력', shield: '보호막' };
function playerUp(kind) { // 플레이어 강화 공통 처리
  const u = CONFIG.upgrades[kind];
  const name = PUP_NAMES[kind];
  if (pUp[kind] >= u.maxLevel) { SFX.dry(); fbFloat(name + ' — 최대 단계'); return; }
  const cost = upgradeCost(u.base, u.growth, pUp[kind]);
  if (money < cost) { SFX.dry(); fbFloat(name + ' — 잔고 부족 (' + formatMoney(cost) + ')'); return; }
  money -= cost;
  pUp[kind]++;
  if (kind === 'maxhp') {
    player.maxHp = playerMaxHpCalc();
    player.hp = Math.min(player.maxHp, player.hp + u.perLevel);
  } else if (kind === 'shield') {
    if (pUp.shield === 1) {
      player.shield = shieldMax(); // 최초 구매 시 즉시 충전
      addFloat(player.x, player.y - 30, '보호막 활성화!', '#6cc7ff', 16);
    }
  }
  fbFloat(name + ' Lv' + pUp[kind] + ' −' + formatMoney(cost), '#8dff8d');
  SFX.buy();
  writeSave();
}

function handleAction(a) {
  if (a.t === 'buyWeapon') {
    const w = CONFIG.weapons[a.i];
    if (player.owned[a.i]) { player.slot = a.i; return; } // 보유 → 장착 (무음)
    if (money >= w.price) {
      money -= w.price;
      player.owned[a.i] = true;
      // ICBM은 탄약 없이 시작 (핵물질로 구매), 그 외는 기본 탄창 지급
      player.ammo[a.i] = w.matCost ? 0 : (w.ammoPack > 0 ? w.ammoPack : Infinity);
      player.slot = a.i;
      SFX.buy();
      fbFloat(w.name + ' 구매 −' + formatMoney(w.price), '#ffd94a');
      writeSave();
    } else { SFX.dry(); fbFloat(w.name + ' — 잔고 부족 (' + formatMoney(w.price) + ')'); }
  } else if (a.t === 'buyAmmo') {
    const w = CONFIG.weapons[a.i];
    if (!player.owned[a.i]) { SFX.dry(); fbFloat(w.name + ' — 미보유'); return; }
    if (w.ammoPack <= 0) { SFX.dry(); return; } // 권총(무한탄)
    if (w.matCost) { // ICBM: 핵물질 + ₩
      if (nukeMat < w.matCost) { SFX.dry(); fbFloat('ICBM 탄약 — 핵물질 필요'); return; }
      if (money < w.ammoPrice) { SFX.dry(); fbFloat('ICBM 탄약 — 잔고 부족 (' + formatMoney(w.ammoPrice) + ')'); return; }
      nukeMat -= w.matCost;
      money -= w.ammoPrice;
      player.ammo[a.i] += w.ammoPack;
      SFX.buy();
      announce('ICBM 탄약 장전 완료', '#ffd94a', 2, 18);
      writeSave();
    } else if (money >= w.ammoPrice) {
      money -= w.ammoPrice;
      player.ammo[a.i] += w.ammoPack;
      SFX.buy();
      fbFloat(w.name + ' 탄약 +' + formatNum(w.ammoPack) + ' −' + formatMoney(w.ammoPrice), '#ffd94a');
      writeSave();
    } else { SFX.dry(); fbFloat('탄약 — 잔고 부족 (' + formatMoney(w.ammoPrice) + ')'); }
  } else if (a.t === 'upWeapon') {
    const w = CONFIG.weapons[a.i];
    if (!player.owned[a.i]) { SFX.dry(); fbFloat(w.name + ' — 미보유'); return; }
    if (w.kind === 'icbm') { SFX.dry(); fbFloat('ICBM — 강화 불가'); return; }
    const u = CONFIG.upgrades.weapon;
    const n = wUp[a.i] || 0;
    if (n >= u.maxLevel) { SFX.dry(); fbFloat(w.name + ' — 최대 강화'); return; }
    const cost = weaponUpCost(w.price, n);
    if (money >= cost) {
      money -= cost;
      wUp[a.i] = n + 1;
      SFX.buy();
      fbFloat(w.name + (a.i === W_FLAMER ? ' 사거리' : ' 공격력') + ' Lv' + wUp[a.i] + ' −' + formatMoney(cost), '#8dff8d');
      writeSave();
    } else { SFX.dry(); fbFloat('강화 — 잔고 부족 (' + formatMoney(cost) + ')'); }
  } else if (a.t === 'upTurret') {
    const u = CONFIG.upgrades.turret;
    if (tUp >= u.maxLevel) { SFX.dry(); fbFloat('터렛 화력 — 최대 단계'); return; }
    const cost = upgradeCost(u.base, u.growth, tUp);
    if (money < cost) { SFX.dry(); fbFloat('터렛 화력 — 잔고 부족 (' + formatMoney(cost) + ')'); return; }
    money -= cost;
    tUp++;
    SFX.buy();
    fbFloat('터렛 화력 Lv' + tUp + ' −' + formatMoney(cost), '#8dff8d');
    writeSave();
  } else if (a.t === 'upSpeed') { playerUp('speed');
  } else if (a.t === 'upMaxhp') { playerUp('maxhp');
  } else if (a.t === 'upShield') { playerUp('shield');
  } else if (a.t === 'heal') {
    const cost = healCost(level);
    if (player.hp >= player.maxHp) { SFX.dry(); fbFloat('치료 — 체력이 가득 참'); return; }
    if (money >= cost) {
      money -= cost;
      player.hp = player.maxHp; // 전량 회복
      healsUsed++;
      SFX.buy();
      fbFloat('치료 완료 −' + formatMoney(cost), '#8dff8d');
      writeSave();
    } else { SFX.dry(); fbFloat('치료 — 잔고 부족 (' + formatMoney(cost) + ')'); }
  } else if (a.t === 'tab') {
    shopTab = a.v;
  } else if (a.t === 'placeTurret') {
    togglePlace(2);
  } else if (a.t === 'placeBarr') {
    togglePlace(1);
  } else if (a.t === 'closeShop') {
    shopOpen = false;
  } else if (a.t === 'openSettings') {
    settingsOpen = true;
  } else if (a.t === 'closeSettings') {
    settingsOpen = false;
  } else if (a.t === 'uiScale') {
    uiScale[a.k] = a.v;
    saveUiSettings();
    SFX.pickup();
  } else if (a.t === 'uiDefaults') {
    for (const k in uiScale) uiScale[k] = 1;
    saveUiSettings();
    SFX.pickup();
  } else if (a.t === 'ok') {
    state = ST.STATS;
  } else if (a.t === 'restart') {
    savingEnabled = true;
    resetGame();
    state = ST.PLAY;
    writeSave();
  } else if (a.t === 'continue') {
    continueGame();
  } else if (a.t === 'newgame') {
    if (titleSaveInfo()) titleConfirm = true; // 기존 세이브 삭제 확인
    else startNewGame();
  } else if (a.t === 'confirmNew') {
    titleConfirm = false;
    startNewGame();
  } else if (a.t === 'cancelNew') {
    titleConfirm = false;
  }
}

function placeValid(gx, gy, kind) {
  if (gx < 0 || gy < 0 || gx >= GC || gy >= GR) return false;
  if (structGrid[gy * GC + gx]) return false;
  const cx = gx * GRID + GRID / 2, cy = gy * GRID + GRID / 2;
  if (dist2(cx, cy, player.x, player.y) < (player.r + 34) * (player.r + 34)) return false;
  const n = ehash.query(cx, cy, 44);
  for (let k = 0; k < n; k++) {
    const e = enemyPool[ehash.results[k]];
    if (!e.active || e.hp <= 0) continue;
    if (dist2(cx, cy, e.x, e.y) < (e.r + 22) * (e.r + 22)) return false;
  }
  return true;
}

function tryPlace() {
  if (!placing) return;
  const gx = (mouse.wx / GRID) | 0, gy = (mouse.wy / GRID) | 0;
  const price = placing.kind === 2 ? CONFIG.turret.price : CONFIG.barricade.price;
  if (money < price || !placeValid(gx, gy, placing.kind)) { SFX.dry(); return; }
  money -= price;
  if (placing.kind === 2) addTurret(gx, gy); else addBarricade(gx, gy);
  SFX.place();
  writeSave();
  if (money < price) placing = null; // 잔액 부족 시 배치 모드 종료
}

// ============================================================
// 렌더링
// ============================================================
function onCam(x, y, m) {
  return x > camX - m && x < camX + VWW + m && y > camY - m && y < camY + VHW + m;
}

function drawEnemy(e) {
  const spr = bugSprites[e.type], S = spr.size;
  const hopH = e.state === 1 ? Math.sin(Math.PI * e.hopP) * (4 + e.r * 0.35) : 0;
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(e.x, e.y + 2, e.r * 0.9, e.r * 0.55, 0, 0, TAU); ctx.fill();
  if (e.cfg.glow) { // 방사능 발광 (엘리트/보스)
    const pu = 0.5 + 0.5 * Math.sin(performance.now() / 250 + e.poolIndex);
    ctx.fillStyle = 'rgba(90,255,100,' + (0.10 + 0.10 * pu).toFixed(2) + ')';
    ctx.beginPath(); ctx.arc(e.x, e.y - hopH, e.r * 1.75, 0, TAU); ctx.fill();
  }
  const frame = e.state === 1 ? (e.hopP < 0.5 ? 1 : 0) : 0;
  ctx.drawImage(spr.frames[frame][spriteRot(e.angle)], e.x - S / 2, e.y - S / 2 - hopH);
  if (e.hitFlash > 0) {
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.beginPath(); ctx.arc(e.x, e.y - hopH, e.r, 0, TAU); ctx.fill();
  }
  if (e.type !== 'small' && e.hp < e.maxHp) {
    const w = e.r * 2;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(e.x - w / 2, e.y - e.r - 12 - hopH, w, 4);
    ctx.fillStyle = '#e33';
    ctx.fillRect(e.x - w / 2, e.y - e.r - 12 - hopH, w * clamp(e.hp / e.maxHp, 0, 1), 4);
  }
}

function drawPlayer() {
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(player.x, player.y + 3, 12, 8, 0, 0, TAU); ctx.fill();
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.rotate(player.aim);
  ctx.fillStyle = '#222'; ctx.fillRect(6, -3, 24, 6);
  ctx.fillStyle = '#111'; ctx.fillRect(26, -2, 7, 4);
  ctx.fillStyle = '#3e5d2e';
  ctx.beginPath(); ctx.ellipse(0, 0, 11, 14, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#e0b184';
  ctx.beginPath(); ctx.arc(1, 0, 7, 0, TAU); ctx.fill();
  ctx.fillStyle = '#4a6b35';
  ctx.beginPath(); ctx.arc(-1, 0, 6, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawStruct(s) {
  if (s.kind === 1) {
    ctx.drawImage(barrSprite, s.gx * GRID, s.gy * GRID);
    const dmg = 1 - s.hp / s.maxHp;
    if (dmg > 0.25) {
      ctx.globalAlpha = Math.min(1, (dmg - 0.25) * 1.6);
      ctx.drawImage(crackSprite, s.gx * GRID, s.gy * GRID);
      ctx.globalAlpha = 1;
    }
  } else {
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(s.x, s.y + 3, 15, 10, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#3c4048';
    ctx.beginPath(); ctx.arc(s.x, s.y, 15, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#23262b'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(s.x, s.y, 13, 0, TAU); ctx.stroke();
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.angle);
    ctx.fillStyle = '#23262b';
    ctx.fillRect(4 - s.recoil * 3, -3, 18, 6);
    ctx.fillStyle = '#111';
    ctx.fillRect(20 - s.recoil * 3, -2, 4, 4);
    ctx.fillStyle = '#5b626d';
    ctx.beginPath(); ctx.arc(0, 0, 9, 0, TAU); ctx.fill();
    ctx.fillStyle = '#2a2d33';
    ctx.beginPath(); ctx.arc(0, 0, 3, 0, TAU); ctx.fill();
    ctx.restore();
  }
  if (s.hp < s.maxHp) {
    const w = 30, y = s.kind === 1 ? s.gy * GRID - 7 : s.y - 24;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(s.x - w / 2, y, w, 4);
    ctx.fillStyle = '#5ad14a';
    ctx.fillRect(s.x - w / 2, y, w * clamp(s.hp / s.maxHp, 0, 1), 4);
  }
}

function drawGhost() {
  const gx = clamp((mouse.wx / GRID) | 0, 0, GC - 1), gy = clamp((mouse.wy / GRID) | 0, 0, GR - 1);
  const price = placing.kind === 2 ? CONFIG.turret.price : CONFIG.barricade.price;
  const ok = money >= price && placeValid(gx, gy, placing.kind);
  const x = gx * GRID, y = gy * GRID;
  ctx.globalAlpha = 0.55;
  if (placing.kind === 1) ctx.drawImage(barrSprite, x, y);
  else {
    ctx.fillStyle = '#3c4048';
    ctx.beginPath(); ctx.arc(x + GRID / 2, y + GRID / 2, 15, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,120,0.5)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x + GRID / 2, y + GRID / 2, CONFIG.turret.range, 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = ok ? 'rgba(80,255,80,0.28)' : 'rgba(255,60,60,0.34)';
  ctx.fillRect(x, y, GRID, GRID);
}

function drawWorld() {
  const shx = (Math.random() * 2 - 1) * shakeMag, shy = (Math.random() * 2 - 1) * shakeMag;
  ctx.fillStyle = '#1c2a12';
  ctx.fillRect(0, 0, VW, VH);
  ctx.save();
  if (ZOOM !== 1) ctx.scale(ZOOM, ZOOM); // 터치 레이아웃: 월드 줌아웃
  ctx.translate(-camX + shx, -camY + shy);
  ctx.drawImage(groundC, 0, 0);
  drawAuras(); // 보스 방사능 아우라 (지면 위, 개체 아래)
  for (let i = 0; i < structures.length; i++) {
    const s = structures[i];
    if (onCam(s.x, s.y, 60)) drawStruct(s);
  }
  drawFragItems();
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    if (onCam(e.x, e.y, 140)) drawEnemy(e);
  }
  drawPlayer();
  // ---- 발광 패스 (예광탄/화염/폭발) ----
  ctx.globalCompositeOperation = 'lighter';
  // 예광탄은 스타일별로 한 패스에 배칭
  ctx.strokeStyle = 'rgba(255,235,120,0.9)'; ctx.lineWidth = 2.5;
  ctx.beginPath();
  for (let i = 0; i < bullets.length; i++) {
    const b = bullets[i];
    if (b.kind !== 0 || b.turret || !onCam(b.x, b.y, 40)) continue;
    ctx.moveTo(b.x - b.ux * 18, b.y - b.uy * 18);
    ctx.lineTo(b.x, b.y);
  }
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,224,80,0.85)'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < bullets.length; i++) {
    const b = bullets[i];
    if (b.kind !== 0 || !b.turret || !onCam(b.x, b.y, 40)) continue;
    ctx.moveTo(b.x - b.ux * 14, b.y - b.uy * 14);
    ctx.lineTo(b.x, b.y);
  }
  ctx.stroke();
  for (let i = 0; i < bullets.length; i++) {
    const b = bullets[i];
    if (!onCam(b.x, b.y, 40)) continue;
    if (b.kind === 1) {
      const lf = clamp(b.life / b.maxLife, 0, 1);
      ctx.fillStyle = 'rgba(255,' + ((120 + 100 * lf) | 0) + ',40,' + (0.15 + 0.5 * lf).toFixed(2) + ')';
      ctx.beginPath(); ctx.arc(b.x, b.y, 4 + (1 - lf) * 9, 0, TAU); ctx.fill();
    } else if (b.kind === 2) {
      ctx.strokeStyle = '#ddd'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(b.x - b.ux * 12, b.y - b.uy * 12); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
  }
  // 발광 파티클 (스파크/총구화염/불꽃)
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    if (p.type !== 0 && p.type !== 3 && p.type !== 4) continue;
    if (!onCam(p.x, p.y, 40)) continue;
    const lf = p.life / p.max;
    if (p.type === 3) {
      ctx.fillStyle = 'rgba(255,240,150,' + (lf * 0.8).toFixed(2) + ')';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1.4 - lf * 0.4), 0, TAU); ctx.fill();
    } else if (p.type === 4) {
      ctx.fillStyle = 'rgba(255,' + ((90 + 120 * lf) | 0) + ',30,' + (lf * 0.7).toFixed(2) + ')';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * lf + 1, 0, TAU); ctx.fill();
    } else {
      ctx.fillStyle = 'rgba(255,220,90,' + (lf * 0.9).toFixed(2) + ')';
      ctx.fillRect(p.x - 1, p.y - 1, 2.5, 2.5);
    }
  }
  ctx.globalCompositeOperation = 'source-over';
  // 일반 파티클 (피/연기/파편)
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    if (p.type === 0 || p.type === 3 || p.type === 4) continue;
    if (!onCam(p.x, p.y, 40)) continue;
    const lf = p.life / p.max;
    if (p.type === 1) {
      ctx.fillStyle = 'rgba(160,18,18,' + (lf * 0.9).toFixed(2) + ')';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill();
    } else if (p.type === 2) {
      ctx.fillStyle = 'rgba(120,120,110,' + (lf * 0.28).toFixed(2) + ')';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (2 - lf), 0, TAU); ctx.fill();
    } else {
      ctx.fillStyle = 'rgba(140,100,50,' + lf.toFixed(2) + ')';
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
  }
  // 플로팅 텍스트
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = 0; i < floats.length; i++) {
    const f = floats[i];
    ctx.font = 'bold ' + f.size + 'px sans-serif';
    ctx.globalAlpha = clamp(f.life / 0.4, 0, 1);
    ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.lineWidth = 3;
    ctx.strokeText(f.txt, f.x, f.y);
    ctx.fillStyle = f.col;
    ctx.fillText(f.txt, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  drawIcbmWorld();
  if (placing && state === ST.PLAY && (!TOUCH_UI || touchGhost)) drawGhost();
  if (TOUCH_UI && state === ST.PLAY) drawTouchAim();
  ctx.restore();
}

// 보스 방사능 아우라 — 맥동하는 녹색 원 + 확장 펄스 링
function drawAuras() {
  if (!bossCount) return;
  const aR = CONFIG.boss.auraRadius, now = performance.now();
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    if (e.type !== 'boss') continue;
    if (!onCam(e.x, e.y, aR + 80)) continue;
    const pu = 0.5 + 0.5 * Math.sin(now / 320);
    ctx.fillStyle = 'rgba(70,230,80,' + (0.05 + 0.04 * pu).toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(e.x, e.y, aR, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(110,255,120,' + (0.3 + 0.2 * pu).toFixed(2) + ')';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(e.x, e.y, aR, 0, TAU); ctx.stroke();
    const pr = (now / 1300) % 1;
    ctx.strokeStyle = 'rgba(110,255,120,' + (0.35 * (1 - pr)).toFixed(2) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(e.x, e.y, aR * pr, 0, TAU); ctx.stroke();
  }
}

function drawFragItems() {
  const now = performance.now();
  for (let i = 0; i < fragItems.length; i++) {
    const f = fragItems[i];
    if (!onCam(f.x, f.y, 30)) continue;
    const pu = 0.5 + 0.5 * Math.sin(now / 220 + f.ph);
    ctx.fillStyle = 'rgba(120,255,120,' + (0.15 + 0.2 * pu).toFixed(2) + ')';
    ctx.beginPath(); ctx.arc(f.x, f.y, 11 + pu * 3, 0, TAU); ctx.fill();
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(now / 600 + f.ph);
    ctx.fillStyle = '#5fe862';
    ctx.fillRect(-4.5, -4.5, 9, 9);
    ctx.strokeStyle = '#1c5c1e'; ctx.lineWidth = 1.5;
    ctx.strokeRect(-4.5, -4.5, 9, 9);
    ctx.restore();
  }
}

// ICBM 월드 연출 — 조준 레티클 / 충격파 링 / 버섯구름
function drawIcbmWorld() {
  if (!icbm) return;
  const c = CONFIG.icbm, det = c.warnDur + c.aimDur;
  if (icbm.t < det) {
    if (icbm.t >= c.warnDur) {
      const p = (icbm.t - c.warnDur) / c.aimDur;
      const r = 240 * (1 - p) + 42;
      const a = 0.5 + 0.4 * Math.sin(icbm.t * 22);
      ctx.strokeStyle = 'rgba(255,60,60,' + a.toFixed(2) + ')';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(icbm.x, icbm.y, r, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.arc(icbm.x, icbm.y, 12, 0, TAU); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(icbm.x - r - 16, icbm.y); ctx.lineTo(icbm.x - 12, icbm.y);
      ctx.moveTo(icbm.x + 12, icbm.y); ctx.lineTo(icbm.x + r + 16, icbm.y);
      ctx.moveTo(icbm.x, icbm.y - r - 16); ctx.lineTo(icbm.x, icbm.y - 12);
      ctx.moveTo(icbm.x, icbm.y + 12); ctx.lineTo(icbm.x, icbm.y + r + 16);
      ctx.stroke();
    }
  } else {
    const p = (icbm.t - det) / c.boomDur;
    if (p < 1.2) { // 충격파 링
      ctx.strokeStyle = 'rgba(255,240,200,' + Math.max(0, 0.7 - p * 0.55).toFixed(2) + ')';
      ctx.lineWidth = 26 * Math.max(0, 1 - p) + 4;
      ctx.beginPath(); ctx.arc(icbm.x, icbm.y, p * 2600, 0, TAU); ctx.stroke();
    }
    // 버섯구름 실루엣
    const g = Math.min(1, p * 1.3);
    const alpha = Math.max(0, 0.75 - p * 0.45);
    if (alpha > 0.01) {
      ctx.fillStyle = 'rgba(42,38,32,' + alpha.toFixed(2) + ')';
      const colW = 60 + g * 70, colH = 300 * g;
      ctx.fillRect(icbm.x - colW / 2, icbm.y - colH, colW, colH);
      ctx.beginPath(); ctx.ellipse(icbm.x, icbm.y - colH, 160 * g + 30, 76 * g + 18, 0, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(icbm.x, icbm.y, 130 * g + 20, 44 * g + 10, 0, 0, TAU); ctx.fill();
    }
  }
}

// ICBM 화면 연출 — 경보 / 화이트아웃 (draw 마지막에 호출해 모든 것 위에 덮음)
function drawIcbmScreen() {
  if (!icbm) return;
  const c = CONFIG.icbm, det = c.warnDur + c.aimDur;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (icbm.t < c.warnDur) {
    const fl = 0.5 + 0.5 * Math.sin(icbm.t * 18);
    ctx.fillStyle = 'rgba(200,0,0,' + (0.1 + 0.12 * fl).toFixed(2) + ')';
    ctx.fillRect(0, 0, VW, VH);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold 42px sans-serif';
    ctx.strokeStyle = 'rgba(0,0,0,0.85)'; ctx.lineWidth = 7;
    ctx.strokeText('⚠ ICBM 발사 경보 ⚠', VW / 2, VH * 0.3);
    ctx.fillStyle = 'rgba(255,90,70,' + (0.7 + 0.3 * fl).toFixed(2) + ')';
    ctx.fillText('⚠ ICBM 발사 경보 ⚠', VW / 2, VH * 0.3);
  } else if (icbm.t < det) {
    ctx.strokeStyle = 'rgba(255,50,50,0.5)'; ctx.lineWidth = 6;
    ctx.strokeRect(3, 3, VW - 6, VH - 6);
  } else {
    const p = (icbm.t - det) / c.boomDur;
    const a = p < 0.12 ? p / 0.12 : Math.max(0, 1 - (p - 0.12) / 0.88);
    if (a > 0.005) {
      ctx.fillStyle = 'rgba(255,255,255,' + Math.min(1, a).toFixed(3) + ')';
      ctx.fillRect(0, 0, VW, VH);
    }
  }
}

// ---------- UI ----------
function uiButton(x, y, w, h, label, enabled, act) {
  ctx.fillStyle = enabled ? '#3a4a2e' : '#2a2a2a';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = enabled ? '#9dc17d' : '#555';
  ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  ctx.fillStyle = enabled ? '#e8ffd8' : '#777';
  ctx.font = '13px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, x + w / 2, y + h / 2 + 1);
  if (enabled && act) pushRect(x, y, w, h, act);
}

// 상점 패널 레이아웃 — 그리기와 클릭 판정이 같은 값을 쓰도록 단일 출처
// 내부(w/h/rowH)는 디자인 단위, s*는 스케일 적용된 화면 좌표
function shopLayout() {
  const f = uiF('shop');
  const rows = shopTab === 0 ? CONFIG.weapons.length : 7;
  const headH = 44, tabH = 34, footH = 30;
  const hudH = Math.ceil(60 * Math.max(uiF('hud'), uiF('money'))); // 하단 바와 겹침 방지
  const availH = (VH - hudH - 16) / f;
  let rowH = 44;
  let h = headH + tabH + rows * rowH + footH;
  if (h > availH) { // 낮은 뷰포트/큰 배율: 행 높이를 줄여 전체가 화면 안에 들어오게
    rowH = Math.max(24, Math.floor((availH - headH - tabH - footH) / rows));
    h = headH + tabH + rows * rowH + footH;
  }
  const w = Math.min(430, (VW - 20) / f);
  const sw = w * f, sh = h * f;
  const sx = Math.max(8, VW - sw - 14);
  const sy = Math.max(8, Math.min(74, VH - hudH - sh - 8));
  return { f, w, h, rowH, tabH, sx, sy, sw, sh };
}

// 강화 / 기타 탭 항목 (데스크톱·터치 상점 공용)
function shopUpgradeRows() {
  const U = CONFIG.upgrades;

  {
    const maxed = pUp.speed >= U.speed.maxLevel;
    rows.push({ name: '이동속도 Lv' + pUp.speed + ' (+' + Math.round(U.speed.perLevel * pUp.speed * 100) + '%)',
      sub: maxed ? '최대 단계' : '+' + Math.round(U.speed.perLevel * 100) + '% 증가',
      cost: maxed ? -1 : upgradeCost(U.speed.base, U.speed.growth, pUp.speed), act: { t: 'upSpeed' } });
  }
  {
    const maxed = pUp.maxhp >= U.maxhp.maxLevel;
    rows.push({ name: '최대 체력 Lv' + pUp.maxhp + ' (' + player.maxHp + ')',
      sub: '+' + U.maxhp.perLevel + ' HP',
      cost: maxed ? -1 : upgradeCost(U.maxhp.base, U.maxhp.growth, pUp.maxhp), act: { t: 'upMaxhp' } });
  }
  {
    const maxed = pUp.shield >= U.shield.maxLevel;

      sub: pUp.shield === 0 ? '무피격 ' + U.shield.regenDelay + '초 후 자동 회복' : '+' + U.shield.perLevel + ' 보호막',
      cost: maxed ? -1 : upgradeCost(U.shield.base, U.shield.growth, pUp.shield), act: { t: 'upShield' } });
  }
  {
    const maxed = tUp >= U.turret.maxLevel;
    rows.push({ name: '터렛 화력 Lv' + tUp + ' (발당 ' + Math.round(CONFIG.turret.dmg * turretDmgMul(tUp)) + ')',
      sub: '설치된 모든 터렛에 적용',

    rows.push({ name: '치료 — HP 전량 회복', sub: full ? '체력이 가득 참' : '레벨마다 비용 상승',
      cost: healCost(level), act: { t: 'heal' }, disabled: full });
  }
  rows.push({ name: '터렛 (자동 사격, HP ' + CONFIG.turret.hp + ')', sub: '배치형', cost: CONFIG.turret.price, act: { t: 'placeTurret' } });
  rows.push({ name: '바리케이드 (HP ' + CONFIG.barricade.hp + ')', sub: '배치형 · 그리드 스냅', cost: CONFIG.barricade.price, act: { t: 'placeBarr' } });
  return rows;
}

      pushRect(x, ry, clickW, rowH, { t: 'buyWeapon', i });
      if (player.slot === i) { ctx.fillStyle = 'rgba(255,217,74,0.10)'; ctx.fillRect(x, ry, w, rowH); }
      ctx.textAlign = 'left';
      ctx.font = 'bold 14px sans-serif';
      ctx.fillStyle = owned ? (player.slot === i ? '#ffd94a' : '#fff') : (afford ? '#cfe6bd' : '#6f6f6f');
      ctx.fillText((i + 1) + '. ' + wp.name, x + 12, ry + rowH * 0.32);
      if (owned) {
        // 보조 정보: 탄약 + 업그레이드 현황
        ctx.font = '11px sans-serif'; ctx.fillStyle = '#9db78a';
        const n = wUp[i] || 0;
        let info = wp.ammoPack > 0 ? (player.ammo[i] === Infinity ? '∞' : formatNum(player.ammo[i])) + '발' : '무한탄';
        if (i === W_FLAMER) info += ' · 사거리 ' + Math.round(flamerRange());
        else if (!isIcbm && n > 0) info += ' · 공격력 ×' + weaponDmgMul(n).toFixed(2);
        ctx.fillText(info, x + 12, ry + rowH * 0.74);

        } else if (wp.ammoPack > 0) {
          uiButton(x + w - 224, ry + 5, btnW, rowH - 10, '탄약 ' + formatMoney(wp.ammoPrice), money >= wp.ammoPrice, { t: 'buyAmmo', i });
        }
        // 강화 버튼 (ICBM 제외, 화방은 사거리)
        if (!isIcbm) {
          const n2 = wUp[i] || 0;
          const maxed = n2 >= CONFIG.upgrades.weapon.maxLevel;

          uiButton(x + w - 112, ry + 5, 104, rowH - 10, label, !maxed && money >= cost, { t: 'upWeapon', i });

  ctx.restore();
  uiTf = null;
}

function drawHUD() {
  const TL = TOUCH_UI ? touchLayout() : null; // 터치 레이아웃 치수 (데스크톱은 null)
  ctx.textBaseline = 'top';
  // ---- 점수창 (좌상단, 스케일: score) ----
  ctx.save();
  if (TL) ctx.translate(SAFE.l, SAFE.t);
  const fS = TL ? Math.min(uiF('score'), TL.scoreMax) : uiF('score'); // 터치: 버튼과 겹치지 않는 만큼만 확대
  ctx.scale(fS, fS);
  ctx.textAlign = 'left';
  ctx.font = 'bold 22px sans-serif';
  ctx.strokeStyle = 'rgba(0,0,0,0.75)'; ctx.lineWidth = 4;
  ctx.strokeText('점수 ' + formatNum(score), 14, 12);
  ctx.fillStyle = '#fff';
  ctx.fillText('점수 ' + formatNum(score), 14, 12);
  ctx.font = '14px sans-serif';
  ctx.lineWidth = 3;
  ctx.strokeText('처치 ' + formatNum(kills) + ' · 생존 ' + mmss(playT), 14, 40);
  ctx.fillStyle = '#dde';
  ctx.fillText('처치 ' + formatNum(kills) + ' · 생존 ' + mmss(playT), 14, 40);
  // 방사능 조각 / 핵물질 (해금 후 상시 표시)
  if (eliteUnlocked || frags > 0 || nukeMat > 0) {
    ctx.font = 'bold 14px sans-serif';
    const matTxt = '☢ 조각 ' + frags + '/' + CONFIG.frag.need + ' · 핵물질 ' + nukeMat;
    ctx.strokeText(matTxt, 14, 60);
    ctx.fillStyle = '#8dff8d';
    ctx.fillText(matTxt, 14, 60);
  }
  ctx.restore();
  // 우상단 (디버그성 정보 — 스케일 미적용; 터치: 버튼 옆/아래)

  ctx.fillStyle = '#aca';
  ctx.fillText('곱등이 ' + enemies.length, TL ? TL.fpsX : VW - 12, TL ? TL.fpsY + 16 : 28);
  }

  if (TL) drawBarTouch(TL); // 터치: 하단 바(HP·레벨·무기 칸·탄약) + 잔고를 전용 배치로
  else {
    // ---- 하단 바 배경 (두 영역 중 큰 쪽 높이) ----
    const fH = uiF('hud'), fM = uiF('money');
    ctx.fillStyle = 'rgba(10,14,8,0.72)';

    ctx.scale(fH, fH);
    const by = -60;
    // 보호막 바 (HP 위 파란색) — 구매 후에만 표시
    const sm = shieldMax();
    if (sm > 0) {
      ctx.fillStyle = '#122a40';
      ctx.fillRect(16, by + 8, 230, 8);
      ctx.fillStyle = '#4db8ff';
      ctx.fillRect(16, by + 8, 230 * clamp(player.shield / sm, 0, 1), 8);
      ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
      ctx.strokeRect(16.5, by + 8.5, 229, 7);
    }
    // HP
    ctx.fillStyle = '#401010';
    ctx.fillRect(16, by + 18, 230, 22);
    ctx.fillStyle = hpFrac > 0.3 ? '#35d13a' : '#e04a2a';
    ctx.fillRect(16, by + 18, 230 * hpFrac, 22);

    ctx.strokeRect(16.5, by + 18.5, 229, 21);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const shTxt = sm > 0 ? '  +' + Math.round(player.shield) + '🛡' : '';
    ctx.fillText('HP ' + Math.ceil(player.hp) + ' / ' + player.maxHp + shTxt, 16 + 115, by + 29);
    // 레벨
    ctx.textAlign = 'left';
    ctx.font = 'bold 20px sans-serif';
    ctx.fillStyle = '#a4ef7c';
    ctx.fillText('Lv ' + level, 262, by + 22);
    ctx.fillStyle = 'rgba(164,239,124,0.25)';
    ctx.fillRect(262, by + 42, 70, 5);
    ctx.fillStyle = '#a4ef7c';
    ctx.fillRect(262, by + 42, 70 * clamp(levelT / CONFIG.difficulty.levelTime, 0, 1), 5);
    // 무기 슬롯
    const slotX = 360, slotY = by + 13, sw = 34, gap = 6;

    for (let i = 0; i < CONFIG.weapons.length; i++) {
      const x = slotX + i * (sw + gap);

      ctx.fillRect(x, slotY, sw, sw);
      ctx.strokeStyle = player.slot === i ? '#ffd94a' : owned ? '#788a60' : '#333';
      ctx.lineWidth = player.slot === i ? 2 : 1;

    // 선택 무기 + 탄약
    const w = getWeapon();
    const ammoTxt = getAmmo() === Infinity ? '∞' : formatNum(getAmmo());
    ctx.textAlign = 'left';
    ctx.font = 'bold 16px sans-serif';
    ctx.fillStyle = getAmmo() === 0 ? '#ff7b6b' : '#fff';
    ctx.fillText(w.name + ' · ' + ammoTxt + '발', slotX + CONFIG.weapons.length * (sw + gap) + 12, by + 30);
    ctx.restore();
    // ---- 잔고 표시 (하단 우측, 스케일: money) ----
    ctx.save();
    ctx.translate(VW, VH);
    ctx.scale(fM, fM);
    ctx.textBaseline = 'top';
    ctx.textAlign = 'right';
    const mTxt = formatMoney(money);
    const hint = 'Tab 상점 · T 터렛 · B 바리케이드 · V 보호막 · M 체력 · J 이속 · H 치료 · E 탄약 · P 일시정지';
    // 배경 패널 — 배율 조합으로 좌측 콘텐츠와 겹쳐도 잔고가 읽히게 (두 줄 중 넓은 쪽 기준)
    ctx.font = 'bold 24px sans-serif';
    let mW = ctx.measureText(mTxt).width;
    ctx.font = '11px sans-serif';
    mW = Math.max(mW, ctx.measureText(hint).width, 330) + 30;
    ctx.fillStyle = 'rgba(10,14,8,0.85)';
    ctx.fillRect(-mW, -46, mW, 46);
    ctx.font = 'bold 24px sans-serif';
    ctx.fillStyle = '#ffd94a';
    ctx.fillText(mTxt, -16, -38);
    ctx.font = '11px sans-serif';
    ctx.fillStyle = '#9a9';
    ctx.fillText(hint, -16, -14);
    ctx.restore();
  }
  ctx.textBaseline = 'middle';
  // 상점
  if (shopOpen && state === ST.PLAY) { if (TL) drawShopTouch(TL); else drawShop(); }
  // 배치 안내 (터치: 상단 안내 + 취소 버튼)
  if (placing && state === ST.PLAY && TL) drawPlaceTouch(TL);
  else if (placing && state === ST.PLAY) {
    ctx.textAlign = 'center';
    ctx.font = 'bold 14px sans-serif';
    ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.lineWidth = 3;
    const msg = (placing.kind === 2 ? '터렛' : '바리케이드') + ' 배치 — 좌클릭 설치 · 우클릭/ESC 취소';
    ctx.strokeText(msg, mouse.x, mouse.y - 30);
    ctx.fillStyle = '#fff';
    ctx.fillText(msg, mouse.x, mouse.y - 30);
  }
  // 피격 플래시 & 저체력 경고
  if (hurtFlash > 0) {
    ctx.fillStyle = 'rgba(180,0,0,' + (hurtFlash * 0.5).toFixed(2) + ')';
    ctx.fillRect(0, 0, VW, VH);
  }
  if (state === ST.PLAY && hpFrac < 0.3) {
    const a = 0.18 + 0.1 * Math.sin(performance.now() / 180);
    const gr = ctx.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * 0.35, VW / 2, VH / 2, Math.max(VW, VH) * 0.7);
    gr.addColorStop(0, 'rgba(160,0,0,0)');
    gr.addColorStop(1, 'rgba(160,0,0,' + a.toFixed(2) + ')');
    ctx.fillStyle = gr;
    ctx.fillRect(0, 0, VW, VH);
  }
  // 보호막 피격 플래시 (파란 테두리)
  if (shieldFlash > 0) {
    ctx.fillStyle = 'rgba(77,184,255,' + (shieldFlash * 0.35).toFixed(2) + ')';
    ctx.fillRect(0, 0, VW, VH);
  }
  // 아우라 피폭 경고 (녹색 비네트)
  if (insideAura && state === ST.PLAY) {
    const a = 0.14 + 0.08 * Math.sin(performance.now() / 90);
    ctx.fillStyle = 'rgba(90,255,90,' + a.toFixed(2) + ')';
    ctx.fillRect(0, 0, VW, VH);
    ctx.textAlign = 'center';
    ctx.font = 'bold ' + (TL ? fitFont('☢ 방사능 피폭! 아우라에서 벗어나세요!', 18, TL.midW, 'bold ') : 18) + 'px sans-serif';
    ctx.fillStyle = '#eaffea';
    ctx.strokeStyle = 'rgba(0,60,0,0.8)'; ctx.lineWidth = 3;
    const auraY = TL ? TL.auraY : VH - 96;
    const auraX = TL ? TL.midX : VW / 2;
    ctx.strokeText('☢ 방사능 피폭! 아우라에서 벗어나세요!', auraX, auraY);
    ctx.fillText('☢ 방사능 피폭! 아우라에서 벗어나세요!', auraX, auraY);
  }
  // 보스 경고 붉은 펄스
  if (bossWarnT > 0) {
    const a = (0.12 + 0.1 * Math.sin(performance.now() / 110)) * Math.min(1, bossWarnT);
    ctx.fillStyle = 'rgba(255,30,30,' + a.toFixed(2) + ')';
    ctx.fillRect(0, 0, VW, 46);
    ctx.fillRect(0, VH - 46, VW, 46);
  }
  // 보스 체력바 (상단 중앙)
  if (bossCount > 0) {
    let bBoss = null;
    for (let i = 0; i < enemies.length; i++) {
      if (enemies[i].type === 'boss' && (!bBoss || enemies[i].maxHp > bBoss.maxHp)) bBoss = enemies[i];
    }
    if (bBoss) {
      // 터치: 상단 HUD·버튼 아래로
      const bcx = TL ? TL.midX : VW / 2;
      const bw2 = TL ? Math.min(480, TL.midW - 16) : Math.min(480, VW - 240), bx2 = bcx - bw2 / 2, by2 = TL ? TL.bossY : 58;
      ctx.textAlign = 'center';
      ctx.font = 'bold 14px sans-serif';
      ctx.strokeStyle = 'rgba(0,0,0,0.8)'; ctx.lineWidth = 3;
      ctx.strokeText('☢ 대왕 방사능 곱등이' + (bossCount > 1 ? ' ×' + bossCount : ''), bcx, by2 - 8);
      ctx.fillStyle = '#8dff8d';
      ctx.fillText('☢ 대왕 방사능 곱등이' + (bossCount > 1 ? ' ×' + bossCount : ''), bcx, by2 - 8);
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(bx2, by2, bw2, 14);
      ctx.fillStyle = '#57d94f';
      ctx.fillRect(bx2 + 2, by2 + 2, (bw2 - 4) * clamp(bBoss.hp / bBoss.maxHp, 0, 1), 10);
      ctx.strokeStyle = '#2c5a28'; ctx.lineWidth = 2;
      ctx.strokeRect(bx2, by2, bw2, 14);
    }
  }
  // 중앙 공지 배너
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = 0; i < announces.length; i++) {
    const an = announces[i];
    const a = clamp(an.t / 0.5, 0, 1);
    ctx.globalAlpha = a;
    ctx.font = 'bold ' + (TL ? fitFont(an.txt, an.size, TL.midW, 'bold ') : an.size) + 'px sans-serif';
    ctx.strokeStyle = 'rgba(0,0,0,0.85)'; ctx.lineWidth = 5;
    const ay = TL ? TL.annY + i * 34 : 110 + i * 38; // 터치: 보스 바 아래부터
    const ax = TL ? TL.midX : VW / 2;
    ctx.strokeText(an.txt, ax, ay);
    ctx.fillStyle = an.col;
    ctx.fillText(an.txt, ax, ay);
  }
  ctx.globalAlpha = 1;
}

function draw3dBox(x, y, w, h, raised) {
  ctx.fillStyle = '#c8c8c8';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = raised ? '#f2f2f2' : '#5a5a5a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x, y + h); ctx.lineTo(x, y); ctx.lineTo(x + w, y); ctx.stroke();
  ctx.strokeStyle = raised ? '#5a5a5a' : '#f2f2f2';
  ctx.beginPath(); ctx.moveTo(x + w, y); ctx.lineTo(x + w, y + h); ctx.lineTo(x, y + h); ctx.stroke();
}

  ctx.fillText('다시 시작 (R)', bx + bw / 2, byy + bhh / 2 + 1);
  uiRects.push({ x: bx, y: byy, w: bw, h: bhh, act: { t: 'restart' } });
}

function draw() {
  uiRects = [];
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  computeCam();
  drawWorld();
  drawHUD();
  if (state === ST.TITLE) drawTitle();
  else if (state === ST.OVER) drawOverPopup();
  else if (state === ST.STATS) drawStats();
  if (paused && state === ST.PLAY && TOUCH_UI) drawPauseTouch();
  else if (paused && state === ST.PLAY) {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, VW, VH);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold 34px sans-serif';
    ctx.fillStyle = '#fff';
    ctx.fillText('일시정지', VW / 2, VH / 2 - 130);
    // 단축키 목록
    const keyLines = [
      ['WASD', '이동'], ['좌클릭 (홀드)', '발사'], ['휠', '무기 교체'],
      ['1~8', '무기 장착 / 미보유 시 구매'],
      ['1~8 (길게)', '0.5초 홀드 후 0.5초마다 자동 강화'],
      ['Shift + 1~8', '해당 무기 강화'],
      ['V', '보호막 구매 / 강화'],
      ['M', '최대 체력 강화'], ['J', '이동속도 강화'],
      ['E', '현재 무기 탄약 구매'], ['T', '터렛 배치 모드'], ['B', '바리케이드 배치 모드'],
      ['H', '치료 (전량 회복)'], ['Tab', '상점'], ['ESC', '배치 취소 / 상점 닫기'],
      ['N', '음소거'], ['P', '일시정지 해제'],
    ];
    ctx.font = '15px sans-serif';
    for (let i = 0; i < keyLines.length; i++) {
      const ky = VH / 2 - 88 + i * 24;
      ctx.textAlign = 'right';

      ctx.textAlign = 'left';
      ctx.fillStyle = '#ccc';
      ctx.fillText(keyLines[i][1], VW / 2 + 14, ky);
