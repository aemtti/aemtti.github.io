 * Inline it into a single-file game (inside a script tag) or load it next to the game.
 *
 *   const kit = TouchKit.create({
 *     sticks: [
 *       { id: 'move', side: 'left',  label: 'MOVE', keys: 'wasd' },            // 'wasd' | 'arrows' | {up,down,left,right} codes
 *       { id: 'aim',  side: 'right', label: 'AIM',  onMove: (x, y, on) => {} } // analog -1..1, on=false when released
 *     ],
 *     buttons: [ { id: 'fire', label: 'FIRE', icon: '✦', key: 'Space' },      // key: KeyboardEvent.code to hold while pressed
 *                { id: 'map', label: 'MAP', key: 'KeyM', place: 'top-right' } ],
 *     landscape: true,        // ask to rotate when the phone is held upright
 *   })

 * Buttons without `key` can use onDown/onUp. Sticks with `keys` send keydown/keyup (8 directions) and still report analog x/y.
 * Keys are dispatched as KeyboardEvents (key, code, keyCode, which) on document, so window/document listeners receive them.
 * Everything else on the page keeps working: the kit only captures touches that start on its own zones/buttons.

    ControlLeft: ['Control', 17], AltLeft: ['Alt', 18], ArrowLeft: ['ArrowLeft', 37], ArrowUp: ['ArrowUp', 38],
    ArrowRight: ['ArrowRight', 39], ArrowDown: ['ArrowDown', 40], Backspace: ['Backspace', 8] }
  const keyInfo = code => {
    if (KEYS[code]) return KEYS[code]
    if (/^Key[A-Z]$/.test(code)) return [code[3].toLowerCase(), code.charCodeAt(3)]
    if (/^Digit\d$/.test(code)) return [code[5], code.charCodeAt(5)]

  function sendKey(type, code) {
    const [key, kc] = keyInfo(code)

  letter-spacing:.06em;color:#fff;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tk-root.tk-off{display:none}
.tk-zone{position:absolute;bottom:0;top:22%;pointer-events:auto;touch-action:none}

.tk-btns.tr{right:calc(12px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));flex-direction:row-reverse}
.tk-btns.tl{left:calc(12px + env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top))}
.tk-btns.bl{left:calc(18px + env(safe-area-inset-left));bottom:calc(20px + env(safe-area-inset-bottom));flex-direction:column-reverse}

@media (orientation:portrait){.tk-rot.need{display:flex}}
`
  // A tap on a kit button is followed by a compatibility `click` at the same spot ~100–300 ms later. If the button just
  // opened a game overlay/menu under the finger, that click would hit it (and often close it). Swallow it.
  let clickBlockUntil = 0

    if (Date.now() < clickBlockUntil && !(e.target && e.target.closest && e.target.closest('.tk-root'))) { e.stopPropagation(); e.preventDefault() }

      const st = { x: 0, y: 0, on: false, pid: null, cx: 0, cy: 0, dirs: {} }

        const zr = zone.getBoundingClientRect(); let x = side === 'l' ? 96 : zr.width - 96
        if (side === 'r' && groups.br) { const gr = groups.br.getBoundingClientRect(); if (gr.width) x = Math.min(x, gr.left - zr.left - 80) }
        base.style.left = x + 'px'; base.style.top = (zr.height - 110) + 'px'
      }
      const setDirs = (want) => {
        if (!keys) return
        for (const d of ['up', 'down', 'left', 'right']) {
          if (want[d] && !st.dirs[d]) { st.dirs[d] = true; press(keys[d]) }

        bs.down = true; btn.classList.add('on')

        if (b.onDown) b.onDown()

      }

        suppressClick()
        if (b.toggle || e.pointerId !== bs.pid) return
        bs.pid = null; bs.down = false; btn.classList.remove('on')
        if (b.key && !b.tap) release(b.key)

      }
      btn.addEventListener('pointerdown', down); btn.addEventListener('pointerup', up); btn.addEventListener('pointercancel', up)
      btn.addEventListener('contextmenu', e => e.preventDefault())
    }

    // ---- portrait → ask to rotate (can be dismissed)
    let rot = null, rotDismissed = false                      // once dismissed, show(true) must not bring the hint back
    if (opt.landscape) {
      rot = el('div', 'tk-rot', document.body, `<b>⟳</b><div>${opt.rotateText || '휴대폰을 가로로 돌려 주세요'}<br><small style="opacity:.6">Rotate your phone</small></div><button type="button">그래도 세로로 하기</button>`)
      rot.querySelector('button').addEventListener('click', () => { rotDismissed = true; rot.classList.remove('need') })
    }

    // ---- page hygiene for touch play: no pinch/double-tap zoom, no pull-to-refresh, no long-press menu on the game
    if (opt.preventGestures !== false) {
      document.documentElement.style.overscrollBehavior = 'none'
      document.addEventListener('gesturestart', e => e.preventDefault())
      let lastT = 0
      document.addEventListener('touchend', e => { const now = Date.now(); if (now - lastT < 300 && !(e.target.closest && e.target.closest('input,textarea,select,a,button'))) e.preventDefault(); lastT = now }, { passive: false })
    }

    api.show = on => {
      api.visible = on; root.classList.toggle('tk-off', !on); if (on) requestAnimationFrame(() => rests.forEach(f => f())); if (rot) rot.classList.toggle('need', on && !!opt.landscape && !rotDismissed)

        for (const b of Object.values(api.buttons)) { b.down = false; b.pid = null; b.el.classList.remove('on') } }
    }
    api.stick = id => api.sticks[id] || { x: 0, y: 0, on: false }
    api.pressed = id => !!(api.buttons[id] && api.buttons[id].down)

    api.show(mode === 'always' || (mode === 'auto' && isTouch()))
    if (mode === 'auto' && !api.visible) addEventListener('touchstart', function once() { removeEventListener('touchstart', once); api.show(true) }, { passive: true })
    return api
  }

  // Helpers for games that read the mouse: fire mouse events at a point (client coords).
  function mouse(target, type, x, y, extra) {
    const ev = new MouseEvent(type, Object.assign({ clientX: x, clientY: y, bubbles: true, cancelable: true, button: 0, buttons: type === 'mouseup' ? 0 : 1 }, extra || {}))
    ;(target || document.elementFromPoint(x, y) || document).dispatchEvent(ev)
  }
  // Resume every AudioContext the game creates, on the first real touch (iOS/Android need a user gesture).
  function unlockAudio() {
    const ctxs = new Set(), AC = window.AudioContext || window.webkitAudioContext
    if (AC && !AC.__tk) { const W = function (...a) { const c = new AC(...a); ctxs.add(c); return c }; W.prototype = AC.prototype; W.__tk = true; window.AudioContext = W; if (window.webkitAudioContext) window.webkitAudioContext = W }

})()

(function () {

/* ============================================================================
   NIGHT OF THE ETERNAL
   A single-file Vampire-Survivors-like built on Phaser 3 + Arcade Physics.
   All art is generated at runtime with Phaser.GameObjects.Graphics.

/* ----------------------------- CONFIG / CONSTANTS ------------------------- */

var WORLD = 6400;
var MAX_ENEMIES = 200;
var MAX_PICKUPS = 400;
var FINAL_TIME = 900;           // seconds -> The Eternal appears
var FONT = '"Trebuchet MS", "Segoe UI", system-ui, sans-serif';
var MONO = 'Consolas, "Courier New", monospace';

function hexs(c) { return "#" + ("000000" + c.toString(16)).slice(-6); }

/* ---------------------------- TOUCH / MOBILE ------------------------------ */
/* Phones & tablets (coarse pointer): the canvas fills the screen in either
   orientation at up to 2x pixel density, the UI is laid out in CSS pixels
   (VIEW_W x VIEW_H become the screen size) and the arena camera zooms so about
   as much of the arena is visible as on desktop. A floating touch stick moves,
   PAUSE / SOUND sit top-right, menus and cards are tapped.
   Desktop keeps the fixed 1280x720 letterboxed frame exactly as before. */

var MOBILE = !!(window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
var RES = 1;                                // canvas pixels per CSS pixel
var WS = 1;                                 // CSS pixels per world unit (arena zoom)
var SAFE = { t: 0, r: 0, b: 0, l: 0 };      // notch / home-bar insets, CSS px
var TOUCH = { x: 0, y: 0, on: false };      // move stick: unit direction while pushed
var MENU_SEL = 0;                           // menu choice, kept when a rotation rebuilds the menu

  VIEW_H = Math.max(240, Math.round(window.innerHeight));

  WS = Math.min(1, Math.sqrt(VIEW_W * VIEW_H / (1280 * 720)));

      case "hit":    this.tone(190, 0.04, "sawtooth", 0.045, 130); break;
      case "kill":   this.tone(330, 0.08, "triangle", 0.075, 150); break;

/* ------------------------------ TEXTURE MAKER ----------------------------- */

function mkTex(scene, key, w, h, draw) {
  var g = scene.make.graphics({ x: 0, y: 0, add: false });
  draw(g, w, h);
  g.generateTexture(key, w, h);
  g.destroy();
}
function polyPts(cx, cy, r, sides, rot) {
  var p = [];
  for (var i = 0; i < sides; i++) {
    var a = rot + (i / sides) * Math.PI * 2;
    p.push(new Phaser.Geom.Point(cx + Math.cos(a) * r, cy + Math.sin(a) * r));
  }
  return p;
}
function starPts(cx, cy, r1, r2, points, rot) {
  var p = [];
  for (var i = 0; i < points * 2; i++) {
    var a = rot + (i / (points * 2)) * Math.PI * 2;
    var r = (i % 2 === 0) ? r1 : r2;
    p.push(new Phaser.Geom.Point(cx + Math.cos(a) * r, cy + Math.sin(a) * r));
  }
  return p;
}

    }).setDepth(28);

  },

  /* phones / tablets: arena zoom and a ground strip that exactly covers the
     zoomed view (called again after a rotation) */
  layoutMobile: function () {
    var cam = this.cameras.main, Z = RES * WS;
    cam.setZoom(Z);
    var gw = VIEW_W * RES, gh = VIEW_H * RES;             // canvas pixels
    var w = Math.ceil(gw / Z) + 4, h = Math.ceil(gh / Z) + 4;
    this.ground.setOrigin(0.5).setPosition(gw / 2, gh / 2).setSize(w, h);
    /* texture coordinate = world coordinate under the zoomed camera */
    this.groundOffX = gw / 2 - w / 2;
    this.groundOffY = gh / 2 - h / 2;
  },

  /* ------------------------------ LOADOUT --------------------------------- */

  addWeapon: function (id) {
    this.weapons[id] = { id: id, level: 1, evolved: false, t: 260, ang: 0 };
    this.wOrder.push(id);
  },
  recalc: function () {
    var p = this.passives, b = this.chr;
    var g = function (k) { return p[k] || 0; };
    var st = this.stats;
    st.maxHp = b.hp + 20 * g("vitality");
    st.speed = b.speed * (1 + 0.09 * g("swift"));
    st.dmgMul = b.dmg * (1 + 0.13 * g("might"));
    st.armorFlat = b.armor + 1.4 * g("armor");
    st.armorPct = Math.min(0.45, 0.04 * g("armor"));
    st.regen = b.regen + 0.55 * g("regen");
    st.magnet = 96 + 34 * g("magnet");
    st.cdr = Math.max(0.40, 1 - 0.08 * g("haste"));
    st.xpMul = 1 + 0.14 * g("wisdom");
    st.areaMul = b.area * (1 + 0.10 * g("area"));
    st.luck = 1 + 0.18 * g("fortune");
    if (this.hp > st.maxHp) { this.hp = st.maxHp; }
  },

  /* -------------------------- LEVEL-UP OPTIONS ---------------------------- */

  rollOptions: function (n) {
    var pool = [], i, id, w;
    var ownedW = this.wOrder.length, ownedP = this.pOrder.length;

    for (i = 0; i < WEAPON_IDS.length; i++) {
      id = WEAPON_IDS[i]; w = this.weapons[id];
      var def = WEAPONS[id];
      if (w) {
        if (w.level < def.max) {
          pool.push({ kind: "wUp", id: id, weight: 10 });
        } else if (!w.evolved && (this.passives[def.evoReq] || 0) >= PASSIVES[def.evoReq].max) {
          pool.push({ kind: "evo", id: id, weight: 26 });
        }
      } else if (ownedW < 6) {
        pool.push({ kind: "wNew", id: id, weight: 13 });
      }
    }
    for (i = 0; i < PASSIVE_IDS.length; i++) {
      id = PASSIVE_IDS[i];
      var lv = this.passives[id] || 0;
      if (lv > 0) {
        if (lv < PASSIVES[id].max) { pool.push({ kind: "pUp", id: id, weight: 9 }); }
      } else if (ownedP < 6) {
        pool.push({ kind: "pNew", id: id, weight: 8 });
      }
    }
    pool.push({ kind: "heal", id: null, weight: 3 });
    pool.push({ kind: "gold", id: null, weight: 2 });

    /* weighted pick without replacement */
    var out = [];
    var bag = pool.slice();
    while (out.length < n && bag.length > 0) {
      var total = 0;
      for (i = 0; i < bag.length; i++) { total += bag[i].weight; }
      var r = Math.random() * total, acc = 0, pick = 0;
      for (i = 0; i < bag.length; i++) {
        acc += bag[i].weight;
        if (r <= acc) { pick = i; break; }
      }
      out.push(bag[pick]);
      bag.splice(pick, 1);
    }
    while (out.length < n) { out.push({ kind: "heal", id: null, weight: 1 }); }
    return out.map(this.describeOption, this);
  },

  describeOption: function (o) {
    var d = { kind: o.kind, id: o.id };
    if (o.kind === "wNew") {
      var def = WEAPONS[o.id];
      d.tag = def.tag; d.color = def.color; d.name = def.name;
      d.right = "NEW WEAPON"; d.desc = def.desc;
    } else if (o.kind === "wUp") {
      var wd = WEAPONS[o.id], lv = this.weapons[o.id].level;
      d.tag = wd.tag; d.color = wd.color; d.name = wd.name;
      d.right = "LV " + lv + "  →  " + (lv + 1);
      d.desc = wd.ups[Math.min(lv - 1, wd.ups.length - 1)];
    } else if (o.kind === "evo") {
      var ed = WEAPONS[o.id];
      d.tag = ed.tag; d.color = 0xffd166; d.name = ed.evoName;
      d.right = "EVOLUTION";
      d.desc = ed.name + " transcends into " + ed.evoName + " — massively stronger.";
    } else if (o.kind === "pNew" || o.kind === "pUp") {
      var pd = PASSIVES[o.id], plv = this.passives[o.id] || 0;
      d.tag = pd.tag; d.color = pd.color; d.name = pd.name;
      d.right = plv === 0 ? "NEW" : ("LV " + plv + "  →  " + (plv + 1));
      d.desc = pd.desc;
    } else if (o.kind === "heal") {
      d.tag = "HP+"; d.color = 0xff3b5c; d.name = "Blood Draught";
      d.right = "RECOVER"; d.desc = "Restore 45% of your maximum health instantly.";
    } else {
      d.tag = "AUR"; d.color = 0xffd166; d.name = "Coin Purse";
      d.right = "TREASURE"; d.desc = "Gain a pile of gold (+150) and a small blast of xp.";
    }
    return d;
  },

  applyOption: function (o) {
    if (o.kind === "wNew") {
      this.addWeapon(o.id);
    } else if (o.kind === "wUp") {
      this.weapons[o.id].level++;
    } else if (o.kind === "evo") {
      this.weapons[o.id].evolved = true;
      SFX.play("evo");
      this.fxGold.explode(46, this.player.x, this.player.y);
      this.cameras.main.flash(260, 255, 209, 102);
    } else if (o.kind === "pNew" || o.kind === "pUp") {
      if (!this.passives[o.id]) { this.passives[o.id] = 0; this.pOrder.push(o.id); }
      this.passives[o.id]++;
      if (o.id === "vitality") { this.hp += 20; }
    } else if (o.kind === "heal") {
      this.hp = Math.min(this.stats.maxHp, this.hp + this.stats.maxHp * 0.45);
      SFX.play("heal");
    } else if (o.kind === "gold") {
      this.gold += 150;
      this.xp += 12;
    }
    this.recalc();
    if (this.ui && this.ui.refreshLoadout) { this.ui.refreshLoadout(); }
  },

  /* --------------------------------- XP ----------------------------------- */

  gainXP: function (amount) {
    this.xp += amount * this.stats.xpMul;
    var leveled = false;
    while (this.xp >= this.xpNeed) {
      this.xp -= this.xpNeed;
      this.level++;
      this.xpNeed = xpForLevel(this.level);
      this.pending++;
      leveled = true;
    }
    if (leveled) {
      SFX.play("level");
      this.fxCyan.explode(24, this.player.x, this.player.y);
      if (!this.choosing && !this.gameOver) { this.openChoice(); }
    }
  },

  openChoice: function () {
    this.choosing = true;
    var opts = this.rollOptions(4);
    this.ui.showLevelUp(opts);
    this.scene.pause();
  },

  /* --------------------------- MAIN UPDATE LOOP --------------------------- */

  update: function (time, delta) {
    if (this.gameOver) { return; }
    var dt = Math.min(delta, 50);
    this.elapsed += dt;

    this.updatePlayer(dt);
    this.updateSpawner(dt);
    this.updateEnemies(dt);
    this.updateWeapons(dt);
    this.updateBullets(dt);
    this.updateFoeShots(dt);
    this.updatePickups(dt);
    this.drawFX(dt);

    this.ground.tilePositionX = this.cameras.main.scrollX + this.groundOffX;
    this.ground.tilePositionY = this.cameras.main.scrollY + this.groundOffY;
  },

  /* ------------------------------- PLAYER --------------------------------- */

  updatePlayer: function (dt) {
    var k = this.keys, dts = dt / 1000;
    var dx = 0, dy = 0;
    if (k.left.isDown || k.left2.isDown) { dx -= 1; }
    if (k.right.isDown || k.right2.isDown) { dx += 1; }
    if (k.up.isDown || k.up2.isDown) { dy -= 1; }
    if (k.down.isDown || k.down2.isDown) { dy += 1; }
    /* touch stick: any direction, same full speed as the keys */
    if (TOUCH.on) { dx = TOUCH.x; dy = TOUCH.y; }

    if (dx !== 0 || dy !== 0) {
      var len = Math.sqrt(dx * dx + dy * dy);
      dx /= len; dy /= len;
      this.facing = Math.atan2(dy, dx);
      this.player.setVelocity(dx * this.stats.speed, dy * this.stats.speed);
      this.player.setFlipX(dx < 0);
    } else {
      this.player.setVelocity(0, 0);
    }

    this.player.x = Phaser.Math.Clamp(this.player.x, 24, WORLD - 24);
    this.player.y = Phaser.Math.Clamp(this.player.y, 24, WORLD - 24);

    if (this.invuln > 0) {
      this.invuln -= dt;
      this.player.setAlpha(0.45 + 0.55 * Math.abs(Math.sin(this.elapsed * 0.03)));
      if (this.invuln <= 0) { this.player.setAlpha(1); }
    }
    if (this.stats.regen > 0 && this.hp < this.stats.maxHp) {
      this.hp = Math.min(this.stats.maxHp, this.hp + this.stats.regen * dts);
    }
  },

  hurtPlayer: function (raw) {
    if (this.invuln > 0 || this.gameOver) { return; }
    var dmg = Math.max(1, (raw - this.stats.armorFlat) * (1 - this.stats.armorPct));
    this.hp -= dmg;
    this.invuln = 520;
    SFX.play("hurt");
    this.cameras.main.shake(140, 0.008);
    this.cameras.main.flash(90, 120, 0, 24);
    this.popText(this.player.x, this.player.y - 22, "-" + Math.round(dmg), "#ff5a7a", 18);
    if (this.hp <= 0) { this.hp = 0; this.die(); }
  },

  die: function () {
    this.gameOver = true;
    this.physics.pause();
    this.player.setTint(0xff3b5c);
    this.fxRed.explode(48, this.player.x, this.player.y);
    this.cameras.main.shake(520, 0.014);
    SFX.play("die");
    this.ui.showEnd(false, this.snapshot());
  },

  win: function () {
    this.gameOver = true;
    this.won = true;
    this.physics.pause();
    this.fxGold.explode(90, this.player.x, this.player.y);
    this.cameras.main.flash(500, 255, 209, 102);
    SFX.play("win");
    this.ui.showEnd(true, this.snapshot());
  },

  snapshot: function () {
    var i, list = [];
    for (i = 0; i < this.wOrder.length; i++) {
      var w = this.weapons[this.wOrder[i]];
      list.push((w.evolved ? WEAPONS[w.id].evoName : WEAPONS[w.id].name) + " " + (w.evolved ? "MAX+" : "Lv" + w.level));
    }
    for (i = 0; i < this.pOrder.length; i++) {
      list.push(PASSIVES[this.pOrder[i]].name + " Lv" + this.passives[this.pOrder[i]]);
    }
    return {
      time: this.elapsed / 1000, kills: this.kills, level: this.level,
      gold: this.gold, dmg: Math.round(this.damageDealt), loadout: list,
      charName: this.chr.name
    };
  },

  /* ------------------------------ SPAWNING -------------------------------- */

  hpMul: function () { var t = this.elapsed / 1000; return 1 + t / 52 + Math.pow(t / 170, 2); },
  spdMul: function () { return Math.min(1.55, 1 + this.elapsed / 620000); },
  foeDmgMul: function () { return 1 + this.elapsed / 300000; },

  spawnPos: function (extra) {
    var R = 790 + (extra || 0);
    var i, a, d, x, y;
    for (i = 0; i < 12; i++) {
      a = Math.random() * Math.PI * 2;
      d = R + Math.random() * 200;
      x = this.player.x + Math.cos(a) * d;
      y = this.player.y + Math.sin(a) * d;
      if (x > 40 && x < WORLD - 40 && y > 40 && y < WORLD - 40) { return { x: x, y: y }; }
    }
    /* cornered: aim back toward the middle of the map so foes stay reachable */
    a = Math.atan2(WORLD / 2 - this.player.y, WORLD / 2 - this.player.x) + (Math.random() - 0.5) * 1.7;
    return {
      x: Phaser.Math.Clamp(this.player.x + Math.cos(a) * R, 40, WORLD - 40),
      y: Phaser.Math.Clamp(this.player.y + Math.sin(a) * R, 40, WORLD - 40)
    };
  },

  pickKind: function (t) {
    var table = [["grunt", 10]];
    if (t > 12) { table.push(["swarm", 8 + Math.min(14, t / 12)]); }
    if (t > 45) { table.push(["brute", 3 + Math.min(9, (t - 45) / 26)]); }
    if (t > 75) { table.push(["shooter", 3 + Math.min(8, (t - 75) / 30)]); }
    var total = 0, i;
    for (i = 0; i < table.length; i++) { total += table[i][1]; }
    var r = Math.random() * total, acc = 0;
    for (i = 0; i < table.length; i++) {
      acc += table[i][1];
      if (r <= acc) { return table[i][0]; }
    }
    return "grunt";
  },

  spawnFoe: function (kind, opts) {
    opts = opts || {};
    var big = (kind === "boss" || kind === "final" || kind === "elite");
    if (!big && this.enemies.countActive(true) >= MAX_ENEMIES) { return null; }
    var def = FOES[kind];
    var pos = opts.pos || this.spawnPos(opts.extra || 0);
    var e = this.enemies.get(pos.x, pos.y, def.tex);
    if (!e) { return null; }

    e.setTexture(def.tex);
    e.enableBody(true, pos.x, pos.y, true, true);
    e.setScale(1);
    e.clearTint();
    e.setAlpha(1);
    e.setDepth(big ? 14 : 10);
    e.body.setCircle(def.r, 0, 0);
    e.body.setBounce(0, 0);

    var hm = this.hpMul() * (opts.hpMul || 1);
    e.kind = kind;
    e.maxHp = def.hp * (kind === "final" ? 1 : hm);
    if (kind === "final") { e.maxHp = def.hp * (1 + this.elapsed / 240000); }
    e.hp = e.maxHp;
    e.spd = def.spd * this.spdMul() * (opts.spdMul || 1);
    e.touchDmg = def.dmg * this.foeDmgMul();
    e.hitR = def.r;
    e.xpv = def.xp;
    e.kbRes = def.kbRes;
    e.kbx = 0; e.kby = 0;
    e.slowT = 0; e.stunT = 0; e.flash = 0;
    e.cdOrb = 0; e.cdAura = 0; e.cdWhip = 0; e.cdNova = 0;
    e.shotT = 1000 + Math.random() * 1400;
    e.seed = Math.random() * 100;
    e.chargeT = 4200; e.charging = 0; e.chargeAng = 0; e.addT = 6500;
    e.isFinal = (kind === "final");
    if (big) { this.boss = (kind === "boss" || kind === "final") ? e : this.boss; }
    return e;
  },

  updateSpawner: function (dt) {
    var t = this.elapsed / 1000, i;

    /* Population-target spawner: the horde grows over time but never outruns
       the player's ability to cull it, which keeps pressure high without an
       unrecoverable death spiral. */
    this.spawnT -= dt;
    if (this.spawnT <= 0) {
      this.spawnT = Math.max(300, 900 - t * 1.5);
      var target = Math.min(MAX_ENEMIES - 12, 10 + t * 0.34);
      var deficit = target - this.enemies.countActive(true);
      if (deficit > 0) {
        var n = Math.min(deficit, 1 + Math.floor(t / 45), 8);
        for (i = 0; i < n; i++) { this.spawnFoe(this.pickKind(t)); }
      }
    }

    this.eventT -= dt;
    if (this.eventT <= 0) {
      this.eventT = 28000 + Math.random() * 8000;
      this.runEvent(t);
    }

    if (!this.finalSpawned && t >= FINAL_TIME) {
      this.finalSpawned = true;
      this.spawnFoe("final", { extra: 60 });
      this.ui.banner("THE ETERNAL AWAKENS", "#d7a8ff");
      SFX.play("boss");
      this.cameras.main.shake(700, 0.010);
    } else if (!this.finalSpawned && t >= this.nextBoss) {
      this.nextBoss += 135;
      this.bossCount++;
      this.spawnFoe("boss", { extra: 40, hpMul: 1 + this.bossCount * 0.55 });
      this.ui.banner("BOSS INCOMING", "#ff5a7a");
      SFX.play("boss");
      this.cameras.main.shake(400, 0.007);
    }
  },

  runEvent: function (t) {
    var i, a, d, pos, n;
    var roll = Math.floor(Math.random() * 4);
    if (roll === 0) {
      /* encircling swarm ring */
      n = 22 + Math.floor(t / 12);
      for (i = 0; i < n; i++) {
        a = (i / n) * Math.PI * 2;
        d = 820;
        this.spawnFoe("swarm", { pos: { x: this.player.x + Math.cos(a) * d, y: this.player.y + Math.sin(a) * d } });
      }
      this.ui.banner("THE SWARM", "#c678dd");
    } else if (roll === 1 && t > 40) {
      /* brute column from one side */
      a = Math.random() * Math.PI * 2;
      n = 4 + Math.floor(t / 90);
      for (i = 0; i < n; i++) {
        d = 800 + i * 70;
        this.spawnFoe("brute", { pos: { x: this.player.x + Math.cos(a) * d, y: this.player.y + Math.sin(a) * d } });
      }
      this.ui.banner("BRUTE MARCH", "#4fae6b");
    } else if (roll === 2 && t > 60) {
      /* elite pack */
      n = 1 + Math.floor(t / 150);
      for (i = 0; i < n; i++) { this.spawnFoe("elite", { extra: 20 }); }
      this.ui.banner("ELITES", "#f5d76e");
    } else {
      /* gauntlet — mixed line */
      n = 14 + Math.floor(t / 16);
      a = Math.random() * Math.PI * 2;
      for (i = 0; i < n; i++) {
        var off = (i - n / 2) * 46;
        pos = {
          x: this.player.x + Math.cos(a) * 830 + Math.cos(a + Math.PI / 2) * off,
          y: this.player.y + Math.sin(a) * 830 + Math.sin(a + Math.PI / 2) * off
        };
        this.spawnFoe(Math.random() < 0.7 ? "grunt" : "shooter", { pos: pos });
      }
      this.ui.banner("HORDE", "#d94f4f");
    }
  },

  /* ------------------------------- ENEMIES -------------------------------- */

  updateEnemies: function (dt) {
    var list = this.enemies.getChildren();
    var px = this.player.x, py = this.player.y;
    var dts = dt / 1000;
    var decay = Math.pow(0.0022, dts);
    var i, e;

    for (i = 0; i < list.length; i++) {
      e = list[i];
      if (!e.active) { continue; }

      /* tint state machine */
      if (e.flash > 0) {
        e.flash -= dt;
        if (e.flash <= 0) {
          e.clearTint();
          if (e.slowT > 0) { e.setTint(0x8fd2ff); }
        }
      } else if (e.slowT > 0) {
        e.slowT -= dt;
        if (e.slowT <= 0) { e.clearTint(); }
      }
      if (e.stunT > 0) { e.stunT -= dt; }

      var dx = px - e.x, dy = py - e.y;
      var d = Math.sqrt(dx * dx + dy * dy) || 1;

      /* recycle strays */
      if (d > 1700 && e.kind !== "boss" && e.kind !== "final") {
        var np = this.spawnPos(0);
        e.body.reset(np.x, np.y);
        continue;
      }

      var spd = e.spd * (e.slowT > 0 ? 0.55 : 1);
      if (e.stunT > 0) { spd = 0; }
      var vx = (dx / d) * spd, vy = (dy / d) * spd;

      if (e.kind === "swarm") {
        var wa = Math.atan2(dy, dx) + Math.sin(this.elapsed * 0.006 + e.seed) * 0.55;
        vx = Math.cos(wa) * spd; vy = Math.sin(wa) * spd;
      } else if (e.kind === "shooter") {
        if (d < 230) { vx = -vx * 0.85; vy = -vy * 0.85; }
        else if (d < 330) { vx *= 0.12; vy *= 0.12; }
        e.shotT -= dt;
        if (e.shotT <= 0 && d < 560 && e.stunT <= 0) {
          e.shotT = 2200 + Math.random() * 700;
          this.foeShoot(e);
        }
      } else if (e.kind === "boss" || e.kind === "final") {
        e.chargeT -= dt;
        if (e.charging > 0) {
          e.charging -= dt;
          vx = Math.cos(e.chargeAng) * e.spd * 3.4;
          vy = Math.sin(e.chargeAng) * e.spd * 3.4;
          if (e.charging <= 0) { e.chargeT = 3800; }
        } else if (e.chargeT <= 0 && d < 700 && e.stunT <= 0) {
          e.charging = 850;
          e.chargeAng = Math.atan2(dy, dx);
        }
        e.addT -= dt;
        if (e.addT <= 0) {
          e.addT = e.isFinal ? 4200 : 7000;
          var adds = e.isFinal ? 8 : 4;
          for (var q = 0; q < adds; q++) {
            var aa = (q / adds) * Math.PI * 2 + e.seed;
            this.spawnFoe(e.isFinal ? "grunt" : "swarm", {
              pos: { x: e.x + Math.cos(aa) * (e.hitR + 30), y: e.y + Math.sin(aa) * (e.hitR + 30) }
            });
          }
        }
        if (e.isFinal) {
          e.shotT -= dt;
          if (e.shotT <= 0) {
            e.shotT = 1900;
            for (var s = 0; s < 10; s++) {
              this.foeShootAngle(e, (s / 10) * Math.PI * 2 + e.seed * 0.1, 240);
            }
          }
        }
      }

      e.setVelocity(vx + e.kbx, vy + e.kby);
      e.kbx *= decay; e.kby *= decay;
      if (Math.abs(e.kbx) < 2) { e.kbx = 0; }
      if (Math.abs(e.kby) < 2) { e.kby = 0; }

      /* contact damage */
      if (d < e.hitR + 13) { this.hurtPlayer(e.touchDmg); }
    }
  },

  foeShoot: function (e) {
    var ang = Math.atan2(this.player.y - e.y, this.player.x - e.x);
    this.foeShootAngle(e, ang, 230);
  },
  foeShootAngle: function (e, ang, speed) {
    var b = this.foeShots.get(e.x, e.y, "foebolt");
    if (!b) { return; }
    b.setTexture("foebolt");
    b.enableBody(true, e.x, e.y, true, true);
    b.setDepth(24);
    b.body.setCircle(7, 0, 0);
    b.setVelocity(Math.cos(ang) * speed, Math.sin(ang) * speed);
    b.life = 4200;
    b.dmg = e.touchDmg * 0.85;
    SFX.play("shoot");
  },
  onFoeShotHit: function (player, b) {
    if (!b.active) { return; }
    this.hurtPlayer(b.dmg);
    this.fxRed.explode(6, b.x, b.y);
    b.disableBody(true, true);
  },
  updateFoeShots: function (dt) {
    var list = this.foeShots.getChildren();
    for (var i = 0; i < list.length; i++) {
      var b = list[i];
      if (!b.active) { continue; }
      b.life -= dt;
      if (b.life <= 0) { b.disableBody(true, true); }
    }
  },

  /* ------------------------------ DAMAGING -------------------------------- */

  damageEnemy: function (e, amount, opt) {
    if (!e.active) { return; }
    opt = opt || {};
    var crit = Math.random() < this.stats.crit;
    var dmg = amount * this.stats.dmgMul * (crit ? this.stats.critMul : 1);
    e.hp -= dmg;
    this.damageDealt += dmg;

    e.flash = 70;
    e.setTintFill(0xffffff);

    if (opt.kb) {
      var sx = (opt.fromX !== undefined) ? opt.fromX : this.player.x;
      var sy = (opt.fromY !== undefined) ? opt.fromY : this.player.y;
      var ax = e.x - sx, ay = e.y - sy;
      var al = Math.sqrt(ax * ax + ay * ay) || 1;
      var f = opt.kb * (1 - e.kbRes);
      e.kbx += (ax / al) * f;
      e.kby += (ay / al) * f;
    }
    if (opt.slow) { e.slowT = opt.slow; }
    if (opt.stun) { e.stunT = Math.max(e.stunT, opt.stun); }
    if (opt.lifesteal) {
      this.hp = Math.min(this.stats.maxHp, this.hp + dmg * opt.lifesteal);
    }

    if (Math.random() < 0.55 || crit || e.hp <= 0) {
      this.popText(e.x + Phaser.Math.Between(-8, 8), e.y - e.hitR - 4,
        String(Math.round(dmg)), crit ? "#ffd166" : "#ffffff", crit ? 22 : 16);
    }
    SFX.play("hit");
    if (e.hp <= 0) { this.killEnemy(e); }
  },

  killEnemy: function (e) {
    this.kills++;
    var kind = e.kind;
    var isFinal = e.isFinal;
    var x = e.x, y = e.y;

    if (kind === "boss" || kind === "final") {
      this.fxGold.explode(70, x, y);
      this.cameras.main.shake(400, 0.010);
      this.spawnPickup(x, y, "chest", 0);
    } else if (kind === "elite") {
      this.fxGold.explode(26, x, y);
      this.spawnPickup(x, y, "heart", 0);
    } else {
      this.fxRed.explode(Math.min(16, 5 + Math.floor(e.hitR / 2.5)), x, y);
    }

    this.dropLoot(kind, x, y, e.xpv);
    if (this.boss === e) { this.boss = null; }
    e.disableBody(true, true);
    SFX.play("kill");

    if (isFinal) { this.win(); }
  },

  dropLoot: function (kind, x, y, xpv) {
    var luck = this.stats.luck;
    var val = xpv;
    if (kind === "boss") { val = 130; }
    if (kind === "elite") { val = 22; }
    this.spawnPickup(x, y, "gem", val);

    var r = Math.random();
    if (r < 0.030 * luck) { this.spawnPickup(x + 12, y, "heart", 0); }
    else if (r < 0.045 * luck) { this.spawnPickup(x + 12, y, "magnetp", 0); }
    else if (r < 0.056 * luck) { this.spawnPickup(x + 12, y, "bombp", 0); }
    if (Math.random() < 0.09 * luck) { this.spawnPickup(x - 12, y, "coin", Math.floor(5 + Math.random() * 12)); }
  },

  /* ------------------------------- WEAPONS -------------------------------- */

  updateWeapons: function (dt) {
    for (var i = 0; i < this.wOrder.length; i++) {
      var id = this.wOrder[i];
      var w = this.weapons[id];
      var st = WEAPONS[id].stat(w.level, w.evolved);
      w.t -= dt;
      if (id === "orbit") {
        this.wOrbit(w, st, dt);
      } else if (id === "aura") {
        this.wAura(w, st, dt);
      } else if (w.t <= 0) {
        w.t = Math.max(90, st.cd * this.stats.cdr);
        if (id === "bolt") { this.wBolt(w, st); }
        else if (id === "nova") { this.wNova(w, st); }
        else if (id === "whip") { this.wWhip(w, st); }
        else if (id === "storm") { this.wStorm(w, st); }
      }
    }
    if (!this.weapons.orbit) {
      while (this.orbs.length) { this.orbs.pop().destroy(); }
    }
  },

  /* --- 1. orbital shield --- */
  wOrbit: function (w, st, dt) {
    w.ang += st.rot * dt / 1000;
    var col = w.evolved ? 0xffd166 : 0x7ee8fa;
    var radius = st.radius * this.stats.areaMul;

    while (this.orbs.length < st.count) {
      var s = this.add.image(0, 0, "orb").setDepth(26).setBlendMode(Phaser.BlendModes.ADD);
      this.orbs.push(s);
    }
    while (this.orbs.length > st.count) { this.orbs.pop().destroy(); }

    var i;
    for (i = 0; i < this.orbs.length; i++) {
      var a = w.ang + (i / this.orbs.length) * Math.PI * 2;
      var o = this.orbs[i];
      o.setPosition(this.player.x + Math.cos(a) * radius, this.player.y + Math.sin(a) * radius);
      o.setScale(st.size * (1 + 0.07 * Math.sin(this.elapsed * 0.01 + i)));
      o.setTint(col);
    }

    var hitR = 17 * st.size;
    var list = this.enemies.getChildren();
    for (i = 0; i < list.length; i++) {
      var e = list[i];
      if (!e.active || this.elapsed < e.cdOrb) { continue; }
      for (var j = 0; j < this.orbs.length; j++) {
        var ob = this.orbs[j];
        var ddx = e.x - ob.x, ddy = e.y - ob.y;
        var rr = hitR + e.hitR;
        if (ddx * ddx + ddy * ddy < rr * rr) {
          e.cdOrb = this.elapsed + st.cd;
          this.damageEnemy(e, st.dmg, { kb: 55, fromX: ob.x, fromY: ob.y });
          break;
        }
      }
    }
  },

  /* --- 2. tracking projectiles --- */
  wBolt: function (w, st) {
    var targets = this.nearestEnemies(st.count, 780);
    for (var i = 0; i < st.count; i++) {
      var ang;
      if (targets.length > 0) {
        var t = targets[i % targets.length];
        ang = Math.atan2(t.y - this.player.y, t.x - this.player.x);
        if (i >= targets.length) { ang += Phaser.Math.FloatBetween(-0.32, 0.32); }
      } else {
        ang = this.facing + (i - (st.count - 1) / 2) * 0.26;
      }
      this.fireBullet(ang, st, w.evolved);
    }
    SFX.play("shoot");
  },

  fireBullet: function (ang, st, evo) {
    var x = this.player.x, y = this.player.y;
    var key = evo ? "bolt2" : "bolt";
    var b = this.bullets.get(x, y, key);
    if (!b) { return; }
    b.setTexture(key);
    b.enableBody(true, x, y, true, true);
    b.setDepth(25);
    b.setRotation(ang);
    b.setScale(st.size);
    b.setBlendMode(Phaser.BlendModes.ADD);
    b.body.setSize(14, 9, true);
    b.setVelocity(Math.cos(ang) * st.speed, Math.sin(ang) * st.speed);
    b.dmg = st.dmg;
    b.pierce = st.pierce;
    b.life = st.life;
    b.spd = st.speed;
    b.homing = st.homing;
    if (!b.hitSet) { b.hitSet = []; } else { b.hitSet.length = 0; }
  },

  onBulletHit: function (b, e) {
    if (!b.active || !e.active) { return; }
    if (b.hitSet.indexOf(e) !== -1) { return; }
    b.hitSet.push(e);
    this.damageEnemy(e, b.dmg, { kb: 110, fromX: b.x, fromY: b.y });
    this.fxGold.explode(3, b.x, b.y);
    b.pierce--;
    if (b.pierce < 0) { b.disableBody(true, true); }
  },

  updateBullets: function (dt) {
    var list = this.bullets.getChildren();
    var dts = dt / 1000;
    for (var i = 0; i < list.length; i++) {
      var b = list[i];
      if (!b.active) { continue; }
      b.life -= dt;
      if (b.homing) {
        var t = this.nearestTo(b.x, b.y, 620);
        if (t) {
          var cur = Math.atan2(b.body.velocity.y, b.body.velocity.x);
          var want = Math.atan2(t.y - b.y, t.x - b.x);
          var na = cur + Phaser.Math.Angle.Wrap(want - cur) * Math.min(1, 5.0 * dts);
          b.setVelocity(Math.cos(na) * b.spd, Math.sin(na) * b.spd);
          b.setRotation(na);
        }
      }
      if (b.life <= 0) { b.disableBody(true, true); }
    }
  },

  /* --- 3. radial AOE pulse --- */
  wNova: function (w, st) {
    var col = w.evolved ? 0xff9f45 : 0x9ad0ff;
    for (var i = 0; i < st.waves; i++) {
      this.novas.push({
        x: this.player.x, y: this.player.y, r: 10,
        max: st.radius * this.stats.areaMul,
        dmg: st.dmg, spd: st.wave, kb: st.kb, col: col, delay: i * 160
      });
    }
    SFX.play("nova");
  },

  /* --- 4. directional arc slash --- */
  wWhip: function (w, st) {
    var col = w.evolved ? 0xff3b5c : 0xff8fb1;
    var dirs = [this.facing];
    if (st.arcs >= 2) { dirs.push(this.facing + Math.PI); }
    if (st.arcs >= 4) { dirs.push(this.facing + Math.PI / 2, this.facing - Math.PI / 2); }
    if (st.arcs >= 6) { dirs.push(this.facing + Math.PI / 4, this.facing - Math.PI / 4); }

    var range = st.range * this.stats.areaMul;
    var half = st.arc / 2;
    var list = this.enemies.getChildren();

    for (var k = 0; k < dirs.length; k++) {
      var ang = dirs[k];
      this.slashes.push({ x: this.player.x, y: this.player.y, ang: ang, range: range, half: half, t: 200, max: 200, col: col });
      for (var i = 0; i < list.length; i++) {
        var e = list[i];
        if (!e.active || this.elapsed < e.cdWhip) { continue; }
        var dx = e.x - this.player.x, dy = e.y - this.player.y;
        var d = Math.sqrt(dx * dx + dy * dy);
        if (d > range + e.hitR) { continue; }
        var da = Math.abs(Phaser.Math.Angle.Wrap(Math.atan2(dy, dx) - ang));
        if (da <= half) {
          e.cdWhip = this.elapsed + 180;
          this.damageEnemy(e, st.dmg, { kb: st.kb });
        }
      }
    }
    SFX.play("whip");
  },

  /* --- 5. lightning strikes --- */
  wStorm: function (w, st) {
    var col = w.evolved ? 0xffe08a : 0xc9a7ff;
    var cands = this.enemiesOnScreen();
    var radius = st.radius * this.stats.areaMul;
    for (var i = 0; i < st.count; i++) {
      var tx, ty;
      if (cands.length > 0) {
        var t = cands[Math.floor(Math.random() * cands.length)];
        tx = t.x; ty = t.y;
      } else {
        tx = this.player.x + Phaser.Math.Between(-320, 320);
        ty = this.player.y + Phaser.Math.Between(-320, 320);
      }
      this.zaps.push({ x: tx, y: ty, r: radius, t: 240, max: 240, seed: Math.random() * 10, col: col });
      var list = this.enemies.getChildren();
      for (var j = 0; j < list.length; j++) {
        var e = list[j];
        if (!e.active) { continue; }
        var dx = e.x - tx, dy = e.y - ty;
        var rr = radius + e.hitR;
        if (dx * dx + dy * dy < rr * rr) {
          this.damageEnemy(e, st.dmg, { kb: 120, fromX: tx, fromY: ty, stun: st.stun });
        }
      }
      this.fxCyan.explode(8, tx, ty);
    }
    SFX.play("zap");
  },

  /* --- 6. damaging aura --- */
  wAura: function (w, st, dt) {
    var R = st.radius * this.stats.areaMul;
    w.drawR = R;
    w.col = w.evolved ? 0xff2d55 : 0xff5a7a;
    var list = this.enemies.getChildren();
    var px = this.player.x, py = this.player.y;
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      if (!e.active) { continue; }
      var dx = e.x - px, dy = e.y - py;
      var rr = R + e.hitR;
      if (dx * dx + dy * dy < rr * rr) {
        e.slowT = Math.max(e.slowT, 400);
        if (this.elapsed >= e.cdAura) {
          e.cdAura = this.elapsed + st.tick;
          this.damageEnemy(e, st.dmg, { kb: 30, slow: 500, lifesteal: st.lifesteal });
        }
      }
    }
  },

  /* --------------------------- TARGET HELPERS ----------------------------- */

  nearestEnemies: function (n, range) {
    var list = this.enemies.getChildren();
    var px = this.player.x, py = this.player.y, r2 = range * range;
    var out = [];
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      if (!e.active) { continue; }
      var dx = e.x - px, dy = e.y - py;
      var d = dx * dx + dy * dy;
      if (d < r2) { out.push({ e: e, d: d }); }
    }
    out.sort(function (a, b) { return a.d - b.d; });
    var res = [];
    for (var k = 0; k < out.length && k < n; k++) { res.push(out[k].e); }
    return res;
  },

  nearestTo: function (x, y, range) {
    var list = this.enemies.getChildren();
    var best = null, bd = range * range;
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      if (!e.active) { continue; }
      var dx = e.x - x, dy = e.y - y;
      var d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = e; }
    }
    return best;
  },

  enemiesOnScreen: function () {
    var v = this.cameras.main.worldView;
    var list = this.enemies.getChildren();
    var out = [];
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      if (e.active && v.contains(e.x, e.y)) { out.push(e); }
    }
    return out;
  },

  /* ------------------------------- PICKUPS -------------------------------- */

  spawnPickup: function (x, y, type, val) {
    if (this.pickups.length >= MAX_PICKUPS) {
      var old = this.pickups.shift();
      this.collect(old);
    }
    var key = type;
    if (type === "gem") { key = val >= 20 ? "gem3" : (val >= 5 ? "gem2" : "gem1"); }
    var s = this.add.image(x, y, key).setDepth(6);
    s.ptype = type;
    s.pval = val;
    s.mag = false;
    s.bob = Math.random() * 6.28;
    this.pickups.push(s);
    this.tweens.add({ targets: s, scale: { from: 0.2, to: 1 }, duration: 240, ease: "Back.easeOut" });
    if (type === "chest") { s.setScale(1); this.tweens.add({ targets: s, angle: { from: -8, to: 8 }, duration: 500, yoyo: true, repeat: -1 }); }
    return s;
  },

  updatePickups: function (dt) {
    var px = this.player.x, py = this.player.y;
    var mag = this.stats.magnet, dts = dt / 1000;
    for (var i = this.pickups.length - 1; i >= 0; i--) {
      var p = this.pickups[i];
      var dx = px - p.x, dy = py - p.y;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d < 1) { d = 1; }
      if (!p.mag && d < mag) { p.mag = true; }
      if (p.mag) {
        var sp = Math.min(880, 200 + Math.max(0, mag - d) * 3.4 + (mag > 400 ? 200 : 0));
        p.x += (dx / d) * sp * dts;
        p.y += (dy / d) * sp * dts;
      } else {
        p.y += Math.sin(this.elapsed * 0.005 + p.bob) * 8 * dts;
      }
      if (d < 26) {
        this.collect(p);
        this.pickups.splice(i, 1);
      }
    }
  },

  collect: function (p) {
    var t = p.ptype;
    if (t === "gem") {
      this.gainXP(p.pval);
      SFX.play("pickup");
    } else if (t === "heart") {
      this.hp = Math.min(this.stats.maxHp, this.hp + this.stats.maxHp * 0.22 + 8);
      this.popText(this.player.x, this.player.y - 30, "+HP", "#63ff8f", 20);
      SFX.play("heal");
    } else if (t === "coin") {
      this.gold += Math.round(p.pval * (1 + (this.passives.fortune || 0) * 0.25));
      SFX.play("pickup");
    } else if (t === "magnetp") {
      for (var i = 0; i < this.pickups.length; i++) { this.pickups[i].mag = true; }
      this.popText(this.player.x, this.player.y - 30, "MAGNET!", "#63b7ff", 22);
      SFX.play("level");
    } else if (t === "bombp") {
      this.detonate();
    } else if (t === "chest") {
      this.gold += 250;
      this.hp = this.stats.maxHp;
      this.pending += 2;
      this.fxGold.explode(50, this.player.x, this.player.y);
      this.popText(this.player.x, this.player.y - 40, "TREASURE!", "#ffd166", 26);
      SFX.play("evo");
      if (!this.choosing && !this.gameOver) { this.openChoice(); }
    }
    if (p.destroy) { p.destroy(); }
  },

  detonate: function () {
    var list = this.enemiesOnScreen();
    this.cameras.main.flash(260, 255, 240, 200);
    this.cameras.main.shake(300, 0.012);
    this.fxGold.explode(60, this.player.x, this.player.y);
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      var dmg = (e.kind === "boss" || e.kind === "final") ? e.maxHp * 0.10 : e.maxHp * 3 + 100;
      this.damageEnemy(e, dmg / Math.max(0.0001, this.stats.dmgMul), { kb: 320 });
    }
    this.popText(this.player.x, this.player.y - 40, "BOOM!", "#ffa64d", 28);
    SFX.play("boss");
  },

  /* --------------------------------- FX ----------------------------------- */

  popText: function (x, y, str, color, size) {
    var t = null;
    for (var i = 0; i < this.dmgPool.length; i++) {
      if (!this.dmgPool[i].active) { t = this.dmgPool[i]; break; }
    }
    if (!t) { return; }
    t.setActive(true).setVisible(true);
    t.setPosition(x, y);
    t.setText(str);
    t.setColor(color);
    t.setFontSize(size || 16);
    t.setAlpha(1);
    this.tweens.add({
      targets: t, y: y - 36, alpha: 0, duration: 640, ease: "Quad.easeOut",
      onComplete: function () { t.setActive(false).setVisible(false); }
    });
  },

  drawFX: function (dt) {
    var g = this.fx;
    g.clear();
    var i, dts = dt / 1000;
    var px = this.player.x, py = this.player.y;

    /* aura field */
    var aw = this.weapons.aura;
    if (aw && aw.drawR) {
      var pulse = 0.09 + 0.035 * Math.sin(this.elapsed * 0.006);
      g.fillStyle(aw.col, pulse);
      g.fillCircle(px, py, aw.drawR);
      g.lineStyle(2, aw.col, 0.45);
      g.strokeCircle(px, py, aw.drawR);
      g.lineStyle(1, aw.col, 0.22);
      g.strokeCircle(px, py, aw.drawR * (0.55 + 0.12 * Math.sin(this.elapsed * 0.009)));
    }

    /* nova shockwaves */
    for (i = this.novas.length - 1; i >= 0; i--) {
      var n = this.novas[i];
      if (n.delay > 0) { n.delay -= dt; continue; }
      n.r += n.spd * dts;
      var prog = n.r / n.max;
      if (prog >= 1) { this.novas.splice(i, 1); continue; }
      g.lineStyle(3 + 9 * (1 - prog), n.col, 0.85 * (1 - prog));
      g.strokeCircle(n.x, n.y, n.r);
      g.lineStyle(2, 0xffffff, 0.35 * (1 - prog));
      g.strokeCircle(n.x, n.y, n.r * 0.94);

      var list = this.enemies.getChildren();
      for (var j = 0; j < list.length; j++) {
        var e = list[j];
        if (!e.active || this.elapsed < e.cdNova) { continue; }
        var dx = e.x - n.x, dy = e.y - n.y;
        var d = Math.sqrt(dx * dx + dy * dy);
        if (Math.abs(d - n.r) < 30 + e.hitR) {
          e.cdNova = this.elapsed + 420;
          this.damageEnemy(e, n.dmg, { kb: n.kb, fromX: n.x, fromY: n.y });
        }
      }
    }

    /* whip arcs */
    for (i = this.slashes.length - 1; i >= 0; i--) {
      var s = this.slashes[i];
      s.t -= dt;
      if (s.t <= 0) { this.slashes.splice(i, 1); continue; }
      var k = s.t / s.max;
      g.fillStyle(s.col, 0.36 * k);
      g.beginPath();
      g.moveTo(s.x, s.y);
      g.arc(s.x, s.y, s.range * (1.12 - 0.12 * k), s.ang - s.half, s.ang + s.half, false);
      g.closePath();
      g.fillPath();
      g.lineStyle(3, 0xffffff, 0.5 * k);
      g.beginPath();
      g.arc(s.x, s.y, s.range * (1.12 - 0.12 * k), s.ang - s.half, s.ang + s.half, false);
      g.strokePath();
    }

    /* lightning */
    for (i = this.zaps.length - 1; i >= 0; i--) {
      var z = this.zaps[i];
      z.t -= dt;
      if (z.t <= 0) { this.zaps.splice(i, 1); continue; }
      var kk = z.t / z.max;
      g.lineStyle(2 + 5 * kk, z.col, 0.35 + 0.65 * kk);
      g.beginPath();
      g.moveTo(z.x + Math.sin(z.seed) * 20, z.y - 460);
      for (var q = 1; q <= 9; q++) {
        var yy = z.y - 460 + (460 * q / 9);
        var xx = z.x + Math.sin(z.seed + q * 1.7) * (1 - q / 9) * 52 + (Math.random() - 0.5) * 9;
        g.lineTo(xx, yy);
      }
      g.strokePath();
      g.fillStyle(z.col, 0.28 * kk);
      g.fillCircle(z.x, z.y, z.r * (1.2 - 0.2 * kk));
      g.lineStyle(2, 0xffffff, 0.6 * kk);
      g.strokeCircle(z.x, z.y, z.r * (1.2 - 0.2 * kk));
    }

    /* big-enemy health bars */
    var el = this.enemies.getChildren();
    for (i = 0; i < el.length; i++) {
      var b = el[i];
      if (!b.active) { continue; }
      if (b.kind !== "elite" && b.kind !== "boss" && b.kind !== "final") { continue; }
      var w = b.hitR * 2.2;
      var frac = Phaser.Math.Clamp(b.hp / b.maxHp, 0, 1);
      g.fillStyle(0x000000, 0.62);
      g.fillRect(b.x - w / 2 - 1, b.y - b.hitR - 15, w + 2, 8);
      g.fillStyle(b.kind === "elite" ? 0xf5d76e : 0xff3b5c, 1);
      g.fillRect(b.x - w / 2, b.y - b.hitR - 14, w * frac, 6);
    }
  }
});

/* ================================= UI SCENE =============================== */

var UIScene = new Phaser.Class({
  Extends: Phaser.Scene,
  initialize: function UIScene() { Phaser.Scene.call(this, { key: "UI" }); },

  create: function () {
    var S = this;
    this.gs = this.scene.get("Game");
    this.modalOpen = false;
    this.endOpen = false;
    this.opts = [];
    this.hoverIdx = 0;

    this.g = this.add.graphics().setDepth(2);

    var lbl = { fontFamily: MONO, fontSize: "18px", color: "#e8e6f2", fontStyle: "bold" };

    this.tLevel = this.add.text(10, 8, "LV 1", { fontFamily: MONO, fontSize: "12px", color: "#eaf6ff", fontStyle: "bold" })
      .setOrigin(0, 0.5).setDepth(3).setShadow(0, 1, "#000000", 3, false, true);
    this.tHp = this.add.text(150, 36, "", { fontFamily: MONO, fontSize: "15px", color: "#ffffff", fontStyle: "bold" }).setOrigin(0.5).setDepth(3);
    this.tTime = this.add.text(VIEW_W / 2, 44, "00:00", {
      fontFamily: MONO, fontSize: "40px", color: "#ffffff", fontStyle: "bold"
    }).setOrigin(0.5).setDepth(3).setShadow(0, 3, "#000000", 6, false, true);
    this.tGoal = this.add.text(VIEW_W / 2, 74, "SURVIVE 15:00", {
      fontFamily: MONO, fontSize: "13px", color: "#8f8bb0"
    }).setOrigin(0.5).setDepth(3);

    this.tKills = this.add.text(VIEW_W - 14, 30, "", lbl).setOrigin(1, 0.5).setDepth(3);
    this.tGold = this.add.text(VIEW_W - 14, 54, "", { fontFamily: MONO, fontSize: "17px", color: "#ffd166", fontStyle: "bold" }).setOrigin(1, 0.5).setDepth(3);
    this.tFoes = this.add.text(VIEW_W - 14, 78, "", { fontFamily: MONO, fontSize: "14px", color: "#8f8bb0" }).setOrigin(1, 0.5).setDepth(3);

    this.loadout = this.add.container(0, 0).setDepth(3);

    this.tBanner = this.add.text(VIEW_W / 2, 210, "", {
      fontFamily: FONT, fontSize: "54px", color: "#ff5a7a", fontStyle: "bold"
    }).setOrigin(0.5).setDepth(6).setAlpha(0).setShadow(0, 4, "#000000", 10, false, true);

    this.buildModal();
    this.buildPause();
    this.buildEnd();
    if (MOBILE) { this.layoutMobile(); }
    this.refreshLoadout();

    /* input */
    this.input.keyboard.on("keydown-ONE", function () { S.pick(0); });
    this.input.keyboard.on("keydown-TWO", function () { S.pick(1); });
    this.input.keyboard.on("keydown-THREE", function () { S.pick(2); });
    this.input.keyboard.on("keydown-FOUR", function () { S.pick(3); });
    this.input.keyboard.on("keydown-UP", function () { S.move(-1); });
    this.input.keyboard.on("keydown-W", function () { S.move(-1); });
    this.input.keyboard.on("keydown-DOWN", function () { S.move(1); });
    this.input.keyboard.on("keydown-S", function () { S.move(1); });
    this.input.keyboard.on("keydown-ENTER", function () {
      if (S.modalOpen) { S.pick(S.hoverIdx); }
      else if (S.endOpen) { S.toMenu(); }
    });
    this.input.keyboard.on("keydown-SPACE", function () { if (S.modalOpen) { S.pick(S.hoverIdx); } });
    this.input.keyboard.on("keydown-R", function () {
      if (S.modalOpen) { S.reroll(); }
      else if (S.endOpen) { S.toMenu(); }
    });
    this.input.keyboard.on("keydown-P", function () { S.togglePause(); });
    this.input.keyboard.on("keydown-ESC", function () { S.togglePause(); });
    this.input.keyboard.on("keydown-M", function () { SFX.muted = !SFX.muted; });
  },

  /* ------------------------------- MODAL ---------------------------------- */

  buildModal: function () {
    var S = this;
    this.modalBits = [];
    var bg = this.add.rectangle(VIEW_W / 2, VIEW_H / 2, VIEW_W, VIEW_H, 0x05040a, 0.88).setDepth(50);
    var title = this.add.text(VIEW_W / 2, 96, "LEVEL UP", {
      fontFamily: FONT, fontSize: "52px", color: "#ffd166", fontStyle: "bold"
    }).setOrigin(0.5).setDepth(52).setShadow(0, 4, "#000000", 8, false, true);
    this.mSub = this.add.text(VIEW_W / 2, 140, "Choose your power", {
      fontFamily: FONT, fontSize: "20px", color: "#b9b6cc"
    }).setOrigin(0.5).setDepth(52);
    this.mFoot = this.add.text(VIEW_W / 2, 676, "", {
      fontFamily: MONO, fontSize: "16px", color: "#8f8bb0"
    }).setOrigin(0.5).setDepth(52);
    this.modalBits.push(bg, title, this.mSub, this.mFoot);

    this.cards = [];
    for (var i = 0; i < 4; i++) {
      (function (i) {
        var y = 214 + i * 106;
        var cbg = S.add.rectangle(VIEW_W / 2, y, 820, 96, 0x14121f, 0.98)
          .setStrokeStyle(2, 0x3a3550).setDepth(51).setInteractive({ useHandCursor: true });
        var badge = S.add.rectangle(300, y, 68, 68, 0xffffff, 1).setDepth(52);
        var tag = S.add.text(300, y, "---", { fontFamily: MONO, fontSize: "21px", color: "#0b0a12", fontStyle: "bold" })
          .setOrigin(0.5).setDepth(53);
        var num = S.add.text(258, y - 33, "1", { fontFamily: MONO, fontSize: "16px", color: "#6f6a8c", fontStyle: "bold" })
          .setOrigin(0.5).setDepth(53);
        var name = S.add.text(348, y - 24, "", { fontFamily: FONT, fontSize: "25px", color: "#ffffff", fontStyle: "bold" })
          .setOrigin(0, 0.5).setDepth(52);
        var right = S.add.text(1022, y - 24, "", { fontFamily: MONO, fontSize: "16px", color: "#ffd166", fontStyle: "bold" })
          .setOrigin(1, 0.5).setDepth(52);
        var desc = S.add.text(348, y + 14, "", {
          fontFamily: FONT, fontSize: "17px", color: "#a9a5bd", wordWrap: { width: 660 }
        }).setOrigin(0, 0.5).setDepth(52);
        cbg.on("pointerover", function () { S.hover(i); });
        if (MOBILE) {
          /* touch: a card is chosen by a full tap on it (down + up) once the
             panel has been up for a moment, so a thumb that was steering
             when the level-up popped cannot pick by accident */
          cbg.on("pointerdown", function () { S.hover(i); S.downIdx = i; });
          cbg.on("pointerup", function () {
            if (S.downIdx === i && performance.now() - S.modalAt > 350) { S.downIdx = -1; S.pick(i); }
          });
        } else {
          cbg.on("pointerdown", function () { S.pick(i); });
        }
        var card = { bg: cbg, badge: badge, tag: tag, num: num, name: name, right: right, desc: desc };
        S.cards.push(card);
        S.modalBits.push(cbg, badge, tag, num, name, right, desc);
      })(i);
    }
    if (MOBILE) {
      /* touch replacement for [R]: a REROLL button */
      this.downIdx = -1; this.modalAt = 0; this.rrDown = false;
      this.rrBox = this.add.rectangle(0, 0, 150, 46, 0x1e1b30, 0.98).setStrokeStyle(2, 0x6f6a8c)
        .setDepth(52).setInteractive({ useHandCursor: true });
      this.rrText = this.add.text(0, 0, "REROLL", {
        fontFamily: FONT, fontSize: "16px", color: "#ffd166", fontStyle: "bold"
      }).setOrigin(0.5).setDepth(53);
      this.rrBox.on("pointerdown", function () { S.rrDown = true; });
      this.rrBox.on("pointerup", function () {
        if (S.rrDown && performance.now() - S.modalAt > 350) { S.rrDown = false; S.reroll(); }
      });
      this.modalBits.push(this.rrBox, this.rrText);
    }
    this.setVis(this.modalBits, false);
  },

  setVis: function (arr, v) { for (var i = 0; i < arr.length; i++) { arr[i].setVisible(v); } },

  cardBits: function (c) { return [c.bg, c.badge, c.tag, c.num, c.name, c.right, c.desc]; },

  showLevelUp: function (opts) {
    this.opts = opts;
    this.modalOpen = true;
    this.setVis(this.modalBits, true);
    for (var i = 0; i < 4; i++) {
      var c = this.cards[i];
      if (i < opts.length) {
        var o = opts[i];
        this.setVis(this.cardBits(c), true);
        c.badge.setFillStyle(o.color, 1);
        c.tag.setText(o.tag);
        c.num.setText(String(i + 1));
        c.name.setText(o.name);

      } else {

      }
    }

    if (MOBILE) { this.modalAt = performance.now(); this.downIdx = -1; this.rrDown = false; }
    this.hover(0);
    this.updateFoot();
  },

  updateFoot: function () {
    if (MOBILE) {
      this.mFoot.setText("TAP A CARD TO CHOOSE");
      this.rrText.setText("REROLL  (" + this.gs.rerolls + ")");
      this.rrBox.setAlpha(this.gs.rerolls > 0 ? 1 : 0.45);
      this.rrText.setAlpha(this.gs.rerolls > 0 ? 1 : 0.45);
      return;
    }
    this.mFoot.setText("[1-4] or CLICK to choose    ·    [↑↓]+[ENTER]    ·    [R] reroll  (" + this.gs.rerolls + " left)");
  },

  hover: function (i) {
    if (!this.modalOpen || i >= this.opts.length) { return; }
    this.hoverIdx = i;
    for (var k = 0; k < this.cards.length; k++) {
      var on = (k === i);
      var col = (k < this.opts.length) ? this.opts[k].color : 0x3a3550;
      this.cards[k].bg.setStrokeStyle(on ? 3 : 2, on ? col : 0x3a3550);
      this.cards[k].bg.setFillStyle(on ? 0x201d33 : 0x14121f, 0.98);
    }
  },

  move: function (d) {
    if (!this.modalOpen) { return; }
    var n = this.opts.length;
    this.hover((this.hoverIdx + d + n) % n);
    SFX.play("ui");
  },

  reroll: function () {
    if (!this.modalOpen || this.gs.rerolls <= 0) { return; }
    this.gs.rerolls--;
    SFX.play("ui");
    this.showLevelUp(this.gs.rollOptions(4));
  },

  pick: function (i) {
    if (!this.modalOpen || i >= this.opts.length) { return; }
    var gs = this.gs;
    gs.applyOption(this.opts[i]);
    gs.pending--;
    SFX.play("level");
    if (gs.pending > 0) {
      this.showLevelUp(gs.rollOptions(4));
    } else {
      this.modalOpen = false;
      this.setVis(this.modalBits, false);
      gs.choosing = false;
      this.scene.resume("Game");
    }
  },

  /* ------------------------------- PAUSE ---------------------------------- */

  buildPause: function () {
    this.pauseBits = [];
    var bg = this.add.rectangle(VIEW_W / 2, VIEW_H / 2, VIEW_W, VIEW_H, 0x05040a, 0.78).setDepth(46);
    var t1 = this.add.text(VIEW_W / 2, 300, "PAUSED", {
      fontFamily: FONT, fontSize: "64px", color: "#ffffff", fontStyle: "bold"
    }).setOrigin(0.5).setDepth(47);
    var t2 = this.add.text(VIEW_W / 2, 372, "[P] or [ESC] to resume    ·    [M] toggle sound", {
      fontFamily: MONO, fontSize: "19px", color: "#b9b6cc"
    }).setOrigin(0.5).setDepth(47);
    this.pauseBits.push(bg, t1, t2);
    this.pBg = bg; this.pT1 = t1; this.pT2 = t2;
    if (MOBILE) {
      /* touch replacements for [P]/[ESC] and [M] */
      var S = this;
      var mkBtn = function (label, fn) {
        var b = S.add.rectangle(0, 0, 176, 52, 0x1e1b30, 0.98).setStrokeStyle(2, 0x8f8bb0)
          .setDepth(48).setInteractive({ useHandCursor: true });
        var t = S.add.text(0, 0, label, { fontFamily: FONT, fontSize: "18px", color: "#ffffff", fontStyle: "bold" })
          .setOrigin(0.5).setDepth(49);
        b.on("pointerdown", function () { b.down = true; b.setFillStyle(0x2d2946, 0.98); });
        b.on("pointerout", function () { b.down = false; b.setFillStyle(0x1e1b30, 0.98); });
        b.on("pointerup", function () { if (b.down) { b.down = false; b.setFillStyle(0x1e1b30, 0.98); fn(); } });
        S.pauseBits.push(b, t);
        return { box: b, text: t };
      };
      this.pResume = mkBtn("RESUME", function () { S.togglePause(); });
      this.pSound = mkBtn("SOUND  ON", function () {
        SFX.init(); SFX.muted = !SFX.muted; S.pSound.text.setText(SFX.muted ? "SOUND  OFF" : "SOUND  ON");
      });
    }
    this.setVis(this.pauseBits, false);
  },

  togglePause: function () {
    if (this.modalOpen || this.endOpen || this.gs.gameOver) { return; }
    if (this.scene.isPaused("Game")) {
      this.setVis(this.pauseBits, false);
      this.scene.resume("Game");
    } else {
      this.setVis(this.pauseBits, true);
      this.scene.pause("Game");
      if (MOBILE) { this.pSound.text.setText(SFX.muted ? "SOUND  OFF" : "SOUND  ON"); }
    }
    SFX.play("ui");
  },

  /* ------------------------------ END SCREEN ------------------------------ */

  buildEnd: function () {
    var S = this;
    this.endBits = [];
    var bg = this.add.rectangle(VIEW_W / 2, VIEW_H / 2, VIEW_W, VIEW_H, 0x05040a, 0.92).setDepth(60);
    this.eTitle = this.add.text(VIEW_W / 2, 128, "", {
      fontFamily: FONT, fontSize: "72px", color: "#ff3b5c", fontStyle: "bold"
    }).setOrigin(0.5).setDepth(61).setShadow(0, 5, "#000000", 10, false, true);
    this.eStats = this.add.text(VIEW_W / 2, 268, "", {
      fontFamily: MONO, fontSize: "24px", color: "#e8e6f2", align: "center", lineSpacing: 8
    }).setOrigin(0.5).setDepth(61);
    this.eLoad = this.add.text(VIEW_W / 2, 452, "", {
      fontFamily: MONO, fontSize: "16px", color: "#a9a5bd", align: "center",
      wordWrap: { width: 1000 }, lineSpacing: 5
    }).setOrigin(0.5).setDepth(61);
    this.eHint = this.add.text(VIEW_W / 2, 636, "CLICK  or  [ENTER] / [R]  to return to the menu", {
      fontFamily: FONT, fontSize: "26px", color: "#ffffff", fontStyle: "bold"
    }).setOrigin(0.5).setDepth(61);
    this.endBits.push(bg, this.eTitle, this.eStats, this.eLoad, this.eHint);
    this.eBg = bg;
    this.setVis(this.endBits, false);
    bg.setInteractive({ useHandCursor: true });
    /* touch: ignore taps for a moment so a thumb still steering at the moment of death does not skip the results */
    bg.on("pointerdown", function () { if (S.endOpen && (!MOBILE || performance.now() - S.endAt > 900)) { S.toMenu(); } });
  },

  showEnd: function (won, snap) {
    this.endOpen = true;
    this.endAt = performance.now();
    this.setVis(this.endBits, true);
    this.eTitle.setText(won ? "THE ETERNAL FALLS" : "YOU DIED");
    this.eTitle.setColor(won ? "#ffd166" : "#ff3b5c");
    var m = Math.floor(snap.time / 60), s = Math.floor(snap.time % 60);
    this.eStats.setText(
      snap.charName + "   ·   LEVEL " + snap.level + "\n" +

    );

  },

  toMenu: function () {
    this.endOpen = false;
    SFX.play("ui");
    this.scene.stop("Game");
    this.scene.start("Menu");
  },

  /* ------------------------------- BANNER --------------------------------- */

  banner: function (text, color) {
    this.tBanner.setText(text);
    this.tBanner.setColor(color);
    this.tBanner.setAlpha(1);
    this.tBanner.setScale(0.7);
    this.tweens.killTweensOf(this.tBanner);
    this.tweens.add({ targets: this.tBanner, scale: 1, duration: 280, ease: "Back.easeOut" });

  },

  /* ---------------------------- MOBILE LAYOUT ----------------------------- */
  /* Phones / tablets: HUD, level-up cards, pause and results laid out for the
     screen in CSS pixels (text >= 12px, buttons >= 44px). The top-right corner
     under the xp bar is kept free for the PAUSE / SOUND touch buttons.
     Called on create, after a rotation and when the results appear. */
  layoutMobile: function () {
    var W = VIEW_W, H = VIEW_H, s = SAFE, land = W >= H, i;
    this.cameras.main.setZoom(RES).centerOn(W / 2, H / 2);
    var m = this.m = { land: land };

    /* --- HUD --- */
    m.xp = { y: s.t, h: 14 };
    m.hp = { x: s.l + 10, y: s.t + 22, w: land ? 190 : 136, h: 18 };
    this.tLevel.setFontSize(12).setPosition(s.l + 8, s.t + 7);
    this.tHp.setFontSize(12).setPosition(m.hp.x + m.hp.w / 2, m.hp.y + m.hp.h / 2);
    /* portrait: the timer sits between the hp bar and the touch buttons (two 58px buttons + 12px gap, 12px from the edge) */
    this.tTime.setFontSize(land ? 26 : 22).setPosition(land ? W / 2 : (m.hp.x + m.hp.w + W - s.r - 136) / 2, s.t + 37);
    if (land) { this.tGoal.setOrigin(0.5).setPosition(W / 2, s.t + 61); }
    else { this.tGoal.setOrigin(0, 0.5).setPosition(m.hp.x, m.hp.y + m.hp.h + 13); }
    this.tGoal.setFontSize(12);
    var rx = land ? W - s.r - 148 : W - s.r - 12, ry = land ? s.t + 30 : s.t + 92;   // left of / under PAUSE·SOUND
    this.tKills.setFontSize(14).setPosition(rx, ry);
    this.tGold.setFontSize(13).setPosition(rx, ry + 18);
    this.tFoes.setFontSize(12).setPosition(rx, ry + 35);
    m.hudBottom = land ? s.t + 80 : s.t + 136;           // boss bar goes below this (and below the buttons)
    var bw = Math.min(420, W - s.l - s.r - 40);
    m.boss = { x: W / 2 - bw / 2, y: m.hudBottom + 4, w: bw, h: 12 };
    /* off-screen boss arrow: on an ellipse round the player that stays under the HUD */
    m.arrow = { rx: Math.min(300, W / 2 - 40), ry: Math.min(240, H / 2 - 40),
      ryUp: Math.min(240, H / 2 - (m.boss.y + m.boss.h + 30)), top: m.boss.y + m.boss.h + 16 };
    m.load = { x: s.l + 28, yW: H - s.b - 62, yP: H - s.b - 22 };
    this.tBanner.setFontSize(land ? 30 : 28).setPosition(W / 2, H * (land ? 0.34 : 0.3));
    this.bannerMaxW = W - 24;

    /* --- level-up --- */
    var mb = this.modalBits;
    mb[0].setPosition(W / 2, H / 2).setSize(W, H);          // backdrop
    /* portrait: the block (about 640px) is centred so the cards sit under the thumb */
    var mt = s.t + (land ? 0 : Math.max(0, (H - s.t - s.b - 640) / 2));
    mb[1].setFontSize(land ? 26 : 34).setPosition(W / 2, mt + (land ? 22 : 46));
    this.mSub.setFontSize(land ? 13 : 14).setPosition(W / 2, mt + (land ? 46 : 80));
    var cw = Math.min(760, W - s.l - s.r - (land ? 32 : 24));
    var gap = land ? 6 : 10, y0 = mt + (land ? 62 : 104), reserve = land ? 64 : 150;
    var ch = Math.floor((H - s.b - reserve - y0 - gap * 3) / 4);
    ch = land ? Math.max(44, Math.min(60, ch)) : Math.max(76, Math.min(96, ch));
    var cx = s.l + (W - s.l - s.r) / 2, cl = cx - cw / 2, cr = cx + cw / 2;
    for (i = 0; i < 4; i++) {
      var c = this.cards[i], cy = y0 + ch / 2 + i * (ch + gap);
      c.bg.setPosition(cx, cy).setSize(cw, ch);
      if (land) {
        c.badge.setPosition(cl + 32, cy).setSize(40, 40);
        c.tag.setFontSize(15).setPosition(cl + 32, cy);
        c.num.setFontSize(12).setPosition(cl + 8, cy - ch / 2 + 10);
        c.name.setFontSize(16).setPosition(cl + 66, cy - 11);
        c.right.setFontSize(12).setPosition(cr - 12, cy - 11);
        c.desc.setFontSize(13).setOrigin(0, 0.5).setPosition(cl + 66, cy + 12).setWordWrapWidth(cw - 80);
      } else {
        c.badge.setPosition(cl + 36, cy).setSize(48, 48);
        c.tag.setFontSize(16).setPosition(cl + 36, cy);
        c.num.setFontSize(12).setPosition(cl + 9, cy - ch / 2 + 11);
        c.name.setFontSize(16).setPosition(cl + 72, cy - ch / 2 + 20);
        c.right.setFontSize(12).setPosition(cr - 10, cy - ch / 2 + 20);
        /* description: up to three lines, starting right under the name */
        c.desc.setFontSize(13).setOrigin(0, 0).setPosition(cl + 72, cy - ch / 2 + 34).setWordWrapWidth(cw - 84);
      }
    }
    var cardsEnd = y0 + 4 * ch + 3 * gap;
    if (land) {
      this.mFoot.setFontSize(12).setOrigin(0, 0.5).setPosition(cl + 4, H - s.b - 38);
      this.rrBox.setPosition(cr - 75, H - s.b - 38).setSize(150, 46);
      this.rrText.setPosition(cr - 75, H - s.b - 38);
    } else {
      this.mFoot.setFontSize(13).setOrigin(0.5).setPosition(W / 2, cardsEnd + 26);
      this.rrBox.setPosition(W / 2, cardsEnd + 80).setSize(200, 48);
      this.rrText.setPosition(W / 2, cardsEnd + 80);
    }

    /* --- pause --- */
    this.pBg.setPosition(W / 2, H / 2).setSize(W, H);
    this.pT1.setFontSize(44).setPosition(W / 2, H / 2 - (land ? 62 : 90));
    this.pT2.setText("");
    if (land) {
      this.pResume.box.setPosition(W / 2 - 100, H / 2 + 14); this.pResume.text.setPosition(W / 2 - 100, H / 2 + 14);
      this.pSound.box.setPosition(W / 2 + 100, H / 2 + 14); this.pSound.text.setPosition(W / 2 + 100, H / 2 + 14);
    } else {
      this.pResume.box.setPosition(W / 2, H / 2 - 10); this.pResume.text.setPosition(W / 2, H / 2 - 10);
      this.pSound.box.setPosition(W / 2, H / 2 + 56); this.pSound.text.setPosition(W / 2, H / 2 + 56);
    }

    /* --- results --- */
    this.eBg.setPosition(W / 2, H / 2).setSize(W, H);
    this.eTitle.setFontSize(land ? 40 : 44).setPosition(W / 2, s.t + (land ? 44 : 110));
    fitText(this.eTitle, W - 24);
    this.eStats.setFontSize(land ? 15 : 16).setLineSpacing(4).setPosition(W / 2, land ? H * 0.42 : H * 0.36);
    this.eLoad.setFontSize(12).setLineSpacing(3).setWordWrapWidth(W - (land ? 60 : 32))
      .setPosition(W / 2, land ? H * 0.7 : H * 0.6);
    this.eHint.setText("TAP ANYWHERE TO RETURN TO THE MENU").setFontSize(land ? 16 : 15)
      .setPosition(W / 2, H - s.b - (land ? 22 : 64));
    fitText(this.eHint, W - 24);

    this.refreshLoadout();
  },

  /* ------------------------------- LOADOUT -------------------------------- */

  refreshLoadout: function () {
    var gs = this.gs;
    if (!gs || !gs.wOrder) { return; }
    this.loadout.removeAll(true);
    var i, x, id;
    var lx = MOBILE ? this.m.load.x : 30, yw = MOBILE ? this.m.load.yW : 656, yp = MOBILE ? this.m.load.yP : 706;

    for (i = 0; i < gs.wOrder.length; i++) {
      id = gs.wOrder[i];
      var w = gs.weapons[id], wd = WEAPONS[id];
      x = lx + i * 52;
      this.mkIcon(x, yw, wd.tag, wd.color, w.evolved ? -1 : w.level, wd.max, w.evolved);
    }
    for (i = 0; i < gs.pOrder.length; i++) {
      id = gs.pOrder[i];
      var pd = PASSIVES[id];
      x = lx + i * 52;
      this.mkIcon(x, yp, pd.tag, pd.color, gs.passives[id], pd.max, false);
    }
  },

  mkIcon: function (x, y, tag, color, level, max, evolved) {
    var box = this.add.rectangle(x, y, 44, 34, color, evolved ? 1 : 0.86)
      .setStrokeStyle(2, evolved ? 0xffffff : 0x000000, evolved ? 1 : 0.35);
    var t = this.add.text(x, y - 4, tag, {
      fontFamily: MONO, fontSize: "14px", color: "#0b0a12", fontStyle: "bold"
    }).setOrigin(0.5);
    this.loadout.add(box);
    this.loadout.add(t);
    if (evolved) {
      var st = this.add.text(x, y + 10, "MAX+", { fontFamily: MONO, fontSize: MOBILE ? "11px" : "9px", color: "#0b0a12", fontStyle: "bold" }).setOrigin(0.5);
      this.loadout.add(st);
    } else {
      var pipW = 36 / max;
      for (var i = 0; i < max; i++) {
        var pip = this.add.rectangle(x - 18 + pipW * i + pipW / 2, y + 11, pipW - 1.6, 4,
          i < level ? 0x0b0a12 : 0xffffff, i < level ? 1 : 0.30);
        this.loadout.add(pip);
      }
    }
  },

  /* -------------------------------- DRAW ---------------------------------- */

  update: function () {
    var gs = this.gs;
    if (!gs || !gs.player || !gs.stats) { return; }
    var g = this.g;
    g.clear();

    /* xp bar */
    var xr = Phaser.Math.Clamp(gs.xp / gs.xpNeed, 0, 1);
    var hr = Phaser.Math.Clamp(gs.hp / gs.stats.maxHp, 0, 1);
    if (MOBILE) {
      /* same bars, placed by layoutMobile (below the notch, thinner) */
      var mx = this.m.xp, mh = this.m.hp;
      g.fillStyle(0x0a0912, 0.95); g.fillRect(0, 0, VIEW_W, mx.y + mx.h);
      g.fillStyle(0x2b6cff, 1); g.fillRect(0, mx.y, VIEW_W * xr, mx.h);
      g.fillStyle(0x9ad8ff, 0.55); g.fillRect(0, mx.y + mx.h - 4, VIEW_W * xr, 4);
      g.lineStyle(1, 0x2a2740, 1); g.strokeRect(0, mx.y, VIEW_W, mx.h);
      g.fillStyle(0x18070d, 0.95); g.fillRect(mh.x, mh.y, mh.w, mh.h);
      g.fillStyle(hr > 0.35 ? 0xff3b5c : 0xff8f1f, 1); g.fillRect(mh.x + 2, mh.y + 2, (mh.w - 4) * hr, mh.h - 4);
      g.fillStyle(0xffffff, 0.20); g.fillRect(mh.x + 2, mh.y + 2, (mh.w - 4) * hr, 5);
      g.lineStyle(2, 0x552336, 1); g.strokeRect(mh.x, mh.y, mh.w, mh.h);
    } else {
      g.fillStyle(0x0a0912, 0.95); g.fillRect(0, 0, VIEW_W, 16);
      g.fillStyle(0x2b6cff, 1); g.fillRect(0, 0, VIEW_W * xr, 16);
      g.fillStyle(0x9ad8ff, 0.55); g.fillRect(0, 11, VIEW_W * xr, 5);
      g.lineStyle(1, 0x2a2740, 1); g.strokeRect(0, 0, VIEW_W, 16);

      /* hp bar */
      g.fillStyle(0x18070d, 0.95); g.fillRect(14, 26, 272, 22);
      g.fillStyle(hr > 0.35 ? 0xff3b5c : 0xff8f1f, 1); g.fillRect(16, 28, 268 * hr, 18);
      g.fillStyle(0xffffff, 0.20); g.fillRect(16, 28, 268 * hr, 6);
      g.lineStyle(2, 0x552336, 1); g.strokeRect(14, 26, 272, 22);
    }

    this.tLevel.setText("LV " + gs.level + "   " + Math.floor(gs.xp) + " / " + gs.xpNeed);
    this.tHp.setText(Math.ceil(gs.hp) + " / " + Math.round(gs.stats.maxHp));

    var sec = gs.elapsed / 1000;
    var mm = Math.floor(sec / 60), ss = Math.floor(sec % 60);
    this.tTime.setText(("0" + mm).slice(-2) + ":" + ("0" + ss).slice(-2));
    this.tGoal.setText(gs.finalSpawned ? "SLAY THE ETERNAL" :
      ("THE ETERNAL IN  " + Math.max(0, Math.ceil(FINAL_TIME - sec)) + "s"));

    this.tKills.setText("KILLS  " + gs.kills);
    this.tGold.setText("GOLD  " + gs.gold);
    if (MOBILE) {   /* the SOUND button shows the sound state */
      this.tFoes.setText("foes " + gs.enemies.countActive(true) + (SFX.muted ? "   ·   muted" : ""));
    } else {
      this.tFoes.setText("foes " + gs.enemies.countActive(true) + "   ·   " + (SFX.muted ? "muted [M]" : "sound [M]"));
    }

    /* boss bar + offscreen arrow */
    var b = gs.boss;
    if (b && b.active) {
      var frac = Phaser.Math.Clamp(b.hp / b.maxHp, 0, 1);
      var bb = MOBILE ? this.m.boss : { x: 340, y: 96, w: 600, h: 20 };
      g.fillStyle(0x18070d, 0.9); g.fillRect(bb.x, bb.y, bb.w, bb.h);
      g.fillStyle(b.isFinal ? 0xa855f7 : 0xff3b5c, 1); g.fillRect(bb.x + 2, bb.y + 2, (bb.w - 4) * frac, bb.h - 4);
      g.lineStyle(2, 0x552336, 1); g.strokeRect(bb.x, bb.y, bb.w, bb.h);

      var cam = gs.cameras.main;
      var sx = (b.x - cam.scrollX), sy = (b.y - cam.scrollY);
      var arR = MOBILE ? this.m.arrow : { rx: 300, ry: 240, ryUp: 240, top: 120 };
      if (MOBILE) {   /* zoomed arena camera -> screen position in CSS px */
        sx = (sx - cam.width / 2) * cam.zoom / RES + VIEW_W / 2;
        sy = (sy - cam.height / 2) * cam.zoom / RES + VIEW_H / 2;
      }
      if (sx < 30 || sx > VIEW_W - 30 || sy < arR.top || sy > VIEW_H - 30) {
        var cx = VIEW_W / 2, cy = VIEW_H / 2;
        var ang = Math.atan2(sy - cy, sx - cx);
        var ax = cx + Math.cos(ang) * arR.rx, ay = cy + Math.sin(ang) * (Math.sin(ang) < 0 ? arR.ryUp : arR.ry);
        g.fillStyle(b.isFinal ? 0xa855f7 : 0xff3b5c, 0.9);
        g.fillTriangle(
          ax + Math.cos(ang) * 18, ay + Math.sin(ang) * 18,
          ax + Math.cos(ang + 2.5) * 14, ay + Math.sin(ang + 2.5) * 14,
          ax + Math.cos(ang - 2.5) * 14, ay + Math.sin(ang - 2.5) * 14
        );
      }
    }

    /* low-health vignette */
    if (hr < 0.3) {
      var a = 0.16 + 0.12 * Math.sin(gs.elapsed * 0.012);
      g.fillStyle(0xff0033, a * (1 - hr / 0.3));
      g.fillRect(0, 0, VIEW_W, 22);
      g.fillRect(0, VIEW_H - 22, VIEW_W, 22);
      g.fillRect(0, 0, 22, VIEW_H);
      g.fillRect(VIEW_W - 22, 0, 22, VIEW_H);
    }
  }
});

if (MOBILE) {
  /* crisp text on the zoomed (up to 2x) canvas */
  var addText = Phaser.GameObjects.GameObjectFactory.prototype.text;
  Phaser.GameObjects.GameObjectFactory.prototype.text = function (x, y, str, style) {

var game = new Phaser.Game({
  type: Phaser.AUTO,
  parent: "game",
  width: Math.round(VIEW_W * RES),
  height: Math.round(VIEW_H * RES),
  backgroundColor: "#07060d",
  physics: { default: "arcade", arcade: { gravity: { x: 0, y: 0 }, debug: false } },
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  render: { antialias: true, roundPixels: true, powerPreference: "high-performance" },
  scene: [BootScene, MenuScene, GameScene, UIScene]
});
window.nightGame = game;   // handle for tests / debugging

/* ----------------------------- TOUCH CONTROLS ------------------------------ */
if (MOBILE && window.TouchKit) {
  var kit = TouchKit.create({
    show: "manual",            // only while a run is being played (see syncTouch)
    sticks: [{
      id: "move", side: "left", label: "MOVE",
      zone: { left: "0", top: "0", width: "100%" },      // put a thumb down anywhere
      onMove: function (x, y, on) {
        var m = Math.sqrt(x * x + y * y);
        TOUCH.on = on && m > 0.22;
        TOUCH.x = TOUCH.on ? x / m : 0;
        TOUCH.y = TOUCH.on ? y / m : 0;
      }
    }],
    buttons: [
      { id: "pause", icon: "❚❚", place: "top-right", size: "s", onDown: function () {
        var ui = game.scene.getScene("UI");
        if (ui && ui.sys.isActive()) { ui.togglePause(); }
      } },
      { id: "sound", icon: "🔊", place: "top-right", size: "s", onDown: function () {
        SFX.init(); SFX.muted = !SFX.muted;
      } }
    ]
  });
  kit.root.classList.add("ne-kit");
  var kitShown = null;
  var syncTouch = function () {
    var gs = game.scene.getScene("Game");
    var want = !!(gs && gs.sys.isActive() && !gs.gameOver);   // not in menus, level-up, pause or results
    if (want !== kitShown) {
      kitShown = want;
      kit.show(want);
      if (!want) { TOUCH.on = false; TOUCH.x = 0; TOUCH.y = 0; }
    }
    var sb = kit.buttons.sound, icon = SFX.muted ? "🔇" : "🔊";
    if (sb && sb.icon !== icon) { sb.icon = icon; sb.el.querySelector("i").textContent = icon; }
    requestAnimationFrame(syncTouch);
  };
  requestAnimationFrame(syncTouch);

  /* rotation / browser bars: resize the canvas and lay every screen out again */
  var relayout = function () {
    var w0 = VIEW_W, h0 = VIEW_H;
    measureView();
    if (VIEW_W === w0 && VIEW_H === h0) { return; }
    game.scale.setGameSize(Math.round(VIEW_W * RES), Math.round(VIEW_H * RES));
    var menu = game.scene.getScene("Menu"), gs = game.scene.getScene("Game"), ui = game.scene.getScene("UI");
    if (menu && menu.sys.isActive()) { menu.scene.restart(); }
    if (gs && (gs.sys.isActive() || gs.sys.isPaused())) { gs.layoutMobile(); }
    if (ui && (ui.sys.isActive() || ui.sys.isPaused())) { ui.layoutMobile(); }
  };
  var relayoutT = 0;
  var onResize = function () { clearTimeout(relayoutT); relayoutT = setTimeout(relayout, 120); };
  window.addEventListener("resize", onResize);
  window.addEventListener("orientationchange", onResize);
}

})();
}
</script>
</body>
</html>
