<script>
'use strict';
// ===== 휴대폰·태블릿 터치 조작 (touch-kit 사용) =====
// 왼쪽 스틱: 이동(WASD) · 오른쪽 스틱: 조준, 절반 이상 밀면 사격 · ◀ ▶: 무기 교체(휠·숫자키 대신)
// 🛒: 상점(B) · ✕: 배치 취소(ESC/우클릭 대신) · 필드를 누른 채 위치를 맞추고 떼면 설치(좌클릭 대신)
// 상점·대화상자는 탭. 데스크톱(마우스)에서는 아무것도 바뀌지 않는다.
function touchHudBottom(){return SAFE.t+(W>H?44:64)}
function fitSize(t,size,maxW){X.font=`bold ${size}px "Malgun Gothic"`;const w=X.measureText(t).width;return w>maxW?Math.max(12,Math.floor(size*maxW/w)):size}
// 터치 HUD: 엄지가 닿는 아래쪽 대신 위쪽 막대 (체력 · 레벨 · 잔고 · 무기/탄약), 그 아래 점수
function hudTouch(){
  const land=W>H,x0=SAFE.l+10,x1=W-SAFE.r-10,y0=SAFE.t,bh=touchHudBottom();
  X.fillStyle='#151515dd';X.fillRect(0,0,W,bh);X.strokeStyle='#777';X.lineWidth=1;X.beginPath();X.moveTo(0,bh+.5);X.lineTo(W,bh+.5);X.stroke();
  const hw=land?200:Math.min(190,Math.round(W*.48)),frac=clamp(player.hp/player.maxHp,0,1);
  X.fillStyle='#302b2b';X.fillRect(x0,y0+11,hw,20);X.fillStyle=frac>.3?'#36bb45':'#d42e2e';X.fillRect(x0+2,y0+13,(hw-4)*frac,16);
  text(`HP ${Math.ceil(player.hp)} / ${player.maxHp}`,x0+hw/2,y0+26,13,'#fff','center');
  const w=CONFIG.weapons[player.weapon],ammo=w.ammo<0?'∞':player.ammo[player.weapon].toLocaleString(),wt=`[${player.weapon+1}] ${w.name}  탄약 ${ammo}`;
  if(land){
    text(`Level ${game.level}`,x0+hw+14,y0+28,18,'#ffe871');
    text(money(game.money),x0+hw+120,y0+28,20,'#8dff78');
    text(wt,x1,y0+28,fitSize(wt,18,x1-(x0+hw+300)),'#ffe36a','right');
  }else{
    text(money(game.money),x1,y0+28,fitSize(money(game.money),20,x1-x0-hw-12),'#8dff78','right');
    text(`Lv ${game.level}`,x0,y0+54,16,'#ffe871');
    text(wt,x1,y0+54,fitSize(wt,15,x1-x0-70),'#ffe36a','right');
  }
  text('Score '+game.score.toLocaleString(),x0,bh+26,19);
  text(`적 ${EP.active.length} / 처치 ${game.kills} / FPS ${fps}`,x0,bh+46,13,'#f7e4ce');
  const midY=Math.max(bh+80,H*.3);
  if(game.wave>0){const t=`LEVEL ${game.level}  -  곱등이 밀도가 증가합니다!`;text(t,W/2,midY,fitSize(t,27,W-24),'#ffdf48','center')}
  if(game.build){const t=`${CONFIG.structures[game.build].name} 배치 · 필드를 누른 채 위치를 맞추고 떼면 설치 · ✕ 취소`;text(t,W/2,midY+34,fitSize(t,16,W-24),'#ffef82','center')}
  else if(game.time<12&&!game.shop&&game.phase==='playing'){const t1='왼쪽: 이동 · 오른쪽: 조준 (절반 이상 밀면 사격)',t2='◀ ▶ 무기 교체 · 🛒 상점';if(land){const t=t1+' · '+t2;text(t,W/2,midY+34,fitSize(t,14,W-24),'#e8f0da','center')}else{text(t1,W/2,midY+34,fitSize(t1,15,W-24),'#e8f0da','center');text(t2,W/2,midY+58,fitSize(t2,15,W-24),'#e8f0da','center')}}
}
(function(){
  if(!TOUCH||!window.TouchKit)return;
  TouchKit.unlockAudio(); // iOS·안드로이드: 첫 터치 때 소리 재개
  const aim={on:false,x:1,y:0,m:0};
  const cycle=d=>{const n=CONFIG.weapons.length;let i=player.weapon;for(let k=0;k<n;k++){i=(i+(d>0?1:n-1))%n;if(player.unlocked[i]){player.weapon=i;break}}};
  const kit=TouchKit.create({show:'manual',
    sticks:[{id:'move',side:'left',label:'이동',keys:'wasd'},
      {id:'aim',side:'right',label:'조준',onMove:(x,y,on)=>{const m=Math.hypot(x,y);aim.m=on?m:0;if(on&&m>.2){aim.on=true;aim.x=x/m;aim.y=y/m}else if(!on)aim.on=false}}],
    buttons:[{id:'shop',label:'상점',icon:'🛒',key:'KeyB',tap:true,place:'top-right',size:'s'},
      {id:'cancel',label:'취소',icon:'✕',key:'Escape',tap:true,place:'top-right',size:'s'},
      {id:'next',label:'무기',icon:'▶',size:'s',onDown:()=>cycle(1)},
      {id:'prev',label:'무기',icon:'◀',size:'s',onDown:()=>cycle(-1)}]});
  window.__touchKit=kit;
  const zones=kit.root.querySelectorAll('.tk-zone'),tr=kit.root.querySelector('.tk-btns.tr'),br=kit.root.querySelector('.tk-btns.br'),B=kit.buttons;
  let placeId=null,shown=null,top=-1,wasShop=false,wasBuild=false;
  // 캔버스 탭: 대화상자 · 상점 버튼 · 배치 (누르고 끌어서 위치 확인 → 떼면 설치)
  const setMouse=t=>{const r=C.getBoundingClientRect();mouse.x=(t.clientX-r.left)*W/r.width;mouse.y=(t.clientY-r.top)*H/r.height;mouse.wx=mouse.x/ZOOM+cam.x;mouse.wy=mouse.y/ZOOM+cam.y};
  C.addEventListener('touchstart',e=>{e.preventDefault();initAudio();const t=e.changedTouches[0];
    if(game.phase==='dead'){setMouse(t);if(dialogButtonHit())game.phase='result';return}
    if(game.phase==='result'){setMouse(t);if(dialogButtonHit())reset();return}
    if(game.shop){setMouse(t);for(const b of shopButtons)if(mouse.x>=b.x&&mouse.x<=b.x+b.w&&mouse.y>=b.y&&mouse.y<=b.y+b.h){b.action?.();return}return}
    if(game.build&&placeId===null){placeId=t.identifier;touchPlacing=true;setMouse(t)}},{passive:false});
  C.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier===placeId)setMouse(t)},{passive:false});
  const end=e=>{for(const t of e.changedTouches)if(t.identifier===placeId){setMouse(t);placeId=null;touchPlacing=false;if(game.build&&e.type==='touchend')place(game.build,mouse.wx,mouse.wy)}};
  C.addEventListener('touchend',end);C.addEventListener('touchcancel',end);
  (function sync(){
    const playing=game.phase==='playing';
    if(playing!==shown){shown=playing;kit.show(playing);if(!playing){aim.on=false;mouse.down=false}}
    const t=touchHudBottom()+8;if(t!==top){top=t;tr.style.top=t+'px'}
    const shop=!!game.shop,build=!!game.build;
    if(shop!==wasShop||build!==wasBuild){ // 상점·배치 중: 조준 스틱을 끄고(탭이 캔버스로), 상점 중엔 이동 스틱·무기 버튼도 숨김
      kit.sticks.aim.reset();if(shop)kit.sticks.move.reset();
      zones[0].style.display=shop?'none':'';zones[1].style.display=shop||build?'none':'';br.style.display=shop?'none':'';
      B.cancel.el.style.display=build?'':'none';wasShop=shop;wasBuild=build;aim.on=false;mouse.down=false}
    if(playing&&!shop&&!build){ // 조준 스틱 → 게임의 마우스 조준점 (플레이어 기준), 절반 이상 밀면 사격
      const px=(player.x-cam.x)*ZOOM,py=(player.y-cam.y)*ZOOM;mouse.x=px+aim.x*140;mouse.y=py+aim.y*140;mouse.down=aim.on&&aim.m>.5}
    requestAnimationFrame(sync)})();
  B.cancel.el.style.display='none';
})();
</script></body></html>
