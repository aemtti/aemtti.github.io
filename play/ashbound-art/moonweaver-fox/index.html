<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c2a">
<title>MOONWEAVER — 달빛을 엮는 아홉 꼬리 여우</title>
<style>
  /* 코드로 그린 SVG 애니메이션 아트 뷰어: 화면(세로·가로·PC)에 맞춰 가운데 배치, 애니메이션은 SVG 안의 SMIL 그대로 */
  html, body { margin: 0; height: 100%; }
  body {
    min-height: 100vh; min-height: 100dvh; overflow: hidden; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(#0b0c2a 0%, #0b0c2a 30%, #03040e 70%, #03040e 100%); color: #cdd2ff;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    font: 500 13px/1.5 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
  }
  .art { display: block; width: 100%; height: auto; max-width: 100%; max-height: 100vh; max-height: 100dvh; object-fit: contain; }
  @media (min-aspect-ratio: 3/2) { .art { width: auto; height: 100vh; height: 100dvh; } }
  figcaption { padding: 18px 20px 0; text-align: center; letter-spacing: .06em; opacity: .72; }
  figcaption small { display: block; margin-top: 2px; font-size: 12px; opacity: .75; letter-spacing: .12em; }
  figure { margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; }
  /* 가로 화면에서는 그림 안의 제목만 보이게 */
  @media (min-aspect-ratio: 1/1) { figcaption { display: none; } }
</style>
</head>
<body>
  <figure>
    <img class="art" src="moonweaver-fox.svg" width="1200" height="800" alt="오로라처럼 흐르는 아홉 꼬리를 가진 여우가 절벽 위에서 거대한 달을 바라보는 애니메이션 벡터 아트">
    <figcaption>MOONWEAVER — 달빛을 엮는 아홉 꼬리 여우<small>SVG · 코드로 그린 애니메이션</small></figcaption>
  </figure>
</body>
</html>
