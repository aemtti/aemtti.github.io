<button class="ui" id="fs" type="button" aria-label="전체 화면"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
<script>
(() => {
  const q = new URLSearchParams(location.search.slice(1) + '&' + location.hash.slice(1));
  const art = document.getElementById('art'), s = art.querySelector('svg');
  const tag = document.getElementById('tag'), fs = document.getElementById('fs');
  const t = parseFloat(q.get('t')), frozen = !isNaN(t);
  if (q.get('vb')) s.setAttribute('viewBox', q.get('vb').split(',').join(' '));
  if (frozen) { s.pauseAnimations(); s.setCurrentTime(t); }
  let fill = false, tagT = 0, fsT = 0;
  const say = (text, ms) => { tag.textContent = text; tag.classList.add('on'); clearTimeout(tagT); tagT = setTimeout(() => tag.classList.remove('on'), ms || 1400); };
  // size the <svg> box to the viewBox aspect (contain, or cover when filled): it clips at its own box,
  // so this also hides the scenery tiles that run past the edges of the picture
  const layout = () => {
    const vb = s.viewBox.baseVal, ar = vb.width / vb.height, W = art.clientWidth || innerWidth, H = art.clientHeight || innerHeight;
    const w = fill ? Math.max(W, H * ar) : Math.min(W, H * ar);
    s.style.width = w + 'px'; s.style.height = w / ar + 'px';
  };
  const setFill = (on, tell) => {
    fill = on; art.classList.toggle('fill', on); layout();
    if (tell) say(on ? '화면 채우기' : '전체 보기');
  };
  setFill(q.get('fit') === 'fill');
  addEventListener('resize', layout);
  art.addEventListener('click', () => setFill(!fill, true));
  // fullscreen: Android and desktop (iPhone Safari has no element fullscreen, so the button stays hidden there)
  const d = document, canFS = !frozen && !!(d.fullscreenEnabled || d.webkitFullscreenEnabled);
  const toggleFS = () => {
    try {
      if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
      else { const el = d.documentElement, p = (el.requestFullscreen || el.webkitRequestFullscreen).call(el); if (p && p.catch) p.catch(() => {}); }
    } catch (e) { /* not allowed here */ }
  };
  const showFS = () => { if (!canFS) return; fs.classList.add('on'); clearTimeout(fsT); fsT = setTimeout(() => fs.classList.remove('on'), 2800); };
  fs.addEventListener('click', e => { e.stopPropagation(); toggleFS(); showFS(); });
  addEventListener('pointerdown', showFS);
  addEventListener('mousemove', showFS);
  addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'f' || e.key === 'F') toggleFS();
    else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); setFill(!fill, true); }
  });
  if (!frozen) {
    // first look: tell what a tap does; suggest turning the phone when it is held upright
    const vb = s.viewBox.baseVal, r = (vb.width / vb.height) / (innerWidth / innerHeight);
    const touch = matchMedia('(pointer: coarse)').matches;
    if (touch && r > 1.6) say('가로로 돌리면 더 크게 보여요\n탭하면 화면 채우기', 3400);
    else if (r > 1.12 || r < 0.89) say((touch ? '탭' : '클릭') + '하면 화면 채우기', 2600);
    showFS();
  }
})();
</script>
