<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
    <title>Horror FPS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #000;
        }
        canvas {
            display: block;
        }
        /* Overlay shown before pointer lock */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 100;
        }
        #overlay.hidden {
            display: none;
        }
        #overlay-text {
            color: #fff;
            font-family: Arial, sans-serif;
            font-size: 24px;
            text-align: center;
        }
        #overlay-text span {
            display: block;
            font-size: 14px;
            color: #888;
            margin-top: 10px;
        }
        /* Crosshair */
        #crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
            z-index: 50;
            display: none;
        }
        #crosshair.visible {
            display: block;
        }
        /* Interaction prompt */
        #interact-prompt {
            position: fixed;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-family: Arial, sans-serif;
            font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            pointer-events: none;
            z-index: 50;
            display: none;
        }
        #interact-prompt.visible {
            display: block;
        }
        /* Message display (for "Key acquired", etc.) */
        #message {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            color: #ffd700;
            font-family: Arial, sans-serif;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            pointer-events: none;
            z-index: 50;
            opacity: 0;
            transition: opacity 0.3s;
        }
        #message.visible {
            opacity: 1;
        }
        /* Inventory indicator */
        #inventory {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: #888;
            font-family: Arial, sans-serif;
            font-size: 14px;
            pointer-events: none;
            z-index: 50;
            display: none;
        }
        #inventory.visible {
            display: block;
        }
        #inventory.has-key {
            color: #ffd700;
        }
        /* Win screen */
        #win-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 200;
        }
        #win-screen.visible {
            display: flex;
        }
        #win-screen h1 {
            color: #4a4;
            font-family: Arial, sans-serif;
            font-size: 48px;
            margin-bottom: 20px;
        }
        #win-screen p {
            color: #888;
            font-family: Arial, sans-serif;
            font-size: 18px;
        }
        /* Jumpscare screen flash */
        #scare-flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 150;
            opacity: 0;
            transition: opacity 0.05s;
        }
        #scare-flash.flash-white {
            background: #fff;
            opacity: 0.8;
        }
        #scare-flash.flash-red {
            background: #400;
            opacity: 0.6;
        }
        #scare-flash.fade-out {
            opacity: 0;
            transition: opacity 0.3s;
        }
        /* the start overlay no longer shows through behind the win screen */
        body:has(#win-screen.visible) #overlay { display: none; }
        /* Win screen: start over (reloads the page) */
        #win-screen button {
            margin-top: 28px;
            min-width: 160px;
            min-height: 48px;
            padding: 12px 28px;
            font-family: Arial, sans-serif;
            font-size: 16px;
            letter-spacing: 1px;
            color: #ddd;
            background: transparent;
            border: 1px solid #555;
            border-radius: 4px;
            cursor: pointer;
        }

        /* ---- Touch screens (html.touch is set by js/touch-controls.js) ---- */
        html:not(.touch) .touch-only { display: none !important; }
        html.touch .desk-only { display: none !important; }
        html, body {
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none;
        }
        #overlay, #win-screen {
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            text-align: center;
        }
        #win-screen h1 { font-size: clamp(30px, 9vw, 48px); }
        #win-screen p { padding: 0 16px; }
        /* the stick lives bottom-left on phones: key indicator goes next to the pause button */
        html.touch #inventory {
            bottom: auto;
            top: calc(26px + env(safe-area-inset-top));
            left: calc(80px + env(safe-area-inset-left));
        }
        .touch-settings {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 22px;
            font-size: 13px;
            color: #999;
            cursor: default;
        }
        .touch-settings input {
            width: min(46vw, 200px);
            height: 44px;
            accent-color: #ddd;
        }
        .touch-settings b { min-width: 3.4em; color: #bbb; font-weight: normal; }
        /* on-screen button labels at least 12px (touch-kit's defaults are 9-11px) */
        html .tk-root { font-size: 12px; }
        html .tk-btn.s { font-size: 12px; }
        html .tk-rot button { min-height: 44px; }   /* rotate hint: 44px tap target */
    </style>
</head>
<body>
    <!-- Click to start overlay -->
    <div id="overlay">
        <div id="overlay-text">
            <div class="desk-only">Click to Play</div>
            <div class="touch-only">Tap to Play</div>
            <span class="desk-only">ESC to release mouse | WASD to move | F for flashlight</span>
            <span class="touch-only">Left stick to move · drag to look · LIGHT / USE buttons · ❚❚ to pause</span>
            <label class="touch-only touch-settings">Look sensitivity
                <input type="range" id="touch-sens" min="0.3" max="3" step="0.05" value="1">
                <b id="touch-sens-value">1.00x</b>
            </label>
        </div>
    </div>

    <!-- Game UI elements -->
    <div id="crosshair"></div>
    <div id="interact-prompt"><span class="desk-only">Press E to interact</span><span class="touch-only">Tap USE to interact</span></div>
    <div id="message"></div>
    <div id="inventory">[ No Key ]</div>
    <div id="scare-flash"></div>
    <div id="win-screen">
        <h1>YOU ESCAPED!</h1>
        <p>You found the key and escaped the darkness.</p>
        <button type="button" onclick="location.reload()">PLAY AGAIN</button>
    </div>

    <!-- Using ES modules to import PointerLockControls -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
