<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
  <title>Pocket Volley</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101418;
      color: #f7fbff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #101418;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      position: relative;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #87cce9;
      touch-action: none;
    }

    button {
      min-height: 34px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 8px;
      padding: 7px 10px;
      color: #f7fbff;
      background: rgba(16, 20, 24, 0.55);
      box-shadow: 0 10px 28px rgba(10, 18, 24, 0.18);
      font: 760 12px/1 system-ui, sans-serif;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: transform 130ms ease, background 130ms ease, border-color 130ms ease;
    }

    button:hover {
      border-color: rgba(255, 234, 117, 0.82);
      background: rgba(35, 44, 38, 0.68);
    }

    button:active {
      transform: translateY(1px);
    }

    button {
      touch-action: manipulation;
    }

    @media (hover: none) {
      /* 터치 화면: 탭한 뒤 hover 강조가 남지 않게 */
      .controls button:hover {
        border-color: rgba(255, 255, 255, 0.22);
        background: rgba(16, 20, 24, 0.55);
      }
    }

    .hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      user-select: none;
    }

    .topbar {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }

    .scoreboard {
      display: grid;
      grid-template-columns: minmax(96px, 1fr) auto minmax(96px, 1fr);
      gap: 10px;
      align-items: center;
      width: min(560px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 8px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 8px;
      background: rgba(13, 21, 24, 0.42);
      box-shadow: 0 16px 40px rgba(18, 28, 32, 0.18);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .team {
      display: grid;
      gap: 2px;
      min-width: 0;
      padding: 4px 8px;
    }

    .team:last-child {
      text-align: right;
    }

    .name {
      overflow: hidden;
      color: rgba(247, 251, 255, 0.78);
      font-size: 11px;
      font-weight: 760;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .score {
      color: #ffffff;
      font-size: 34px;
      font-weight: 900;
      line-height: 0.98;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 3px 0 rgba(0, 0, 0, 0.18);
    }

    .center {
      display: grid;
      gap: 4px;
      justify-items: center;
      min-width: 86px;
    }

    .badge {
      min-width: 64px;
      padding: 4px 8px;
      border-radius: 999px;
      color: #101418;
      background: #ffe96f;
      font-size: 11px;
      font-weight: 900;
      text-align: center;
      box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.14);
    }

    .target {
      color: rgba(247, 251, 255, 0.76);
      font-size: 10px;
      font-weight: 780;
      letter-spacing: 0;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
      pointer-events: auto;
    }

    .toast {
      position: absolute;
      left: 50%;
      top: 104px;
      min-width: min(360px, calc(100vw - 40px));
      padding: 10px 16px;
      border: 1px solid rgba(255, 255, 255, 0.20);
      border-radius: 8px;
      color: #fffdf4;
      background: rgba(12, 18, 20, 0.52);
      box-shadow: 0 18px 40px rgba(11, 20, 24, 0.22);
      font-size: 14px;
      font-weight: 850;
      text-align: center;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.18);
      opacity: 0;
      transform: translateX(-50%) translateY(-8px);
      transition: opacity 160ms ease, transform 160ms ease;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .touch {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: none;
      justify-content: space-between;
      gap: 22px;
      padding: 0 18px 18px;
      pointer-events: none;
    }

    .pad,
    .actions {
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }

    .touch button {
      width: 58px;
      height: 58px;
      min-height: 58px;
      border-radius: 8px;
      padding: 0;
      font-size: 20px;
      background: rgba(14, 20, 20, 0.48);
    }

    .actions button {
      width: 64px;
      height: 64px;
      min-height: 64px;
      font-size: 15px;
    }

    @media (max-width: 760px) {
      .topbar {
        top: 10px;
        left: 10px;
        right: 10px;
        align-items: flex-start;
      }

      .scoreboard {
        grid-template-columns: minmax(72px, 1fr) auto minmax(72px, 1fr);
        gap: 4px;
        width: min(360px, calc(100vw - 132px));
        margin: 0;
      }

      .score {
        font-size: 27px;
      }

      .controls {
        width: 112px;
        gap: 6px;
      }

      .controls button {
        min-height: 31px;
        padding: 6px 7px;
        font-size: 11px;
      }

      .name {
        font-size: 10px;
      }

      .badge {
        min-width: 52px;
        font-size: 10px;
      }

      .toast {
        top: 92px;
      }

      .touch {
        display: flex;
      }
    }

    @media (max-width: 480px) {
      .scoreboard {
        width: min(310px, calc(100vw - 116px));
      }

      .team {
        padding: 2px 5px;
      }

      .center {
        min-width: 58px;
      }

      .target {
        display: none;
      }

      .touch button {
        width: 50px;
        height: 50px;
        min-height: 50px;
      }

      .actions button {
        width: 56px;
        height: 56px;
        min-height: 56px;
      }
    }

    /* ---- 터치 기기 (html.touch-on): 가로/세로 모두 조작 버튼 표시, 2P는 오른쪽에 두 번째 조작 버튼 ---- */
    #safe-probe {
      position: fixed;
      left: 0;
      top: 0;
      width: 0;
      height: 0;
      visibility: hidden;
      pointer-events: none;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .touch .p2 {
      display: none;
    }

    .pad,
    .actions {
      touch-action: none;
    }

    html.touch-on .touch {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 0 calc(10px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));
    }

    html.touch-on .touch.two .p2 {
      display: flex;
    }

    html.touch-on .touch.two .actions.p1 {
      margin-right: auto;
    }

    html.touch-on .pad,
    html.touch-on .actions {
      gap: 8px;
    }

    html.touch-on .touch button {
      width: var(--tb, 58px);
      height: var(--tb, 58px);
      min-height: 0;
      border-radius: 14px;
      font-size: calc(var(--tb, 58px) * 0.3);
      background: rgba(14, 20, 20, 0.42);
      transition: none;
    }

    .touch button.on,
    html.touch-on .touch button.on {
      background: rgba(255, 255, 255, 0.34);
      border-color: #ffffff;
      transform: scale(0.94);
    }

    html.touch-on .touch.two .p1 button {
      border-color: rgba(255, 212, 81, 0.75);
    }

    html.touch-on .touch.two .p2 button {
      border-color: rgba(125, 214, 109, 0.8);
    }

    html.touch-on .touch.two .p1 button.on,
    html.touch-on .touch.two .p2 button.on {
      border-color: #ffffff;
    }

    html.touch-on .controls button {
      min-width: 44px;
      min-height: 44px;
      padding: 6px 8px;
      font-size: 13px;
    }

    html.touch-on .name,
    html.touch-on .badge,
    html.touch-on .target {
      font-size: 12px;
    }

    @media (orientation: landscape) {
      html.touch-on .topbar {
        top: calc(8px + env(safe-area-inset-top));
        left: calc(10px + env(safe-area-inset-left));
        right: calc(10px + env(safe-area-inset-right));
        align-items: flex-start;
      }

      html.touch-on .scoreboard {
        flex: 1 1 auto;
        width: auto;
        max-width: 440px;
        margin: 0;
        padding: 5px 8px;
      }

      html.touch-on .score {
        font-size: 26px;
      }

      html.touch-on .controls {
        flex-wrap: nowrap;
        width: auto;
        gap: 6px;
      }
    }

    @media (orientation: portrait) {
      html.touch-on .topbar {
        top: calc(10px + env(safe-area-inset-top));
        left: calc(10px + env(safe-area-inset-left));
        right: calc(10px + env(safe-area-inset-right));
      }

      html.touch-on .touch.two {
        display: grid;
        grid-template-columns: auto 1fr auto;
        grid-template-areas: "a1 . a2" "p1 . p2";
        row-gap: 10px;
      }

      html.touch-on .touch.two .actions.p1 { grid-area: a1; margin: 0; }
      html.touch-on .touch.two .pad.p1 { grid-area: p1; }
      html.touch-on .touch.two .actions.p2 { grid-area: a2; }
      html.touch-on .touch.two .pad.p2 { grid-area: p2; }
    }

    @media (orientation: portrait) and (max-width: 760px) {
      /* 버튼이 두 칸 세 줄(44px)이라 안내 문구는 그 아래로 */
      html.touch-on .toast {
        top: calc(166px + env(safe-area-inset-top));
      }
    }
  </style>
</head>
<body>
  <canvas id="game" aria-label="Pocket Volley game canvas"></canvas>

  <div class="hud" aria-hidden="false">
    <div class="topbar">
      <div class="scoreboard" aria-live="polite">
        <div class="team">
          <span class="name" id="leftName">Dynamo Pup</span>
          <span class="score" id="leftScore">0</span>
        </div>
        <div class="center">
          <span class="badge" id="serverBadge">SERVE</span>
          <span class="target" id="targetLabel">15 / +2</span>
        </div>
        <div class="team">
          <span class="name" id="rightName">Moss Kit</span>
          <span class="score" id="rightScore">0</span>
        </div>
      </div>

      <div class="controls">
        <button id="modeBtn" type="button">CPU</button>
        <button id="diffBtn" type="button">보통</button>
        <button id="targetBtn" type="button">15점</button>
        <button id="soundBtn" type="button">음향</button>
        <button id="pauseBtn" type="button">정지</button>
        <button id="resetBtn" type="button">다시</button>
      </div>
    </div>

    <div class="toast" id="toast">Pocket Volley</div>
  </div>

  <div class="touch" id="touchUi" aria-hidden="false">
    <div class="pad p1" data-player="1">
      <button data-touch="left" type="button" aria-label="left">&lt;</button>
      <button data-touch="right" type="button" aria-label="right">&gt;</button>
    </div>
    <div class="actions p1" data-player="1">
      <button data-touch="jump" type="button" aria-label="jump">UP</button>
      <button data-touch="attack" type="button" aria-label="attack">HIT</button>
    </div>
    <div class="actions p2" data-player="2">
      <button data-touch="attack" type="button" aria-label="player 2 attack">HIT</button>
      <button data-touch="jump" type="button" aria-label="player 2 jump">UP</button>
    </div>
    <div class="pad p2" data-player="2">
      <button data-touch="left" type="button" aria-label="player 2 left">&lt;</button>
      <button data-touch="right" type="button" aria-label="player 2 right">&gt;</button>
    </div>
  </div>
  <div id="safe-probe"></div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const ui = {
      leftScore: document.getElementById("leftScore"),
      rightScore: document.getElementById("rightScore"),
      leftName: document.getElementById("leftName"),
      rightName: document.getElementById("rightName"),
      serverBadge: document.getElementById("serverBadge"),
      targetLabel: document.getElementById("targetLabel"),
      toast: document.getElementById("toast"),
      modeBtn: document.getElementById("modeBtn"),
      diffBtn: document.getElementById("diffBtn"),
      targetBtn: document.getElementById("targetBtn"),
      soundBtn: document.getElementById("soundBtn"),
      pauseBtn: document.getElementById("pauseBtn"),
      resetBtn: document.getElementById("resetBtn"),
      touchUi: document.getElementById("touchUi")
    };

    const WORLD = {
      w: 960,
      h: 540,
      floor: 456,
      ceiling: 34,
      leftWall: 48,
      rightWall: 912,
      netX: 480,
      netW: 14,
      netTop: 314
    };

    const DIFFICULTIES = [
      { label: "느긋", skill: 0.68, delay: 0.25, error: 58 },
      { label: "보통", skill: 0.86, delay: 0.16, error: 34 },
      { label: "강함", skill: 1.02, delay: 0.09, error: 16 }
    ];

    const keys = new Set();
    const touch = { left: false, right: false, jump: false, attack: false };
    const touch2 = { left: false, right: false, jump: false, attack: false }; // 2P 모드의 오른쪽 선수 터치 버튼
    // 터치 기기: 가로/세로 모두 화면 조작 버튼을 보인다 (첫 터치 때도 켜짐)
    const touchUi = { on: window.matchMedia("(pointer: coarse)").matches, vw: 0, vh: 0, hintFont: "", resets: [] };
    let audioCtx = null;

    const state = {
      mode: "cpu",
      difficulty: 1,
      target: 15,
      sound: true,
      paused: false,
      matchOver: false,
      waitingServe: true,
      serveTimer: 1.0,
      server: -1,
      messageTimer: 0,
      shake: 0,
      time: 0,
      scores: { "-1": 0, "1": 0 },
      particles: [],
      sparks: []
    };

    const leftPlayer = makePlayer(-1);
    const rightPlayer = makePlayer(1);
    const players = [leftPlayer, rightPlayer];
    const ball = makeBall();

    function makePlayer(side) {
      return {
        side,
        name: side < 0 ? "Dynamo Pup" : "Moss Kit",
        x: side < 0 ? 214 : 746,
        y: WORLD.floor - 38,
        vx: 0,
        vy: 0,
        radius: 39,
        face: side,
        onGround: true,
        wasJump: false,
        wasAttack: false,
        jumpBuffer: 0,
        attackTimer: 0,
        attackCooldown: 0,
        attackHasHit: false,
        squash: 0,
        blink: Math.random() * 3,
        aiThink: 0,
        aiTarget: side < 0 ? 214 : 746,
        aiJump: false,
        aiAttack: false,
        colors: side < 0
          ? { body: "#ffd451", shade: "#f49c38", trim: "#513d24", eye: "#1c2730", accent: "#ff7b4c" }
          : { body: "#7dd66d", shade: "#329f67", trim: "#274734", eye: "#13271e", accent: "#ffe36d" }
      };
    }

    function makeBall() {
      return {
        x: 0,
        y: 0,
        vx: 0,
        vy: 0,
        r: 17,
        active: false,
        lastSide: 0,
        sideTouches: 0,
        touchCooldown: { "-1": 0, "1": 0 },
        trail: []
      };
    }

    function resetMatch() {
      state.scores["-1"] = 0;
      state.scores["1"] = 0;
      state.server = -1;
      state.matchOver = false;
      state.paused = false;
      state.particles.length = 0;
      state.sparks.length = 0;
      resetPlayers();
      prepareServe("Pocket Volley");
      updateHud();
    }

    function resetPlayers() {
      leftPlayer.x = 214;
      rightPlayer.x = 746;
      for (const player of players) {
        player.y = WORLD.floor - player.radius;
        player.vx = 0;
        player.vy = 0;
        player.onGround = true;
        player.attackTimer = 0;
        player.attackCooldown = 0;
        player.attackHasHit = false;
        player.jumpBuffer = 0;
        player.squash = 0;
      }
    }

    function prepareServe(message) {
      state.waitingServe = true;
      state.serveTimer = state.matchOver ? 999 : 1.0;
      ball.active = false;
      ball.vx = 0;
      ball.vy = 0;
      ball.lastSide = 0;
      ball.sideTouches = 0;
      ball.touchCooldown["-1"] = 0;
      ball.touchCooldown["1"] = 0;
      showMessage(message);
      placeServeBall();
    }

    function placeServeBall() {
      const server = state.server < 0 ? leftPlayer : rightPlayer;
      ball.x = server.x - server.side * 34;
      ball.y = server.y - 116 + Math.sin(state.time * 5) * 5;
      ball.trail.length = 0;
    }

    function launchServe() {
      if (state.matchOver) {
        return;
      }
      const server = state.server < 0 ? leftPlayer : rightPlayer;
      state.waitingServe = false;
      ball.active = true;
      ball.x = server.x - server.side * 35;
      ball.y = server.y - 102;
      ball.vx = -server.side * (330 + Math.random() * 44);
      ball.vy = -620 - Math.random() * 60;
      ball.lastSide = server.side;
      ball.sideTouches = 1;
      pop(ball.x, ball.y, server.side < 0 ? "#ffed75" : "#b8f48e", 10, 220);
      tone(410, 0.055, "triangle", 0.045);
      showMessage("SERVE");
    }

    function showMessage(text) {
      ui.toast.textContent = text;
      ui.toast.classList.add("show");
      state.messageTimer = 1.1;
    }

    function updateHud() {
      ui.leftScore.textContent = state.scores["-1"];
      ui.rightScore.textContent = state.scores["1"];
      ui.serverBadge.textContent = state.server < 0 ? "LEFT" : "RIGHT";
      ui.serverBadge.style.background = state.server < 0 ? "#ffe96f" : "#b9f58a";
      ui.targetLabel.textContent = `${state.target} / +2`;
      ui.modeBtn.textContent = state.mode === "cpu" ? "CPU" : "2P";
      ui.diffBtn.textContent = DIFFICULTIES[state.difficulty].label;
      ui.diffBtn.style.display = state.mode === "cpu" ? "" : "none";
      ui.targetBtn.textContent = `${state.target}P`;
      ui.soundBtn.textContent = state.sound ? "음향" : "무음";
      ui.pauseBtn.textContent = state.paused ? "계속" : "정지";
      if (ui.touchUi.classList.contains("two") !== (state.mode === "2p")) {
        ui.touchUi.classList.toggle("two", state.mode === "2p");
        layoutTouch();
      }
    }

    function sideName(side) {
      return side < 0 ? leftPlayer.name : rightPlayer.name;
    }

    function endRally(winner, reason) {
      if (state.waitingServe || state.matchOver) {
        return;
      }

      state.scores[String(winner)] += 1;
      state.server = winner;

      const lead = Math.abs(state.scores["-1"] - state.scores["1"]);
      const high = Math.max(state.scores["-1"], state.scores["1"]);
      if (high >= state.target && lead >= 2) {
        state.matchOver = true;
        state.waitingServe = true;
        showMessage(`${sideName(winner)} WIN`);
        fanfare();
      } else {
        const text = `${sideName(winner)} +1`;
        prepareServe(reason ? `${text} / ${reason}` : text);
        tone(520, 0.07, "square", 0.035);
      }

      state.shake = 7;
      pop(ball.x, Math.min(ball.y, WORLD.floor - 16), winner < 0 ? "#ffe96f" : "#b8f48e", 20, 360);
      updateHud();
    }

    function getControls(player, dt) {
      if (player.side > 0 && state.mode === "cpu") {
        return aiControls(player, dt);
      }

      const p1 = player.side < 0;
      return {
        left: p1 ? keys.has("KeyA") || touch.left : keys.has("ArrowLeft") || touch2.left,
        right: p1 ? keys.has("KeyD") || touch.right : keys.has("ArrowRight") || touch2.right,
        jump: p1 ? keys.has("KeyW") || keys.has("Space") || touch.jump : keys.has("ArrowUp") || touch2.jump,
        attack: p1 ? keys.has("KeyS") || touch.attack : keys.has("ArrowDown") || touch2.attack
      };
    }

    function aiControls(player, dt) {
      const diff = DIFFICULTIES[state.difficulty];
      player.aiThink -= dt;
      if (player.aiThink <= 0) {
        player.aiThink = diff.delay + Math.random() * 0.06;
        const home = WORLD.netX + 238;
        let target = home;
        if (!state.waitingServe && ball.active) {
          const towardAi = ball.vx > -80 || ball.x > WORLD.netX - 60;
          if (towardAi) {
            target = predictLandingX(diff) + player.side * 50;
          } else {
            target = home + Math.sin(state.time * 1.7) * 18;
          }
        }
        player.aiTarget = clamp(target, WORLD.netX + 70, WORLD.rightWall - 70);
        const near = Math.abs(ball.x - player.x) < 110 && ball.y > 160 && ball.y < 405;
        const incoming = ball.vy > -220 || ball.x > WORLD.netX;
        player.aiJump = near && incoming && ball.y < player.y - 20 && Math.random() < diff.skill;
        player.aiAttack = isBallInStrikeZone(player, 18) && incoming && Math.random() < diff.skill * 0.86;
      }

      const deadZone = 14 + (1.05 - diff.skill) * 24;
      return {
        left: player.x > player.aiTarget + deadZone,
        right: player.x < player.aiTarget - deadZone,
        jump: player.aiJump,
        attack: player.aiAttack
      };
    }

    function predictLandingX(diff) {
      let x = ball.x;
      let y = ball.y;
      let vx = ball.vx;
      let vy = ball.vy;
      const step = 1 / 42;
      for (let i = 0; i < 130; i++) {
        vy += 1120 * step;
        x += vx * step;
        y += vy * step;
        if (x - ball.r < WORLD.leftWall) {
          x = WORLD.leftWall + ball.r;
          vx = Math.abs(vx) * 0.82;
        }
        if (x + ball.r > WORLD.rightWall) {
          x = WORLD.rightWall - ball.r;
          vx = -Math.abs(vx) * 0.82;
        }
        if (y + ball.r >= WORLD.floor - 8) {
          break;
        }
      }
      const error = (Math.random() * 2 - 1) * diff.error;
      return x + error;
    }

    function updatePlayer(player, dt) {
      const input = getControls(player, dt);
      const accel = player.onGround ? 1950 : 1280;
      const maxSpeed = player.onGround ? 405 : 360;

      if (input.left) {
        player.vx -= accel * dt;
        player.face = -1;
      }
      if (input.right) {
        player.vx += accel * dt;
        player.face = 1;
      }
      if (!input.left && !input.right) {
        player.vx *= Math.pow(player.onGround ? 0.78 : 0.93, dt * 60);
      }

      player.vx = clamp(player.vx, -maxSpeed, maxSpeed);
      player.jumpBuffer = Math.max(0, player.jumpBuffer - dt);
      if (input.jump && !player.wasJump) {
        player.jumpBuffer = 0.12;
      }
      player.wasJump = input.jump;

      if (player.jumpBuffer > 0 && player.onGround) {
        player.vy = -735;
        player.onGround = false;
        player.jumpBuffer = 0;
        player.squash = -0.16;
        pop(player.x, player.y + 32, "rgba(255,255,255,0.75)", 7, 120);
        tone(230, 0.035, "sine", 0.025);
      }

      player.attackCooldown = Math.max(0, player.attackCooldown - dt);
      if (input.attack && !player.wasAttack && player.attackCooldown <= 0) {
        player.attackTimer = 0.22;
        player.attackCooldown = 0.36;
        player.attackHasHit = false;
        player.face = -player.side;
        if (!player.onGround) {
          player.vy += 90;
        }
        slash(player);
        tone(170, 0.045, "sawtooth", 0.024);
      }
      player.wasAttack = input.attack;
      player.attackTimer = Math.max(0, player.attackTimer - dt);

      player.vy += 1540 * dt;
      player.x += player.vx * dt;
      player.y += player.vy * dt;

      const minX = player.side < 0 ? WORLD.leftWall + player.radius : WORLD.netX + WORLD.netW / 2 + player.radius;
      const maxX = player.side < 0 ? WORLD.netX - WORLD.netW / 2 - player.radius : WORLD.rightWall - player.radius;
      if (player.x < minX) {
        player.x = minX;
        player.vx = Math.max(0, player.vx) * 0.4;
      }
      if (player.x > maxX) {
        player.x = maxX;
        player.vx = Math.min(0, player.vx) * 0.4;
      }

      const groundY = WORLD.floor - player.radius;
      if (player.y >= groundY) {
        if (!player.onGround && player.vy > 260) {
          player.squash = 0.18;
          pop(player.x, WORLD.floor - 5, "rgba(235,240,226,0.65)", 5, 90);
        }
        player.y = groundY;
        player.vy = 0;
        player.onGround = true;
      } else {
        player.onGround = false;
      }

      player.squash *= Math.pow(0.82, dt * 60);
      player.blink -= dt;
      if (player.blink < -0.10) {
        player.blink = 2.4 + Math.random() * 2.8;
      }
    }

    function updateBall(dt) {
      ball.touchCooldown["-1"] = Math.max(0, ball.touchCooldown["-1"] - dt);
      ball.touchCooldown["1"] = Math.max(0, ball.touchCooldown["1"] - dt);

      if (state.waitingServe) {
        placeServeBall();
        return;
      }

      ball.trail.push({ x: ball.x, y: ball.y, age: 0 });
      if (ball.trail.length > 12) {
        ball.trail.shift();
      }
      for (const point of ball.trail) {
        point.age += dt;
      }

      ball.vy += 1120 * dt;
      ball.vx *= Math.pow(0.997, dt * 60);
      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;

      if (ball.x - ball.r < WORLD.leftWall) {
        ball.x = WORLD.leftWall + ball.r;
        ball.vx = Math.abs(ball.vx) * 0.84;
        bounceFx(ball.x, ball.y);
      }
      if (ball.x + ball.r > WORLD.rightWall) {
        ball.x = WORLD.rightWall - ball.r;
        ball.vx = -Math.abs(ball.vx) * 0.84;
        bounceFx(ball.x, ball.y);
      }
      if (ball.y - ball.r < WORLD.ceiling) {
        ball.y = WORLD.ceiling + ball.r;
        ball.vy = Math.abs(ball.vy) * 0.78;
        bounceFx(ball.x, ball.y);
      }

      resolveNetCollision();

      for (const player of players) {
        if (!resolveAttackHit(player)) {
          resolvePlayerBall(player);
        }
      }

      const speed = Math.hypot(ball.vx, ball.vy);
      const max = 1040;
      if (speed > max) {
        ball.vx = ball.vx / speed * max;
        ball.vy = ball.vy / speed * max;
      }

      if (ball.y + ball.r >= WORLD.floor) {
        const faultSide = ball.x < WORLD.netX ? -1 : 1;
        ball.y = WORLD.floor - ball.r;
        endRally(-faultSide, "GROUND");
      }
    }

    function resolveNetCollision() {
      const left = WORLD.netX - WORLD.netW / 2;
      const right = WORLD.netX + WORLD.netW / 2;
      const top = WORLD.netTop;
      if (ball.x + ball.r < left || ball.x - ball.r > right || ball.y + ball.r < top || ball.y - ball.r > WORLD.floor) {
        return;
      }

      if (ball.y < top && ball.vy > 0) {
        ball.y = top - ball.r;
        ball.vy = -Math.abs(ball.vy) * 0.74;
        ball.vx += (ball.x < WORLD.netX ? -70 : 70);
      } else if (ball.x < WORLD.netX) {
        ball.x = left - ball.r;
        ball.vx = -Math.abs(ball.vx) * 0.72;
      } else {
        ball.x = right + ball.r;
        ball.vx = Math.abs(ball.vx) * 0.72;
      }
      state.shake = Math.max(state.shake, 3);
      bounceFx(ball.x, ball.y);
    }

    function isBallInStrikeZone(player, padding = 0) {
      const towardOpponent = -player.side;
      const forward = (ball.x - player.x) * towardOpponent;
      const vertical = ball.y - (player.y - 28);
      const reachX = 96 + padding;
      const reachY = 108 + padding * 0.55;
      const normalized = ((forward - 48) / reachX) ** 2 + (vertical / reachY) ** 2;
      return forward > -8 - padding && forward < 112 + padding && normalized < 0.92;
    }

    function resolveAttackHit(player) {
      if (player.attackTimer <= 0 || player.attackHasHit || !isBallInStrikeZone(player)) {
        return false;
      }

      const towardOpponent = -player.side;
      const highContact = ball.y < Math.min(player.y - 48, WORLD.netTop + 38);
      const power = highContact ? 780 : 610;
      const lift = highContact ? 330 : -500;
      const movementBoost = clamp(player.vx * towardOpponent, -90, 170);

      ball.x = player.x + towardOpponent * Math.max(52, Math.abs(ball.x - player.x));
      ball.vx = towardOpponent * (power + movementBoost);
      ball.vy = highContact ? Math.max(250, ball.vy + lift) : Math.min(-360, ball.vy + lift);
      player.attackHasHit = true;
      player.squash = highContact ? -0.10 : -0.06;
      state.shake = Math.max(state.shake, highContact ? 7 : 4);

      pop(ball.x, ball.y, player.side < 0 ? "#fff176" : "#c6ff8b", highContact ? 18 : 12, highContact ? 340 : 250);
      registerTouch(player, true);
      tone(highContact ? 660 : 520, highContact ? 0.06 : 0.045, "square", highContact ? 0.045 : 0.034);
      return true;
    }

    function resolvePlayerBall(player) {
      const cx = player.x;
      const cy = player.y - 17;
      const dx = ball.x - cx;
      const dy = ball.y - cy;
      const dist = Math.hypot(dx, dy) || 0.001;
      const minDist = ball.r + player.radius * 0.92;
      if (dist >= minDist) {
        return;
      }

      const nx = dx / dist;
      const ny = dy / dist;
      ball.x = cx + nx * minDist;
      ball.y = cy + ny * minDist;

      const relVx = ball.vx - player.vx;
      const relVy = ball.vy - player.vy;
      const incoming = relVx * nx + relVy * ny;
      if (incoming < 0) {
        ball.vx -= incoming * nx * 1.62;
        ball.vy -= incoming * ny * 1.62;
      }

      const towardOpponent = -player.side;
      ball.vx += player.vx * 0.46 + towardOpponent * 115;
      ball.vy += player.vy * 0.32 - 135;

      if (ball.vx * towardOpponent < 125) {
        ball.vx = towardOpponent * (125 + Math.abs(player.vx) * 0.22);
      }
      if (ball.vy > -240) {
        ball.vy = -240;
      }
      pop(ball.x, ball.y, "rgba(255,255,255,0.72)", 7, 170);

      registerTouch(player, false);
      tone(360, 0.035, "triangle", 0.025);
    }

    function registerTouch(player, attack) {
      const key = String(player.side);
      if (ball.touchCooldown[key] > 0) {
        return;
      }
      ball.touchCooldown[key] = attack ? 0.20 : 0.15;

      if (ball.lastSide === player.side) {
        ball.sideTouches += 1;
      } else {
        ball.lastSide = player.side;
        ball.sideTouches = 1;
      }

      if (ball.sideTouches > 3) {
        endRally(-player.side, "4 TOUCH");
      }
    }

    function updateParticles(dt) {
      for (const group of [state.particles, state.sparks]) {
        for (const p of group) {
          p.age += dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vy += p.gravity * dt;
          p.vx *= Math.pow(0.985, dt * 60);
        }
        for (let i = group.length - 1; i >= 0; i--) {
          if (group[i].age >= group[i].life) {
            group.splice(i, 1);
          }
        }
      }
      state.shake = Math.max(0, state.shake - dt * 18);
      if (state.messageTimer > 0) {
        state.messageTimer -= dt;
        if (state.messageTimer <= 0) {
          ui.toast.classList.remove("show");
        }
      }
    }

    function step(dt) {
      updateParticles(dt);
      if (state.paused) {
        return;
      }

      state.time += dt;
      for (const player of players) {
        updatePlayer(player, dt);
      }

      if (state.waitingServe) {
        placeServeBall();
        state.serveTimer -= dt;
        if (state.serveTimer <= 0) {
          launchServe();
        }
      } else {
        updateBall(dt);
      }
    }

    function render() {
      resize();
      ctx.save();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#0f1518";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const scale = Math.min(canvas.width / WORLD.w, canvas.height / WORLD.h);
      const ox = (canvas.width - WORLD.w * scale) / 2;
      const oy = (canvas.height - WORLD.h * scale) / 2;
      ctx.translate(ox, oy);
      ctx.scale(scale, scale);

      if (state.shake > 0) {
        ctx.translate((Math.random() - 0.5) * state.shake, (Math.random() - 0.5) * state.shake * 0.6);
      }

      drawBackground();
      drawCourt();
      drawBallShadow();
      drawPlayer(leftPlayer);
      drawPlayer(rightPlayer);
      drawNet();
      drawBall();
      drawParticles();

      if (state.paused) {
        drawPauseVeil("PAUSE");
      }
      if (state.matchOver) {
        drawPauseVeil(`${state.scores["-1"] > state.scores["1"] ? leftPlayer.name : rightPlayer.name} WIN`);
      }

      ctx.restore();

      // 세로 화면(터치): 코트 아래에 가로 화면 안내 한 줄
      if (touchUi.on && canvas.height > canvas.width * 1.1) {
        ctx.fillStyle = "rgba(247, 251, 255, 0.5)";
        ctx.font = touchUi.hintFont;
        ctx.textAlign = "center";
        ctx.textBaseline = "top";
        ctx.fillText("가로로 돌리면 코트가 더 크게 보여요", canvas.width / 2, oy + WORLD.h * scale + canvas.width * 0.04);
      }
    }

    function drawBackground() {
      const sky = ctx.createLinearGradient(0, 0, 0, WORLD.floor);
      sky.addColorStop(0, "#8fd5ef");
      sky.addColorStop(0.58, "#bee7d6");
      sky.addColorStop(1, "#f3db83");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, WORLD.w, WORLD.h);

      ctx.fillStyle = "rgba(255,255,255,0.78)";
      drawCloud(124, 88, 1.0);
      drawCloud(742, 74, 0.82);
      drawCloud(542, 118, 0.62);

      ctx.fillStyle = "#7bbd79";
      hill(0, 344, 260, 74);
      ctx.fillStyle = "#55a56f";
      hill(246, 342, 320, 88);
      ctx.fillStyle = "#438d6d";
      hill(574, 350, 330, 82);

      ctx.fillStyle = "rgba(42, 73, 67, 0.32)";
      for (let i = 0; i < 20; i++) {
        const x = 54 + i * 45;
        ctx.beginPath();
        ctx.arc(x, 310 + Math.sin(i) * 8, 9 + (i % 3) * 4, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function hill(x, y, w, h) {
      ctx.beginPath();
      ctx.moveTo(x - 30, WORLD.floor);
      ctx.quadraticCurveTo(x + w * 0.22, y - h, x + w * 0.55, y);
      ctx.quadraticCurveTo(x + w * 0.86, y + h * 0.22, x + w + 40, WORLD.floor);
      ctx.closePath();
      ctx.fill();
    }

    function drawCloud(x, y, s) {
      ctx.beginPath();
      ctx.ellipse(x, y, 36 * s, 17 * s, 0, 0, Math.PI * 2);
      ctx.ellipse(x + 28 * s, y - 8 * s, 30 * s, 22 * s, 0, 0, Math.PI * 2);
      ctx.ellipse(x + 60 * s, y, 38 * s, 18 * s, 0, 0, Math.PI * 2);
      ctx.ellipse(x + 26 * s, y + 8 * s, 52 * s, 17 * s, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawCourt() {
      const sand = ctx.createLinearGradient(0, WORLD.floor - 38, 0, WORLD.h);
      sand.addColorStop(0, "#f1c961");
      sand.addColorStop(1, "#d99a45");
      ctx.fillStyle = sand;
      ctx.fillRect(0, WORLD.floor - 38, WORLD.w, WORLD.h - WORLD.floor + 38);

      ctx.fillStyle = "#eaa849";
      for (let i = 0; i < 120; i++) {
        const x = (i * 97) % WORLD.w;
        const y = WORLD.floor + 4 + ((i * 31) % 66);
        ctx.globalAlpha = 0.18 + (i % 5) * 0.02;
        ctx.beginPath();
        ctx.ellipse(x, y, 10 + (i % 4) * 4, 2.2, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      ctx.strokeStyle = "rgba(255,255,255,0.78)";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(WORLD.leftWall, WORLD.floor);
      ctx.lineTo(WORLD.rightWall, WORLD.floor);
      ctx.stroke();

      ctx.strokeStyle = "rgba(255,255,255,0.46)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(WORLD.netX, WORLD.floor - 38);
      ctx.lineTo(WORLD.netX, WORLD.h);
      ctx.stroke();
    }

    function drawNet() {
      ctx.save();
      ctx.fillStyle = "#6a4f3a";
      roundRect(WORLD.netX - 8, WORLD.netTop - 12, 16, WORLD.floor - WORLD.netTop + 22, 8);
      ctx.fill();

      ctx.strokeStyle = "rgba(255,255,255,0.9)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(WORLD.netX - 48, WORLD.netTop);
      ctx.lineTo(WORLD.netX + 48, WORLD.netTop);
      ctx.stroke();

      ctx.fillStyle = "rgba(245, 250, 255, 0.64)";
      ctx.fillRect(WORLD.netX - 42, WORLD.netTop + 5, 84, WORLD.floor - WORLD.netTop - 4);
      ctx.strokeStyle = "rgba(77, 110, 118, 0.52)";
      ctx.lineWidth = 1.3;
      for (let y = WORLD.netTop + 18; y < WORLD.floor - 6; y += 20) {
        ctx.beginPath();
        ctx.moveTo(WORLD.netX - 42, y);
        ctx.lineTo(WORLD.netX + 42, y);
        ctx.stroke();
      }
      for (let x = WORLD.netX - 32; x <= WORLD.netX + 32; x += 16) {
        ctx.beginPath();
        ctx.moveTo(x, WORLD.netTop + 6);
        ctx.lineTo(x, WORLD.floor - 8);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawBallShadow() {
      const t = clamp((WORLD.floor - ball.y) / 270, 0, 1);
      ctx.fillStyle = `rgba(46, 38, 28, ${0.24 * (1 - t) + 0.05})`;
      ctx.beginPath();
      ctx.ellipse(ball.x, WORLD.floor + 3, 28 * (1 - t * 0.44), 6 * (1 - t * 0.35), 0, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawBall() {
      for (let i = 0; i < ball.trail.length; i++) {
        const p = ball.trail[i];
        const a = i / ball.trail.length * 0.24;
        ctx.fillStyle = `rgba(255, 246, 158, ${a})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, ball.r * (0.55 + i / ball.trail.length * 0.42), 0, Math.PI * 2);
        ctx.fill();
      }

      const spin = state.time * 8 + ball.x * 0.01;
      const grad = ctx.createRadialGradient(ball.x - 6, ball.y - 8, 3, ball.x, ball.y, ball.r + 5);
      grad.addColorStop(0, "#ffffff");
      grad.addColorStop(0.32, "#fff176");
      grad.addColorStop(0.68, "#ffb33f");
      grad.addColorStop(1, "#d66c2c");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.translate(ball.x, ball.y);
      ctx.rotate(spin);
      ctx.strokeStyle = "rgba(105, 61, 35, 0.62)";
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.arc(0, 0, ball.r * 0.72, -1.2, 1.2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, 0, ball.r * 0.72, Math.PI - 1.2, Math.PI + 1.2);
      ctx.stroke();
      ctx.restore();
    }

    function drawPlayer(player) {
      ctx.save();
      ctx.translate(player.x, player.y);
      const squeeze = 1 + player.squash;
      const stretch = 1 - player.squash * 0.72;
      ctx.scale(squeeze, stretch);

      const dir = player.face || player.side;
      const c = player.colors;

      ctx.fillStyle = "rgba(46, 38, 28, 0.20)";
      ctx.beginPath();
      ctx.ellipse(0, 42, 42, 9, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.scale(dir, 1);
      drawTail(player);
      drawEars(player);
      ctx.restore();

      const body = ctx.createRadialGradient(-15, -24, 8, 0, 0, 54);
      body.addColorStop(0, lighten(c.body, 0.32));
      body.addColorStop(0.58, c.body);
      body.addColorStop(1, c.shade);
      ctx.fillStyle = body;
      ctx.beginPath();
      ctx.ellipse(0, 0, 40, 45, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "rgba(69, 52, 36, 0.28)";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = c.accent;
      ctx.beginPath();
      ctx.ellipse(-14 * dir, 6, 8, 12, 0.15 * dir, 0, Math.PI * 2);
      ctx.fill();

      const blink = player.blink < 0 ? 0.16 : 1;
      drawEye(-14, -13, blink, c.eye);
      drawEye(15, -13, blink, c.eye);

      ctx.strokeStyle = c.trim;
      ctx.lineWidth = 2.4;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.arc(0, 4, 10, 0.18, Math.PI - 0.18);
      ctx.stroke();

      ctx.fillStyle = c.trim;
      ctx.beginPath();
      ctx.ellipse(-20, 34, 14, 7, -0.1, 0, Math.PI * 2);
      ctx.ellipse(20, 34, 14, 7, 0.1, 0, Math.PI * 2);
      ctx.fill();

      if (player.attackTimer > 0) {
        ctx.save();
        ctx.scale(dir, 1);
        ctx.strokeStyle = "rgba(255,255,255,0.80)";
        ctx.lineWidth = 5;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(20, -26);
        ctx.quadraticCurveTo(54, -8, 64, 26);
        ctx.stroke();
        ctx.restore();
      }

      ctx.restore();
    }

    function drawTail(player) {
      const c = player.colors;
      ctx.fillStyle = c.accent;
      ctx.strokeStyle = "rgba(72, 52, 33, 0.25)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      if (player.side < 0) {
        ctx.moveTo(-30, 10);
        ctx.lineTo(-62, -4);
        ctx.lineTo(-48, -19);
        ctx.lineTo(-74, -33);
        ctx.lineTo(-44, -33);
        ctx.lineTo(-52, -13);
        ctx.lineTo(-26, -2);
      } else {
        ctx.moveTo(-31, 10);
        ctx.quadraticCurveTo(-70, -20, -62, -46);
        ctx.quadraticCurveTo(-34, -34, -35, -8);
        ctx.lineTo(-24, 4);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }

    function drawEars(player) {
      const c = player.colors;
      ctx.fillStyle = c.body;
      ctx.strokeStyle = "rgba(72, 52, 33, 0.28)";
      ctx.lineWidth = 2;
      const wag = Math.sin(state.time * 8 + player.x * 0.02) * 0.07;
      ctx.save();
      ctx.rotate(-0.28 + wag);
      ctx.beginPath();
      ctx.ellipse(-20, -48, 12, 28, -0.18, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
      ctx.save();
      ctx.rotate(0.25 - wag);
      ctx.beginPath();
      ctx.ellipse(19, -49, 12, 28, 0.18, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
      ctx.fillStyle = c.trim;
      ctx.beginPath();
      ctx.ellipse(-24, -65, 6, 10, -0.2, 0, Math.PI * 2);
      ctx.ellipse(24, -65, 6, 10, 0.2, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawEye(x, y, blink, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.ellipse(x, y, 5.8, 7.2 * blink, 0, 0, Math.PI * 2);
      ctx.fill();
      if (blink > 0.5) {
        ctx.fillStyle = "rgba(255,255,255,0.9)";
        ctx.beginPath();
        ctx.arc(x - 1.8, y - 2.4, 1.8, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawParticles() {
      for (const p of state.particles) {
        const t = 1 - p.age / p.life;
        ctx.fillStyle = colorWithAlpha(p.color, t);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * t, 0, Math.PI * 2);
        ctx.fill();
      }

      for (const p of state.sparks) {
        const t = 1 - p.age / p.life;
        ctx.strokeStyle = colorWithAlpha(p.color, t);
        ctx.lineWidth = p.size * t;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.vx * 0.035, p.y - p.vy * 0.035);
        ctx.stroke();
      }
    }

    function drawPauseVeil(text) {
      ctx.fillStyle = "rgba(12, 18, 20, 0.18)";
      ctx.fillRect(0, 0, WORLD.w, WORLD.h);
      ctx.fillStyle = "rgba(255,255,255,0.92)";
      ctx.font = "900 42px system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.shadowColor = "rgba(0,0,0,0.24)";
      ctx.shadowBlur = 0;
      ctx.shadowOffsetY = 4;
      ctx.fillText(text, WORLD.w / 2, 184);
      ctx.shadowOffsetY = 0;
    }

    function pop(x, y, color, count, speed) {
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const v = speed * (0.3 + Math.random() * 0.7);
        state.particles.push({
          x,
          y,
          vx: Math.cos(a) * v,
          vy: Math.sin(a) * v - 40,
          gravity: 430,
          age: 0,
          life: 0.28 + Math.random() * 0.25,
          size: 2.2 + Math.random() * 3.8,
          color
        });
      }
    }

    function slash(player) {
      const color = player.side < 0 ? "#fff176" : "#baff84";
      for (let i = 0; i < 9; i++) {
        state.sparks.push({
          x: player.x + player.side * (28 + Math.random() * 24),
          y: player.y - 32 + Math.random() * 62,
          vx: player.side * (220 + Math.random() * 270),
          vy: -80 + Math.random() * 180,
          gravity: 0,
          age: 0,
          life: 0.18 + Math.random() * 0.10,
          size: 2.3 + Math.random() * 2,
          color
        });
      }
    }

    function bounceFx(x, y) {
      state.shake = Math.max(state.shake, 2.4);
      pop(x, y, "rgba(255,255,255,0.62)", 5, 130);
      tone(260, 0.026, "triangle", 0.018);
    }

    function fanfare() {
      tone(420, 0.09, "triangle", 0.04);
      setTimeout(() => tone(560, 0.09, "triangle", 0.04), 90);
      setTimeout(() => tone(760, 0.16, "triangle", 0.04), 190);
    }

    function tone(freq, duration, type, gain) {
      if (!state.sound) {
        return;
      }
      try {
        audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const amp = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        amp.gain.setValueAtTime(gain, audioCtx.currentTime);
        amp.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(amp).connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration + 0.01);
      } catch (error) {
        state.sound = false;
        updateHud();
      }
    }

    function lighten(hex, amount) {
      const n = parseInt(hex.slice(1), 16);
      const r = clamp(((n >> 16) & 255) + 255 * amount, 0, 255);
      const g = clamp(((n >> 8) & 255) + 255 * amount, 0, 255);
      const b = clamp((n & 255) + 255 * amount, 0, 255);
      return `rgb(${r}, ${g}, ${b})`;
    }

    function colorWithAlpha(color, alpha) {
      if (color.startsWith("rgba")) {
        return color.replace(/[\d.]+\)$/u, `${alpha})`);
      }
      if (color.startsWith("#")) {
        const n = parseInt(color.slice(1), 16);
        return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
      }
      return color;
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function resize() {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const width = Math.floor(window.innerWidth * dpr);
      const height = Math.floor(window.innerHeight * dpr);
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
        // 휴대폰 주소창 때문에 100vh가 실제 화면과 다를 수 있어 CSS 크기를 창 크기에 맞춘다 (비율 유지)
        canvas.style.width = window.innerWidth + "px";
        canvas.style.height = window.innerHeight + "px";
        layoutTouch();
      }
    }

    // 터치 버튼 크기: 가로 화면은 코트 바닥선 아래 모래 띠에 들어가게, 세로 화면은 큼직하게
    function layoutTouch() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      let safeBottom = 0;
      try {
        safeBottom = parseFloat(getComputedStyle(document.getElementById("safe-probe")).paddingBottom) || 0;
      } catch (error) {
        safeBottom = 0;
      }
      const scale = Math.min(vw / WORLD.w, vh / WORLD.h);
      const oy = (vh - WORLD.h * scale) / 2;
      let size;
      if (vh > vw) {
        size = state.mode === "2p" ? clamp(vw * 0.15, 54, 76) : clamp(vw * 0.17, 60, 84);
      } else {
        size = clamp(vh - (oy + WORLD.floor * scale) - 8 - safeBottom, 46, 64);
      }
      document.documentElement.style.setProperty("--tb", Math.round(size) + "px");
      touchUi.hintFont = `600 ${Math.round(13 * Math.min(2, window.devicePixelRatio || 1))}px system-ui, sans-serif`;
    }

    function setTouchUi(on) {
      touchUi.on = on;
      document.documentElement.classList.toggle("touch-on", on);
      layoutTouch();
    }

    // 터치 버튼 묶음 (← → / UP HIT): 손가락을 떼지 않고 옆 버튼으로 미끄러져도 바뀌고, 여러 손가락 동시 입력 가능
    function bindTouchGroup(group) {
      const target = group.dataset.player === "2" ? touch2 : touch;
      const buttons = Array.from(group.querySelectorAll("[data-touch]"));
      const rects = buttons.map((button) => button.getBoundingClientRect());
      const pointers = new Map(); // pointerId → 누르고 있는 버튼 번호 (-1: 없음)
      const refresh = () => {
        for (let i = 0; i < buttons.length; i++) {
          let on = false;
          for (const index of pointers.values()) {
            if (index === i) {
              on = true;
            }
          }
          target[buttons[i].dataset.touch] = on;
          buttons[i].classList.toggle("on", on);
        }
      };
      const pick = (x, y) => { // 손가락 아래 버튼 (버튼 밖 22px까지는 가장 가까운 버튼)
        let best = -1;
        let bestDist = 22 * 22;
        for (let i = 0; i < buttons.length; i++) {
          const r = rects[i];
          const dx = Math.max(r.left - x, 0, x - r.right);
          const dy = Math.max(r.top - y, 0, y - r.bottom);
          if (dx * dx + dy * dy <= bestDist) {
            bestDist = dx * dx + dy * dy;
            best = i;
          }
        }
        return best;
      };
      group.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        for (let i = 0; i < buttons.length; i++) {
          rects[i] = buttons[i].getBoundingClientRect();
        }
        try {
          group.setPointerCapture(event.pointerId);
        } catch (error) {
          /* 캡처 불가 */
        }
        pointers.set(event.pointerId, pick(event.clientX, event.clientY));
        refresh();
      });
      group.addEventListener("pointermove", (event) => {
        if (!pointers.has(event.pointerId)) {
          return;
        }
        const index = pick(event.clientX, event.clientY);
        if (index !== pointers.get(event.pointerId)) {
          pointers.set(event.pointerId, index);
          refresh();
        }
      });
      const release = (event) => {
        if (pointers.delete(event.pointerId)) {
          refresh();
        }
      };
      group.addEventListener("pointerup", release);
      group.addEventListener("pointercancel", release);
      group.addEventListener("lostpointercapture", release);
      group.addEventListener("contextmenu", (event) => event.preventDefault());
      touchUi.resets.push(() => {
        pointers.clear();
        refresh();
      });
    }

    function resetTouch() {
      for (const reset of touchUi.resets) {
        reset();
      }
    }

    // 모바일은 사용자 제스처 안에서 오디오를 만들거나 깨워야 소리가 난다 (첫 터치/키 입력)
    function unlockAudio() {
      if (!state.sound) {
        return;
      }
      try {
        audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") {
          audioCtx.resume().catch(() => {});
        }
      } catch (error) {
        /* 오디오 미지원 */
      }
    }

    window.addEventListener("keydown", (event) => {
      keys.add(event.code);
      if (["Space", "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(event.code)) {
        event.preventDefault();
      }
      if (event.code === "KeyP" || event.code === "Escape") {
        state.paused = !state.paused;
        updateHud();
      }
      if (event.code === "KeyR") {
        resetMatch();
      }
    });

    window.addEventListener("keyup", (event) => {
      keys.delete(event.code);
    });

    ui.modeBtn.addEventListener("click", () => {
      state.mode = state.mode === "cpu" ? "2p" : "cpu";
      resetTouch();
      resetMatch();
    });

    ui.diffBtn.addEventListener("click", () => {
      state.difficulty = (state.difficulty + 1) % DIFFICULTIES.length;
      showMessage(DIFFICULTIES[state.difficulty].label);
      updateHud();
    });

    ui.targetBtn.addEventListener("click", () => {
      state.target = state.target === 15 ? 7 : 15;
      resetMatch();
    });

    ui.soundBtn.addEventListener("click", () => {
      state.sound = !state.sound;
      updateHud();
      if (state.sound) {
        tone(500, 0.05, "triangle", 0.03);
      }
    });

    ui.pauseBtn.addEventListener("click", () => {
      state.paused = !state.paused;
      updateHud();
    });

    ui.resetBtn.addEventListener("click", resetMatch);

    for (const group of document.querySelectorAll(".touch .pad, .touch .actions")) {
      bindTouchGroup(group);
    }

    window.addEventListener("touchstart", () => {
      if (!touchUi.on) {
        setTouchUi(true);
      }
    }, { passive: true, capture: true });
    window.addEventListener("pointerdown", unlockAudio, true);
    window.addEventListener("touchend", unlockAudio, true);
    window.addEventListener("keydown", unlockAudio, true);
    window.addEventListener("blur", resetTouch);
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        resetTouch();
      }
    });
    canvas.addEventListener("contextmenu", (event) => event.preventDefault());
    window.addEventListener("resize", resize);

    let last = performance.now();
    let accumulator = 0;
    const fixed = 1 / 120;

    function frame(now) {
      const elapsed = Math.min(0.05, (now - last) / 1000);
      last = now;
      accumulator += elapsed;
      while (accumulator >= fixed) {
        step(fixed);
        accumulator -= fixed;
      }
      render();
      requestAnimationFrame(frame);
    }

    setTouchUi(touchUi.on);
    resize();
    resetMatch();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
