      ctx.fillText('[ E ] DEPOSIT', 0, b.radius + 48 * wt);
    }
    ctx.restore();
  }
  function drawShopStation(s) {
    ctx.save();
    ctx.translate(s.x, s.y);
    const pulse = 0.5 + 0.5*Math.sin(s.pulse);
    const inRange = Math.hypot(player.x-s.x, player.y-s.y) < s.dockRange;
    if (inRange) {
      ctx.strokeStyle = `hsla(35, 100%, 60%, ${0.35 + 0.25*pulse})`;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, s.dockRange, 0, Math.PI*2); ctx.stroke();
    }
    // warm halo
    const grad = ctx.createRadialGradient(0,0, 8, 0,0, 90);
    grad.addColorStop(0, `hsla(35,100%,68%,${0.45 + 0.3*pulse})`);
    grad.addColorStop(1, 'hsla(35,100%,55%,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(0,0, 90, 0, Math.PI*2); ctx.fill();
    // hexagonal frame
    ctx.strokeStyle = `hsla(35,100%,75%,1)`; ctx.lineWidth = 3;
    ctx.beginPath();
    for (let i=0;i<6;i++) {
      const a = i/6 * Math.PI*2 + Math.PI/6;
      const x = Math.cos(a)*s.radius, y = Math.sin(a)*s.radius;
      if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.stroke();
    // inner counter-rotating gear teeth
    ctx.save();
    ctx.rotate(-s.pulse * 0.45);
    ctx.strokeStyle = `hsla(35,100%,80%,0.85)`; ctx.lineWidth = 2;
    for (let i=0; i<8; i++) {
      const a = i/8 * Math.PI*2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*16, Math.sin(a)*16);
      ctx.lineTo(Math.cos(a)*30, Math.sin(a)*30);
      ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
    // glowing core
    ctx.fillStyle = `hsla(35,100%,80%,${0.6+0.4*pulse})`;
    ctx.shadowColor = 'hsl(35,100%,70%)'; ctx.shadowBlur = 18;
    ctx.beginPath(); ctx.arc(0,0, 10+pulse*4, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    // wrench glyph
    ctx.fillStyle = 'rgba(40,20,5,0.85)';
    ctx.font = '700 14px "Segoe UI", system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('⚙', 0, 1);
    ctx.textBaseline = 'alphabetic';
    // label
    const wt = view.wt;
    ctx.fillStyle = 'rgba(255,230,200,0.9)';
    ctx.font = view.fName;
    ctx.fillText(s.name, 0, s.radius + 28 * wt);
    if (inRange && !touchUI) { // touch: the SHOP button + panel say this
      ctx.fillStyle = 'rgba(255,220,180,0.95)';
      ctx.font = view.fPrompt;
      ctx.fillText('[ B ] SHIPYARD', 0, s.radius + 48 * wt);
    }
    ctx.restore();
  }

  function drawCargoToken(c) {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(performance.now()*0.003 + (c.spin||0)*100);
    ctx.shadowColor = 'hsl(50,100%,70%)'; ctx.shadowBlur = 10;
    ctx.fillStyle = 'hsl(50,100%,65%)';
    ctx.beginPath();
    ctx.moveTo(0, -6); ctx.lineTo(6, 0); ctx.lineTo(0, 6); ctx.lineTo(-6, 0); ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillRect(-1.3, -1.3, 2.6, 2.6);
    ctx.restore();
  }
  function drawChain(ship, color = 'rgba(255, 220, 100, 0.45)') {
    if (!ship.cargo || ship.cargo.length === 0) return;
    ctx.save();
    ctx.strokeStyle = color; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(ship.x, ship.y);
    for (const c of ship.cargo) ctx.lineTo(c.x, c.y);
    ctx.stroke();
    ctx.restore();
  }

  // -------- player ship visuals (per class) --------
  function drawPlayerScout() {
    ctx.save();
    ctx.translate(player.x, player.y); ctx.rotate(player.angle);
    ctx.shadowColor = 'hsla(195,100%,70%,1)'; ctx.shadowBlur = 18;
    ctx.fillStyle = 'hsl(195, 90%, 55%)';
    ctx.beginPath();
    ctx.moveTo(15, 0); ctx.lineTo(-9, 9); ctx.lineTo(-5, 0); ctx.lineTo(-9, -9);
    ctx.closePath(); ctx.fill();
    ctx.lineWidth = 1.4; ctx.strokeStyle = 'hsla(195,100%,85%,0.9)'; ctx.stroke();
    if (player.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${player.flash})`; ctx.fill(); }
    ctx.restore();
  }
  function drawPlayerGunship() {
    ctx.save();
    ctx.translate(player.x, player.y); ctx.rotate(player.angle);
    ctx.shadowColor = 'hsla(195, 100%, 60%, 1)'; ctx.shadowBlur = 18;
    ctx.fillStyle = 'hsl(195, 65%, 32%)';
    ctx.beginPath();
    ctx.moveTo(26, 0);
    ctx.lineTo(20, -10); ctx.lineTo(-22, -11); ctx.lineTo(-26, -5);
    ctx.lineTo(-26, 5);  ctx.lineTo(-22, 11);  ctx.lineTo(20, 10);
    ctx.closePath(); ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = 'hsla(195, 100%, 80%, 0.95)'; ctx.stroke();
    ctx.fillStyle = 'hsl(195, 40%, 20%)';
    ctx.fillRect(-22, -2, 44, 4);
    for (const tx of [-9, 11]) {
      ctx.fillStyle = 'hsl(195, 75%, 45%)';
      ctx.beginPath(); ctx.arc(tx, 0, 5, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'hsl(195, 90%, 70%)';
      ctx.fillRect(tx, -3, 11, 1.6);
      ctx.fillRect(tx, 1.4, 11, 1.6);
    }
    if (player.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${player.flash})`; ctx.fillRect(-26, -11, 52, 22); }
    ctx.restore();
  }
  function drawPlayerDreadnought() {
    ctx.save();
    ctx.translate(player.x, player.y); ctx.rotate(player.angle);
    ctx.shadowColor = 'hsla(195, 100%, 60%, 1)'; ctx.shadowBlur = 22;
    ctx.fillStyle = 'hsl(195, 55%, 25%)';
    ctx.beginPath();
    ctx.moveTo(34, 0);
    ctx.lineTo(24, -14); ctx.lineTo(-2, -25); ctx.lineTo(-26, -20);
    ctx.lineTo(-32, -7); ctx.lineTo(-32, 7);  ctx.lineTo(-26, 20);
    ctx.lineTo(-2, 25);  ctx.lineTo(24, 14);
    ctx.closePath(); ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = 'hsla(195, 100%, 80%, 0.95)'; ctx.stroke();
    ctx.fillStyle = 'hsl(195, 38%, 35%)';
    ctx.fillRect(-12, -16, 20, 5);
    ctx.fillRect(-12, 11, 20, 5);
    ctx.fillStyle = 'hsl(195, 60%, 40%)';
    ctx.beginPath(); ctx.arc(2, 0, 10, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'hsl(195, 80%, 60%)';
    ctx.fillRect(2, -2.5, 22, 5);
    ctx.fillStyle = 'hsl(35, 90%, 55%)';
    ctx.fillRect(-20, -18, 8, 5);
    ctx.fillRect(-20, 13, 8, 5);
    if (player.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${player.flash})`; ctx.beginPath(); ctx.arc(0, 0, 32, 0, Math.PI*2); ctx.fill(); }
    ctx.restore();
  }
  function drawPlayerVisual() {
    if (player.shipClass === 'scout') drawPlayerScout();
    else if (player.shipClass === 'gunship') drawPlayerGunship();
    else if (player.shipClass === 'dreadnought') drawPlayerDreadnought();
  }

  // -------- enemy ship visuals --------
  function drawScout(p) {
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(p.angle);
    ctx.shadowColor = 'hsla(0,100%,60%,1)'; ctx.shadowBlur = 12;
    ctx.fillStyle = 'hsl(0, 75%, 38%)';
    ctx.beginPath();
    ctx.moveTo(13, 0); ctx.lineTo(3, 6); ctx.lineTo(-8, 10);
    ctx.lineTo(-12, 4); ctx.lineTo(-6, 0); ctx.lineTo(-12, -4);
    ctx.lineTo(-8, -10); ctx.lineTo(3, -6); ctx.closePath();
    ctx.fill();
    ctx.lineWidth = 1.3; ctx.strokeStyle = 'hsla(0,100%,80%,0.85)'; ctx.stroke();
    if (p.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${p.flash})`; ctx.fill(); }
    ctx.restore();
  }
  function drawGunship(p) {
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(p.angle);
    ctx.shadowColor = 'hsla(8, 100%, 55%, 1)'; ctx.shadowBlur = 16;
    ctx.fillStyle = 'hsl(8, 60%, 28%)';
    ctx.beginPath();
    ctx.moveTo(26, 0);
    ctx.lineTo(20, -10); ctx.lineTo(-22, -11); ctx.lineTo(-26, -5);
    ctx.lineTo(-26, 5);  ctx.lineTo(-22, 11);  ctx.lineTo(20, 10);
    ctx.closePath(); ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = 'hsla(8, 100%, 75%, 0.9)'; ctx.stroke();
    ctx.fillStyle = 'hsl(8, 35%, 18%)';
    ctx.fillRect(-22, -2, 44, 4);
    for (const tx of [-9, 11]) {
      ctx.fillStyle = 'hsl(8, 70%, 45%)';
      ctx.beginPath(); ctx.arc(tx, 0, 5, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'hsl(8, 80%, 60%)';
      ctx.fillRect(tx, -3, 11, 1.6);
      ctx.fillRect(tx, 1.4, 11, 1.6);
    }
    if (p.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${p.flash})`; ctx.fillRect(-26, -11, 52, 22); }
    ctx.restore();
  }
  function drawDreadnought(p) {
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(p.angle);
    ctx.shadowColor = 'hsla(355, 100%, 55%, 1)'; ctx.shadowBlur = 20;
    ctx.fillStyle = 'hsl(355, 45%, 22%)';
    ctx.beginPath();
    ctx.moveTo(38, 0);
    ctx.lineTo(28, -16); ctx.lineTo(0, -28); ctx.lineTo(-28, -22);
    ctx.lineTo(-34, -8); ctx.lineTo(-34, 8);  ctx.lineTo(-28, 22);
    ctx.lineTo(0, 28);   ctx.lineTo(28, 16);
    ctx.closePath(); ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = 'hsla(355, 100%, 75%, 0.9)'; ctx.stroke();
    ctx.fillStyle = 'hsl(355, 28%, 32%)';
    ctx.fillRect(-14, -17, 22, 5);
    ctx.fillRect(-14, 12, 22, 5);
    ctx.fillStyle = 'hsl(355, 50%, 36%)';
    ctx.beginPath(); ctx.arc(2, 0, 11, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'hsl(355, 70%, 55%)';
    ctx.fillRect(2, -2.5, 24, 5);
    ctx.fillStyle = 'hsl(20, 80%, 50%)';
    ctx.fillRect(-22, -19, 9, 5);
    ctx.fillRect(-22, 14, 9, 5);
    if (p.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${p.flash})`; ctx.beginPath(); ctx.arc(0, 0, 36, 0, Math.PI*2); ctx.fill(); }
    ctx.restore();
  }
  function drawPirate(p) {
    if (p.type === 'scout') drawScout(p);
    else if (p.type === 'gunship') drawGunship(p);
    else if (p.type === 'dreadnought') drawDreadnought(p);
    if (p.health < p.maxHealth) {
      ctx.save();
      ctx.translate(p.x, p.y - p.radius - 12);
      const w = p.radius * 2 + 8;
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.fillRect(-w/2, 0, w, 3);
      ctx.fillStyle = 'hsl(0,90%,60%)';
      ctx.fillRect(-w/2, 0, w*(p.health/p.maxHealth), 3);
      ctx.restore();
    }
    if (p.type !== 'scout' && p.goal && p.goal !== 'patrol') {
      ctx.save();
      ctx.translate(p.x, p.y - p.radius - (12 + 10 * view.wt));
      ctx.fillStyle = p.goal === 'hunt' ? 'rgba(255,120,120,0.85)'
                    : p.goal === 'collect' ? 'rgba(255,220,120,0.85)'
                    : p.goal === 'flee' ? 'rgba(255,180,255,0.95)'
                    : 'rgba(120,255,180,0.85)';
      ctx.font = view.fGoal;
      ctx.textAlign = 'center';
      ctx.fillText(p.goal.toUpperCase(), 0, 0);
      ctx.restore();
    }
  }
  function drawMissile(m) {
    ctx.save();
    ctx.translate(m.x, m.y); ctx.rotate(m.angle);
    const friendly = m.launcherType === 'player';
    ctx.shadowColor = friendly ? 'hsla(195, 100%, 70%, 1)' : 'hsla(20, 100%, 60%, 1)';
    ctx.shadowBlur = 14;
    ctx.fillStyle = friendly ? 'hsl(195, 90%, 55%)' : 'hsl(15, 80%, 50%)';
    ctx.beginPath();
    ctx.moveTo(8, 0); ctx.lineTo(2, 3); ctx.lineTo(-6, 3);
    ctx.lineTo(-6, -3); ctx.lineTo(2, -3);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = friendly ? 'rgba(180,240,255,0.9)' : 'rgba(255,200,100,0.9)';
    ctx.fillRect(-8, -1.7, 2.5, 3.4);
    ctx.restore();
  }

  function drawHealthBar(x, y, w, h, ratio, hue) {
    ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = `hsla(${hue}, 90%, 55%, 0.95)`; ctx.fillRect(x, y, w*ratio, h);
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1; ctx.strokeRect(x, y, w, h);
  }

  // minimap rect, shared with the touch HUD layout (updated in place, no per-frame objects)
  const mm = { x: 0, y: 0, size: 0 };
  function layoutMinimap() {
    const pad = 14;
    // touch: sized for short landscape screens too; moves under the HUD panel when the screen is narrow
    mm.size = touchUI ? Math.min(220, Math.max(view.w, view.h) * 0.16, Math.min(view.w, view.h) * 0.36)
                      : Math.min(220, view.w*0.22);
    mm.x = view.w - mm.size - pad - safe.r;
    mm.y = pad + safe.t + (touchUI && mm.x < 18 + safe.l + 300 + 8 ? 152 + 14 : 0);
  }
  function drawMinimap() {
    layoutMinimap();
    const size = mm.size, x = mm.x, y = mm.y;
    ctx.save();
    ctx.fillStyle = 'rgba(5,8,20,0.7)';
    ctx.strokeStyle = 'rgba(120,200,255,0.45)'; ctx.lineWidth = 1;
    ctx.fillRect(x, y, size, size); ctx.strokeRect(x, y, size, size);
    const sx = size / WORLD.w, sy = size / WORLD.h;
    ctx.fillStyle = 'rgba(140,160,180,0.45)';
    for (const a of asteroids) ctx.fillRect(x + a.x*sx - 1, y + a.y*sy - 1, 2, 2);
    for (const b of beacons) {
      ctx.fillStyle = 'hsl(140,100%,65%)';
      ctx.beginPath(); ctx.arc(x + b.x*sx, y + b.y*sy, 3.5, 0, Math.PI*2); ctx.fill();
    }
    for (const s of shops) {
      ctx.fillStyle = 'hsl(35,100%,65%)';
      ctx.fillRect(x + s.x*sx - 3, y + s.y*sy - 3, 6, 6);
    }
    ctx.fillStyle = 'hsl(50,100%,65%)';
    for (const t of tokens) ctx.fillRect(x + t.x*sx - 1, y + t.y*sy - 1, 2, 2);
    for (const p of pirates) {
      const fill = p.type === 'dreadnought' ? 'hsl(355, 100%, 55%)'
                 : p.type === 'gunship'    ? 'hsl(15, 100%, 60%)'
                                           : 'hsl(0, 100%, 75%)';
      const r = p.type === 'dreadnought' ? 4 : p.type === 'gunship' ? 3 : 2;
      ctx.fillStyle = fill;
      ctx.beginPath(); ctx.arc(x + p.x*sx, y + p.y*sy, r, 0, Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = 'hsl(20,100%,65%)';
    for (const m of missiles) ctx.fillRect(x + m.x*sx - 1, y + m.y*sy - 1, 2, 2);
    ctx.fillStyle = 'hsl(190,100%,70%)';
    ctx.save();
    ctx.translate(x + player.x*sx, y + player.y*sy);
    ctx.rotate(player.angle);
    ctx.beginPath(); ctx.moveTo(5,0); ctx.lineTo(-3,3); ctx.lineTo(-3,-3); ctx.closePath();
    ctx.fill();
    ctx.restore();
    ctx.fillStyle = 'rgba(200,220,255,0.6)';
    ctx.font = touchUI ? '600 12px "Segoe UI", system-ui, sans-serif' : '600 10px "Segoe UI", system-ui, sans-serif';
    ctx.fillText('SECTOR MAP', x + 6, y + 14);
    ctx.restore();
  }

  function drawHUD() {
    // touch: the panel drops its empty third row (small screens need the space)
    const row3 = player.cargo.length > 0 || PLAYER_CLASSES[player.shipClass].canMissile;
    const x = 18 + safe.l, y = 18 + safe.t, w = 300, h = touchUI && !row3 ? 116 : 152;
    ctx.save();
    ctx.fillStyle = 'rgba(5,8,20,0.7)';
    ctx.strokeStyle = 'rgba(120,200,255,0.35)';
    ctx.fillRect(x, y, w, h); ctx.strokeRect(x, y, w, h);

    ctx.fillStyle = 'rgba(120,220,255,0.95)';
    ctx.font = '700 14px "Segoe UI", system-ui, sans-serif';
    const clsText = `■ ${player.shipClass.toUpperCase()}`;
    ctx.fillText(clsText, x+12, y+22);
    // touch: keep the upgrade levels clear of a long class name (DREADNOUGHT)
    const lvX = touchUI ? Math.max(130, 12 + ctx.measureText(clsText).width + 14) : 130;
    ctx.fillStyle = 'rgba(220,240,255,0.6)';
    ctx.font = touchUI ? '500 12px "Segoe UI", system-ui, sans-serif' : '500 11px "Segoe UI", system-ui, sans-serif';
    const u = player.upgrades;
    ctx.fillText(`E${u.engine}  C${u.cooling}  W${u.weapon}  A${u.armor}`, x + lvX, y + 22);

    ctx.fillStyle = 'rgba(220,240,255,0.9)';
    ctx.font = '700 13px "Segoe UI", system-ui, sans-serif';
    ctx.fillText('HULL', x+12, y+50);
    const maxHp = effPlayerMaxHealth();
    drawHealthBar(x+62, y+40, 220, 12, player.health / maxHp,
      player.health > maxHp*0.6 ? 140 : player.health > maxHp*0.3 ? 40 : 0);

    ctx.fillStyle = 'rgba(255,220,120,0.95)';
    ctx.font = '700 16px "Segoe UI", system-ui, sans-serif';
    ctx.fillText(`◆ ${player.gold} GOLD`, x+12, y+78);

    ctx.fillStyle = 'rgba(180,255,210,0.9)';
    ctx.font = '600 13px "Segoe UI", system-ui, sans-serif';
    ctx.fillText(`CARGO  ${player.cargo.length}/${player.maxCargo}`, x+12, y+102);
    ctx.fillStyle = 'rgba(255,160,180,0.9)';
    ctx.fillText(`KILLS  ${player.totalKills}`, x+160, y+102);

    let row3y = y + 126;
    if (player.cargo.length > 0) {
      const dragPct = Math.round((1 - 1/(1 + player.cargo.length*CARGO_DRAG_THRUST)) * 100);
      ctx.fillStyle = 'rgba(255,200,140,0.9)';
      ctx.font = '600 12px "Segoe UI", system-ui, sans-serif';
      ctx.fillText(touchUI ? `DRAG -${dragPct}%   [RELEASE]` : `DRAG -${dragPct}%   [X] release`, x+12, row3y);
    } else if (PLAYER_CLASSES[player.shipClass].canMissile) {
      const max = PLAYER_CLASSES[player.shipClass].missileCooldownMax;
      const ratio = 1 - player.missileCooldown / max;
      ctx.fillStyle = 'rgba(255,180,100,0.9)';
      ctx.font = '600 12px "Segoe UI", system-ui, sans-serif';
      ctx.fillText(touchUI ? `[MISSILE]` : `[V] MISSILE`, x+12, row3y);
      drawHealthBar(x+96, y+118, 184, 10, ratio, 25);
    }
    ctx.restore();

    const nearBeacon = beacons.find(b => Math.hypot(b.x-player.x, b.y-player.y) < b.dockRange);
    const nearShop = shops.find(s => Math.hypot(s.x-player.x, s.y-player.y) < s.dockRange);
    // station panel: bottom centre on desktop. Touch: short landscape screens use the top strip between the HUD
    // and the map (the docked station's own labels sit right below the ship), portrait puts it just below the ship,
    // and narrow landscape screens fall back to just above the SHOP / DEPOSIT button.
    let w2 = 340, px = view.w/2 - w2/2, panelY = view.h - 120;
    if (touchUI) {
      layoutMinimap();
      const gapL = 18 + safe.l + 300 + 8, gapR = mm.x - 8;
      if (view.w > view.h && gapR - gapL >= 260) { w2 = Math.min(340, gapR - gapL); px = (gapL + gapR) / 2 - w2 / 2; panelY = 18 + safe.t; }
      else if (view.w <= view.h) panelY = Math.round(view.h / 2 + 44);
      else panelY = view.h - 156 - safe.b;
    }
    const pcx = px + w2 / 2;
    const panelBg = touchUI ? 'rgba(5,8,20,0.85)' : 'rgba(5,8,20,0.7)';
    if (!shopOpen && nearShop) {
      ctx.save();
      ctx.fillStyle = panelBg;
      ctx.strokeStyle = 'hsla(35,100%,70%,0.6)';
      const h2 = 56;
      const cx = px, cy = panelY;
      ctx.fillRect(cx, cy, w2, h2); ctx.strokeRect(cx, cy, w2, h2);
      ctx.fillStyle = 'hsl(35,100%,80%)';
      ctx.font = '700 14px "Segoe UI", system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`SHIPYARD — ${nearShop.name}`, pcx, cy + 18);
      ctx.fillStyle = 'rgba(255,230,200,0.9)';
      ctx.font = '500 12px "Segoe UI", system-ui, sans-serif';
      ctx.fillText(touchUI ? '[ SHOP ]  업그레이드 / 수리' : '[ B ]  업그레이드 / 수리', pcx, cy + 38);
      ctx.restore();
    } else if (!shopOpen && nearBeacon) {
      ctx.save();
      ctx.fillStyle = panelBg;
      ctx.strokeStyle = 'hsla(140,100%,70%,0.6)';
      const h2 = 56;
      const cx = px, cy = panelY;
      ctx.fillRect(cx, cy, w2, h2); ctx.strokeRect(cx, cy, w2, h2);
      ctx.fillStyle = 'hsl(140,100%,80%)';
      ctx.font = '700 14px "Segoe UI", system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`BEACON — ${nearBeacon.name}`, pcx, cy + 18);
      ctx.fillStyle = 'rgba(220,255,235,0.9)';
      ctx.font = '500 12px "Segoe UI", system-ui, sans-serif';
      const msg = player.cargo.length > 0 ? `${touchUI ? '[ DEPOSIT ]' : '[ E ]'}  부품 ${player.cargo.length}개 인계 → +${player.cargo.length*100}G` : `사냥할 부품이 없습니다`;
      ctx.fillText(msg, pcx, cy + 38);
      ctx.restore();
    }

    if (player.dead) {
      ctx.save();
      ctx.fillStyle = 'rgba(5,0,10,0.55)';
      ctx.fillRect(0,0,view.w,view.h);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffd0d0';
      ctx.shadowColor = 'rgba(255,80,80,0.7)'; ctx.shadowBlur = 30;
      ctx.font = '800 56px "Segoe UI", system-ui, sans-serif';
      if (touchUI) { // narrow phone screens: shrink the headline to fit
        const tw = ctx.measureText('SHIP DESTROYED').width;
        if (tw > view.w - 32) ctx.font = `800 ${Math.floor(56 * (view.w - 32) / tw)}px "Segoe UI", system-ui, sans-serif`;
      }
      ctx.fillText('SHIP DESTROYED', view.w/2, view.h/2 - 20);
      ctx.shadowBlur = 0;
      ctx.font = '500 18px "Segoe UI", system-ui, sans-serif';
      ctx.fillStyle = 'rgba(220,220,230,0.85)';
      ctx.fillText(`복귀 중... ${Math.ceil(player.deadTimer/60)}s`, view.w/2, view.h/2 + 14);
      ctx.restore();
    }
  }

  // ---------- shop overlay ----------
  function drawShopOption(x, y, key, label, cost, disabled, color) {
    ctx.save();
    const canAfford = !disabled && player.gold >= cost;
    ctx.fillStyle = canAfford ? `hsla(${color},80%,50%,0.6)` : 'hsla(0,0%,40%,0.4)';
    ctx.fillRect(x, y - 14, 22, 22);
    ctx.fillStyle = canAfford ? '#fff' : 'rgba(255,255,255,0.5)';
    ctx.font = '700 13px "Segoe UI", system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(key, x + 11, y + 1);
    ctx.textAlign = 'left';
    ctx.font = '500 13px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = canAfford ? 'rgba(220,240,255,0.95)' : 'rgba(220,240,255,0.45)';
    ctx.fillText(label, x + 32, y + 2);
    ctx.textAlign = 'right';
    ctx.font = '700 13px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = canAfford ? 'rgba(255, 220, 120, 0.95)' : 'rgba(255, 220, 120, 0.4)';
    ctx.fillText(`${cost}G`, x + 460, y + 2);
    ctx.restore();
  }
  function drawSpecOption(x, y, key, spec) {
    const lv = player.upgrades[spec];
    const maxed = lv >= MAX_SPEC_LEVEL;
    const cost = maxed ? 0 : SPEC_COSTS[lv];
    const canAfford = !maxed && player.gold >= cost;
    ctx.save();
    ctx.fillStyle = maxed ? 'rgba(120,120,120,0.4)' : (canAfford ? 'hsla(195,80%,50%,0.6)' : 'hsla(0,0%,40%,0.4)');
    ctx.fillRect(x, y - 14, 22, 22);
    ctx.fillStyle = canAfford || maxed ? '#fff' : 'rgba(255,255,255,0.5)';
    ctx.font = '700 13px "Segoe UI", system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(key, x + 11, y + 1);
    ctx.textAlign = 'left';
    ctx.font = '500 13px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = canAfford || maxed ? 'rgba(220,240,255,0.95)' : 'rgba(220,240,255,0.45)';
    ctx.fillText(SPEC_LABEL[spec], x + 32, y + 2);
    for (let i = 0; i < MAX_SPEC_LEVEL; i++) {
      ctx.fillStyle = i < lv ? 'hsl(195, 100%, 65%)' : 'rgba(255,255,255,0.15)';
      ctx.fillRect(x + 270 + i * 12, y - 4, 8, 8);
    }
    ctx.textAlign = 'right';
    ctx.font = '700 13px "Segoe UI", system-ui, sans-serif';
    if (maxed) {
      ctx.fillStyle = 'rgba(120,255,180,0.7)';
      ctx.fillText('MAX', x + 460, y + 2);
    } else {
      ctx.fillStyle = canAfford ? 'rgba(255, 220, 120, 0.95)' : 'rgba(255, 220, 120, 0.4)';
      ctx.fillText(`${cost}G`, x + 460, y + 2);
    }
    ctx.restore();
  }
  function drawShop() {
    if (!shopOpen) return;
    if (touchUI) { drawShopTouch(); return; }
    ctx.save();
    ctx.fillStyle = 'rgba(2, 4, 14, 0.78)';
    ctx.fillRect(0, 0, view.w, view.h);

    const W = 540, H = 540;
    const x = view.w/2 - W/2, y = view.h/2 - H/2;
    ctx.fillStyle = 'rgba(10, 16, 32, 0.96)';
    ctx.strokeStyle = 'hsla(140, 100%, 60%, 0.7)';
    ctx.lineWidth = 2;
    ctx.fillRect(x, y, W, H); ctx.strokeRect(x, y, W, H);

    ctx.shadowColor = 'hsla(140, 100%, 60%, 0.8)'; ctx.shadowBlur = 20;
    ctx.fillStyle = 'hsl(140, 100%, 80%)';
    ctx.font = '700 22px "Segoe UI", system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`${shopStation.name} — SHIPYARD`, x + W/2, y + 36);
    ctx.shadowBlur = 0;

    let cy = y + 70;
    ctx.font = '600 14px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = 'rgba(220,240,255,0.85)';
    ctx.textAlign = 'left';
    ctx.fillText(`CLASS  ${player.shipClass.toUpperCase()}`, x + 28, cy);
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(255, 220, 120, 0.95)';
    ctx.fillText(`◆ ${player.gold} GOLD`, x + W - 28, cy);
    cy += 22;
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(220,240,255,0.7)';
    ctx.font = '500 12px "Segoe UI", system-ui, sans-serif';
    ctx.fillText(`HULL  ${Math.floor(player.health)} / ${Math.floor(effPlayerMaxHealth())}`, x + 28, cy);

    cy += 18;
    ctx.strokeStyle = 'rgba(120,200,255,0.2)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x + 24, cy); ctx.lineTo(x + W - 24, cy); ctx.stroke();
    cy += 22;

    ctx.fillStyle = 'hsl(45, 100%, 70%)';
    ctx.font = '700 13px "Segoe UI", system-ui, sans-serif';
    ctx.fillText('SHIP CLASS', x + 28, cy);
    cy += 24;
    if (player.shipClass === 'scout') {
      drawShopOption(x + 28, cy, '1', '등급 업그레이드  →  GUNSHIP', CLASS_UPGRADE_COST.gunship, false, 45);
      cy += 30;
    } else if (player.shipClass === 'gunship') {
      drawShopOption(x + 28, cy, '1', '등급 업그레이드  →  DREADNOUGHT', CLASS_UPGRADE_COST.dreadnought, false, 45);
      cy += 30;
    } else {
      ctx.fillStyle = 'rgba(180,200,220,0.55)';
      ctx.font = '500 13px "Segoe UI", system-ui, sans-serif';
      ctx.fillText('  최상위 등급 도달', x + 28, cy);
      cy += 30;
    }

    cy += 8;
    ctx.fillStyle = 'hsl(195, 100%, 70%)';
    ctx.font = '700 13px "Segoe UI", system-ui, sans-serif';
    ctx.fillText('SPEC UPGRADES', x + 28, cy);
    cy += 24;
    drawSpecOption(x + 28, cy, '2', 'engine');  cy += 26;
    drawSpecOption(x + 28, cy, '3', 'cooling'); cy += 26;
    drawSpecOption(x + 28, cy, '4', 'weapon');  cy += 26;
    drawSpecOption(x + 28, cy, '5', 'armor');   cy += 32;

    ctx.fillStyle = 'hsl(0, 100%, 75%)';
    ctx.font = '700 13px "Segoe UI", system-ui, sans-serif';
    ctx.fillText('REPAIR', x + 28, cy);
    cy += 24;
    const max = effPlayerMaxHealth();
    const missing = max - player.health;
    if (missing > 0.5) {
      const cost = Math.ceil(missing * REPAIR_RATE[player.shipClass]);
      drawShopOption(x + 28, cy, 'R', `함체 수리  (+${Math.floor(missing)} HP)`, cost, false, 0);
    } else {
      ctx.fillStyle = 'rgba(180,255,200,0.6)';
      ctx.font = '500 13px "Segoe UI", system-ui, sans-serif';
      ctx.fillText('  함체 손상 없음', x + 28, cy);
    }

    ctx.fillStyle = 'rgba(180,200,220,0.55)';
    ctx.font = '500 12px "Segoe UI", system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('[ B ]  /  [ ESC ]  CLOSE', x + W/2, y + H - 16);

    ctx.restore();
  }

  // touch shipyard helpers (one option row = one tap target)
  const TOUCH_ROW_H = 44;
  const SPEC_ORDER = ['engine', 'cooling', 'weapon', 'armor'];
  function shopTouchLabel(text, lx, ly, color) {
    ctx.fillStyle = color; ctx.font = '700 13px "Segoe UI", system-ui, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(text, lx, ly + 15);
  }
  function shopTouchNote(text, lx, ly, color) {
    ctx.fillStyle = color; ctx.font = '500 13px "Segoe UI", system-ui, sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(text, lx + 10, ly + TOUCH_ROW_H / 2 + 5);
  }
  // state: 'buy' (affordable) | 'poor' | 'max'; lv >= 0 also draws the spec level pips
  function shopTouchRow(rx, ry, rw, key, text, cost, state, hue, lv, action) {
    const RH = TOUCH_ROW_H, on = state === 'buy', lit = on || state === 'max', my = ry + RH / 2;
    ctx.fillStyle = on ? `hsla(${hue},80%,50%,0.14)` : 'rgba(255,255,255,0.04)';
    ctx.fillRect(rx, ry, rw, RH);
    ctx.strokeStyle = on ? `hsla(${hue},100%,70%,0.5)` : 'rgba(150,170,200,0.22)';
    ctx.lineWidth = 1; ctx.strokeRect(rx + 0.5, ry + 0.5, rw - 1, RH - 1);
    ctx.fillStyle = state === 'max' ? 'rgba(120,120,120,0.4)' : on ? `hsla(${hue},80%,50%,0.6)` : 'hsla(0,0%,40%,0.4)';
    ctx.fillRect(rx + 10, my - 11, 22, 22);
    ctx.textBaseline = 'middle';
    ctx.fillStyle = lit ? '#fff' : 'rgba(255,255,255,0.5)';
    ctx.font = '700 13px "Segoe UI", system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(key, rx + 21, my + 1);
    ctx.textAlign = 'left';
    ctx.font = '500 13px "Segoe UI", system-ui, sans-serif';
    const maxW = (lv >= 0 ? rw - 126 : rw - 64) - 42, tw = ctx.measureText(text).width;
    if (tw > maxW) ctx.font = `500 ${Math.max(11, Math.floor(13 * maxW / tw))}px "Segoe UI", system-ui, sans-serif`;
    ctx.fillStyle = lit ? 'rgba(220,240,255,0.95)' : 'rgba(220,240,255,0.45)';
    ctx.fillText(text, rx + 42, my + 1);
    if (lv >= 0) for (let i = 0; i < MAX_SPEC_LEVEL; i++) {
      ctx.fillStyle = i < lv ? 'hsl(195, 100%, 65%)' : 'rgba(255,255,255,0.15)';
      ctx.fillRect(rx + rw - 118 + i * 11, my - 4, 8, 8);
    }
    ctx.textAlign = 'right';
    ctx.font = '700 13px "Segoe UI", system-ui, sans-serif';
    if (state === 'max') { ctx.fillStyle = 'rgba(120,255,180,0.7)'; ctx.fillText('MAX', rx + rw - 12, my + 1); }
    else { ctx.fillStyle = on ? 'rgba(255, 220, 120, 0.95)' : 'rgba(255, 220, 120, 0.4)'; ctx.fillText(`${cost}G`, rx + rw - 12, my + 1); }
    ctx.textBaseline = 'alphabetic';
    shopHitTargets.push({ x: rx, y: ry, w: rw, h: RH, action });
  }
  // touch shipyard: the same options as big tappable rows (44 px), sized to fit a phone —
  // two columns on short landscape screens, one column in portrait
  function drawShopTouch() {
    shopHitTargets.length = 0;
    ctx.save();
    ctx.fillStyle = 'rgba(2, 4, 14, 0.78)';
    ctx.fillRect(0, 0, view.w, view.h);

    const avW = view.w - safe.l - safe.r - 16, avH = view.h - safe.t - safe.b - 16;
    const two = avW > avH && avW >= 600;
    const RH = TOUCH_ROW_H, GAP = 4, P = 16, LBL = 22;
    const colW = two ? Math.min(380, (avW - P * 3) / 2) : Math.min(480, avW - P * 2);
    const headH = 28 + 20 + 18 + 12;
    const classH = LBL + RH, repairH = LBL + RH, specH = LBL + 4 * RH + 3 * GAP;
    const W = two ? colW * 2 + P * 3 : colW + P * 2;
    const H = two ? P + headH + Math.max(classH + 10 + repairH + 12 + RH, specH) + P
                  : P + headH + classH + 10 + specH + 10 + repairH + 12 + RH + P;
    const x = safe.l + 8 + (avW - W) / 2, y = safe.t + 8 + Math.max(0, (avH - H) / 2);
    ctx.fillStyle = 'rgba(10, 16, 32, 0.96)';
    ctx.strokeStyle = 'hsla(140, 100%, 60%, 0.7)';
    ctx.lineWidth = 2;
    ctx.fillRect(x, y, W, H); ctx.strokeRect(x, y, W, H);

    // header
    ctx.shadowColor = 'hsla(140, 100%, 60%, 0.8)'; ctx.shadowBlur = 20;
    ctx.fillStyle = 'hsl(140, 100%, 80%)';
    ctx.font = '700 22px "Segoe UI", system-ui, sans-serif';
    ctx.textAlign = 'center';
    const title = `${shopStation.name} — SHIPYARD`, ttw = ctx.measureText(title).width;
    if (ttw > W - P * 2) ctx.font = `700 ${Math.floor(22 * (W - P * 2) / ttw)}px "Segoe UI", system-ui, sans-serif`;
    ctx.fillText(title, x + W/2, y + P + 20);
    ctx.shadowBlur = 0;
    let cy = y + P + 28 + 16;
    ctx.font = '600 14px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = 'rgba(220,240,255,0.85)';
    ctx.textAlign = 'left';
    ctx.fillText(`CLASS  ${player.shipClass.toUpperCase()}`, x + P, cy);
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(255, 220, 120, 0.95)';
    ctx.fillText(`◆ ${player.gold} GOLD`, x + W - P, cy);
    cy += 20;
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(220,240,255,0.7)';
    ctx.font = '500 12px "Segoe UI", system-ui, sans-serif';
    ctx.fillText(`HULL  ${Math.floor(player.health)} / ${Math.floor(effPlayerMaxHealth())}`, x + P, cy);
    cy += 10;
    ctx.strokeStyle = 'rgba(120,200,255,0.2)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x + P, cy); ctx.lineTo(x + W - P, cy); ctx.stroke();
    const bodyY = y + P + headH;

    const lx = x + P, rx = two ? x + P * 2 + colW : x + P;
    // ship class
    let ly = bodyY;
    shopTouchLabel('SHIP CLASS', lx, ly, 'hsl(45, 100%, 70%)'); ly += LBL;
    const next = player.shipClass === 'scout' ? 'GUNSHIP' : player.shipClass === 'gunship' ? 'DREADNOUGHT' : null;
    if (next) {
      const cost = CLASS_UPGRADE_COST[next.toLowerCase()];
      shopTouchRow(lx, ly, colW, '1', `등급 업그레이드  →  ${next}`, cost, player.gold >= cost ? 'buy' : 'poor', 45, -1, 'class');
    } else shopTouchNote('최상위 등급 도달', lx, ly, 'rgba(180,200,220,0.55)');
    ly += RH + 10;
    // spec upgrades (right column when there are two)
    let sy = two ? bodyY : ly;
    shopTouchLabel('SPEC UPGRADES', rx, sy, 'hsl(195, 100%, 70%)'); sy += LBL;
    for (let i = 0; i < SPEC_ORDER.length; i++) {
      const spec = SPEC_ORDER[i], lv = player.upgrades[spec], maxed = lv >= MAX_SPEC_LEVEL, cost = maxed ? 0 : SPEC_COSTS[lv];
      shopTouchRow(rx, sy, colW, String(i + 2), SPEC_LABEL[spec], cost, maxed ? 'max' : player.gold >= cost ? 'buy' : 'poor', 195, lv, spec);
      sy += RH + GAP;
    }
    if (!two) ly = sy - GAP + 10;
    // repair
    shopTouchLabel('REPAIR', lx, ly, 'hsl(0, 100%, 75%)'); ly += LBL;
    const missing = effPlayerMaxHealth() - player.health;
    if (missing > 0.5) {
      const cost = Math.ceil(missing * REPAIR_RATE[player.shipClass]);
      shopTouchRow(lx, ly, colW, 'R', `함체 수리  (+${Math.floor(missing)} HP)`, cost, player.gold >= cost ? 'buy' : 'poor', 0, -1, 'repair');
    } else shopTouchNote('함체 손상 없음', lx, ly, 'rgba(180,255,200,0.6)');
    ly += RH + 12;
    // close
    ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fillRect(lx, ly, colW, RH);
    ctx.strokeStyle = 'hsla(140, 100%, 60%, 0.6)'; ctx.lineWidth = 1.5; ctx.strokeRect(lx + 0.5, ly + 0.5, colW - 1, RH - 1);
    ctx.fillStyle = 'hsl(140, 100%, 80%)'; ctx.font = '700 14px "Segoe UI", system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('CLOSE', lx + colW / 2, ly + RH / 2 + 1);
    ctx.textBaseline = 'alphabetic';
    shopHitTargets.push({ x: lx, y: ly, w: colW, h: RH, action: 'close' });
    ctx.restore();
  }

  function drawTitleScreen() {
    if (touchUI) { drawTitleScreenTouch(); return; }
    titleHitTargets.length = 0;
    // dim the world backdrop
    ctx.save();
    ctx.fillStyle = 'rgba(2, 4, 14, 0.78)';
    ctx.fillRect(0, 0, view.w, view.h);

    const cx = view.w / 2;
    const cy = view.h / 2;

    // title
    ctx.shadowColor = 'hsla(195, 100%, 60%, 0.95)';
    ctx.shadowBlur = 32;
    ctx.fillStyle = 'hsl(195, 90%, 78%)';
    ctx.font = '900 54px "Segoe UI", system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('ASTEROID BOUNTY HUNTER', cx, cy - 200);
    ctx.shadowBlur = 0;

    ctx.fillStyle = 'rgba(220,240,255,0.65)';
    ctx.font = '500 16px "Segoe UI", system-ui, sans-serif';
    ctx.fillText('Ecosystem of Bounty Hunters', cx, cy - 168);

    // start button
    const btnW = 280, btnH = 64;
    const btnX = cx - btnW/2, btnY = cy - 100;
    const overBtn = mouseScreen.active &&
      mouseScreen.x >= btnX && mouseScreen.x < btnX + btnW &&
      mouseScreen.y >= btnY && mouseScreen.y < btnY + btnH;
    ctx.shadowColor = 'hsla(140, 100%, 55%, 0.9)';
    ctx.shadowBlur = overBtn ? 32 : 18;
    ctx.fillStyle = overBtn ? 'hsla(140, 80%, 50%, 0.55)' : 'hsla(140, 60%, 32%, 0.45)';
    ctx.fillRect(btnX, btnY, btnW, btnH);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'hsl(140, 100%, 70%)';
    ctx.lineWidth = 2;
    ctx.strokeRect(btnX, btnY, btnW, btnH);
    ctx.fillStyle = overBtn ? '#fff' : 'rgba(220,255,235,0.95)';
    ctx.font = '700 22px "Segoe UI", system-ui, sans-serif';
    ctx.textBaseline = 'middle';
    ctx.fillText('START GAME', cx, btnY + btnH/2);
    ctx.textBaseline = 'alphabetic';
    titleHitTargets.push({ x: btnX, y: btnY, w: btnW, h: btnH, action: 'start' });

    // difficulty label (below start button)
    ctx.fillStyle = 'rgba(220,240,255,0.85)';
    ctx.font = '700 14px "Segoe UI", system-ui, sans-serif';
    ctx.fillText('DIFFICULTY', cx, btnY + btnH + 36);

    // 10 cells
    const cellW = 38, cellH = 38, gap = 6;
    const totalW = 10 * cellW + 9 * gap;
    const startX = cx - totalW / 2;
    const cellY = btnY + btnH + 50;
    for (let i = 1; i <= 10; i++) {
      const x = startX + (i - 1) * (cellW + gap);
      const y = cellY;
      const hue = 220 - (i - 1) * 23; // blue → red
      const isSel = i === difficultyLevel;
      const overCell = mouseScreen.active &&
        mouseScreen.x >= x && mouseScreen.x < x + cellW &&
        mouseScreen.y >= y && mouseScreen.y < y + cellH;

      ctx.fillStyle = isSel
        ? `hsla(${hue}, 90%, 50%, 0.95)`
        : (overCell ? `hsla(${hue}, 80%, 35%, 0.6)` : 'rgba(40,50,70,0.55)');
      ctx.fillRect(x, y, cellW, cellH);
      ctx.strokeStyle = isSel ? `hsl(${hue}, 100%, 80%)` : 'rgba(150,170,200,0.4)';
      ctx.lineWidth = isSel ? 2 : 1;
      ctx.strokeRect(x, y, cellW, cellH);

      ctx.fillStyle = isSel ? '#fff' : 'rgba(220,240,255,0.7)';
      ctx.font = '700 15px "Segoe UI", system-ui, sans-serif';
      ctx.textBaseline = 'middle';
      ctx.fillText(`${i}`, x + cellW/2, y + cellH/2);
      ctx.textBaseline = 'alphabetic';

      titleHitTargets.push({ x, y, w: cellW, h: cellH, action: 'diff', value: i });
    }

    // difficulty description
    const descHue = 220 - (difficultyLevel - 1) * 23;
    ctx.shadowColor = `hsla(${descHue}, 90%, 60%, 0.7)`;
    ctx.shadowBlur = 14;
    ctx.fillStyle = `hsl(${descHue}, 90%, 72%)`;
    ctx.font = '700 18px "Segoe UI", system-ui, sans-serif';
    ctx.fillText(`${DIFFICULTY_NAMES[difficultyLevel]}  ×${difficultyFactor().toFixed(2)}`, cx, cellY + cellH + 36);
    ctx.shadowBlur = 0;

    // controls / tips
    ctx.fillStyle = 'rgba(180,200,220,0.6)';
    ctx.font = '500 12px "Segoe UI", system-ui, sans-serif';
    const tips = [
      'WASD / Arrows : 이동       Mouse : 조준       Click / Space : 사격       V : 미사일',
      'E : BEACON 인계           B : SHIPYARD 정비/업그레이드           X : 카고 분리',
    ];
    tips.forEach((t, i) => ctx.fillText(t, cx, cellY + cellH + 76 + i * 18));

    ctx.fillStyle = 'rgba(180,200,220,0.4)';
    ctx.font = '500 11px "Segoe UI", system-ui, sans-serif';
    ctx.fillText('← →   난이도 선택   ·   Enter   시작', cx, cellY + cellH + 124);

    ctx.restore();
  }

  // touch title screen: the same content stacked to fit a phone (tap targets 44 px, text ≥ 12 px)
  const TOUCH_TIPS = ['왼쪽 스틱 : 이동', '오른쪽 스틱 : 조준 + 사격', 'MISSILE : 미사일',
                      'DEPOSIT : BEACON 인계', 'SHOP : SHIPYARD 정비/업그레이드', 'RELEASE : 카고 분리'];
  const tipLines = [];
  let tipLinesW = -1;
  function drawTitleScreenTouch() {
    titleHitTargets.length = 0;
    const W = view.w, H = view.h, cx = W / 2, maxW = W - safe.l - safe.r - 32;
    ctx.save();
    ctx.fillStyle = 'rgba(2, 4, 14, 0.78)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    // title as large as the width (and a short landscape screen) allows
    let tf = Math.min(54, Math.max(26, H * 0.1));
    ctx.font = `900 ${tf}px "Segoe UI", system-ui, sans-serif`;
    const tw = ctx.measureText('ASTEROID BOUNTY HUNTER').width;
    if (tw > maxW) tf = Math.floor(tf * maxW / tw);
    // difficulty cells: one row of 10 when it fits, otherwise two rows of 5
    const cell = 44, perRow = 10 * cell + 9 * 6 <= maxW ? 10 : 5, gap = perRow === 10 ? 6 : 8;
    const rows = 10 / perRow, gridW = perRow * cell + (perRow - 1) * gap, gridH = rows * cell + (rows - 1) * gap;
    // control tips wrapped to the width (recomputed only when the width changes)
    ctx.font = '500 12px "Segoe UI", system-ui, sans-serif';
    if (tipLinesW !== maxW) {
      tipLinesW = maxW; tipLines.length = 0;
      let line = '';
      for (const t of TOUCH_TIPS) {
        const next = line ? line + '      ' + t : t;
        if (line && ctx.measureText(next).width > maxW) { tipLines.push(line); line = t; } else line = next;
      }
      if (line) tipLines.push(line);
      // same number of lines, but evenly filled when that still fits
      const per = Math.ceil(TOUCH_TIPS.length / tipLines.length), even = [];
      for (let i = 0; i < TOUCH_TIPS.length; i += per) even.push(TOUCH_TIPS.slice(i, i + per).join('      '));
      if (even.length === tipLines.length && even.every(l => ctx.measureText(l).width <= maxW)) tipLines.splice(0, tipLines.length, ...even);
    }
    const btnW = 260, btnH = 56;
    const total = tf + 26 + 18 + btnH + 38 + gridH + 58 + tipLines.length * 18 + 8;
    let y = Math.max(safe.t + 8, (H - total) / 2);

    y += tf;
    ctx.shadowColor = 'hsla(195, 100%, 60%, 0.95)';
    ctx.shadowBlur = 32;
    ctx.fillStyle = 'hsl(195, 90%, 78%)';
    ctx.font = `900 ${tf}px "Segoe UI", system-ui, sans-serif`;
    ctx.fillText('ASTEROID BOUNTY HUNTER', cx, y);
    ctx.shadowBlur = 0;
    y += 26;
    ctx.fillStyle = 'rgba(220,240,255,0.65)';
    ctx.font = '500 16px "Segoe UI", system-ui, sans-serif';
    ctx.fillText('Ecosystem of Bounty Hunters', cx, y);
    y += 18;

    // start button
    const btnX = cx - btnW / 2, btnY = y;
    ctx.shadowColor = 'hsla(140, 100%, 55%, 0.9)';
    ctx.shadowBlur = 18;
    ctx.fillStyle = 'hsla(140, 60%, 32%, 0.45)';
    ctx.fillRect(btnX, btnY, btnW, btnH);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'hsl(140, 100%, 70%)';
    ctx.lineWidth = 2;
    ctx.strokeRect(btnX, btnY, btnW, btnH);
    ctx.fillStyle = 'rgba(220,255,235,0.95)';
    ctx.font = '700 22px "Segoe UI", system-ui, sans-serif';
    ctx.textBaseline = 'middle';
    ctx.fillText('START GAME', cx, btnY + btnH / 2);
    ctx.textBaseline = 'alphabetic';
    titleHitTargets.push({ x: btnX, y: btnY, w: btnW, h: btnH, action: 'start' });
    y += btnH + 30;

    // difficulty
    ctx.fillStyle = 'rgba(220,240,255,0.85)';
    ctx.font = '700 14px "Segoe UI", system-ui, sans-serif';
    ctx.fillText('DIFFICULTY', cx, y);
    y += 8;
    const startX = cx - gridW / 2;
    for (let i = 1; i <= 10; i++) {
      const x = startX + ((i - 1) % perRow) * (cell + gap);
      const cy = y + Math.floor((i - 1) / perRow) * (cell + gap);
      const hue = 220 - (i - 1) * 23; // blue → red
      const isSel = i === difficultyLevel;
      ctx.fillStyle = isSel ? `hsla(${hue}, 90%, 50%, 0.95)` : 'rgba(40,50,70,0.55)';
      ctx.fillRect(x, cy, cell, cell);
      ctx.strokeStyle = isSel ? `hsl(${hue}, 100%, 80%)` : 'rgba(150,170,200,0.4)';
      ctx.lineWidth = isSel ? 2 : 1;
      ctx.strokeRect(x, cy, cell, cell);
      ctx.fillStyle = isSel ? '#fff' : 'rgba(220,240,255,0.7)';
      ctx.font = '700 15px "Segoe UI", system-ui, sans-serif';
      ctx.textBaseline = 'middle';
      ctx.fillText(`${i}`, x + cell / 2, cy + cell / 2);
      ctx.textBaseline = 'alphabetic';
      titleHitTargets.push({ x, y: cy, w: cell, h: cell, action: 'diff', value: i });
    }
    y += gridH + 30;

    const descHue = 220 - (difficultyLevel - 1) * 23;
    ctx.shadowColor = `hsla(${descHue}, 90%, 60%, 0.7)`;
    ctx.shadowBlur = 14;
    ctx.fillStyle = `hsl(${descHue}, 90%, 72%)`;
    ctx.font = '700 18px "Segoe UI", system-ui, sans-serif';
    ctx.fillText(`${DIFFICULTY_NAMES[difficultyLevel]}  ×${difficultyFactor().toFixed(2)}`, cx, y);
    ctx.shadowBlur = 0;
    y += 28;

    // touch controls
    ctx.fillStyle = 'rgba(180,200,220,0.6)';
    ctx.font = '500 12px "Segoe UI", system-ui, sans-serif';
    for (const t of tipLines) { ctx.fillText(t, cx, y); y += 18; }
    ctx.fillStyle = 'rgba(180,200,220,0.4)';
    ctx.fillText('난이도 칸을 탭해 선택   ·   START GAME 을 탭해 시작', cx, y + 4);

    ctx.restore();
  }

  // keep the on-screen controls in step with the game state (DOM is only touched when something changes)
  let kitWanted = false;
  function syncTouchUI() {
    const want = touchUI && gameState === 'playing' && !shopOpen;
    if (touchUI && kit) {
      showBtn('missile', !!PLAYER_CLASSES[player.shipClass].canMissile);
      // keep a pressed button until its finger lifts, so the kit sees the release
      if (player.cargo.length > 0 || !kit.pressed('release')) showBtn('release', player.cargo.length > 0);
    }
    if (want !== kitWanted) { kitWanted = want; showKit(want); }
    if (!touchUI) return;
    let act = '';
    if (want && !player.dead) {
      for (const s of shops) if (Math.hypot(s.x - player.x, s.y - player.y) < s.dockRange) { act = 'shop'; break; }
      if (!act && player.cargo.length > 0)
        for (const b of beacons) if (Math.hypot(b.x - player.x, b.y - player.y) < b.dockRange) { act = 'deposit'; break; }
    }
    setAct(act);
  }

  function render() {
    syncTouchUI();
    ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0); // draw in CSS px (touch canvases are backed at up to 1.5×)
    canvas.style.cursor = gameState === 'title' ? 'pointer' : 'none';
    ctx.fillStyle = '#02030a'; ctx.fillRect(0,0,view.w,view.h);
    drawStars();

    ctx.save();
    applyCamera();

    ctx.strokeStyle = 'rgba(255, 80, 120, 0.35)'; ctx.lineWidth = 2;
    ctx.strokeRect(0, 0, WORLD.w, WORLD.h);

    for (const a of asteroids) drawAsteroid(a);
    for (const b of beacons) drawBeacon(b);
    for (const s of shops) drawShopStation(s);
    for (const t of tokens) drawCargoToken(t);

    drawChain(player, 'rgba(120, 220, 255, 0.5)');
    for (const p of pirates) {
      const col = p.type === 'dreadnought' ? 'rgba(255, 140, 140, 0.45)'
                : p.type === 'gunship'    ? 'rgba(255, 180, 130, 0.45)'
                                          : 'rgba(255, 120, 120, 0.4)';
      drawChain(p, col);
    }
    for (const c of player.cargo) drawCargoToken(c);
    for (const p of pirates) for (const c of p.cargo) drawCargoToken(c);

    for (const p of pirates) drawPirate(p);
    for (const m of missiles) drawMissile(m);

    for (const b of bullets) {
      ctx.save();
      const friendly = b.owner === player;
      const hue = friendly ? 195 : 0;
      ctx.shadowColor = `hsla(${hue},100%,70%,1)`; ctx.shadowBlur = 10;
      ctx.fillStyle = `hsla(${hue},100%,75%,1)`;
      ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = `hsla(${hue},100%,80%,0.5)`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx*1.4, b.y - b.vy*1.4); ctx.stroke();
      ctx.restore();
    }

    for (const p of particles) {
      ctx.save();
      ctx.shadowColor = `hsla(${p.hue},100%,70%,${p.life})`; ctx.shadowBlur = 8;
      ctx.fillStyle = `hsla(${p.hue},100%,75%,${p.life})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size*p.life, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }

    if (!player.dead) {
      const blink = player.invuln > 0 ? (Math.floor(player.invuln/4)%2===0) : true;
      if (blink) drawPlayerVisual();
    }

    for (const f of flashes) {
      ctx.save();
      ctx.shadowColor = `hsla(${f.hue},100%,70%,${f.life})`; ctx.shadowBlur = 14;
      ctx.fillStyle = `hsla(${f.hue},100%,80%,${f.life})`;
      ctx.font = view.fFlash;
      ctx.textAlign = 'center';
      ctx.fillText(f.text, f.x, f.y);
      ctx.restore();
    }

    ctx.restore();

    if (gameState === 'playing') {
      drawHUD();
      drawMinimap();
      drawShop();

      if (mouseScreen.active && !(touchUI && shopOpen)) { // touch: the aim marker has no place over the shipyard
        ctx.save();
        const cx = mouseScreen.x, cy = mouseScreen.y;
        ctx.strokeStyle = 'rgba(120,220,255,0.9)'; ctx.lineWidth = 1.5;
        ctx.shadowColor = 'rgba(120,220,255,0.7)'; ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(cx, cy, 9, 0, Math.PI*2);
        ctx.moveTo(cx - 16, cy); ctx.lineTo(cx - 5, cy);
        ctx.moveTo(cx + 5, cy); ctx.lineTo(cx + 16, cy);
        ctx.moveTo(cx, cy - 16); ctx.lineTo(cx, cy - 5);
        ctx.moveTo(cx, cy + 5); ctx.lineTo(cx, cy + 16);
        ctx.stroke();
        ctx.fillStyle = 'rgba(120,220,255,0.9)';
        ctx.fillRect(cx - 1, cy - 1, 2, 2);
        ctx.restore();
      }
    } else if (gameState === 'title') {
      drawTitleScreen();
    }
  }

  // fixed 60 updates per second whatever the display refresh rate (a 120 Hz phone would otherwise run the game
  // at double speed); at 60 Hz this is one update per frame, as before. Catch-up is capped at 4 steps.
  const STEP = 1000 / 60;
  let lastT = -1, acc = 0, steps = 0;
  function loop(now) {
    if (lastT < 0) { lastT = now; acc = STEP; }
    acc += now - lastT; lastT = now;
    if (rotBlocked()) acc = 0;                 // rotate prompt is covering the game: hold the world still
    let n = 0;
    while (acc >= STEP - 1 && n < 4) { update(); steps++; acc -= STEP; n++; }
    if (acc >= STEP) acc = 0;                  // too far behind (tab switch, long stall): drop the rest
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // read-only hook for automated checks (not used by the game)
  window.__abh = {
    get player() { return player; },
    get pirates() { return pirates; },
    get targets() { return { title: titleHitTargets, shop: shopHitTargets }; },
    get info() {
      return { gameState, shopOpen, difficultyLevel, steps, touchUI, zoom: view.zoom, dpr: view.dpr, act: tActKind,
        bullets: bullets.length, myBullets: bullets.filter(b => b.owner === player).length, missiles: missiles.length,
        mouse: mouseScreen.active ? [mouseScreen.x, mouseScreen.y] : null };
    },
  };
})();
</script>
</body>
</html>
