<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no" />
<title>Neon Breakout</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #05060d;
    overflow: hidden;
    font-family: "Segoe UI", "Apple SD Gothic Neo", system-ui, sans-serif;
    color: #e8f4ff;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(ellipse at 30% 0%, rgba(120, 60, 255, 0.18), transparent 60%),
      radial-gradient(ellipse at 80% 100%, rgba(0, 200, 255, 0.18), transparent 60%),
      #05060d;
  }
  canvas {
    background: #07091a;
    border: 1px solid rgba(120, 200, 255, 0.25);
    border-radius: 14px;
    box-shadow:
      0 0 0 1px rgba(120, 200, 255, 0.08) inset,
      0 0 60px rgba(120, 60, 255, 0.25),
      0 0 120px rgba(0, 200, 255, 0.15);
    max-width: 96vw; max-height: 96vh;
    max-height: 96dvh;
    touch-action: none;
  }
  #hint {
    position: fixed; left: 50%; top: 14px;
    transform: translateX(-50%);
    font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
    color: rgba(200, 220, 255, 0.55);
    pointer-events: none; user-select: none;
  }

  /* ---------- mobile / touch ---------- */
  html, body {
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #wrap { touch-action: none; }            /* drag anywhere to move the paddle; no page scroll/zoom */
  #hint .tch { display: none; }
  html.touch #hint .kbd { display: none; }
  html.touch #hint .tch { display: inline; }
  html.touch #hint {
    top: calc(70px + env(safe-area-inset-top));
    width: max-content; max-width: 88vw; text-align: center; line-height: 1.6;
  }
  @media (orientation: landscape) and (max-height: 500px) {
    html.touch #hint { display: none; }    /* landscape phone: no room above the canvas (the start screen shows the touch hint) */
  }
  #pauseBtn {
    display: none; position: fixed; z-index: 5;
    top: calc(10px + env(safe-area-inset-top)); right: calc(10px + env(safe-area-inset-right));
    width: 48px; height: 48px; padding: 0; border-radius: 12px;
    align-items: center; justify-content: center;
    border: 1px solid rgba(120, 200, 255, 0.35);
    background: rgba(7, 9, 26, 0.72); color: #e8f4ff;
    font: 700 17px/1 "Segoe UI", system-ui, sans-serif;
    box-shadow: 0 0 18px rgba(120, 60, 255, 0.25);
    touch-action: none; cursor: pointer;
  }
  html.touch #pauseBtn.on { display: flex; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="900" height="640"></canvas></div>
<div id="hint"><span class="kbd">Move: ← →  /  Mouse &nbsp;·&nbsp; Launch / Shoot: Space · Click &nbsp;·&nbsp; Pause: P</span><span class="tch">Move: Drag &nbsp;·&nbsp; Launch: Tap &nbsp;·&nbsp; Pause: ❚❚</span></div>
<button id="pauseBtn" type="button" aria-label="Pause">❚❚</button>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // ---------- audio ----------
  let actx;
  function beep(freq = 440, dur = 0.06, type = 'square', gain = 0.08) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.value = gain;
      o.connect(g); g.connect(actx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.stop(actx.currentTime + dur);
    } catch (e) {}
  }

  // ---------- state ----------
  const STATE = { READY: 0, PLAYING: 1, PAUSED: 2, OVER: 3, WIN: 4 };
  let state = STATE.READY;

  const BASE_PADDLE_W = 130;
  const PADDLE_W_MAX = 260;
  const paddle = { w: BASE_PADDLE_W, h: 14, x: W/2 - BASE_PADDLE_W/2, y: H - 50, speed: 9, vx: 0 };

  // multi-ball: array of balls
  let balls = [];
  function newBall(stuck = true) {
    return {
      x: paddle.x + paddle.w/2,
      y: paddle.y - 9,
      r: 8,
      vx: 0, vy: 0,
      stuck,
      speed: 7
    };
  }

  const keys = {};
  let mouseX = null;

  let score = 0, lives = 3, level = 1, combo = 0, comboTimer = 0;
  let best = 0;
  try { best = +localStorage.getItem('neon_breakout_best') || 0; } catch (e) {}   // storage may be blocked
  let shakeT = 0, shakeMag = 0;

  // ---------- bricks ----------
  let bricks = [];
  const BRICK_ROWS = 6, BRICK_COLS = 12;
  const BRICK_PAD = 6;
  const BRICK_TOP = 70, BRICK_LEFT = 30;
  function buildBricks() {
    bricks = [];
    const totalW = W - BRICK_LEFT * 2;
    const bw = (totalW - (BRICK_COLS - 1) * BRICK_PAD) / BRICK_COLS;
    const bh = 22;
    const palette = [
      { hue: 320, hp: 1 },
      { hue: 285, hp: 1 },
      { hue: 220, hp: 2 },
      { hue: 190, hp: 2 },
      { hue: 150, hp: 3 },
      { hue: 50,  hp: 3 },
    ];
    for (let r = 0; r < BRICK_ROWS; r++) {
      const p = palette[BRICK_ROWS - 1 - r] || palette[0];
      for (let c = 0; c < BRICK_COLS; c++) {
        bricks.push({
          x: BRICK_LEFT + c * (bw + BRICK_PAD),
          y: BRICK_TOP + r * (bh + BRICK_PAD),
          w: bw, h: bh,
          hue: p.hue, hp: p.hp, maxHp: p.hp,
          alive: true, flash: 0
        });
      }
    }
  }

  // ---------- particles ----------
  const particles = [];
  function burst(x, y, hue, n = 18) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 1 + Math.random() * 4;
      particles.push({
        x, y,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: 1, decay: 0.02 + Math.random() * 0.03,
        size: 2 + Math.random() * 3,
        hue
      });
    }
  }

  // ---------- powerups ----------
  // types: 'expand' | 'bullets' | 'multiball' | 'life'
  const POWER_TYPES = [
    { type: 'expand',    hue: 195, label: '≡',  weight: 28 },
    { type: 'bullets',   hue: 320, label: '▲',  weight: 22 },
    { type: 'multiball', hue: 270, label: '◉',  weight: 22 },
    { type: 'life',      hue: 0,   label: '♥',  weight: 10 },
  ];
  const POWER_DROP_CHANCE = 0.22; // chance per brick destroyed
  const powerups = [];

  function maybeDropPowerup(x, y) {
    if (Math.random() > POWER_DROP_CHANCE) return;
    const total = POWER_TYPES.reduce((s, p) => s + p.weight, 0);
    let r = Math.random() * total;
    let pick = POWER_TYPES[0];
    for (const p of POWER_TYPES) { if (r < p.weight) { pick = p; break; } r -= p.weight; }
    powerups.push({
      x, y, w: 28, h: 18,
      vy: 1.8,
      type: pick.type,
      hue: pick.hue,
      label: pick.label,
      pulse: 0,
      alive: true
    });
  }

  function applyPowerup(p) {
    if (p.type === 'expand') {
      paddle.w = Math.min(PADDLE_W_MAX, paddle.w + 36);
      beep(700, 0.12, 'triangle', 0.1);
      flashText('PADDLE +', p.hue);
    } else if (p.type === 'bullets') {
      fireFanBullets();
      beep(880, 0.1, 'square', 0.09);
      flashText('5-SHOT', p.hue);
    } else if (p.type === 'multiball') {
      // duplicate one of the active (non-stuck) balls, or spawn launched
      const alive = balls.filter(b => !b.stuck);
      const src = alive[0] || balls[0];
      for (let i = 0; i < 2; i++) {
        const angle = -Math.PI/2 + (Math.random() - 0.5) * 1.0;
        const sp = src ? Math.hypot(src.vx, src.vy) || 7 : 7;
        balls.push({
          x: src ? src.x : paddle.x + paddle.w/2,
          y: src ? src.y : paddle.y - 12,
          r: 8,
          vx: Math.cos(angle) * sp,
          vy: Math.sin(angle) * sp,
          stuck: false,
          speed: src ? src.speed : 7
        });
      }
      beep(560, 0.12, 'triangle', 0.1);
      flashText('+2 BALLS', p.hue);
    } else if (p.type === 'life') {
      lives++;
      beep(990, 0.18, 'triangle', 0.12);
      flashText('+1 LIFE', p.hue);
    }
  }

  // ---------- bullets ----------
  const bullets = [];
  function fireFanBullets() {
    const cx = paddle.x + paddle.w/2;
    const cy = paddle.y;
    const spread = Math.PI / 3; // 60 deg total
    const n = 5;
    for (let i = 0; i < n; i++) {
      const t = (i / (n - 1)) - 0.5; // -0.5..0.5
      const angle = -Math.PI/2 + t * spread;
      const sp = 9;
      bullets.push({
        x: cx, y: cy,
        vx: Math.cos(angle) * sp,
        vy: Math.sin(angle) * sp,
        life: 1, alive: true
      });
    }
  }

  // ---------- floating text ----------
  const flashes = [];
  function flashText(text, hue) {
    flashes.push({ text, hue, life: 1, y: H/2 - 80 });
  }

  // ---------- input ----------
  window.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (e.key === ' ' || e.key === 'Spacebar') { launch(); e.preventDefault(); }
    if (e.key === 'p' || e.key === 'P') togglePause();
    if ((state === STATE.OVER || state === STATE.WIN) && (e.key === 'Enter' || e.key === ' ')) reset();
  });
  window.addEventListener('keyup', e => { keys[e.key] = false; });

  canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    mouseX = (e.clientX - rect.left) * (W / rect.width);
  });
  canvas.addEventListener('mouseleave', () => { mouseX = null; });
  canvas.addEventListener('mousedown', () => {
    if (state === STATE.OVER || state === STATE.WIN) { reset(); return; }
    if (state === STATE.READY) state = STATE.PLAYING;
    launch();
  });

  // ---------- touch (phones / tablets) ----------
  // Touch anywhere on the screen: start / launch / restart / resume. Slide a finger sideways anywhere and the
  // paddle follows the finger's movement (relative, like a trackpad), so the thumb never has to cover the ball.
  // Mouse input keeps using the canvas handlers above.
  const wrap = document.getElementById('wrap');
  const pauseBtn = document.getElementById('pauseBtn');
  let touchUi = false;                 // touch prompts + pause button (html.touch)
  function setTouchUi(on) {
    if (touchUi === on) return;
    touchUi = on;
    document.documentElement.classList.toggle('touch', on);
  }
  setTouchUi(matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0);
  addEventListener('pointerdown', e => setTouchUi(e.pointerType !== 'mouse'), true);
  addEventListener('pointermove', e => {
    if (touchUi && e.pointerType === 'mouse' && (e.movementX || e.movementY)) setTouchUi(false);
  }, true);

  function wakeAudio() {               // mobile browsers only start audio from a touch
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') { const p = actx.resume(); if (p && p.catch) p.catch(() => {}); }
    } catch (e) {}
  }
  function touchAction() {             // same as a click, plus: a touch while paused resumes
    if (state === STATE.OVER || state === STATE.WIN) { reset(); return; }
    if (state === STATE.PAUSED) { togglePause(); return; }
    if (state === STATE.READY) state = STATE.PLAYING;
    launch();
  }
  const touchPts = new Map();          // pointerId -> last clientX
  let dragId = null, dragX = 0;        // finger that steers, paddle-centre target (canvas px)
  wrap.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse') return;
    e.preventDefault();
    wakeAudio();
    touchAction();
    touchPts.set(e.pointerId, e.clientX);
    try { wrap.setPointerCapture(e.pointerId); } catch (x) {}
    if (dragId === null) { dragId = e.pointerId; dragX = paddle.x + paddle.w / 2; mouseX = dragX; }
  });
  wrap.addEventListener('pointermove', e => {
    if (!touchPts.has(e.pointerId)) return;
    e.preventDefault();
    const last = touchPts.get(e.pointerId);
    touchPts.set(e.pointerId, e.clientX);
    if (e.pointerId !== dragId) return;
    if (state !== STATE.PLAYING) { dragX = paddle.x + paddle.w / 2; mouseX = dragX; return; }
    // screen px -> canvas px; about 320 px of finger travel crosses the whole field on small screens
    const k = (W / canvasCssW) * Math.max(1, Math.min(1.8, canvasCssW / 320));
    const half = paddle.w / 2;
    dragX = Math.max(8 + half, Math.min(W - 8 - half, dragX + (e.clientX - last) * k));
    mouseX = dragX;
  });
  const touchEnd = e => {
    if (!touchPts.delete(e.pointerId)) return;
    if (e.type === 'pointerup') wakeAudio();
    if (e.pointerId === dragId) {      // another finger still down takes over steering
      dragId = touchPts.size ? touchPts.keys().next().value : null;
      dragX = paddle.x + paddle.w / 2; if (dragId !== null) mouseX = dragX;
    }
  };
  wrap.addEventListener('pointerup', touchEnd);
  wrap.addEventListener('pointercancel', touchEnd);
  wrap.addEventListener('contextmenu', e => { if (touchUi) e.preventDefault(); });
  document.addEventListener('gesturestart', e => e.preventDefault());
  pauseBtn.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); wakeAudio(); togglePause(); });
  pauseBtn.addEventListener('contextmenu', e => e.preventDefault());
  let uiState = -1;
  function syncTouchUi() {             // pause button only while pausable; touches the DOM only on change
    if (state === uiState) return;
    uiState = state;
    pauseBtn.classList.toggle('on', state === STATE.PLAYING || state === STATE.PAUSED);
    pauseBtn.textContent = state === STATE.PAUSED ? '▶' : '❚❚';
    pauseBtn.setAttribute('aria-label', state === STATE.PAUSED ? 'Resume' : 'Pause');
  }

  // Canvas text is drawn at the canvas' own 900x640 scale; when the canvas is shown smaller (phones) the
  // fonts grow so on-screen text stays >= ~12.5 CSS px. At full size (desktop) every font is unchanged.
  const FONT = '"Segoe UI", system-ui, sans-serif';
  const F = {};
  let canvasCssW = W;
  function fitText() {
    canvasCssW = canvas.getBoundingClientRect().width || W;
    const min = 12.5 * W / canvasCssW;
    const f = px => Math.round(Math.max(px, min) * 10) / 10;
    F.big = f(18) > 18;
    F.hudPx = f(18);
    F.hud = `600 ${f(18)}px ${FONT}`;
    F.combo = `700 ${f(22)}px ${FONT}`;
    F.flash = `800 ${f(28)}px ${FONT}`;
    F.title = `800 ${f(56)}px ${FONT}`;
    F.sub = `500 ${f(18)}px ${FONT}`;
    F.legend = `500 ${f(14)}px ${FONT}`;
  }
  fitText();
  addEventListener('resize', fitText);

  function launch() {
    let launched = false;
    for (const b of balls) {
      if (b.stuck) {
        const angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.6;
        b.vx = Math.cos(angle) * b.speed;
        b.vy = Math.sin(angle) * b.speed;
        b.stuck = false;
        launched = true;
      }
    }
    if (launched) beep(660, 0.08, 'triangle', 0.1);
  }
  function togglePause() {
    if (state === STATE.PLAYING) state = STATE.PAUSED;
    else if (state === STATE.PAUSED) state = STATE.PLAYING;
  }

  function reset(full = true) {
    if (full) { score = 0; lives = 3; level = 1; }
    buildBricks();
    paddle.w = BASE_PADDLE_W;
    paddle.x = W/2 - paddle.w/2;
    balls = [newBall(true)];
    balls[0].speed = 7 + (level - 1) * 0.5;
    powerups.length = 0;
    bullets.length = 0;
    state = STATE.READY;
  }

  reset();

  // ---------- update ----------
  function update() {
    if (state !== STATE.PLAYING) return;

    // paddle
    paddle.vx = 0;
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) paddle.vx -= paddle.speed;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) paddle.vx += paddle.speed;
    paddle.x += paddle.vx;
    if (mouseX !== null) {
      const target = mouseX - paddle.w/2;
      paddle.x += (target - paddle.x) * 0.35;
    }
    paddle.x = Math.max(8, Math.min(W - paddle.w - 8, paddle.x));

    // balls
    for (let bi = balls.length - 1; bi >= 0; bi--) {
      const ball = balls[bi];
      if (ball.stuck) {
        ball.x = paddle.x + paddle.w/2;
        ball.y = paddle.y - ball.r - 1;
        continue;
      }
      ball.x += ball.vx;
      ball.y += ball.vy;

      // walls
      if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx *= -1; beep(300, 0.04, 'square', 0.04); }
      if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx *= -1; beep(300, 0.04, 'square', 0.04); }
      if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy *= -1; beep(300, 0.04, 'square', 0.04); }

      // paddle collide
      if (ball.vy > 0 &&
          ball.x > paddle.x && ball.x < paddle.x + paddle.w &&
          ball.y + ball.r > paddle.y && ball.y - ball.r < paddle.y + paddle.h) {
        const t = (ball.x - (paddle.x + paddle.w/2)) / (paddle.w/2);
        const angle = -Math.PI/2 + t * (Math.PI/3);
        const sp = Math.hypot(ball.vx, ball.vy);
        ball.vx = Math.cos(angle) * sp;
        ball.vy = Math.sin(angle) * sp;
        ball.y = paddle.y - ball.r - 1;
        combo = 0;
        beep(520, 0.06, 'square', 0.07);
      }

      // bottom
      if (ball.y - ball.r > H) {
        balls.splice(bi, 1);
        continue;
      }

      // brick collide
      for (const b of bricks) {
        if (!b.alive) continue;
        if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w &&
            ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {
          const overlapL = (ball.x + ball.r) - b.x;
          const overlapR = (b.x + b.w) - (ball.x - ball.r);
          const overlapT = (ball.y + ball.r) - b.y;
          const overlapB = (b.y + b.h) - (ball.y - ball.r);
          const minX = Math.min(overlapL, overlapR);
          const minY = Math.min(overlapT, overlapB);
          if (minX < minY) ball.vx *= -1; else ball.vy *= -1;

          hitBrick(b, ball.x, ball.y);
          break;
        }
      }
    }

    // if no balls left -> lose a life
    if (balls.length === 0) {
      lives--;
      shake(10, 18);
      beep(120, 0.3, 'sawtooth', 0.1);
      if (lives <= 0) {
        state = STATE.OVER;
        best = Math.max(best, score);
        try { localStorage.setItem('neon_breakout_best', best); } catch (e) {}
      } else {
        // reset paddle width when a life is lost (penalty)
        paddle.w = BASE_PADDLE_W;
        paddle.x = Math.min(W - paddle.w - 8, Math.max(8, paddle.x));
        balls = [newBall(true)];
        balls[0].speed = 7 + (level - 1) * 0.5;
        state = STATE.READY;
      }
    }

    // bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
      const bu = bullets[i];
      bu.x += bu.vx; bu.y += bu.vy;
      if (bu.y < -10 || bu.x < -10 || bu.x > W + 10) { bullets.splice(i, 1); continue; }
      // check brick hits
      for (const b of bricks) {
        if (!b.alive) continue;
        if (bu.x > b.x && bu.x < b.x + b.w && bu.y > b.y && bu.y < b.y + b.h) {
          hitBrick(b, bu.x, bu.y);
          bullets.splice(i, 1);
          break;
        }
      }
    }

    // powerups fall
    for (let i = powerups.length - 1; i >= 0; i--) {
      const p = powerups[i];
      p.y += p.vy;
      p.pulse += 0.15;
      if (p.y > H + 30) { powerups.splice(i, 1); continue; }
      // catch with paddle
      if (p.y + p.h > paddle.y && p.y < paddle.y + paddle.h &&
          p.x + p.w > paddle.x && p.x < paddle.x + paddle.w) {
        applyPowerup(p);
        burst(p.x + p.w/2, p.y + p.h/2, p.hue, 16);
        powerups.splice(i, 1);
      }
    }

    // win check
    if (bricks.every(b => !b.alive)) {
      level++;
      beep(900, 0.2, 'triangle', 0.12);
      if (level > 5) {
        state = STATE.WIN;
        best = Math.max(best, score);
        try { localStorage.setItem('neon_breakout_best', best); } catch (e) {}
      } else {
        reset(false);
      }
    }

    // particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy;
      p.vy += 0.06;
      p.vx *= 0.99;
      p.life -= p.decay;
      if (p.life <= 0) particles.splice(i, 1);
    }

    // flashes
    for (let i = flashes.length - 1; i >= 0; i--) {
      const f = flashes[i];
      f.life -= 0.012;
      f.y -= 0.6;
      if (f.life <= 0) flashes.splice(i, 1);
    }

    // brick flash decay
    for (const b of bricks) if (b.flash > 0) b.flash = Math.max(0, b.flash - 0.08);

    if (comboTimer > 0) comboTimer--;
    else combo = 0;

    if (shakeT > 0) shakeT--;
  }

  function hitBrick(b, hx, hy) {
    b.hp--;
    b.flash = 1;
    if (b.hp <= 0) {
      b.alive = false;
      burst(b.x + b.w/2, b.y + b.h/2, b.hue, 22);
      combo++;
      comboTimer = 60;
      const gain = 10 * b.maxHp + combo * 2;
      score += gain;
      shake(4, 5);
      beep(440 + b.maxHp * 80 + combo * 10, 0.07, 'triangle', 0.09);
      maybeDropPowerup(b.x + b.w/2 - 14, b.y + b.h/2);
    } else {
      burst(hx, hy, b.hue, 6);
      beep(700, 0.04, 'square', 0.05);
    }
  }

  function shake(t, m) { shakeT = Math.max(shakeT, t); shakeMag = m; }

  // ---------- render ----------
  function drawGlowRect(x, y, w, h, hue, alpha = 1, glow = 14) {
    ctx.save();
    ctx.shadowColor = `hsla(${hue},100%,65%,${0.9 * alpha})`;
    ctx.shadowBlur = glow;
    ctx.fillStyle = `hsla(${hue},90%,60%,${alpha})`;
    ctx.fillRect(x, y, w, h);
    ctx.restore();
  }

  function render() {
    ctx.save();
    if (shakeT > 0) {
      ctx.translate((Math.random() - 0.5) * shakeMag, (Math.random() - 0.5) * shakeMag);
    }
    ctx.fillStyle = 'rgba(7,9,26,0.6)';
    ctx.fillRect(0, 0, W, H);

    // grid
    ctx.strokeStyle = 'rgba(80,140,220,0.06)';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 40) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += 40) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    // bricks
    for (const b of bricks) {
      if (!b.alive) continue;
      const a = 0.55 + 0.15 * (b.hp / b.maxHp);
      drawGlowRect(b.x, b.y, b.w, b.h, b.hue, a, 12);
      ctx.fillStyle = `hsla(${b.hue},100%,85%,${0.25 + b.flash * 0.7})`;
      ctx.fillRect(b.x + 2, b.y + 2, b.w - 4, 4);
      if (b.maxHp > 1) {
        ctx.fillStyle = `hsla(${b.hue},100%,90%,0.85)`;
        for (let i = 0; i < b.hp; i++) {
          ctx.fillRect(b.x + b.w - 6 - i * 5, b.y + b.h - 6, 3, 3);
        }
      }
    }

    // powerups
    for (const p of powerups) {
      const pulse = 0.5 + 0.5 * Math.sin(p.pulse);
      ctx.save();
      ctx.shadowColor = `hsla(${p.hue},100%,70%,${0.8 + 0.2 * pulse})`;
      ctx.shadowBlur = 16 + pulse * 8;
      // pill
      ctx.fillStyle = `hsla(${p.hue},90%,55%,0.9)`;
      const r = 6;
      ctx.beginPath();
      ctx.moveTo(p.x + r, p.y);
      ctx.lineTo(p.x + p.w - r, p.y);
      ctx.quadraticCurveTo(p.x + p.w, p.y, p.x + p.w, p.y + r);
      ctx.lineTo(p.x + p.w, p.y + p.h - r);
      ctx.quadraticCurveTo(p.x + p.w, p.y + p.h, p.x + p.w - r, p.y + p.h);
      ctx.lineTo(p.x + r, p.y + p.h);
      ctx.quadraticCurveTo(p.x, p.y + p.h, p.x, p.y + p.h - r);
      ctx.lineTo(p.x, p.y + r);
      ctx.quadraticCurveTo(p.x, p.y, p.x + r, p.y);
      ctx.fill();
      // label
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#0b0d1a';
      ctx.font = '700 13px "Segoe UI", system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.label, p.x + p.w/2, p.y + p.h/2 + 1);
      ctx.restore();
    }

    // particles
    for (const p of particles) {
      ctx.save();
      ctx.shadowColor = `hsla(${p.hue},100%,70%,${p.life})`;
      ctx.shadowBlur = 10;
      ctx.fillStyle = `hsla(${p.hue},100%,75%,${p.life})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // bullets
    for (const bu of bullets) {
      ctx.save();
      ctx.shadowColor = 'hsla(320,100%,70%,1)';
      ctx.shadowBlur = 14;
      ctx.fillStyle = 'hsla(320,100%,75%,1)';
      ctx.beginPath();
      ctx.arc(bu.x, bu.y, 3.5, 0, Math.PI * 2);
      ctx.fill();
      // streak
      ctx.strokeStyle = 'hsla(320,100%,80%,0.6)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(bu.x, bu.y);
      ctx.lineTo(bu.x - bu.vx * 1.5, bu.y - bu.vy * 1.5);
      ctx.stroke();
      ctx.restore();
    }

    // paddle
    drawGlowRect(paddle.x, paddle.y, paddle.w, paddle.h, 195, 1, 22);
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fillRect(paddle.x + 4, paddle.y + 2, paddle.w - 8, 3);

    // balls
    for (const ball of balls) {
      ctx.save();
      ctx.shadowColor = 'rgba(255,255,255,0.9)';
      ctx.shadowBlur = 24;
      const grad = ctx.createRadialGradient(ball.x, ball.y, 0, ball.x, ball.y, ball.r);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(1, 'hsl(190,100%,65%)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    ctx.restore(); // shake

    // HUD
    ctx.save();
    ctx.fillStyle = 'rgba(220,240,255,0.85)';
    ctx.font = F.hud;
    ctx.textBaseline = 'top';
    const sScore = `SCORE  ${score}`, sLevel = `LEVEL  ${level}/5`;
    const sBest = `BEST  ${best}`, sLives = `LIVES  ${'♥ '.repeat(Math.max(0,lives))}`;
    let levelX = 200, livesX = W - 200;
    if (F.big) {
      // enlarged text (small screens): pack the four items from both edges, shrink a little if they still collide
      let ws = ctx.measureText(sScore).width, wl = ctx.measureText(sLevel).width;
      let wb = ctx.measureText(sBest).width, wv = ctx.measureText(sLives).width;
      const room = W - 40 - 3 * 24, need = ws + wl + wb + wv;
      if (need > room) {
        const k = room / need;
        ctx.font = `600 ${F.hudPx * k}px ${FONT}`;
        ws *= k; wb *= k;
      }
      levelX = 20 + ws + 24;
      livesX = W - 20 - wb - 24;
    }
    ctx.fillText(sScore, 20, 18);
    ctx.fillText(sLevel, levelX, 18);
    ctx.textAlign = 'right';
    ctx.fillText(sBest, W - 20, 18);
    ctx.fillText(sLives, livesX, 18);
    ctx.textAlign = 'left';

    if (combo > 1) {
      ctx.fillStyle = `hsla(${(combo*30)%360},100%,70%,${comboTimer/60})`;
      ctx.font = F.combo;
      ctx.textAlign = 'center';
      ctx.fillText(`x${combo} COMBO!`, W/2, 44);
      ctx.textAlign = 'left';
    }

    // floating flashes
    for (const f of flashes) {
      ctx.save();
      ctx.textAlign = 'center';
      ctx.shadowColor = `hsla(${f.hue},100%,70%,${f.life})`;
      ctx.shadowBlur = 18;
      ctx.fillStyle = `hsla(${f.hue},100%,80%,${f.life})`;
      ctx.font = F.flash;
      ctx.fillText(f.text, W/2, f.y);
      ctx.restore();
    }

    // touch devices get tap/drag wording in the prompts
    if (state === STATE.READY) overlay('NEON BREAKOUT', touchUi ? 'Tap 으로 시작 · 드래그로 이동' : 'Click / Space 로 시작', false);
    else if (state === STATE.PAUSED) overlay('PAUSED', touchUi ? 'Tap 으로 다시 시작' : 'P 로 다시 시작', true);
    else if (state === STATE.OVER) overlay('GAME OVER', `최종 점수 ${score} · ${touchUi ? 'Tap 으로' : 'Enter 로'} 재시작`, true);
    else if (state === STATE.WIN) overlay('YOU WIN', `점수 ${score} · ${touchUi ? 'Tap 으로' : 'Enter 로'} 재도전`, true);

    ctx.restore();
  }

  function overlay(title, sub, dim) {
    if (dim) {
      ctx.fillStyle = 'rgba(5,6,13,0.55)';
      ctx.fillRect(0, 0, W, H);
    }
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(120,200,255,0.7)';
    ctx.shadowBlur = 24;
    ctx.fillStyle = '#eaf6ff';
    ctx.font = F.title;
    ctx.fillText(title, W/2, H/2 - 50);
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(220,240,255,0.85)';
    ctx.font = F.sub;
    ctx.fillText(sub, W/2, H/2 + 6);

    // legend for powerups
    if (state === STATE.READY) {
      ctx.font = F.legend;
      ctx.fillStyle = 'rgba(220,240,255,0.7)';
      ctx.fillText('아이템: ≡ 패들확장 · ▲ 5연발 · ◉ 멀티볼 · ♥ 라이프', W/2, H/2 + 44);
    }
    ctx.textAlign = 'left';
  }

  // ---------- loop ----------
  // Fixed timestep: the game logic is frame-based, so update() runs 60 times per second whatever the display
  // refresh rate (120/144 Hz phones would otherwise run at 2x+ speed). At 60 Hz this is one update + one render
  // per frame, exactly as before. Catch-up is capped at 4 steps (the rest is dropped, e.g. after a background tab),
  // and a frame is only redrawn when the game advanced (same picture/trails as at 60 Hz, half the work at 120 Hz).
  const STEP = 1000 / 60;
  let acc = 0, lastT = -1, stepCount = 0, drawCount = 0;
  function loop(t) {
    let n = 0;
    if (t === undefined || lastT < 0) { update(); n = 1; }
    else {
      acc += Math.min(t - lastT, 250);
      while (acc > STEP - 2 && n < 4) { update(); acc -= STEP; n++; }   // 2 ms slack absorbs 60 Hz jitter
      if (acc > STEP) acc = 0;
    }
    if (t !== undefined) lastT = t;
    stepCount += n;
    if (n) { render(); drawCount++; }
    syncTouchUi();
    requestAnimationFrame(loop);
  }
  loop();

  // read-only state for automated tests (no effect on the game)
  window.__mg = { get s() {
    return { state, score, lives, level, best, paddleX: paddle.x, paddleW: paddle.w, mouseX, dragX, dragId,
      balls: balls.map(b => ({ x: b.x, y: b.y, vx: b.vx, vy: b.vy, stuck: b.stuck })),
      bricks: bricks.filter(b => b.alive).length, touchUi, steps: stepCount, draws: drawCount,
      hudFont: F.hud, canvasCssW, audio: actx ? actx.state : 'none' };
  } };
})();
</script>
</body>
</html>
