<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>SDF Physics Lab</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #080a0f;
      color: #edf2ff;
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #080a0f;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      cursor: grab;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #overlayCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      pointer-events: none;
    }

    canvas.dragging {
      cursor: grabbing;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 7px;
      color: #f8fafc;
      background: rgba(255, 255, 255, 0.07);
      cursor: pointer;
      transition: border-color 140ms ease, background 140ms ease, transform 140ms ease;
    }

    /* 터치 기기에서는 탭한 버튼에 hover 색이 남지 않도록 실제 hover가 있는 기기에서만 적용 */
    @media (hover: hover) {
      button:hover {
        border-color: rgba(94, 234, 212, 0.58);
        background: rgba(94, 234, 212, 0.13);
      }
    }

    button:active {
      transform: translateY(1px);
    }

    button.active {
      border-color: rgba(94, 234, 212, 0.9);
      background: rgba(94, 234, 212, 0.19);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .panel {
      position: fixed;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      background: rgba(9, 13, 22, 0.80);
      box-shadow: 0 18px 54px rgba(0, 0, 0, 0.36);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      user-select: none;
      overscroll-behavior: contain;
      touch-action: manipulation;
    }

    .left-panel {
      top: 16px;
      left: 16px;
      width: min(370px, calc(100vw - 32px));
      max-height: calc(100vh - 32px);
      overflow: auto;
      padding: 15px 16px 16px;
    }

    .right-panel {
      top: 16px;
      right: 16px;
      width: min(330px, calc(100vw - 32px));
      max-height: calc(100vh - 32px);
      overflow: auto;
      padding: 15px 16px 16px;
    }

    .status {
      left: 50%;
      bottom: 16px;
      display: flex;
      gap: 12px;
      align-items: center;
      min-height: 38px;
      padding: 8px 12px;
      transform: translateX(-50%);
      color: #dbeafe;
      font-size: 12px;
      white-space: nowrap;
    }

    h1,
    h2 {
      margin: 0;
      letter-spacing: 0;
      line-height: 1.2;
    }

    h1 {
      font-size: 17px;
      font-weight: 780;
    }

    h2 {
      margin-top: 17px;
      margin-bottom: 8px;
      color: #f8fafc;
      font-size: 12px;
      font-weight: 760;
      text-transform: uppercase;
    }

    p {
      margin: 0;
      color: #cbd5e1;
      font-size: 12px;
      line-height: 1.52;
    }

    .tool-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .tool-grid button,
    .action-row button {
      min-height: 38px;
      padding: 7px 8px;
      font-size: 12px;
      font-weight: 700;
    }

    .action-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    .material-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(58px, 1fr));
      gap: 7px;
    }

    .material-row button {
      min-height: 34px;
      padding: 6px 4px;
      font-size: 11px;
      font-weight: 720;
    }

    .swatch {
      display: block;
      width: 16px;
      height: 16px;
      margin: 0 auto 4px;
      border-radius: 999px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.28);
    }

    .object-list {
      display: grid;
      gap: 6px;
      max-height: 160px;
      overflow: auto;
      padding-right: 2px;
    }

    .object-row {
      display: grid;
      grid-template-columns: 14px 1fr auto;
      gap: 7px;
      align-items: center;
      width: 100%;
      min-height: 32px;
      padding: 6px 7px;
      text-align: left;
    }

    .object-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      box-shadow: 0 0 12px currentColor;
    }

    .object-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 680;
    }

    .object-speed {
      color: #aab7cc;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .control {
      display: grid;
      grid-template-columns: 88px minmax(0, 1fr) 54px;
      gap: 9px;
      align-items: center;
      margin-top: 9px;
    }

    .control label {
      color: #f8fafc;
      font-size: 12px;
      font-weight: 680;
      white-space: nowrap;
    }

    output,
    .readout {
      color: #c2cce0;
      font-size: 12px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #5eead4;
    }

    .select-row {
      display: grid;
      grid-template-columns: 86px 1fr;
      gap: 9px;
      align-items: center;
      margin-top: 9px;
    }

    .select-row label {
      color: #f8fafc;
      font-size: 12px;
      font-weight: 680;
    }

    select {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 7px;
      padding: 7px 8px;
      color: #f8fafc;
      background: rgba(255, 255, 255, 0.08);
    }

    .empty {
      display: grid;
      min-height: 104px;
      place-items: center;
      color: #aab7cc;
      font-size: 12px;
      line-height: 1.45;
      text-align: center;
    }

    .inspector-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 3px 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      color: #b7c3d8;
      font-size: 11px;
      font-weight: 700;
    }

    .error {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 24px;
      color: #fff;
      background: #130f18;
      text-align: center;
      font: 650 16px/1.5 system-ui, sans-serif;
      z-index: 20;
    }

    /* ---- 모바일 대응: 하단 독, 시트형 패널, 터치 안내 ---- */
    .dock,
    .sheet-close,
    .touch-help {
      display: none;
    }

    .touch-hint {
      position: fixed;
      left: 50%;
      top: calc(16px + env(safe-area-inset-top));
      z-index: 8;
      width: max-content;
      max-width: min(420px, calc(100vw - 32px));
      padding: 9px 14px;
      border: 1px solid rgba(94, 234, 212, 0.38);
      border-radius: 8px;
      color: #e2f7f3;
      background: rgba(9, 13, 22, 0.88);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      font-size: 12px;
      line-height: 1.55;
      text-align: center;
      word-break: keep-all;
      transform: translateX(-50%);
      transition: opacity 400ms ease;
      touch-action: manipulation;
    }

    .touch-hint.fade {
      opacity: 0;
    }

    /* 손가락용: 누르는 곳은 최소 44px, 글자는 최소 12px */
    @media (pointer: coarse) {
      body {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }

      .tool-grid button,
      .action-row button,
      .material-row button,
      .object-row,
      select {
        min-height: 44px;
      }

      input[type="range"] {
        height: 44px;
        margin: 0;
      }

      .control {
        margin-top: 4px;
      }

      .material-row button,
      .object-speed,
      .pill {
        font-size: 12px;
      }

      .touch-help {
        display: block;
        margin-top: 6px;
        color: #9fb1c8;
        word-break: keep-all;
      }
    }

    /* 좁은 화면(휴대폰 세로·가로): 자주 쓰는 버튼은 하단 독에 두고, 패널은 필요할 때만 여는 시트로 바꾼다 */
    @media (max-width: 840px), (max-height: 540px) {
      :root {
        --dock-h: 108px;
      }

      .dock {
        left: calc(8px + env(safe-area-inset-left));
        right: calc(8px + env(safe-area-inset-right));
        bottom: calc(8px + env(safe-area-inset-bottom));
        z-index: 6;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 6px;
      }

      .dock-row {
        display: flex;
        gap: 6px;
      }

      .dock button {
        flex: 1 1 0;
        min-width: 0;
        height: 44px;
        padding: 0 4px;
        overflow: hidden;
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .dock .sheet-toggle {
        border-color: rgba(94, 234, 212, 0.34);
      }

      .dock .sheet-toggle.active {
        border-color: rgba(94, 234, 212, 0.9);
      }

      .left-panel,
      .right-panel {
        display: none;
        z-index: 7;
        padding: 12px 14px 14px;
      }

      body[data-sheet="tools"] .left-panel,
      body[data-sheet="inspector"] .right-panel {
        display: block;
      }

      .sheet-close {
        display: grid;
        place-items: center;
        float: right;
        width: 44px;
        height: 44px;
        margin: -4px -4px 4px 8px;
        padding: 0;
        font-size: 18px;
        line-height: 1;
      }

      .inspector-title {
        min-height: 40px;
      }

      .spawn-heading,
      .left-panel .tool-grid,
      .world-actions {
        display: none;
      }

      .object-list {
        max-height: none;
        overflow: visible;
      }

      .status {
        top: calc(8px + env(safe-area-inset-top));
        bottom: auto;
        z-index: 5;
        min-height: 32px;
        max-width: calc(100vw - 16px);
        padding: 6px 12px;
        overflow: hidden;
      }

      .touch-hint {
        top: calc(50px + env(safe-area-inset-top));
      }

      @media (orientation: portrait) {
        .left-panel,
        .right-panel {
          top: auto;
          left: calc(8px + env(safe-area-inset-left));
          right: calc(8px + env(safe-area-inset-right));
          bottom: calc(var(--dock-h) + 16px + env(safe-area-inset-bottom));
          width: auto;
          max-height: min(56vh, calc(100% - var(--dock-h) - 72px - env(safe-area-inset-top) - env(safe-area-inset-bottom)));
        }
      }

      @media (orientation: landscape) {
        .left-panel,
        .right-panel {
          top: calc(8px + env(safe-area-inset-top));
          bottom: calc(var(--dock-h) + 16px + env(safe-area-inset-bottom));
          max-height: none;
        }

        .left-panel {
          left: calc(8px + env(safe-area-inset-left));
          right: auto;
          width: min(360px, calc(50vw - 16px));
        }

        .right-panel {
          left: auto;
          right: calc(8px + env(safe-area-inset-right));
          width: min(330px, calc(50vw - 16px));
        }

        body[data-sheet="tools"] .status {
          left: auto;
          right: calc(8px + env(safe-area-inset-right));
          transform: none;
        }

        body[data-sheet="inspector"] .status {
          left: calc(8px + env(safe-area-inset-left));
          transform: none;
        }
      }

      @media (min-width: 680px) {
        :root {
          --dock-h: 58px;
        }

        .dock {
          flex-direction: row;
        }

        .dock-row {
          flex: 6 1 0;
        }

        .dock-row + .dock-row {
          flex: 5 1 0;
        }
      }
    }
  </style>
</head>
<body>
  <canvas id="glCanvas" aria-label="SDF physics lab canvas"></canvas>
  <canvas id="overlayCanvas" aria-hidden="true"></canvas>

  <section class="panel left-panel" id="toolsPanel" aria-label="world tools">
    <button class="sheet-close" type="button" aria-label="닫기">✕</button>
    <h1>SDF Physics Lab</h1>
    <p class="touch-help">물체를 끌면 이동 · 빈 곳을 끌면 시점 회전 · 물체를 잡은 채 두 손가락을 벌리거나 오므리면 앞뒤로 이동</p>

    <h2 class="spawn-heading">생성</h2>
    <div class="tool-grid">
      <button id="addSphere" type="button">구</button>
      <button id="addBox" type="button">박스</button>
      <button id="addTorus" type="button">토러스</button>
      <button id="addBomb" type="button">폭탄</button>
      <button id="addLiquid" type="button">액체</button>
      <button id="pulseWorld" type="button">충격파</button>
    </div>

    <h2>재질</h2>
    <div class="material-row" id="materialButtons"></div>

    <h2>세계</h2>
    <div class="control">
      <label for="gravity">중력</label>
      <input id="gravity" type="range" min="-18" max="3" step="0.1" value="-9.8">
      <output id="gravityValue" for="gravity">-9.8</output>
    </div>
    <div class="control">
      <label for="timeScale">시간</label>
      <input id="timeScale" type="range" min="0.1" max="1.8" step="0.05" value="1">
      <output id="timeScaleValue" for="timeScale">1.00</output>
    </div>
    <div class="control">
      <label for="blend">SDF blend</label>
      <input id="blend" type="range" min="0" max="0.42" step="0.01" value="0.04">
      <output id="blendValue" for="blend">0.04</output>
    </div>
    <div class="control">
      <label for="steps">max steps</label>
      <input id="steps" type="range" min="48" max="180" step="1" value="112">
      <output id="stepsValue" for="steps">112</output>
    </div>
    <div class="control">
      <label for="epsilon">epsilon</label>
      <input id="epsilon" type="range" min="0.0008" max="0.014" step="0.0004" value="0.0028">
      <output id="epsilonValue" for="epsilon">0.0028</output>
    </div>

    <div class="action-row world-actions">
      <button id="togglePause" type="button">일시정지</button>
      <button id="dropStack" type="button">쌓기</button>
      <button id="resetWorld" type="button">초기화</button>
    </div>

    <h2>오브젝트</h2>
    <div class="object-list" id="objectList"></div>
  </section>

  <section class="panel right-panel" id="inspectorPanel" aria-label="selected object inspector">
    <button class="sheet-close" type="button" aria-label="닫기">✕</button>
    <div class="inspector-title">
      <h1 id="selectedTitle">선택 없음</h1>
      <span class="pill" id="objectCount">0 / 24</span>
    </div>

    <div id="emptyInspector" class="empty">선택 없음</div>

    <div id="inspector" hidden>
      <div class="select-row">
        <label for="shapeSelect">형태</label>
        <select id="shapeSelect">
          <option value="sphere">구</option>
          <option value="box">박스</option>
          <option value="torus">토러스</option>
        </select>
      </div>
      <div class="select-row">
        <label for="materialSelect">재질</label>
        <select id="materialSelect"></select>
      </div>

      <h2>물리값</h2>
      <div class="control">
        <label for="size">크기</label>
        <input id="size" type="range" min="0.22" max="0.92" step="0.01" value="0.5">
        <output id="sizeValue" for="size">0.50</output>
      </div>
      <div class="control">
        <label for="mass">질량</label>
        <input id="mass" type="range" min="0.2" max="6" step="0.1" value="1">
        <output id="massValue" for="mass">1.0</output>
      </div>
      <div class="control">
        <label for="bounce">탄성</label>
        <input id="bounce" type="range" min="0" max="1" step="0.01" value="0.5">
        <output id="bounceValue" for="bounce">0.50</output>
      </div>
      <div class="control">
        <label for="friction">마찰</label>
        <input id="friction" type="range" min="0" max="1" step="0.01" value="0.4">
        <output id="frictionValue" for="friction">0.40</output>
      </div>

      <h2>동작</h2>
      <div class="action-row">
        <button id="kickObject" type="button">밀기</button>
        <button id="cloneObject" type="button">복제</button>
        <button id="deleteObject" type="button">삭제</button>
      </div>
    </div>
  </section>

  <div class="panel status" aria-live="polite">
    <span id="playState">실행 중</span>
    <span id="collisionReadout">충돌 0</span>
    <span id="energyReadout">에너지 0.0</span>
  </div>

  <!-- 좁은 화면 전용 하단 독: 버튼은 위 패널의 같은 버튼을 대신 누른다 -->
  <nav class="panel dock" id="dock" aria-label="quick tools">
    <div class="dock-row">
      <button type="button" data-proxy="addSphere">구</button>
      <button type="button" data-proxy="addBox">박스</button>
      <button type="button" data-proxy="addTorus">토러스</button>
      <button type="button" data-proxy="addBomb">폭탄</button>
      <button type="button" data-proxy="addLiquid">액체</button>
      <button type="button" data-proxy="pulseWorld">충격파</button>
    </div>
    <div class="dock-row">
      <button type="button" data-proxy="togglePause" id="dockPause">일시정지</button>
      <button type="button" data-proxy="dropStack">쌓기</button>
      <button type="button" data-proxy="resetWorld">초기화</button>
      <button type="button" class="sheet-toggle" data-sheet="tools" aria-controls="toolsPanel" aria-expanded="false">도구</button>
      <button type="button" class="sheet-toggle" data-sheet="inspector" aria-controls="inspectorPanel" aria-expanded="false">속성</button>
    </div>
  </nav>

  <div class="touch-hint" id="touchHint" hidden>물체를 끌면 이동 · 빈 곳을 끌면 시점 회전<br>물체를 잡은 채 두 손가락을 벌리거나 오므리면 앞뒤로</div>

  <div id="error" class="error"></div>

  <script>
    const MAX_OBJECTS = 24;
    const canvas = document.getElementById("glCanvas");
    const overlay = document.getElementById("overlayCanvas");
    const overlayCtx = overlay.getContext("2d");
    const errorBox = document.getElementById("error");
    const gl = canvas.getContext("webgl2", {
      antialias: false,
      depth: false,
      stencil: false,
      preserveDrawingBuffer: false
    });

    if (!gl) {
      errorBox.textContent = "이 브라우저는 WebGL2를 지원하지 않습니다.";
      errorBox.style.display = "grid";
      throw new Error("WebGL2 is not supported.");
    }

    const vertexSource = `#version 300 es
      in vec2 aPosition;
      out vec2 vUv;

      void main() {
        vUv = aPosition * 0.5 + 0.5;
        gl_Position = vec4(aPosition, 0.0, 1.0);
      }
    `;

    const fragmentSource = `#version 300 es
      precision highp float;

      #define MAX_OBJECTS 24

      in vec2 vUv;
      out vec4 outColor;

      uniform vec2 uResolution;
      uniform vec2 uViewCenter;
      uniform float uViewScale;
      uniform float uTime;
      uniform vec2 uCamera;
      uniform int uObjectCount;
      uniform int uObjectType[MAX_OBJECTS];
      uniform vec4 uObjectPos[MAX_OBJECTS];
      uniform vec4 uObjectShape[MAX_OBJECTS];
      uniform vec4 uObjectColor[MAX_OBJECTS];
      uniform int uSelectedIndex;
      uniform float uBlend;
      uniform int uMaxSteps;
      uniform float uEpsilon;

      const float FAR_CLIP = 52.0;
      const int LOOP_LIMIT = 220;

      float sdSphere(vec3 p, float radius) {
        return length(p) - radius;
      }

      float sdBox(vec3 p, vec3 halfSize) {
        vec3 q = abs(p) - halfSize;
        return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0);
      }

      float sdTorus(vec3 p, vec2 torus) {
        vec2 q = vec2(length(p.xy) - torus.x, p.z);
        return length(q) - torus.y;
      }

      float smoothUnion(float a, float b, float k) {
        if (k <= 0.0001) {
          return min(a, b);
        }
        float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
        return mix(b, a, h) - k * h * (1.0 - h);
      }

      float objectDistance(int i, vec3 p) {
        vec3 local = p - uObjectPos[i].xyz;
        int type = uObjectType[i];
        vec4 shape = uObjectShape[i];

        if (type == 0) {
          return sdSphere(local, shape.x);
        }
        if (type == 1) {
          return sdBox(local, shape.xyz);
        }
        return sdTorus(local, shape.xy);
      }

      // sdfScene: 현재 물리 시뮬레이션에 있는 모든 오브젝트와 바닥을 하나의 거리장으로 합친다.
      // 각 점에서 가장 가까운 표면까지의 거리와 어떤 물체에 닿았는지를 함께 반환한다.
      vec2 sdfScene(vec3 p) {
        vec2 result = vec2(10000.0, -1.0);

        for (int i = 0; i < MAX_OBJECTS; i++) {
          if (i >= uObjectCount) {
            break;
          }

          float d = objectDistance(i, p);
          float id = float(i + 1);

          if (result.y > 0.0 && uBlend > 0.0001) {
            float merged = smoothUnion(result.x, d, uBlend);
            if (d < result.x) {
              result.y = id;
            }
            result.x = merged;
          } else if (d < result.x) {
            result = vec2(d, id);
          }
        }

        float floorDist = p.y;
        if (floorDist < result.x) {
          result = vec2(floorDist, 100.0);
        }

        return result;
      }

      // raymarch: 카메라에서 출발한 광선을 SDF 값만큼 전진시키며 표면과 만나는 지점을 찾는다.
      // 이 방식은 빈 공간을 크게 건너뛰기 때문에 메시 없이도 수학적 도형을 렌더링할 수 있다.
      vec2 raymarch(vec3 ro, vec3 rd) {
        float traveled = 0.0;
        float id = -1.0;

        for (int i = 0; i < LOOP_LIMIT; i++) {
          if (i >= uMaxSteps) {
            break;
          }

          vec2 scene = sdfScene(ro + rd * traveled);
          if (scene.x < uEpsilon) {
            id = scene.y;
            break;
          }

          traveled += scene.x;
          if (traveled > FAR_CLIP) {
            break;
          }
        }

        if (traveled > FAR_CLIP) {
          id = -1.0;
        }

        return vec2(traveled, id);
      }

      // estimateNormal: 표면 근처의 SDF 값을 여러 방향으로 조금씩 비교해 법선을 추정한다.
      // 메시의 vertex normal이 없기 때문에 조명 계산에 필요한 표면 방향을 여기서 직접 만든다.
      vec3 estimateNormal(vec3 p) {
        float e = max(uEpsilon * 1.8, 0.0012);
        vec2 h = vec2(e, 0.0);
        return normalize(vec3(
          sdfScene(p + h.xyy).x - sdfScene(p - h.xyy).x,
          sdfScene(p + h.yxy).x - sdfScene(p - h.yxy).x,
          sdfScene(p + h.yyx).x - sdfScene(p - h.yyx).x
        ));
      }

      vec3 objectColor(float id) {
        if (id > 90.0) {
          return vec3(0.30, 0.35, 0.42);
        }

        int index = int(id) - 1;
        for (int i = 0; i < MAX_OBJECTS; i++) {
          if (i == index) {
            return uObjectColor[i].rgb;
          }
        }
        return vec3(0.8);
      }

      float softShadow(vec3 ro, vec3 rd, float minT, float maxT) {
        float shadow = 1.0;
        float t = minT;

        for (int i = 0; i < 42; i++) {
          float h = sdfScene(ro + rd * t).x;
          shadow = min(shadow, 9.0 * h / t);
          t += clamp(h, 0.02, 0.24);

          if (shadow < 0.03 || t > maxT) {
            break;
          }
        }

        return clamp(shadow, 0.0, 1.0);
      }

      float ambientOcclusion(vec3 p, vec3 n) {
        float occ = 0.0;
        float weight = 1.0;

        for (int i = 1; i <= 4; i++) {
          float h = 0.055 * float(i);
          float d = sdfScene(p + n * h).x;
          occ += (h - d) * weight;
          weight *= 0.55;
        }

        return clamp(1.0 - occ * 1.75, 0.0, 1.0);
      }

      vec3 floorGrid(vec3 p, vec3 base) {
        vec2 cell = abs(fract(p.xz * 0.5) - 0.5);
        float line = 1.0 - smoothstep(0.012, 0.018, min(cell.x, cell.y));
        vec2 majorCell = abs(fract(p.xz * 0.1) - 0.5);
        float major = 1.0 - smoothstep(0.008, 0.014, min(majorCell.x, majorCell.y));
        vec3 gridColor = mix(vec3(0.42, 0.51, 0.62), vec3(0.58, 0.68, 0.78), major);
        return mix(base, gridColor, max(line * 0.42, major * 0.60));
      }

      // lighting: 충돌 지점의 색, 법선, 그림자, 주변광, 안개를 조합해 최종 픽셀 색을 만든다.
      // 물리 엔진이 움직인 오브젝트 상태를 시각적으로 읽기 좋게 보여주는 단계다.
      vec3 lighting(vec3 p, vec3 n, vec3 rd, float id, float traveled) {
        vec3 base = objectColor(id);
        if (id > 90.0) {
          base = floorGrid(p, base);
        }

        vec3 lightDir = normalize(vec3(-0.58, 0.82, 0.35));
        vec3 fillDir = normalize(vec3(0.62, 0.35, -0.70));
        float diffuse = max(dot(n, lightDir), 0.0);
        float fill = max(dot(n, fillDir), 0.0);
        float shadow = softShadow(p + n * max(uEpsilon * 4.0, 0.006), lightDir, 0.05, 8.0);
        float ao = ambientOcclusion(p, n);

        vec3 halfVector = normalize(lightDir - rd);
        float specular = pow(max(dot(n, halfVector), 0.0), 48.0);
        float rim = pow(1.0 - max(dot(n, -rd), 0.0), 3.0);

        vec3 color = base * (0.16 + 0.92 * diffuse * shadow + 0.24 * fill) * ao;
        color += vec3(1.0, 0.96, 0.86) * specular * shadow * 0.38;
        color += vec3(0.34, 0.68, 1.0) * rim * 0.18;

        float selected = step(0.5, 0.5 - abs(id - float(uSelectedIndex + 1)));
        color += vec3(1.0, 0.82, 0.32) * selected * (0.16 + rim * 0.70);

        float fog = 1.0 - exp(-0.012 * traveled * traveled);
        vec3 sky = mix(vec3(0.045, 0.055, 0.074), vec3(0.17, 0.21, 0.28), clamp(rd.y * 0.5 + 0.5, 0.0, 1.0));
        return mix(color, sky, fog);
      }

      mat3 cameraBasis(float yaw, float pitch) {
        vec3 target = vec3(0.0, 1.1, 0.0);
        float radius = 9.0;
        vec3 ro = target + vec3(
          radius * cos(pitch) * sin(yaw),
          radius * sin(pitch),
          radius * cos(pitch) * cos(yaw)
        );

        vec3 forward = normalize(target - ro);
        vec3 right = normalize(cross(forward, vec3(0.0, 1.0, 0.0)));
        vec3 up = cross(right, forward);
        return mat3(right, up, forward);
      }

      vec3 background(vec3 rd) {
        float t = clamp(rd.y * 0.5 + 0.5, 0.0, 1.0);
        vec3 color = mix(vec3(0.038, 0.045, 0.062), vec3(0.18, 0.22, 0.30), t);
        float glow = pow(max(dot(rd, normalize(vec3(-0.46, 0.73, 0.36))), 0.0), 8.0);
        return color + glow * vec3(0.13, 0.17, 0.23);
      }

      void main() {
        vec2 frag = gl_FragCoord.xy;
        // uViewScale: 가로 화면에서는 화면 높이(기존과 같음), 세로 화면에서는 가로 시야가 너무 좁아지지 않게 줄인 값
        // uViewCenter: 카메라 중심이 놓이는 픽셀 (기본은 화면 가운데, 모바일에서 시트가 열리면 가려지지 않은 쪽으로 이동)
        vec2 uv = (frag * 2.0 - 2.0 * uViewCenter) / uViewScale;
        uv *= 1.0 + 0.045 * dot(uv, uv);

        vec3 target = vec3(0.0, 1.1, 0.0);
        float radius = 9.0;
        vec3 ro = target + vec3(
          radius * cos(uCamera.y) * sin(uCamera.x),
          radius * sin(uCamera.y),
          radius * cos(uCamera.y) * cos(uCamera.x)
        );

        mat3 basis = cameraBasis(uCamera.x, uCamera.y);
        vec3 rd = normalize(basis * vec3(uv, 1.75));
        vec2 hit = raymarch(ro, rd);
        vec3 color = background(rd);

        if (hit.y > 0.0) {
          vec3 p = ro + rd * hit.x;
          vec3 n = estimateNormal(p);
          color = lighting(p, n, rd, hit.y, hit.x);
        }

        color = pow(color, vec3(0.4545));
        color += (fract(sin(dot(frag + uTime, vec2(12.9898, 78.233))) * 43758.5453) - 0.5) * 0.012;
        outColor = vec4(color, 1.0);
      }
    `;

    function showError(message) {
      errorBox.textContent = message;
      errorBox.style.display = "grid";
    }

    function compileShader(type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);

      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        const log = gl.getShaderInfoLog(shader);
        gl.deleteShader(shader);
        throw new Error(log || "Shader compilation failed.");
      }

      return shader;
    }

    function createProgram(vertex, fragment) {
      const program = gl.createProgram();
      gl.attachShader(program, vertex);
      gl.attachShader(program, fragment);
      gl.linkProgram(program);

      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        const log = gl.getProgramInfoLog(program);
        gl.deleteProgram(program);
        throw new Error(log || "Program link failed.");
      }

      return program;
    }

    let program;
    try {
      const vertexShader = compileShader(gl.VERTEX_SHADER, vertexSource);
      const fragmentShader = compileShader(gl.FRAGMENT_SHADER, fragmentSource);
      program = createProgram(vertexShader, fragmentShader);
      gl.deleteShader(vertexShader);
      gl.deleteShader(fragmentShader);
    } catch (error) {
      showError(`셰이더 오류: ${error.message}`);
      throw error;
    }

    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);

    const quad = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, quad);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -1, -1,
       3, -1,
      -1,  3
    ]), gl.STATIC_DRAW);

    const positionLocation = gl.getAttribLocation(program, "aPosition");
    gl.enableVertexAttribArray(positionLocation);
    gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

    const uniforms = {
      resolution: gl.getUniformLocation(program, "uResolution"),
      viewCenter: gl.getUniformLocation(program, "uViewCenter"),
      viewScale: gl.getUniformLocation(program, "uViewScale"),
      time: gl.getUniformLocation(program, "uTime"),
      camera: gl.getUniformLocation(program, "uCamera"),
      objectCount: gl.getUniformLocation(program, "uObjectCount"),
      objectType: gl.getUniformLocation(program, "uObjectType[0]"),
      objectPos: gl.getUniformLocation(program, "uObjectPos[0]"),
      objectShape: gl.getUniformLocation(program, "uObjectShape[0]"),
      objectColor: gl.getUniformLocation(program, "uObjectColor[0]"),
      selectedIndex: gl.getUniformLocation(program, "uSelectedIndex"),
      blend: gl.getUniformLocation(program, "uBlend"),
      maxSteps: gl.getUniformLocation(program, "uMaxSteps"),
      epsilon: gl.getUniformLocation(program, "uEpsilon")
    };

    const ui = {
      materialButtons: document.getElementById("materialButtons"),

      selectedTitle: document.getElementById("selectedTitle"),
      objectCount: document.getElementById("objectCount"),
      emptyInspector: document.getElementById("emptyInspector"),
      inspector: document.getElementById("inspector"),
      shapeSelect: document.getElementById("shapeSelect"),
      materialSelect: document.getElementById("materialSelect"),
      gravity: document.getElementById("gravity"),
      gravityValue: document.getElementById("gravityValue"),
      timeScale: document.getElementById("timeScale"),
      timeScaleValue: document.getElementById("timeScaleValue"),
      blend: document.getElementById("blend"),
      blendValue: document.getElementById("blendValue"),
      steps: document.getElementById("steps"),
      stepsValue: document.getElementById("stepsValue"),
      epsilon: document.getElementById("epsilon"),
      epsilonValue: document.getElementById("epsilonValue"),
      size: document.getElementById("size"),
