    };

    const materials = {
      rubber: { label: "고무", color: [0.95, 0.22, 0.38], mass: 1.0, bounce: 0.86, friction: 0.68 },
      metal: { label: "금속", color: [0.70, 0.78, 0.86], mass: 3.2, bounce: 0.32, friction: 0.28 },
      ice: { label: "얼음", color: [0.42, 0.86, 1.00], mass: 0.9, bounce: 0.18, friction: 0.04 },
      wood: { label: "나무", color: [1.00, 0.62, 0.28], mass: 1.6, bounce: 0.38, friction: 0.62 },
      foam: { label: "폼", color: [0.56, 0.98, 0.54], mass: 0.45, bounce: 0.66, friction: 0.82 },
      liquid: { label: "액체", color: [0.23, 0.70, 1.00], mass: 0.22, bounce: 0.22, friction: 0.02 },
      bomb: { label: "폭탄", color: [1.00, 0.30, 0.12], mass: 2.4, bounce: 0.42, friction: 0.36 }
    };

    const shapeNames = {
      sphere: "구",
      box: "박스",
      torus: "토러스"
    };

    const state = {
      objects: [],
      effects: [],
      selectedId: null,
      nextId: 1,
      yaw: 0.55,
      pitch: 0.36,
      gravity: Number(ui.gravity.value),
      timeScale: Number(ui.timeScale.value),
      blend: Number(ui.blend.value),
      maxSteps: Number(ui.steps.value),
      epsilon: Number(ui.epsilon.value),
      activeMaterial: "rubber",
      paused: false,
      collisions: 0,
      frameCollisions: 0,
      dragMode: null,
      dragObjectId: null,
      dragPlaneY: 0,
      dragDepth: 0,
      dragOffset: { x: 0, y: 0, z: 0 },
      lastPointer: { x: 0, y: 0 },
      uiDirty: true
    };

    const objectTypeArray = new Int32Array(MAX_OBJECTS);
    const objectPosArray = new Float32Array(MAX_OBJECTS * 4);
    const objectShapeArray = new Float32Array(MAX_OBJECTS * 4);
    const objectColorArray = new Float32Array(MAX_OBJECTS * 4);

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function vec(x = 0, y = 0, z = 0) {
      return { x, y, z };
    }

    function length(v) {
      return Math.hypot(v.x, v.y, v.z);
    }

    function normalize(v) {
      const len = length(v) || 1;
      return { x: v.x / len, y: v.y / len, z: v.z / len };
    }

    function dot(a, b) {
      return a.x * b.x + a.y * b.y + a.z * b.z;
    }

    function cross(a, b) {
      return {
        x: a.y * b.z - a.z * b.y,
        y: a.z * b.x - a.x * b.z,
        z: a.x * b.y - a.y * b.x
      };
    }

    function sub(a, b) {
      return { x: a.x - b.x, y: a.y - b.y, z: a.z - b.z };
    }

    function add(a, b) {
      return { x: a.x + b.x, y: a.y + b.y, z: a.z + b.z };
    }

    function scale(v, s) {
      return { x: v.x * s, y: v.y * s, z: v.z * s };
    }

    function addScaled(target, direction, amount) {
      target.x += direction.x * amount;
      target.y += direction.y * amount;
      target.z += direction.z * amount;
    }

    function getSelectedObject() {
      return state.objects.find((object) => object.id === state.selectedId) || null;
    }

    function objectLabel(object) {
      if (object.kind === "bomb") {
        return "폭탄";
      }
      if (object.kind === "liquid") {
        return "액체";
      }
      return shapeNames[object.type];
    }

    function selectedIndex() {
      return state.objects.findIndex((object) => object.id === state.selectedId);
    }

    function applyMaterial(object, key, overwritePhysics = true) {
      const material = materials[key] || materials.rubber;
      object.material = key;
      object.color = material.color.slice();

      if (key === "bomb") {
        object.kind = "bomb";
        object.type = "sphere";
        object.fuse = object.fuse > 0 ? object.fuse : 3.2;
      } else if (key === "liquid") {
        object.kind = "liquid";
        object.type = "sphere";
      } else if (object.kind === "bomb" || object.kind === "liquid") {
        object.kind = "solid";
      }

      if (overwritePhysics) {
        object.mass = material.mass;
        object.restitution = material.bounce;
        object.friction = material.friction;
      }

      object.invMass = 1 / Math.max(object.mass, 0.001);
      updateShape(object);
    }

    function updateShape(object) {
      const size = object.size;
      if (object.type === "sphere") {
        object.radius = size;
        object.half = vec(size, size, size);
      } else if (object.type === "box") {
        object.half = vec(size * 1.05, size * 0.72, size * 0.92);
        object.radius = length(object.half);
      } else {
        object.major = size * 0.68;
        object.minor = Math.max(0.06, size * 0.18);
        object.radius = object.major + object.minor;
        object.half = vec(object.radius, object.radius, object.minor);
      }
    }

    function supportY(object) {
      if (object.type === "box") {
        return object.half.y;
      }
      return object.radius;
    }

    function supportXZ(object) {
      if (object.type === "box") {
        return Math.max(object.half.x, object.half.z);
      }
      return object.radius;
    }

    function createObject(type, options = {}) {
      if (state.objects.length >= MAX_OBJECTS) {
        return null;
      }

      const object = {
        id: state.nextId++,
        type,
        kind: options.kind || "solid",
        material: state.activeMaterial,
        size: options.size ?? 0.48,
        mass: 1,
        invMass: 1,
        restitution: 0.5,
        friction: 0.4,
        color: [1, 1, 1],
        pos: vec(options.x ?? 0, options.y ?? 4, options.z ?? 0),
        vel: vec(options.vx ?? 0, options.vy ?? 0, options.vz ?? 0),
        fuse: options.fuse ?? 0,
        age: 0,
        half: vec(),
        radius: 0.5,
        major: 0.35,
        minor: 0.08
      };

      updateShape(object);
      applyMaterial(object, options.material || state.activeMaterial, true);
      object.pos.y = Math.max(object.pos.y, supportY(object) + 0.02);
      state.objects.push(object);
      state.selectedId = object.id;
      state.uiDirty = true;
      syncInspectorFromObject();
      return object;
    }

    function duplicateObject(object) {
      if (!object) {
        return;
      }

      const copy = createObject(object.type, {
        kind: object.kind,
        size: object.size,
        material: object.material,
        x: clamp(object.pos.x + 0.45, -4.2, 4.2),
        y: object.pos.y + 0.5,
        z: clamp(object.pos.z + 0.35, -4.2, 4.2),
        vx: object.vel.x * 0.25,
        vy: Math.abs(object.vel.y) * 0.25,
        vz: object.vel.z * 0.25
      });

      if (copy) {
        copy.mass = object.mass;
        copy.restitution = object.restitution;
        copy.friction = object.friction;
        copy.invMass = 1 / Math.max(copy.mass, 0.001);
        state.uiDirty = true;
      }
    }

    function resetWorld() {
      state.objects = [];
      state.effects = [];
      state.selectedId = null;
      state.nextId = 1;
      state.collisions = 0;

      state.activeMaterial = "rubber";
      createObject("sphere", { x: -1.7, y: 3.5, z: -0.25, vx: 2.3, material: "rubber", size: 0.50 });
      createObject("box", { x: 0.0, y: 2.4, z: 0.22, vx: -0.7, material: "wood", size: 0.52 });
      createObject("torus", { x: 1.55, y: 4.4, z: -0.32, vx: -1.3, material: "ice", size: 0.54 });
      createObject("sphere", { x: 0.95, y: 6.0, z: 0.52, vx: -0.9, material: "metal", size: 0.42 });
      state.activeMaterial = "rubber";
      state.selectedId = state.objects[0]?.id ?? null;
      state.uiDirty = true;
      syncInspectorFromObject();
      updateMaterialButtons();
    }

    function dropStack() {
      const sequence = [
        ["box", "wood", -0.8, 3.0, 0.0],
        ["sphere", "rubber", 0.0, 4.0, 0.0],
        ["torus", "ice", 0.75, 5.2, 0.0],
        ["sphere", "metal", -0.15, 6.4, 0.0]
      ];

      for (const [type, material, x, y, z] of sequence) {
        if (state.objects.length >= MAX_OBJECTS) {
          break;
        }
        createObject(type, { x, y, z, material, size: 0.44 + Math.random() * 0.12 });
      }
    }

    function createBomb() {
      const bomb = createObject("sphere", {
        kind: "bomb",
        material: "bomb",
        size: 0.36,
        x: -0.35 + Math.random() * 0.7,
        y: 6.2,
        z: -0.35 + Math.random() * 0.7,
        vx: -0.8 + Math.random() * 1.6,
        vy: 0.4,
        vz: -0.8 + Math.random() * 1.6,
        fuse: 3.2
      });

      if (bomb) {
        bomb.restitution = 0.48;
        bomb.friction = 0.34;
      }
    }

    function createLiquidSplash(origin = vec(0, 5.8, 0)) {
      const count = Math.min(9, MAX_OBJECTS - state.objects.length);
      for (let i = 0; i < count; i++) {
        const angle = (i / Math.max(1, count)) * Math.PI * 2 + Math.random() * 0.35;
        const radius = 0.12 + Math.random() * 0.45;
        const droplet = createObject("sphere", {
          kind: "liquid",
          material: "liquid",
          size: 0.13 + Math.random() * 0.06,
          x: origin.x + Math.cos(angle) * radius,
          y: origin.y + Math.random() * 0.45,
          z: origin.z + Math.sin(angle) * radius,
          vx: Math.cos(angle) * (1.2 + Math.random() * 1.8),
          vy: 0.8 + Math.random() * 1.8,
          vz: Math.sin(angle) * (1.2 + Math.random() * 1.8)
        });

        if (droplet) {
          droplet.mass = 0.16;
          droplet.invMass = 1 / droplet.mass;
          droplet.restitution = 0.18;
          droplet.friction = 0.02;
        }
      }
    }

    function addEffect(kind, position, options = {}) {
      state.effects.push({
        kind,
        pos: { ...position },
        age: 0,
        life: options.life ?? 0.65,
        radius: options.radius ?? 0.25,
        maxRadius: options.maxRadius ?? 3.2,
        strength: options.strength ?? 1,
        color: options.color || (kind === "liquid" ? [0.23, 0.70, 1.00] : [1.00, 0.48, 0.16])
      });

      if (state.effects.length > 28) {
        state.effects.shift();
      }
    }

    function applyRadialImpulse(center, radius, strength) {
      for (const object of state.objects) {
        const delta = sub(object.pos, center);
        const distance = Math.max(0.001, length(delta));
        if (distance > radius) {
          continue;
        }

        const falloff = 1 - distance / radius;
        const direction = scale(delta, 1 / distance);
        const impulse = strength * falloff * falloff / Math.max(0.35, object.mass);
        addScaled(object.vel, direction, impulse);
        object.vel.y += impulse * 0.45;
      }
    }

    function explodeBomb(bomb) {
      if (!bomb || !state.objects.includes(bomb)) {
        return;
      }

      const center = { ...bomb.pos };
      applyRadialImpulse(center, 4.2, 13.5);
      addEffect("explosion", center, { life: 0.85, maxRadius: 4.2, strength: 1.25, color: [1.0, 0.42, 0.12] });
      state.objects = state.objects.filter((object) => object !== bomb);
      if (state.selectedId === bomb.id) {
        state.selectedId = state.objects[0]?.id ?? null;
        syncInspectorFromObject();
      }
      state.collisions += 6;
      state.uiDirty = true;
    }

    function pulseWorld() {
      const selected = getSelectedObject();
      const center = selected ? { ...selected.pos } : vec(0, 1.0, 0);
      applyRadialImpulse(center, 3.6, 8.0);
      addEffect("pulse", center, { life: 0.6, maxRadius: 3.6, strength: 0.9, color: [0.36, 0.92, 1.0] });
    }

    function setObjectType(object, type) {
      if (!object) {
        return;
      }

      object.type = type;
      updateShape(object);
      object.pos.y = Math.max(object.pos.y, supportY(object) + 0.02);
      state.uiDirty = true;
    }

    // 화면 좌표 → 카메라 uv 기준 길이. 가로 화면·데스크톱은 기존과 같이 높이 기준이고,
    // 세로 화면(휴대폰)에서는 가로 시야가 너무 좁아지지 않도록 너비 × PORTRAIT_VIEW 로 줄인다.
    const PORTRAIT_VIEW = 1.5;

    function viewNorm(width, height) {
      return Math.min(height, width * PORTRAIT_VIEW);
    }

    // 좁은 화면에서 도구/속성 시트가 열리면, 가려지지 않은 영역의 가운데로 카메라 중심을 옮긴다 (CSS px).
    // 데스크톱(패널 고정 배치)이나 시트가 닫힌 상태에서는 항상 0이라 기존 화면과 같다.
    const compactQuery = matchMedia("(max-width: 840px), (max-height: 540px)");
    const sheetPanels = {
      tools: document.getElementById("toolsPanel"),
      inspector: document.getElementById("inspectorPanel")
    };
    const statusPanel = document.querySelector(".status");
    const view = { offsetX: 0, offsetY: 0, targetX: 0, targetY: 0, glScale: 1, overlayScale: 1, measuredAt: -1e9 };

    function updateViewOffset(dt, now) {
      const sheet = compactQuery.matches ? sheetPanels[document.body.dataset.sheet] : null;
      if (!sheet) {
        view.targetX = 0;
        view.targetY = 0;
      } else if (now - view.measuredAt > 200) {
        // 시트 크기는 가끔만 바뀌므로 0.2초마다 한 번만 잰다
        view.measuredAt = now;
        view.targetX = 0;
        view.targetY = 0;
        const rect = sheet.getBoundingClientRect();
        const width = canvas.clientWidth;
        const height = canvas.clientHeight;
        if (rect.width > width * 0.6) {
          // 아래쪽 시트(세로 화면): 상태 표시줄과 시트 사이의 가운데
          view.targetY = Math.min(0, (statusPanel.getBoundingClientRect().bottom + rect.top) * 0.5 - height * 0.5);
        } else if (rect.width > 0) {
          // 옆 시트(가로 화면): 시트 반대쪽 영역의 가운데
          view.targetX = rect.left < width * 0.5 ? rect.right * 0.5 : (rect.left - width) * 0.5;
        }
      }

      const ease = Math.min(1, Math.max(0, dt) * 10);
      view.offsetX += (view.targetX - view.offsetX) * ease;
      view.offsetY += (view.targetY - view.offsetY) * ease;
      if (Math.abs(view.targetX - view.offsetX) < 0.05) {
        view.offsetX = view.targetX;
      }
      if (Math.abs(view.targetY - view.offsetY) < 0.05) {
        view.offsetY = view.targetY;
      }
    }

    // 휴대폰·태블릿(굵은 포인터)은 레이마칭이 무거우므로 프레임 시간에 맞춰 WebGL 해상도를 자동 조절한다.
    // 데스크톱은 기존과 같이 devicePixelRatio(최대 1.75) 해상도로 그린다.
    const coarsePointer = matchMedia("(pointer: coarse)").matches;
    const renderScale = {
      adaptive: coarsePointer,
      value: 1,          // CSS 픽셀 대비 WebGL 버퍼 배율
      min: 0.5,
      max: 1.5,
      frames: 0,
      time: 0,
      calm: 0,           // 연속으로 여유 있던 측정 구간(약 0.5초) 수
      wait: 3,           // 해상도를 올려 보기 전에 기다릴 구간 수
      sinceRaise: 99
    };

    function tuneRenderScale(frameMs) {
      if (!renderScale.adaptive || !(frameMs > 0) || frameMs > 250) {
        return;
      }

      renderScale.frames++;
      renderScale.time += frameMs;
      if (renderScale.time < 500 || renderScale.frames < 8) {
        return;
      }

      const average = renderScale.time / renderScale.frames;
      renderScale.frames = 0;
      renderScale.time = 0;
      renderScale.sinceRaise++;

      if (average > 26) {
        // 느리면 바로 낮춘다. 방금 올린 탓이면 다음 시도까지 두 배로 오래 기다려 해상도가 들쭉날쭉하지 않게 한다.
        if (renderScale.sinceRaise <= 2) {
          renderScale.wait = Math.min(64, renderScale.wait * 2);
        }
        renderScale.value = Math.max(renderScale.min, renderScale.value * (average > 40 ? 0.7 : 0.85));
        renderScale.calm = 0;
        renderScale.sinceRaise = 99;
      } else if (average < 19) {
        if (renderScale.sinceRaise === 3) {
          renderScale.wait = Math.max(3, renderScale.wait / 2);  // 올린 뒤에도 괜찮았으면 다음엔 더 빨리 올려 본다
        }
        renderScale.calm++;
        if (renderScale.calm >= renderScale.wait && renderScale.value < renderScale.max) {
          renderScale.value = Math.min(renderScale.max, renderScale.value * 1.1);
          renderScale.calm = 0;
          renderScale.sinceRaise = 0;
        }
      } else {
        renderScale.calm = 0;
      }
    }

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 1.75);
      const glScale = renderScale.adaptive ? Math.min(dpr, renderScale.value) : dpr;
      const width = Math.max(1, Math.floor(canvas.clientWidth * glScale));
      const height = Math.max(1, Math.floor(canvas.clientHeight * glScale));

      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }

      // 오버레이(화살표·링)는 WebGL 해상도와 상관없이 선명하게 그린다
      const overlayWidth = Math.max(1, Math.floor(canvas.clientWidth * dpr));
      const overlayHeight = Math.max(1, Math.floor(canvas.clientHeight * dpr));
      if (overlay.width !== overlayWidth || overlay.height !== overlayHeight) {
        overlay.width = overlayWidth;
        overlay.height = overlayHeight;
      }
      view.glScale = canvas.width / Math.max(1, canvas.clientWidth);
      view.overlayScale = overlay.width / Math.max(1, canvas.clientWidth);

      gl.viewport(0, 0, canvas.width, canvas.height);
    }

    function getCamera() {
      const target = vec(0, 1.1, 0);
      const radius = 9;
      const position = vec(
        target.x + radius * Math.cos(state.pitch) * Math.sin(state.yaw),
        target.y + radius * Math.sin(state.pitch),
        target.z + radius * Math.cos(state.pitch) * Math.cos(state.yaw)
      );
      const forward = normalize(sub(target, position));
      const right = normalize(cross(forward, vec(0, 1, 0)));
      const up = cross(right, forward);
      return { position, forward, right, up };
    }

    function projectPoint(point) {
      const camera = getCamera();
      const toPoint = sub(point, camera.position);
      const z = dot(toPoint, camera.forward);
      if (z <= 0.05) {
        return null;
      }

      const x = dot(toPoint, camera.right);
      const y = dot(toPoint, camera.up);
      const uvX = x / z * 1.75;
      const uvY = y / z * 1.75;
      const norm = viewNorm(overlay.width, overlay.height);
      return {
        x: (uvX * norm + overlay.width) * 0.5 + view.offsetX * view.overlayScale,
        y: (overlay.height - uvY * norm) * 0.5 + view.offsetY * view.overlayScale,
        z
      };
    }

    function updateEffects(dt) {
      for (const effect of state.effects) {
        effect.age += dt;
        const t = clamp(effect.age / effect.life, 0, 1);
        effect.radius = effect.maxRadius * (0.18 + 0.82 * t);
      }
      state.effects = state.effects.filter((effect) => effect.age < effect.life);
    }

    function drawArrow(from, to, color, alpha) {
      const dx = to.x - from.x;
      const dy = to.y - from.y;
      const len = Math.hypot(dx, dy);
      if (len < 8) {
        return;
      }

      const ux = dx / len;
      const uy = dy / len;
      overlayCtx.save();
      overlayCtx.globalAlpha = alpha;
      overlayCtx.strokeStyle = color;
      overlayCtx.fillStyle = color;
      overlayCtx.lineWidth = 2.2;
      overlayCtx.lineCap = "round";
      overlayCtx.beginPath();
      overlayCtx.moveTo(from.x, from.y);
      overlayCtx.lineTo(to.x, to.y);
      overlayCtx.stroke();
      overlayCtx.beginPath();
      overlayCtx.moveTo(to.x, to.y);
      overlayCtx.lineTo(to.x - ux * 12 - uy * 5, to.y - uy * 12 + ux * 5);
      overlayCtx.lineTo(to.x - ux * 12 + uy * 5, to.y - uy * 12 - ux * 5);
      overlayCtx.closePath();
      overlayCtx.fill();
      overlayCtx.restore();
    }

    function drawOverlay() {
      overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
      const norm = viewNorm(overlay.width, overlay.height);

      for (const effect of state.effects) {
        const screen = projectPoint(effect.pos);
        if (!screen) {
          continue;
        }

        const t = clamp(effect.age / effect.life, 0, 1);
        const screenRadius = effect.radius / screen.z * 1.75 * norm * 0.5;
        const [r, g, b] = effect.color.map((value) => Math.round(value * 255));
        overlayCtx.save();
        overlayCtx.globalAlpha = (1 - t) * 0.78 * effect.strength;
        overlayCtx.strokeStyle = `rgb(${r}, ${g}, ${b})`;
        overlayCtx.lineWidth = effect.kind === "impact" ? 2 : 4;
        overlayCtx.beginPath();
        overlayCtx.arc(screen.x, screen.y, Math.max(3, screenRadius), 0, Math.PI * 2);
        overlayCtx.stroke();
        overlayCtx.restore();
      }

      for (const object of state.objects) {
        const speed = length(object.vel);
        if (speed < 0.28) {
          continue;
        }

        const from = projectPoint(object.pos);
        const to = projectPoint(add(object.pos, scale(object.vel, 0.18)));
        if (!from || !to) {
          continue;
        }

        const color = object.kind === "liquid" ? "rgb(90, 205, 255)" : object.kind === "bomb" ? "rgb(255, 126, 58)" : "rgb(94, 234, 212)";
        drawArrow(from, to, color, clamp(speed / 6, 0.18, 0.75));
      }

      const selected = getSelectedObject();
      if (selected) {
        const screen = projectPoint(selected.pos);
        if (screen) {
          overlayCtx.save();
          overlayCtx.strokeStyle = "rgba(255, 216, 94, 0.68)";
          overlayCtx.lineWidth = 2;
          overlayCtx.beginPath();
          overlayCtx.arc(screen.x, screen.y, Math.max(14, selected.radius / screen.z * 1.75 * norm * 0.48), 0, Math.PI * 2);
          overlayCtx.stroke();
          overlayCtx.restore();
        }
      }
    }

    function pointerRay(event) {
      const rect = canvas.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      const norm = viewNorm(rect.width, rect.height);
      const uv = {
        x: (x * 2 - rect.width - view.offsetX * 2) / norm,
        y: (rect.height - y * 2 + view.offsetY * 2) / norm
      };
      const camera = getCamera();
      const direction = normalize(add(add(scale(camera.right, uv.x), scale(camera.up, uv.y)), scale(camera.forward, 1.75)));
      return { origin: camera.position, direction };
    }

    function raySphere(ray, center, radius) {
      const oc = sub(ray.origin, center);
      const b = dot(oc, ray.direction);
      const c = dot(oc, oc) - radius * radius;
      const h = b * b - c;
      if (h < 0) {
        return Infinity;
      }
      const root = Math.sqrt(h);
      const t = -b - root;
      const t2 = -b + root;
      if (t > 0.01) {
        return t;
      }
      return t2 > 0.01 ? t2 : Infinity;
    }

    function rayAabb(ray, center, half) {
      let tMin = -Infinity;
      let tMax = Infinity;
      const axes = ["x", "y", "z"];

      for (const axis of axes) {
        const origin = ray.origin[axis] - center[axis];
        const direction = ray.direction[axis];
        const min = -half[axis];
        const max = half[axis];

        if (Math.abs(direction) < 1e-6) {
          if (origin < min || origin > max) {
            return Infinity;
          }
          continue;
        }

        let t1 = (min - origin) / direction;
        let t2 = (max - origin) / direction;
        if (t1 > t2) {
          const swap = t1;
          t1 = t2;
          t2 = swap;
        }
        tMin = Math.max(tMin, t1);
        tMax = Math.min(tMax, t2);
        if (tMin > tMax) {
          return Infinity;
        }
      }

      return tMin > 0.01 ? tMin : tMax > 0.01 ? tMax : Infinity;
    }

    function pickObject(ray) {
      let picked = null;
      let nearest = Infinity;

      for (const object of state.objects) {
        const t = object.type === "box"
          ? rayAabb(ray, object.pos, object.half)
          : raySphere(ray, object.pos, object.radius);

        if (t < nearest) {
          nearest = t;
          picked = object;
        }
      }

      return picked ? { object: picked, distance: nearest } : null;
    }

    // 터치 전용: 손가락 끝은 넓으니 광선이 살짝 빗나가도 화면에서 가까운(26px 이내) 물체를 집는다.
    // 집는 깊이는 광선 위에서 물체 중심에 가장 가까운 지점이다.
    function pickObjectNearTouch(event, ray) {
      const rect = canvas.getBoundingClientRect();
      const norm = viewNorm(rect.width, rect.height);
      const camera = getCamera();
      let picked = null;
      let bestGap = 26;

      for (const object of state.objects) {
        const toPoint = sub(object.pos, camera.position);
        const z = dot(toPoint, camera.forward);
        if (z <= 0.05) {
          continue;
        }

        const screenX = rect.left + (dot(toPoint, camera.right) / z * 1.75 * norm + rect.width) * 0.5 + view.offsetX;
        const screenY = rect.top + (rect.height - dot(toPoint, camera.up) / z * 1.75 * norm) * 0.5 + view.offsetY;
        const screenRadius = object.radius / z * 1.75 * norm * 0.5;
        const gap = Math.hypot(event.clientX - screenX, event.clientY - screenY) - screenRadius;
        if (gap < bestGap) {
          bestGap = gap;
          picked = object;
        }
      }

      if (!picked) {
        return null;
      }
      return { object: picked, distance: Math.max(0.5, dot(sub(picked.pos, ray.origin), ray.direction)) };
    }

    function intersectPlaneY(ray, y) {
      if (Math.abs(ray.direction.y) < 0.0001) {
        return null;
      }
      const t = (y - ray.origin.y) / ray.direction.y;
      if (t <= 0) {
        return null;
      }
      return add(ray.origin, scale(ray.direction, t));
    }

    function solveFloorAndBounds(object) {
      const floorY = supportY(object);
      if (object.pos.y < floorY) {
        object.pos.y = floorY;
        if (object.vel.y < 0) {
          if (object.kind === "bomb" && Math.abs(object.vel.y) > 1.25) {
            object.fuse = Math.min(object.fuse, 0.02);
          }
          if (object.kind === "liquid" && Math.abs(object.vel.y) > 1.0) {
            addEffect("liquid", object.pos, { life: 0.38, maxRadius: 0.7, strength: 0.45, color: [0.23, 0.70, 1.0] });
          }
          object.vel.y = -object.vel.y * object.restitution;
          object.vel.x *= Math.max(0, 1 - object.friction * 0.22);
          object.vel.z *= Math.max(0, 1 - object.friction * 0.22);
          if (Math.abs(object.vel.y) > 0.45) {
            state.frameCollisions++;
          }
        }
      }

      const bound = 5.4;
      const radius = supportXZ(object);
      if (object.pos.x < -bound + radius) {
        object.pos.x = -bound + radius;
        object.vel.x = Math.abs(object.vel.x) * object.restitution;
        state.frameCollisions++;
      } else if (object.pos.x > bound - radius) {
        object.pos.x = bound - radius;
        object.vel.x = -Math.abs(object.vel.x) * object.restitution;
        state.frameCollisions++;
      }

      if (object.pos.z < -bound + radius) {
        object.pos.z = -bound + radius;
        object.vel.z = Math.abs(object.vel.z) * object.restitution;
        state.frameCollisions++;
      } else if (object.pos.z > bound - radius) {
        object.pos.z = bound - radius;
        object.vel.z = -Math.abs(object.vel.z) * object.restitution;
        state.frameCollisions++;
      }
    }

    function sphereSphere(a, b) {
      const delta = sub(b.pos, a.pos);
      const dist = length(delta);
      const radius = a.radius + b.radius;
      if (dist >= radius) {
        return null;
      }
      const normal = dist > 0.0001 ? scale(delta, 1 / dist) : vec(1, 0, 0);
      return { normal, penetration: radius - dist };
    }

    function boxBox(a, b) {
      const delta = sub(b.pos, a.pos);
      const overlapX = a.half.x + b.half.x - Math.abs(delta.x);
      const overlapY = a.half.y + b.half.y - Math.abs(delta.y);
      const overlapZ = a.half.z + b.half.z - Math.abs(delta.z);

      if (overlapX <= 0 || overlapY <= 0 || overlapZ <= 0) {
        return null;
      }

      if (overlapX < overlapY && overlapX < overlapZ) {
        return { normal: vec(Math.sign(delta.x) || 1, 0, 0), penetration: overlapX };
      }
      if (overlapY < overlapZ) {
        return { normal: vec(0, Math.sign(delta.y) || 1, 0), penetration: overlapY };
      }
      return { normal: vec(0, 0, Math.sign(delta.z) || 1), penetration: overlapZ };
    }

    function sphereBox(sphere, box) {
      const local = sub(sphere.pos, box.pos);
      const closest = vec(
        clamp(local.x, -box.half.x, box.half.x),
        clamp(local.y, -box.half.y, box.half.y),
        clamp(local.z, -box.half.z, box.half.z)
      );
      const fromBoxToSphere = sub(local, closest);
      const dist = length(fromBoxToSphere);

      if (dist > 0.0001) {
        if (dist >= sphere.radius) {
          return null;
        }
        return {
          normal: scale(fromBoxToSphere, -1 / dist),
          penetration: sphere.radius - dist
        };
      }

      const dx = box.half.x - Math.abs(local.x);
      const dy = box.half.y - Math.abs(local.y);
      const dz = box.half.z - Math.abs(local.z);
      if (dx < dy && dx < dz) {
        return { normal: vec(-(Math.sign(local.x) || 1), 0, 0), penetration: sphere.radius + dx };
      }
      if (dy < dz) {
        return { normal: vec(0, -(Math.sign(local.y) || 1), 0), penetration: sphere.radius + dy };
      }
      return { normal: vec(0, 0, -(Math.sign(local.z) || 1)), penetration: sphere.radius + dz };
    }

    function collisionInfo(a, b) {
      const aSphere = a.type !== "box";
      const bSphere = b.type !== "box";

      if (aSphere && bSphere) {
        return sphereSphere(a, b);
      }
      if (!aSphere && !bSphere) {
        return boxBox(a, b);
      }
      if (aSphere && !bSphere) {
        return sphereBox(a, b);
      }

      const info = sphereBox(b, a);
      if (!info) {
        return null;
      }
      return { normal: scale(info.normal, -1), penetration: info.penetration };
    }

    function resolvePair(a, b) {
      const info = collisionInfo(a, b);
      if (!info) {
        return;
      }

      const invMassSum = a.invMass + b.invMass;
      if (invMassSum <= 0) {
        return;
      }

      const correction = Math.max(info.penetration - 0.002, 0) / invMassSum * 0.78;
      addScaled(a.pos, info.normal, -correction * a.invMass);
      addScaled(b.pos, info.normal, correction * b.invMass);

      const relativeVelocity = sub(b.vel, a.vel);
      const normalVelocity = dot(relativeVelocity, info.normal);
      if (normalVelocity > 0) {
        return;
      }

      const restitution = Math.min(a.restitution, b.restitution);
      const impulseMagnitude = -(1 + restitution) * normalVelocity / invMassSum;
      const impulse = scale(info.normal, impulseMagnitude);
      addScaled(a.vel, impulse, -a.invMass);
      addScaled(b.vel, impulse, b.invMass);

      if (impulseMagnitude > 1.15) {
        const contact = scale(add(a.pos, b.pos), 0.5);
        addEffect("impact", contact, {
          life: 0.32,
          maxRadius: clamp(impulseMagnitude * 0.18, 0.18, 0.85),
          strength: clamp(impulseMagnitude * 0.08, 0.2, 0.8),
          color: [1.0, 0.86, 0.36]
        });
      }

      if (impulseMagnitude > 1.7) {
        if (a.kind === "bomb") {
          a.fuse = Math.min(a.fuse, 0.02);
        }
        if (b.kind === "bomb") {
          b.fuse = Math.min(b.fuse, 0.02);
        }
      }

      const tangentVelocity = sub(relativeVelocity, scale(info.normal, normalVelocity));
      const tangentSpeed = length(tangentVelocity);
      if (tangentSpeed > 0.0001) {
        const tangent = scale(tangentVelocity, 1 / tangentSpeed);
        const friction = Math.sqrt(a.friction * b.friction);
        const frictionMagnitude = clamp(-dot(relativeVelocity, tangent) / invMassSum, -impulseMagnitude * friction, impulseMagnitude * friction);
        const frictionImpulse = scale(tangent, frictionMagnitude);
        addScaled(a.vel, frictionImpulse, -a.invMass);
        addScaled(b.vel, frictionImpulse, b.invMass);
      }

      state.frameCollisions++;
    }

    function applyLiquidCohesion(dt) {
      const liquids = state.objects.filter((object) => object.kind === "liquid");
      for (let i = 0; i < liquids.length; i++) {
        for (let j = i + 1; j < liquids.length; j++) {
          const a = liquids[i];
          const b = liquids[j];
          const delta = sub(b.pos, a.pos);
          const distance = length(delta);
          if (distance < 0.001 || distance > 1.15) {
            continue;
          }

          const direction = scale(delta, 1 / distance);
          const cohesion = (1.15 - distance) * 0.22 * dt;
          addScaled(a.vel, direction, cohesion / Math.max(0.1, a.mass));
          addScaled(b.vel, direction, -cohesion / Math.max(0.1, b.mass));
        }
      }
    }

    function stepPhysics(dt) {
      if (state.paused) {
        return;
      }

      state.frameCollisions = 0;
      const dragId = state.dragMode === "object" ? state.dragObjectId : null;
      applyLiquidCohesion(dt);

      for (const object of state.objects) {
        if (object.id === dragId) {
          continue;
        }

        object.age += dt;
        if (object.kind === "bomb") {
          object.fuse -= dt;
        }

        object.vel.y += state.gravity * dt;
        const drag = object.kind === "liquid" ? 0.986 : 0.998;
        object.vel.x *= Math.pow(drag, dt * 60);
        object.vel.z *= Math.pow(drag, dt * 60);
        object.pos.x += object.vel.x * dt;
        object.pos.y += object.vel.y * dt;
        object.pos.z += object.vel.z * dt;
        solveFloorAndBounds(object);
      }

      for (let iteration = 0; iteration < 3; iteration++) {
        for (let i = 0; i < state.objects.length; i++) {
          for (let j = i + 1; j < state.objects.length; j++) {
            resolvePair(state.objects[i], state.objects[j]);
          }
        }
        for (const object of state.objects) {
          solveFloorAndBounds(object);
        }
      }

      for (const object of [...state.objects]) {
        if (object.kind === "bomb" && object.fuse <= 0) {
          explodeBomb(object);
        }
      }

      state.collisions += state.frameCollisions;
    }

    function kineticEnergy() {
      let total = 0;
      for (const object of state.objects) {
        const speedSq = dot(object.vel, object.vel);
        total += 0.5 * object.mass * speedSq;
      }
      return total;
    }

    function syncWorldControls() {
      state.gravity = Number(ui.gravity.value);
      state.timeScale = Number(ui.timeScale.value);
      state.blend = Number(ui.blend.value);
      state.maxSteps = Number(ui.steps.value);
      state.epsilon = Number(ui.epsilon.value);

      ui.gravityValue.textContent = state.gravity.toFixed(1);
      ui.timeScaleValue.textContent = state.timeScale.toFixed(2);
      ui.blendValue.textContent = state.blend.toFixed(2);
      ui.stepsValue.textContent = String(state.maxSteps);
      ui.epsilonValue.textContent = state.epsilon.toFixed(4);
    }

    function syncInspectorFromObject() {
      const object = getSelectedObject();
      if (!object) {
        ui.inspector.hidden = true;
        ui.emptyInspector.hidden = false;
        ui.selectedTitle.textContent = "선택 없음";
        state.uiDirty = true;
        return;
      }

      ui.inspector.hidden = false;
      ui.emptyInspector.hidden = true;
      ui.selectedTitle.textContent = `${objectLabel(object)} #${object.id}`;
      ui.shapeSelect.value = object.type;
      ui.materialSelect.value = object.material;
      ui.size.value = object.size;
      ui.mass.value = object.mass;
      ui.bounce.value = object.restitution;
      ui.friction.value = object.friction;
      updateInspectorOutputs();
      state.uiDirty = true;
    }

    function updateInspectorOutputs() {
      ui.sizeValue.textContent = Number(ui.size.value).toFixed(2);
      ui.massValue.textContent = Number(ui.mass.value).toFixed(1);
      ui.bounceValue.textContent = Number(ui.bounce.value).toFixed(2);
      ui.frictionValue.textContent = Number(ui.friction.value).toFixed(2);
    }

    function applyInspectorToObject() {
      const object = getSelectedObject();
      if (!object) {
        return;
      }

      setObjectType(object, ui.shapeSelect.value);
      object.size = Number(ui.size.value);
      object.mass = Number(ui.mass.value);
      object.restitution = Number(ui.bounce.value);
      object.friction = Number(ui.friction.value);
      object.invMass = 1 / Math.max(object.mass, 0.001);
      applyMaterial(object, ui.materialSelect.value, false);
      updateShape(object);
      object.pos.y = Math.max(object.pos.y, supportY(object) + 0.02);
      ui.shapeSelect.value = object.type;
      ui.selectedTitle.textContent = `${objectLabel(object)} #${object.id}`;
      updateInspectorOutputs();
      state.uiDirty = true;
    }

    function updateMaterialButtons() {
      for (const button of ui.materialButtons.querySelectorAll("button")) {
        button.classList.toggle("active", button.dataset.material === state.activeMaterial);
      }
    }

    function renderMaterialControls() {
      ui.materialButtons.textContent = "";
      ui.materialSelect.textContent = "";

      for (const [key, material] of Object.entries(materials)) {
        const button = document.createElement("button");
        button.type = "button";
        button.dataset.material = key;
        button.innerHTML = `<span class="swatch" style="background: rgb(${material.color.map((c) => Math.round(c * 255)).join(",")})"></span>${material.label}`;
        button.addEventListener("click", () => {
          state.activeMaterial = key;
          const object = getSelectedObject();
          if (object) {
            applyMaterial(object, key, true);
            syncInspectorFromObject();
          }
          updateMaterialButtons();
        });
        ui.materialButtons.appendChild(button);

        const option = document.createElement("option");
        option.value = key;
        option.textContent = material.label;
        ui.materialSelect.appendChild(option);
      }

      updateMaterialButtons();
    }

    // 목록은 0.3초마다 갱신된다. 행을 매번 새로 만들면 누르는 도중에 행이 바뀌어 클릭/탭이 사라지므로
    // 기존 행을 재사용하고 내용만 바꾼다.
    function renderObjectList() {
      ui.objectCount.textContent = `${state.objects.length} / ${MAX_OBJECTS}`;

      const rows = ui.objectList.children;
      while (rows.length > state.objects.length) {
        ui.objectList.lastElementChild.remove();
      }

      for (let i = 0; i < state.objects.length; i++) {
        const object = state.objects[i];
        let row = rows[i];
        if (!row) {
          row = document.createElement("button");
          row.type = "button";
          row.className = "object-row";
          row.innerHTML = `
          <span class="object-dot" style="background: currentColor"></span>
          <span class="object-name"></span>
          <span class="object-speed"></span>
        `;
          row.addEventListener("click", () => {
            state.selectedId = Number(row.dataset.id);
            syncInspectorFromObject();
          });
          ui.objectList.appendChild(row);
        }

        const [dotEl, nameEl, speedEl] = row.children;
        row.dataset.id = object.id;
        row.classList.toggle("active", object.id === state.selectedId);
        dotEl.style.color = `rgb(${object.color.map((c) => Math.round(c * 255)).join(",")})`;
        nameEl.textContent = `${objectLabel(object)} #${object.id}`;
        speedEl.textContent = `${length(object.vel).toFixed(1)}m/s`;
      }
    }

    function updateStatus() {
      ui.playState.textContent = state.paused ? "일시정지" : "실행 중";
      ui.togglePause.textContent = state.paused ? "재생" : "일시정지";
      if (ui.dockPause.textContent !== ui.togglePause.textContent) {
        ui.dockPause.textContent = ui.togglePause.textContent;
        ui.dockPause.classList.toggle("active", state.paused);
      }
      ui.collisionReadout.textContent = `충돌 ${state.collisions}`;
      ui.energyReadout.textContent = `에너지 ${kineticEnergy().toFixed(1)}`;
    }

    function uploadObjects() {
      objectTypeArray.fill(0);
      objectPosArray.fill(0);
      objectShapeArray.fill(0);
      objectColorArray.fill(0);

      for (let i = 0; i < state.objects.length; i++) {
        const object = state.objects[i];
        objectTypeArray[i] = object.type === "sphere" ? 0 : object.type === "box" ? 1 : 2;

        const posOffset = i * 4;
        objectPosArray[posOffset] = object.pos.x;
        objectPosArray[posOffset + 1] = object.pos.y;
        objectPosArray[posOffset + 2] = object.pos.z;
        objectPosArray[posOffset + 3] = 0;

        const shapeOffset = i * 4;
        if (object.type === "sphere") {
          objectShapeArray[shapeOffset] = object.radius;
          objectShapeArray[shapeOffset + 1] = object.radius;
          objectShapeArray[shapeOffset + 2] = object.radius;
        } else if (object.type === "box") {
          objectShapeArray[shapeOffset] = object.half.x;
          objectShapeArray[shapeOffset + 1] = object.half.y;
          objectShapeArray[shapeOffset + 2] = object.half.z;
        } else {
          objectShapeArray[shapeOffset] = object.major;
          objectShapeArray[shapeOffset + 1] = object.minor;
          objectShapeArray[shapeOffset + 2] = object.radius;
        }

        const colorOffset = i * 4;
        let color = object.color;
        if (object.kind === "bomb") {
          const pulse = 0.35 + 0.65 * Math.max(0, Math.sin(performance.now() * 0.012 + object.id));
          color = [
            clamp(object.color[0] + pulse * 0.42, 0, 1),
            clamp(object.color[1] + pulse * 0.18, 0, 1),
            clamp(object.color[2] * (0.65 + pulse * 0.35), 0, 1)
          ];
        } else if (object.kind === "liquid") {
          const shimmer = 0.08 * Math.sin(performance.now() * 0.006 + object.id * 1.7);
          color = [
            clamp(object.color[0] + shimmer, 0, 1),
            clamp(object.color[1] + shimmer, 0, 1),
            clamp(object.color[2] + shimmer * 0.5, 0, 1)
          ];
        }
        objectColorArray[colorOffset] = color[0];
        objectColorArray[colorOffset + 1] = color[1];
        objectColorArray[colorOffset + 2] = color[2];
        objectColorArray[colorOffset + 3] = 1;
      }

      gl.uniform1i(uniforms.objectCount, state.objects.length);
      gl.uniform1iv(uniforms.objectType, objectTypeArray);
      gl.uniform4fv(uniforms.objectPos, objectPosArray);
      gl.uniform4fv(uniforms.objectShape, objectShapeArray);
      gl.uniform4fv(uniforms.objectColor, objectColorArray);
      gl.uniform1i(uniforms.selectedIndex, selectedIndex());
    }

    document.getElementById("addSphere").addEventListener("click", () => {
      createObject("sphere", { x: -0.4 + Math.random() * 0.8, y: 5.0, z: -0.3 + Math.random() * 0.6, vx: -1.5 + Math.random() * 3 });
    });

    document.getElementById("addBox").addEventListener("click", () => {
      createObject("box", { x: -0.4 + Math.random() * 0.8, y: 5.0, z: -0.3 + Math.random() * 0.6, vx: -1.2 + Math.random() * 2.4 });
    });

    document.getElementById("addTorus").addEventListener("click", () => {
      createObject("torus", { x: -0.4 + Math.random() * 0.8, y: 5.2, z: -0.3 + Math.random() * 0.6, vx: -1.4 + Math.random() * 2.8 });
    });

    document.getElementById("addBomb").addEventListener("click", createBomb);
    document.getElementById("addLiquid").addEventListener("click", () => {
      const selected = getSelectedObject();
      createLiquidSplash(selected ? add(selected.pos, vec(0, 1.1, 0)) : vec(0, 5.8, 0));
    });
    document.getElementById("pulseWorld").addEventListener("click", pulseWorld);

    document.getElementById("dropStack").addEventListener("click", dropStack);
    document.getElementById("resetWorld").addEventListener("click", resetWorld);
    document.getElementById("kickObject").addEventListener("click", () => {
      const object = getSelectedObject();
      if (!object) {
        return;
      }
      const camera = getCamera();
      addScaled(object.vel, camera.forward, 7 / Math.max(0.7, object.mass));
      object.vel.y += 2.0 / Math.max(0.7, object.mass);
    });

    document.getElementById("cloneObject").addEventListener("click", () => duplicateObject(getSelectedObject()));
    document.getElementById("deleteObject").addEventListener("click", () => {
      const object = getSelectedObject();
      if (!object) {
        return;
      }
      state.objects = state.objects.filter((item) => item.id !== object.id);
      state.selectedId = state.objects[0]?.id ?? null;
      syncInspectorFromObject();
      state.uiDirty = true;
    });

    ui.togglePause.addEventListener("click", () => {
      state.paused = !state.paused;
      updateStatus();
    });

    for (const input of [ui.gravity, ui.timeScale, ui.blend, ui.steps, ui.epsilon]) {
      input.addEventListener("input", syncWorldControls);
    }

    for (const input of [ui.shapeSelect, ui.materialSelect, ui.size, ui.mass, ui.bounce, ui.friction]) {
      input.addEventListener("input", applyInspectorToObject);
      input.addEventListener("change", applyInspectorToObject);
    }

    // ---- 캔버스 포인터 입력 ----
    // 마우스는 기존과 똑같이 동작한다. 터치는 손가락마다 따로 추적한다:
    // 첫 손가락 = 물체 끌기 / 카메라 회전, 물체를 잡은 채 두 번째 손가락으로 벌리기·오므리기 = 앞뒤 거리(마우스 휠 대응).
    const activePointers = new Map();
    const gesture = {
      primaryId: null,
      secondaryId: null,
      offsetX: 0,
      offsetY: 0,
      pinchDistance: 1,
      pinchDepth: 0
    };
    // 물체를 끄는 기준 위치: 한 손가락이면 그 손가락, 두 손가락이면 중점.
    // 손가락 구성이 바뀔 때 물체가 튀지 않도록 offset으로 보정한다 (마우스는 항상 offset 0 = 기존과 동일).
    const dragPointer = { clientX: 0, clientY: 0 };

    function updateDragPointer() {
      const first = activePointers.get(gesture.primaryId);
      const second = gesture.secondaryId !== null ? activePointers.get(gesture.secondaryId) : null;
      let x = first.x;
      let y = first.y;
      if (second) {
        x = (x + second.x) * 0.5;
        y = (y + second.y) * 0.5;
      }
      dragPointer.clientX = x + gesture.offsetX;
      dragPointer.clientY = y + gesture.offsetY;
    }

    function rebaseDragPointer() {
      const keepX = dragPointer.clientX;
      const keepY = dragPointer.clientY;
      gesture.offsetX = 0;
      gesture.offsetY = 0;
      updateDragPointer();
      gesture.offsetX = keepX - dragPointer.clientX;
      gesture.offsetY = keepY - dragPointer.clientY;
      dragPointer.clientX = keepX;
      dragPointer.clientY = keepY;
    }

    function releaseCanvasPointer(pointerId) {
      if (pointerId !== undefined && pointerId !== null && canvas.hasPointerCapture(pointerId)) {
        canvas.releasePointerCapture(pointerId);
      }
    }

    canvas.addEventListener("pointerdown", (event) => {
      if (gesture.primaryId !== null) {
        // 한 손가락으로 물체를 잡고 있을 때의 두 번째 손가락만 핀치로 쓰고, 그 밖의 손가락은 무시한다
        const first = activePointers.get(gesture.primaryId);
        if (event.pointerType === "touch" && first && first.touch && gesture.secondaryId === null && state.dragMode === "object") {
          activePointers.set(event.pointerId, { x: event.clientX, y: event.clientY, touch: true });
          gesture.secondaryId = event.pointerId;
          gesture.pinchDistance = Math.max(24, Math.hypot(event.clientX - first.x, event.clientY - first.y));
          gesture.pinchDepth = state.dragDepth;
          canvas.setPointerCapture(event.pointerId);
          rebaseDragPointer();
        }
        return;
      }

      gesture.primaryId = event.pointerId;
      gesture.offsetX = 0;
      gesture.offsetY = 0;
      activePointers.set(event.pointerId, { x: event.clientX, y: event.clientY, touch: event.pointerType === "touch" });
      dragPointer.clientX = event.clientX;
      dragPointer.clientY = event.clientY;

      const ray = pointerRay(event);
      let picked = pickObject(ray);
      if (!picked && event.pointerType === "touch") {
        picked = pickObjectNearTouch(event, ray);
      }
      state.lastPointer.x = event.clientX;
      state.lastPointer.y = event.clientY;
      canvas.classList.add("dragging");
      canvas.setPointerCapture(event.pointerId);

      if (picked) {
        const object = picked.object;
        state.selectedId = object.id;
        state.dragMode = "object";
        state.dragObjectId = object.id;
        state.dragDepth = picked.distance;
        const hitPoint = add(ray.origin, scale(ray.direction, picked.distance));
        state.dragOffset = sub(hitPoint, object.pos);
        object.vel = vec(0, 0, 0);
        syncInspectorFromObject();
      } else {
        state.dragMode = "camera";
      }
    });

    canvas.addEventListener("pointermove", (event) => {
      const tracked = activePointers.get(event.pointerId);
      if (!tracked) {
        return;
      }
      tracked.x = event.clientX;
      tracked.y = event.clientY;

      if (!state.dragMode) {
        return;
      }

      if (state.dragMode === "camera") {
        if (event.pointerId !== gesture.primaryId) {
          return;
        }
        const dx = event.clientX - state.lastPointer.x;
        const dy = event.clientY - state.lastPointer.y;
        state.lastPointer.x = event.clientX;
        state.lastPointer.y = event.clientY;
        state.yaw -= dx * 0.006;
        state.pitch = clamp(state.pitch + dy * 0.0048, -0.08, 1.18);
        return;
      }

      const object = state.objects.find((item) => item.id === state.dragObjectId);
      if (!object) {
        return;
      }

      if (gesture.secondaryId !== null) {
        // 두 손가락 사이가 벌어지면 가까이, 오므리면 멀리 (물체가 손가락 사이에서 커지고 작아지듯)
        const first = activePointers.get(gesture.primaryId);
        const second = activePointers.get(gesture.secondaryId);
        const distance = Math.max(24, Math.hypot(first.x - second.x, first.y - second.y));
        state.dragDepth = clamp(gesture.pinchDepth * gesture.pinchDistance / distance, 1.6, 13.0);
      }
      updateDragPointer();

      const ray = pointerRay(dragPointer);
      const targetPoint = add(ray.origin, scale(ray.direction, state.dragDepth));
      const target = sub(targetPoint, state.dragOffset);
      const oldPos = { ...object.pos };
      object.pos.x = clamp(target.x, -5.0 + supportXZ(object), 5.0 - supportXZ(object));
      object.pos.z = clamp(target.z, -5.0 + supportXZ(object), 5.0 - supportXZ(object));
      object.pos.y = clamp(target.y, supportY(object), 8.5);
      object.vel.x = (object.pos.x - oldPos.x) * 20;
      object.vel.y = (object.pos.y - oldPos.y) * 20;
      object.vel.z = (object.pos.z - oldPos.z) * 20;
    });

    function endPointer(event) {
      if (!activePointers.has(event.pointerId)) {
        return;
      }
      activePointers.delete(event.pointerId);

      if (event.pointerId === gesture.secondaryId) {
        // 두 번째 손가락만 뗐으면 다시 한 손가락 끌기로 돌아간다
        gesture.secondaryId = null;
        releaseCanvasPointer(event.pointerId);
        rebaseDragPointer();
        return;
      }

      state.dragMode = null;
      state.dragObjectId = null;
      canvas.classList.remove("dragging");
      releaseCanvasPointer(event.pointerId);
      if (gesture.secondaryId !== null) {
        activePointers.delete(gesture.secondaryId);
        releaseCanvasPointer(gesture.secondaryId);
        gesture.secondaryId = null;
      }
      gesture.primaryId = null;
    }

    canvas.addEventListener("pointerup", endPointer);
    canvas.addEventListener("pointercancel", endPointer);
    canvas.addEventListener("lostpointercapture", endPointer);

    // 터치로 길게 눌러도 컨텍스트 메뉴가 뜨지 않게 한다 (마우스 오른쪽 클릭은 기존 그대로)
    let lastPointerType = "mouse";
    window.addEventListener("pointerdown", (event) => {
      lastPointerType = event.pointerType;
    }, true);
    document.addEventListener("contextmenu", (event) => {
      if (lastPointerType === "touch") {
        event.preventDefault();
      }
    });

    if (coarsePointer) {
      // iOS Safari는 user-scalable=no를 무시하므로 두 손가락 확대를 직접 막는다
      document.addEventListener("gesturestart", (event) => event.preventDefault());
    }

    // ---- 좁은 화면 UI: 하단 독 버튼은 패널의 같은 버튼을 대신 누르고, 도구/속성 패널은 시트로 연다 ----
    const dock = document.getElementById("dock");
    const sheetToggles = dock.querySelectorAll(".sheet-toggle");
    const touchHint = document.getElementById("touchHint");

    function hideTouchHint() {
      if (touchHint.hidden || touchHint.classList.contains("fade")) {
        return;
      }
      touchHint.classList.add("fade");
      setTimeout(() => {
        touchHint.hidden = true;
      }, 450);
    }

    function setSheet(name) {
      document.body.dataset.sheet = name;
      view.measuredAt = -1e9;
      for (const toggle of sheetToggles) {
        const open = toggle.dataset.sheet === name;
        toggle.classList.toggle("active", open);
        toggle.setAttribute("aria-expanded", String(open));
      }
      if (name) {
        hideTouchHint();
      }
    }

    dock.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) {
        return;
      }
      if (button.dataset.proxy) {
        document.getElementById(button.dataset.proxy).click();
      } else if (button.dataset.sheet) {
        setSheet(document.body.dataset.sheet === button.dataset.sheet ? "" : button.dataset.sheet);
      }
    });

    for (const closeButton of document.querySelectorAll(".sheet-close")) {
      closeButton.addEventListener("click", () => setSheet(""));
    }
    setSheet("");

    if (coarsePointer) {
      // 터치 기기: 처음 몇 초 동안 조작 안내를 보여 준다 (탭하면 바로 닫힘)
      touchHint.hidden = false;
      touchHint.addEventListener("click", hideTouchHint);
      setTimeout(hideTouchHint, 9000);
    }

    canvas.addEventListener("wheel", (event) => {
      if (state.dragMode !== "object") {
        return;
      }
      event.preventDefault();
      state.dragDepth = clamp(state.dragDepth + event.deltaY * 0.006, 1.6, 13.0);
    }, { passive: false });

    window.addEventListener("resize", () => {
      view.measuredAt = -1e9;
      resize();
    });

    renderMaterialControls();
    syncWorldControls();
    resetWorld();

    let lastTime = performance.now();
    let lastListRender = 0;
    let accumulator = 0;
    const fixedStep = 1 / 90;
    const startTime = performance.now();

    function render(now) {
      resize();
      tuneRenderScale(now - lastTime);

      const realDt = Math.min(0.05, (now - lastTime) / 1000);
      const elapsed = realDt * state.timeScale;
      lastTime = now;
      accumulator += elapsed;
      updateEffects(realDt);
      updateViewOffset(realDt, now);

      while (accumulator >= fixedStep) {
        stepPhysics(fixedStep);
        accumulator -= fixedStep;
      }

      gl.useProgram(program);
      gl.bindVertexArray(vao);
      uploadObjects();
      gl.uniform2f(uniforms.resolution, canvas.width, canvas.height);
      gl.uniform2f(uniforms.viewCenter, canvas.width * 0.5 + view.offsetX * view.glScale, canvas.height * 0.5 - view.offsetY * view.glScale);
      gl.uniform1f(uniforms.viewScale, viewNorm(canvas.width, canvas.height));
      gl.uniform1f(uniforms.time, (now - startTime) * 0.001);
      gl.uniform2f(uniforms.camera, state.yaw, state.pitch);
      gl.uniform1f(uniforms.blend, state.blend);
      gl.uniform1i(uniforms.maxSteps, state.maxSteps);
      gl.uniform1f(uniforms.epsilon, state.epsilon);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      drawOverlay();

      updateStatus();
      if (state.uiDirty || now - lastListRender > 300) {
        renderObjectList();
        state.uiDirty = false;
        lastListRender = now;
      }

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
