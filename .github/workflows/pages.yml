name: Guard and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # three times an hour: collect works marked with site.json in other repos (deploy only if something changed)
    # and re-check that private tools are still private. GitHub often delays or drops scheduled runs,
    # so several slots an hour keep new works within about an hour. To publish right away, run this
    # workflow by hand (Actions → Guard and deploy → Run workflow, or `gh workflow run pages.yml -R aemtti/aemtti.github.io`).
    - cron: '7,27,47 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # only for the keep-alive step below

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.collect.outputs.changed }}
    steps:
      # GitHub switches off scheduled workflows in public repos after 60 days without commits. Collected works are
      # never committed, so re-enable this workflow on every run to keep the schedule alive.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pages.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # works draw Korean text with system fonts (system-ui, sans-serif, canvas), and the runner has none,
      # so screenshot thumbnails showed empty boxes instead of letters
      - name: Korean fonts for thumbnail screenshots
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk fonts-noto-color-emoji
          fc-cache -f
          fc-list :lang=ko family | head -3
      - name: Collect works that other repositories mark with site.json
        id: collect
        run: node tools/collect.mjs
        env:
          SITE_COLLECT_TOKEN: ${{ secrets.SITE_COLLECT_TOKEN }}
          PRIVATE_ONLY: ${{ secrets.PRIVATE_ONLY }}
      - name: Build gallery pages from works.json
        run: node tools/build-site.mjs
      - name: Guard — only works listed in works.json, no private tools, no credentials
        run: node tools/guard.mjs
        env:
          SITE_DENY: ${{ secrets.SITE_DENY }}
          PRIVATE_ONLY: ${{ secrets.PRIVATE_ONLY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRE_SECRETS: '1'
      - name: Leave tooling out of the published site
        run: rm -rf tools .github README.md .gitignore
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    if: github.event_name != 'schedule' || needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
