name: Guard and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 21 * * *'   # every day 06:23 KST: re-check that private tools are still private

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard — only works listed in works.json, no private tools, no credentials
        run: node tools/guard.mjs
        env:
          SITE_DENY: ${{ secrets.SITE_DENY }}
          PRIVATE_ONLY: ${{ secrets.PRIVATE_ONLY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRE_SECRETS: '1'

  deploy:
    needs: guard
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Leave tooling out of the published site
        run: rm -rf tools .github README.md .gitignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
